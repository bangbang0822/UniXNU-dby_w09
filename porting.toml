revision = "86beeae46b4b789f11f73062f02edd46dc262b10"
result = "The first boot that ran the whole userspace: the slot the run left behind reports `time=1392s idle=4s IRQ=1857951 monitor=1388 lost=16 root=1 procs=246 published=2`, 634 writer rounds, and process rows for `backboardd p56 n15 r2 w13 b0 t1 s1/31`, `SpringBoard p27 n15 r4 w11 b0 t1 s4/47` and `runningboardd p26 n5 r0 w5`, with the stage line naming `target pid=562 fairplayd.A2 exec process signature accepted`. Display: `DISPLAY stage=10 PM=4 calls=4 callbacks=1 guard=0 owned=1`, `SWAP calls=44 accepted=1 reason=0 COPY calls=44 status=00000000 bytes=16384000 retired=44` and `GOP actual mapping virtual=fffffff206752000 physical=9c000000 bytes=16384000`, so the legacy backend owns the panel and the CPU copy presented 44 full 1600x2560x4 frames. The panel title had moved to `LIVE: DEADLINE EXCEEDED - OS and diagnostic recording continue`, which is the monitor saying the OS kept running past its observation deadline rather than dying. This is the first time this port has had SpringBoard, backboardd and a presented frame after the audit rebuild, and the first boot that outlived the 46 s wall that the missing PMGR nub had set."

[[area.evidence]]
kind = "device"
reference = "drivers/GopFramebuffer/NativeLegacyDisplay.cpp"
command = "a console row every 32 copies carrying the surface format, the source stride and the first pixels of the compositor-s surface and of the scanout; kernel 696c167d and payload 0d5e5aa5 were built and flashed on the boot that showed white horizontal lines on the panel"
revision = "4922886330e98d65556b5ab358ac1675ace281cf"
result = "The owner-reported symptom for this round is a garbled panel: white horizontal lines instead of the lock screen, on a boot whose counters say 44 full frames were copied (SWAP calls=44 accepted=1, COPY calls=44 status=00000000 bytes=16384000 retired=44) and whose swap state is coherent (format 0x42475241, src_stride 0x1900, src/dst 1600x2560, allocation 0xfa0000, IOMFB reporting `default_fb_surface: No Default FB Surface found`). So the question is which half of the path produces the lines - a surface the renderer never drew, or a copy that lands elsewhere. The new row prints `copy=`, the surface format, the source stride and three pixels from the source and from the scanout at the same offsets - for the first eight copies and then one in 64, because this boot only takes a copy about every 30 s (44 in 23 minutes) and a 32-copy cadence would have printed nothing inside the console window. Its reading is the next evidence row; nothing in this one is a measurement of the lines yet."

[[area.evidence]]
kind = "source"
reference = "drivers/GopFramebuffer/NativeLegacyDisplay.cpp"
result = "A pixel-format mismatch is ruled out by reading the path rather than by another boot. native_legacy_copy_layout (NativeLegacyRequest.h) only validates - non-null, four-byte alignment of the base and stride, enough room for width x height in both buffers, no pointer-overflow - and copies nothing. The transfer itself is native_legacy_copy_pixels, which moves 32-bit words unchanged (four per 64-bit device store, byte-wise for the tail) under the stated premise that surface and scanout are both BGRA8888 little-endian. nativeBgra accepts exactly two surface formats: 0x42475241 ('ARGB', no planes, i.e. plain B,G,R,A bytes in memory) and 0x26424741 ('&BGA', at most one plane, Apple-s compressed spelling whose rows this port never compresses), and the swap state of the garbled boot reported 0x42475241 with a single plane, i.e. the accepted one. Geometry is equal, not merely tolerated: the validator demands surface width/height at least the display-s 1600 x 2560, and IOMFB layer0 reported src_width 0x640, src_height 0xa00, src_stride 0x1900 (1600 x 4) and allocation 0xfa0000 (exactly 1600 x 2560 x 4); a landscape surface (2560 x 1600) would fail the height test and be refused, not copied. The symptom itself argues the same way: an R/B swap cannot turn a picture white, it shifts hues, so white horizontal lines are not a byte-order artefact. What is left is therefore the content of the surface - a renderer that never drew into it, or a frame written into a different surface - which the copy row measures on the next boot."

[[area.evidence]]
kind = "source"
reference = "drivers/GopFramebuffer/NativeLegacyDisplay.cpp"
result = "The fork this board builds is behind the component, and two of the differences are on the copy path itself. The core tree's drivers/GopFramebuffer/NativeLegacyDisplay.cpp and the public component (UniXNU/GopFramebuffer main) are both 1,230 lines / 87,408 bytes, while this board's copy is 685 lines / 45,600 bytes, and scripts/build-gop-legacy-display.py:105 compiles the board copy - the built kernel carries `DbyDisplay: copy=` and not the component's `direct scanout` string, which is what says which one runs. First difference: the component flushes the compositor's surface before it copies it (flush_dcache64 over the source mapping, upstream line 717); this board's copy read the source through the kernel's mapping without dropping what the CPU still held for it, so a stale-line read was never excluded by anything. Second: the component converts half-float 8-byte-pixel surfaces (convertHalfRows with NativeHalfCodes.h) and passes the surface format to native_legacy_gpu_offer; this boot's swap reported 0x42475241 with stride 0x1900, so that path is not what this panel needed, but it names the class of surface the layer expects and the fork cannot render. The 2026-11-15 change adds the source flush before the copy, and a pipe-read row (dby-dpu=2) that was withdrawn the same night: mapping the MDP block at 0xae01000 and reading VIG 0/1's source address, stride, format and source size aborted the kernel immediately after the first copy - the console printed `DbyDisplay: copy=1 fmt=42475241 stride=6400 src=ff000000 ff000000 ff000000 dst=00000000 00000000 00000000` and then `Unclassified kernel abort`, with nothing between the two, so the block is not readable without the clocks and power domain the direct-scanout path sets up first. What that costs the white-line question is small: with sheng-dpu-scanout off nothing in this driver writes the pipes, so they still fetch what the firmware left, and the firmware fetched the GOP framebuffer - that is how the boot progress page appears. The copy row is therefore the measurement that matters, and its first reading is in this round: the compositor's surface held 0xff000000 (opaque black) at the first swap, not white, which is what the next boot has to compare against a frame the OS actually rendered."

[[area.evidence]]
kind = "device"
reference = "drivers/GopFramebuffer/NativeLegacyDisplay.cpp"
command = "kernel f0457400 and payload 18249e11 (the pipe read withdrawn) flashed to preload, reboot, console captured on COM20; the panic text of that run read back on the next boot through the [prev] replay"
revision = "9d774ca9175505152d5372dbf1e7c8bf9b5b8d15"
result = "Three boots, three different deaths, and the third one names the next target. Boot 1 (kernel 1fa2ecb3, pipe read present) presented its first frame - `DbyDisplay: copy=1 fmt=42475241 stride=6400 src=ff000000 ff000000 ff000000 dst=00000000 00000000 00000000`, i.e. the compositor's surface held opaque black, not white - and then died with `Unclassified kernel abort` with nothing between the two rows, which is the pipe read mapping 0xae01000 and faulting. Boot 2 of the same kernel lasted about eight minutes, presented copy=1, and its `[prev]` replay on the next boot shows the death as `Kernel data abort. at pc 0xfffffff00c0a663c, lr 0xfffffff00c0a65f8` with `x0: 0x000000009c000000` (the GOP framebuffer's physical address) and `esr: 0x96000010` (synchronous external abort on a read); llvm-nm puts pc and lr inside `NativeLegacyDisplay::startVsync()`'s invoke lambda, so the vsync path - not the copy path - is what faults, and it faults when the render server starts asking for vsync. Boot 3 (kernel f0457400, pipe read withdrawn) reached the same place: `DISPLAY stage=10 PM=4 calls=4 callbacks=1 guard=0 owned=0`, `SWAP calls=0`, then the same data abort at 69 s. The AMFI `No PMGR?` panic is intermittent rather than fixed: boot 1 hit it at 57 s, boots 2 and 3 passed the same `AMFI: PMGRAON latched to: ffffffff` line without panicking, so the stand-in and AMFI's latch race. Nothing in this row is a white-line measurement: no boot has yet presented a frame the OS actually rendered."
[[area.evidence]]
kind = "device"
reference = "docs/display-white-lines-2026-11-16.md"
command = "two payload rebuilds differing only in board.toml's touch argument (dby-touch=8, then dby-touch=1), fastboot flash preload, fastboot continue, console captured on COM20 and the panel watched from the firmware logo to the home screen"
revision = "236692038c56be7d25b7a15c58f6459cf0bce86b"
result = "The white horizontal lines are the panel being reset and never re-initialised, and the reset comes from the touch driver's stage 6. With `dby-touch=8` the panel shows white lines as soon as the OS owns it, while the copy counters are healthy (`SWAP calls=44 accepted=1 reason=0`, `COPY calls=44 status=00000000 bytes=16384000 retired=44`) and the first copy's source pixels are opaque black (`src=ff000000`), so neither the copy nor the pixel format is involved. With `dby-touch=1` - a payload that differs only in that argument, `959c642d4eb033be4fa9333664a60fe44b9f1b27e2534b100043ac057008fb3c` - the lines are gone and the iPadOS home screen comes up, with the console carrying `DbyTouch: stage=1 ic=novatek transport=spi compatible=huawei,thp`, the read-only pin census and no frame reads, and the display rows showing the copies landing (`DbyDisplay: copy=2 fmt=42475241 stride=6400 src=ff000000 ... dst=ff000000 ...`). Stage 1 returns before any mapping, so the rung that matters is somewhere in 2..8; the reset pulse on GPIO 98 is the only rung that changes the panel's own state, which is why the fix in the document is to stop driving that pad by default rather than to touch the copy path."

[[area]]
id = "input"
status = "device-verified"
components = ["ShengHidInput", "ShengNovatekTouch", "QcomGeniSpi"]
paths = ["package/DbyTouch/**", "package/GeniSpi*", "package/HidInputProbe.cpp", "package/IliTddi*", "package/Nvt*", "package/TouchBoard.h", "package/TouchProbe.cpp", "scripts/build-dby-touch.py", "scripts/gen-touch-firmware.py", "scripts/gen-touch-firmware-multi.py", "docs/handover/2026-11-04-touch/**"]
inputs = ["Capacitive touch panel (Novatek N9Z family over TDDI) and three physical keys (power, volume up, volume down), polled on the SE14 GENI SPI bus.", "The keys are already usable in firmware; the DbyTouch stack reports them in XNU as an HID consumer as well.", "Touch firmware image for this panel, carried verbatim in package/DbyTouch/DbyTouchFw.h."]
configuration = ["[components] selects ShengHidInput, ShengNovatekTouch and QcomGeniSpi from the catalog; the board producer DbyTouch reaches the kernel through [kernel] archives and scripts/build-dby-touch.py.", "[kernel.prelink] roots already include com.apple.iokit.IOHIDFamily and com.apple.iokit.IOHIDEventDriver, so the OS side of HID is inside the prelink closure.", "[payload] kernel_args carry the stage ladder: dby-touch=8 dby-touch-se=1 sheng-touch-hid=1 sheng-buttons=1, with offline-hid-input=1 offline-hid-home=1 offline-key-events=1 on the consumer side."]
procedure = ["Read https://unixnu.com/porting/input completely before writing board code: transport and sensor, publishing reports through the qualified IOHIDDevice ABI, then physical buttons.", "Keep the vendor-verified driver sources byte-identical to the accepted implementation, then change one variable per flash and read the stage ladder."]
findings = [
  "The three NT36523 firmware images left Git. They are vendor bytes taken from the closed libafehalW2599Z*.so files, so committing them contradicted proprietary-files.txt and this repository's own gen-touch-firmware.py rule. They now live in .cache/firmware/novatek as nt36523_Z<project>.bin, are kept out of Git and out of proprietary-files.txt, which records no row for this panel; the build reads them from .cache/firmware/novatek, where the three files are c55ee43…, bf0faac… and b7633e1… (196608 bytes each), and scripts/gen-touch-firmware-multi.py turns them into build/dby-touch/DbyTouchFwImages.h, which scripts/build-dby-touch.py runs before the compile and puts on the include path. package/DbyTouch/DbyTouchFw.h keeps only the table layout, the default selection and the name matching. The generator checks each image against its recorded ILM/DLM length and CRC-32/MPEG-2 before embedding it, and a missing image produces a length-0 row that the uploader's own bound turns into a refusal, so a host without the vendor package builds a kernel whose touch upload stops instead of programming the panel with unknown bytes. Verified by round trip: the bytes parsed back out of the generated header are identical to the pinned files.",

  "`DbyTouch` is the accepted producer for this panel (Novatek N9Z, 1600x2560, mode 0): on hardware it reports points on the lock screen against payload `09c3aad6…`, so the earlier no-XNU-HID-device limit is closed. The Home and volume keys go through the board `KeypadDeviceLib` in the firmware tree.", "The stage ladder gates the chip side only: once the SE answers (dby-touch-se=1) stage2 chains to stage5, which reads frames and publishes contacts, so dby-touch=2 already reaches the UI. Reading the number as a feature switch misattributes every later failure.", "Publishing reports means subclassing the original IOHIDDevice with its exact 207-slot vtable and 0xd0 instance size; an approximate header changes the instance layout and the failure appears far from its cause.", "The N9Z command mailbox and the 0x30000 firmware array are board data, not SoC data: taking the SM8550 board's controller sources as-is for this panel is the trap on this line.",
  "The publish cadence question is closed by reverting, not by re-tuning. The rung ladder {8208, 2048, 1024, 512, 128} and every number measured on it (read=11178 us on the 128 rung, loop=25994 us, about 67 us per piece) describe a read path that exists only in our tree: the accepted driver has no ladder, it reads at a fixed DBY_TOUCH_FRAME_CHUNK piece with a memset per piece. On 2026-11-06 the self-invented read path went back with `git checkout e61237a -- package/DbyTouch/DbyTouch.cpp package/DbyTouch/DbyTouchBoard.h`, which removed +470/-24 lines and the nine symbols stage5ReadAdaptive, gTouchChunks, gTouchChunkStep, gTouchChunkFail, gTouchTxPad, gTouchFaultTry, dbyTouchCompensateBase, gTouchBaseLift and gTouchIdleRun; kernel 916f71cd and payload e4a24792 were then rebuilt from the restored source. So the cadence figures above are measurements of reverted code and are not a criterion for anything. What stands: this unit is a three-firmware integration assembled by its owner, the stage-8 upload really does run (dby-touch=8 dby-touch-se=1 sheng-touch-hid=1, byte-for-byte the reference kernel-args.txt values), and the accepted read shape is part of that contract, not a detail to optimise.",
  "Withdrawn inference. The 2026-11-06 sentence that eliminated GENI_ERR_TIMEOUT (-110) because a silent engine would cost about 20 ms at poll_limit 20000 was arithmetic on an unmeasured constant: it assumed one empty-poll iteration costs 1 us, and that iteration cost was never measured on this bus, so both the 20 ms figure and the -110 exclusion it produced are void. The refusals it set out to explain (the cf=1/1/1/0 row) came from the ladder described in the entry above, and the fault latch it defended -- snap_irq, snap_status, snap_txfs, snap_rxfs copied on every failed piece plus a 4-byte CS-release transfer inserted inside stage5ReadChunked -- was itself our addition. Putting an instrument inside the data path it measures is how this panel went from working to dead, and no raw errno was ever recorded for that boot.",
  "A diagnostic column that never moves is a bug, not a baseline: gTouchUsLoopMin was re-armed to 0 at every publish window while the sample test also accepts gTouchRateN == 0, so every row after the first printed loop=26088/0/26305 -- a minimum of 0 us, which reads as a free loop. It re-arms at 0xFFFFFFFF now.",
  "The deferred question -- touch stops working after a while -- did not reproduce at this cadence: the 2026-11-06 capture is 745 lines over a 420 s window and the loop was still publishing when it closed (n=15936, i.e. 15936 x 26 ms = 414 s of it, rf=0 read failures, IRQ timeouts 0, no panic row). Whatever killed the earlier streams sat on the 76 ms path, so the silent read-fail backoff stays a hypothesis about the old cadence rather than a measured cause of this one. A second, free measurement on that same boot, taken at 10:35 while the console ring replayed: 89,800 publish cycles in the captured stream (n=28928 up to n=118750, about 39 minutes at the 26 ms cadence, i.e. roughly 51 minutes of uptime) and every row still reports chunk=128, cf=1/1/1/0, wait=1 us, IRQ timeouts 0, rf=0, with no [touch] link clear row and no panic anywhere in 199807 bytes. So on this cadence the loop does not degrade with age. What the same replay cannot decide: all 360 [touch] p= rows in it read h=0 an=0 live=0 cc=0, i.e. no contact was confirmed during that period -- and whether a finger was on the panel is not recoverable from the console, so it stands as an open observation on this line rather than a measured defect. Both captures in this entry were taken on the reverted ladder build, not on the accepted read path, so they describe our own code and not the panel.",
  "Two values in the touch bring-up were published before they were checked, both in package/DbyTouch/DbyTouch.cpp. The tail of the SPMI row writes 'v' and the detected generation as a pair under a guard of `at + 1 < capacity`, which reserves only the terminator, so entering that branch with one slot left put the second character one byte past the caller's buffer; the pair now requires `at + 2 < capacity` while the one-character branch above keeps its own test. And dbyTouchChipEnable() published id.trim_row straight out of an uninitialised stack struct, before it looked at the identify's return code: a failed identify leaves the struct untouched, so gEnableIdentRow carried whatever the stack held into the diagnostic row, i.e. a plausible trim row from nothing. The struct is zero-initialised and the row is read only when the identify answered, with the -1 this function already uses for unknown. Both are in this round's kernel; neither row has been read on hardware, and the panel has not been asked to confirm the trim row either way.",
  "The button sink was published in the wrong order, in the same file that already does it right for the touch sink. native_buttons_set_sink() stored gBtnSink and then gBtnSinkCtx with plain stores, and the poller read them with plain loads, so a load could see the function pointer before the context that belongs with it and call the sink with a stale or null context. It now writes the context first and release-stores the pointer, and the poller acquire-loads the pointer and only then reads the context - the shape native_touch_set_sink() and dbyTouchPublishContact() already use twenty-odd lines away, which is why this counts as a defect rather than a style. Built into this round's kernel; the button path has not been exercised on hardware with this ordering, and the four rows it feeds were last read on the boot that predates the change.",
  "The N9Z identify path kept a second copy of three values this repository already carries with their source. package/DbyTouch/DbyTouchProtocol.c declared its own 0x3F0FE and wrote 0x69 and 0xAA as bare literals, while DbyTouchBoard.h:257-259 names all three (DBY_TOUCH_N9Z_BOOT_ADDR, _BOOT_BYTE, _IDLE_BYTE, citing novatek_thp.c:310-333) and that header reaches this file through DbyTouchProtocol.h:32; a third copy of the same register sat in package/NvtProtocol.c:50 as NVT_N9Z_VER_TRIM. The boot register and the two magic bytes now come from the header, the id register stays local (its other copy is in a .c, so there is no macro to reuse) and carries the source that names it for this part's series profile, and the two declarations moved off the opening brace. The change is value-preserving by construction, and the build says so: the kernel after it hashes to 59a488c8b56d6a4ffe70a2366ab53553358c4e5597c29158269a9213ae4d6335, the same digest the build before it produced.",
  "The firmware picker tested for a missing oeminfo partition with `oemLast < oemFirst`, which is false for the pair's own initial state: both start at 0 and are only written when the entry is found, so a table without an oeminfo entry fell into the scan branch and read LBA 0 as though it were the partition - reporting 'oeminfo 0x0..0x0 has no project id' where the honest answer was that no such partition exists. An explicit haveOem flag records the match now and the not-found branch tests it; the table walk and the rows are otherwise unchanged. In this round's kernel; the not-found path itself has not been observed, because the tested unit's table does carry oeminfo, so what the corrected row prints is unmeasured.",
  "The N9Z trim matcher was the weaker of two copies of the same table. package/DbyTouch/DbyTouchProtocol.c held the 23-row version/trim table beside package/NvtProtocol.c:53-77 (verified byte for byte on 2026-11-14: same rows, same masks; that copy compares id[i] because it is handed the id without the two header bytes), and its matcher indexed rx[i + 2] with hardcoded 23 and 6 - no length parameter at all, so a shorter buffer at a future call site would have been an out-of-bounds read that nothing in the file could catch. dby_n9z_trim_matches() now takes rxLen, refuses a buffer shorter than header-plus-columns, and derives rows and columns from sizeof on both arrays. The table is not shared: NvtProtocol.c is a pinned copy of ShengNovatekTouch carrying its own keep-in-sync-with-components.toml rule, so exporting the table from it is a different change, recorded as a limit below. The bounds change is value-preserving and the build says so: the kernel after it hashes to e352f0cda65263009d09df3d43bff4c6a7ad4770eec61ededdb49f5d0264d4d2, the digest the build before it produced.",
  "package/GeniSpi.c was a dead copy of the QcomGeniSpi component: the touch archive compiles the component's GeniSpi.c from its own checkout (scripts/build-dby-touch.py:54 maps it to drivers/QcomGeniSpi/GeniSpi.c and says the copy is deliberately not used), while only its header is included by DbyTouch.cpp and TouchProbe.cpp. It was deleted on 2026-11-14, which also retired a fix made to it the same day: handle_rx derives the RX byte count from the FIFO word count and subtracts the last-word padding, and with a zero word count - a legal empty last packet - that is a size_t underflow of about 2^64 that the drain loop then reads for. The component at eac47ba carries the same line (drivers/QcomGeniSpi/GeniSpi.c:182), so the live bug is a component fix and is owed there; the input limits say so. What this repository fixed here instead is the serialiser in package/HidInputProbe.cpp, which advanced its shared offset by snprintf's would-be length and stored a terminator outside the array; both writes clamp to the room left now.",
  "touch is blocked by a dead patch function, not by the driver or the boot arguments. Producer and device are both healthy on the first desktop boot: DbyTouch(s5) publishes continuously with fail=0, HidInputProbe logs 'event driver attached after 2 s', and the panel row reads 'TOUCH HID started=1 drv=1 key-reports=4 touch-reports=378 res=0' - 378 digitizer reports were submitted. What never happened is the property patch: package/HidInputProbe.cpp:125 defines native_hid_live_checkpoint(IOService *), the only code that writes Built-In, DisplayIntegrated, PrimaryUsagePage 0x0d and PrimaryUsage 4 onto the event service, and a grep of this repository and the build tree found no caller for it, so the function had been dead since it was written. backboardd's filter (documented at HidInputProbe.cpp:148-153) drops a digitizer event from a service whose pair is not (0x0D, 1|4|0x20), which is exactly the (1,6) the service kept publishing. The fix calls it from the match thread on both success paths, five passes 200 ms apart with a closing 'HidInputProbe: pair ...' kprintf: the reference board's version is called once a second by its publisher and needs one pass, this board's dk=0 keeps the in-kernel IOHIDEventDriver owning the service so no DriverKit re-publish overwrites the pair, and the row is what makes a failed boot diagnosable instead of a coin flip. split was off when this was written and is now on: the 2026-11-18 round keeps the split device and publishes the pair on it, which is exactly the 'second device that nothing patches' this sentence warned about - the warning was about NOT storing that object, and storing it is the fix. Static checks pass (braces and parens balanced, definition before both call sites, call sites inside the match thread, which nobody joins). Acceptance on the board: the driver row and touch-reports keep appearing, the new pair row prints, the volume keys keep incrementing key-reports, and the desktop answers a tap. If touch still does nothing while touch-reports and the pair row both look right, the remaining gate is on backboardd's side, not in this driver.",
  "The dead-code repair did work, and what follows corrects an earlier reading of the same capture that got it backwards. Round: payload a47c82ec, kernel 1fa399f3, seed 3b509f95, 54 arguments, sheng-data-reset removed on purpose. tools/console-touch.log:455 carries 'HidInputProbe: event driver attached after 2 s' and :457 carries 'HidInputProbe: pair BI:T PP:0xd PU:0x4', so native_hid_live_checkpoint() ran all five passes and read back exactly the digitizer pair - Built-In true, PrimaryUsagePage 0x0d, PrimaryUsage 4. The store is writable in the same boot (D st=3 hdr=3 with pres=128635 ld=3143 wr=197190, and tx_flush rows throughout), the picture is correct ([swapok] x3 with stride=6400 alloc=16384000, DbyDisplay copy=1..8 fmt=42475241), and touch still does nothing. The error this replaces was a log-reading heuristic: it assumed everything before the '[prev] --- end ---' marker was replay, and therefore concluded the probe had printed nothing. The capture disproves it - the replay block is only the '[prev]'-prefixed run from line 481 to 1633, and the unprefixed text on both sides of it belongs to the live boot. The counters carry across the dump: DbyBattery #2 at 451 and #3 at 456, then #4 after the dump, while the dump itself shows the previous boot's #158/#159; DbyTouch goes pub=0, 64, 128 at 456/458/461 and pub=192 after it. A second consequence of the same mistake: the '452 is replay' correction recorded for the previous round is also wrong, that row is live as well. The rule that replaces the heuristic: locate the '[prev]' block by its prefix, not by the end marker, and treat everything outside it as live.",
  "With the pair published and touch still inert, the remaining gate is on backboardd's side and the reason is that the filter reads the descriptor, not the runtime property. HidInputProbe.cpp:148-153 records what a digitizer event must carry: the sending service has to report PrimaryUsagePage 0x0D with PrimaryUsage 1, 4 or 0x20, and :143-144 names the filter as {DeviceUsagePage, DeviceUsage, Built-In}. The first pair is a runtime property and the patch now sets it correctly on both the event driver and its parent (the event service), which is why the row reads BI:T PP:0xd PU:0x4. DeviceUsagePage and DeviceUsage are not properties: they come from the HID report descriptor, and this board's only device lists its keyboard collection first, so that descriptor still answers (1,6). backboardd therefore classifies the sender as a keyboard no matter what the property says, and drops the touch reports - board.toml:393-394 already states the same thing from the other direction ('the touch collection only rides at the tail of the keyboard descriptor, which backboardd does not consume'). The next change is therefore the digitizer device rather than more probing: turn sheng-touch-split=1 on, remember the second IOHIDDevice instead of letting it live in a local, and publish the pair on that one, because native_touch_set_sink() is a single global slot that the last-started service wins, so the reports will be coming from the device whose descriptor does carry Digitizer/Touch Screen. The four diagnostic rows added in the same round stay: they cost nothing and make a future silent boot readable, but they are not expected to change the outcome of this one.",
  "native_hid_live_checkpoint was never dead code, and an earlier entry in this area says it was. The caller is the driver, not a probe: drivers/ShengHidInput/NativeHidInput.cpp:369-371 runs native_hid_live_checkpoint(self) from its one-second tick, and the copy the kernel builds is ShengHidInput-408b9b7e, whose sha is identical to the pinned feed at drivers/NativeHidInput. The earlier 'grep found no caller' search covered package/ and headers only, so it missed the driver entirely, and the repair that connected it from the match thread was unnecessary - the pair row that appeared afterwards (BI:T PP:0xd PU:0x4) would have appeared anyway. The component revision is also not a suspect: components.toml pins 71a40e76, which is three commits AHEAD of the 5f3a37c the upstream input page cites (600c3227 edge contacts, 7b37352d signed event-driver vtable, 71a40e76 the AppleUserHIDEventService vtable), so this board builds the newer of the two.",
  "Every configuration in which touch worked runs on one core, and this board stopped being single-core on 2026-11-16. Three sources agree. uke's docs/TOUCH-PORT.md records the whole chain working on iOS 17 with the heartbeat 'f119123 ok119123 c1 hid7004 drv1 rpt7004 r0' - reports delivered, result 0 - while passing sheng-smp=1, an argument nothing parses, so it ran on cpu0 alone. This board's own input evidence[0] records touch working on 2026-11-04 (commit e61237a, 'contacts follow the finger, the swipe clears the lock screen') with the same sheng-smp=1. board.toml:340-342 states the mechanism plainly: ArmCpu reads 'smp', nothing reads 'sheng-smp', so the SMP request stayed 0. Since the 2026-11-16 switch to smp=1 the system is genuinely multicore and touch has not worked once. The suspect is NativeHidInput::touchSend (drivers/ShengHidInput/NativeHidInput.cpp:279-290): it takes a snapshot behind a seqlock (if(native_touch_seq!=before) return) that cannot tear on one core and can on several, which is exactly the hazard the upstream input page calls 'preserve snapshot consistency'. Also settled by the same research: sheng-touch-split is an iOS 27 requirement, not an iOS 17 one. uke's iOS 17 line delivered touch without it, and its iOS 27 line adopted it only after finding that 'backboardd treats the composite primary-usage 1/6 device as a keyboard and ignores digitizer events'. This board runs 17.7.11, so the split added on 2026-11-18 was solving an iOS 27 problem, and that round drops both it and smp=1 to reconstruct the 2026-11-04 shape: 54 arguments, 971 bytes. 2026-11-20 puts smp=1 back, and the first measurement does not reproduce the old shape. Payload 35ef1fe0 (kernel ff068187 unchanged) boots eight cores - one ml_processor_register pair per core, cpu_number 0..3 with cluster_id 0 and cpu_number 4..7 with cluster_id 1 - and the owner reports the interface fast, with the first gesture after the home screen appeared (a swipe up) followed, so the chain publishes and the consumer acts at least once. What cannot yet be said is that multi-core leaves touch intact. The only per-gesture counter that speaks to it is [touch multi] reports/max/lifts (BootLog.c:710-714): the single-core boot of payload 9a181e72 reads reports=60757 max=10 lifts=0 after forty minutes, while this eight-core boot reads reports=8631 max=10 lifts=1 after a few minutes. lifts moving off zero is the one difference, and  The instrumented build already answers the first half. Payload 245b5406 (kernel df12c570, the same 992-byte argument set as the payload before it, only the s5 row changed) prints nc/nlive/ncmax and reads nc=10 nlive=10 ncmax=10 at pub=3008, about 47 s into the boot, with nobody touching the glass - and keeps that value at every sample for the next fifteen thousand published frames, with nz between 7250 and 8070 of 8192 bytes. The owner touched the panel during that window and the row did not move: nz showed no excursion, the header words kept their regular pattern, and the contact count stayed at the cap. So the phantom is below the HID layer - the matcher fills all ten slots out of whatever the reader hands it - and this row cannot separate a finger from noise while the cap is saturated either way. Two candidates are left and only a new measurement separates them: the frame is not a touch delta image at all (wrong offset, wrong mode, or a firmware upload that did not take - any of which would explain nz near 90 percent on an untouched panel), or the gates (floor 700, peak 1200, min nodes 2) sit far below the amplitude of whatever this frame really is.  The build that adds those two reads (nca, pk and a coarse byte histogram) also carries the reading rules the next round depends on. (1) The row mixes two moments: nc, nlive, ncmax, nca and pk describe the previous frame, because they are written by dbyTouchFindContact and dbyTouchPublishContact after the kprintf, while nz, nhi, nvhi, sum and h0/h1 are measured on the frame being printed. In a still picture that is invisible, but a finger landing exactly on the sampled frame shows a new nz beside an old pk, so a jump has to be confirmed on two consecutive samples and never on one. (2) The histogram counts idle bytes too - dbyFrameIdle accepts 0x00, 0xFF and 0x1F - so an all-idle frame reads nhi=nvhi=8192 as well; nz is what separates the two, with nz near 0 meaning pure idle filler (a read or mode fault) and nz near 7000 with a high nhi meaning non-idle high-valued bytes (noise or saturation). (3) Two invariants make the peak field self-checking: a candidate only exists if its peak cleared DBY_TOUCH_TOUCH_PEAK when it was collected, and that same wmax is what the field stores, so nca greater than zero implies pk of at least 1200, while nca zero implies pk zero because the field is cleared at the top of every frame. A row with nca above zero and pk below 1200 therefore means the observation point is wrong, not that some other value feeds the gate.  The next build (cda95df7, kernel 627e1c26) then failed differently on the same arguments: the reader stopped publishing at pub=832 with nca=0 pk=0 r=0 while the rest of the system kept running (DbyBattery and DbyButtons kept printing for minutes), and the DSI kick row never appeared at all although the probe snapshot had printed - so that boot had two stuck threads, not a saturated matcher. The frames of the two boots look like the same page rather than a different one: h0 is fa060040 in both, h1 sits in the same 7fxx80yy family, nz is 7250..8070 in both, and only the sampled w1000 word differs (7f-suffixed in the saturated boot, 0a/80 in the stuck one) which a single word cannot decide. What separates the two boots is not thread liveness but frame content or the page the reader picked, and the numbers that can settle it are sum, w1000, h0/h1 and nhi/nvhi side by side - which is why the next round records them together instead of reading ts alone. One reading trap for that round: tp=0 with ts=0 means the live loop never ran (a configuration without sheng-touch-hid=1 only uses the sweep path, which calls find but never publish, so native_touch_count still moves), and it must not be read as the driver being dead.  The firmware image is now pinned by measurement rather than by identity. Payload c3fff537 (the same kernel, the same 968-byte argument set) drops dby-touch-fw=W2599Z1100, and the fwsel rows answer what this unit can tell us about itself: 'oeminfo first=ffffffff ffffffff', then 'oeminfo 0x3000..0x8fff has no project id, keeping W2599Z2700' and 'image W2599Z2700, ilm=14547/18f0d943, source default'. So this panel carries NO project id anywhere the driver can read, the automatic choice is the table default, and that default is wrong: with Z2700 the panel came up garbled and the touch reader reached tp=1, i.e. it never started. With dby-touch-fw=W2599Z1100 the display is clean and touch responds, so the argument stays and the automatic path is recorded as unusable on this unit rather than untried. Two numbers also close open questions. At rest, on the no-kick boot, seventy-one consecutive samples read nc=0 nlive=0 nca=0 pk=0 with ncmax=5 left over from the earlier touch: there is no phantom contact when nothing touches the glass, so the baseline tracking is sound and the failure is confined to what happens while a finger is down. And the frame counters that looked like noise are normal: a 50x32 matrix of 16-bit values around 0x8000 makes nearly every byte non-idle, so nz of 7250..8070 says nothing about a finger. What is left to measure is the amplitude of a real contact against the 1200 gate, which is why the next build publishes a running peak and a candidate-frame count through the button row instead of the 1/64 samples: pk a little above 1200 means the gates are marginal for this image, pk in the thousands means the gate is fine and one finger is being cut into several components. That row carries two peak fields for a reason: pk is the monotone maximum since boot and pkl is the peak of the frame the row happens to catch, because a single monotone number cannot answer both 'has any candidate ever existed' and 'how strong is the finger right now' - a noise frame that saturates once would pin a monotone value forever and hide every later finger. The two counters also have different owners and that is a reading trap of its own: tp and ts are advanced only by the live loop, so tp=0 with ts=0 means the live loop never ran, while cf and pk are advanced by any caller of dbyTouchFindContact including the sweep path, so cf climbing beside tp=0 means frames are arriving and only the publish step is missing - a configuration difference, not a fault.  If the peak measurement lands in the thousands, the next change has a known address: dbyTouchCollectCandidates keeps the heaviest DBY_TOUCH_MAX_CANDIDATES components of the frame and gates each one on its own (DBY_TOUCH_MIN_NODES, DBY_TOUCH_TOUCH_PEAK), but it never suppresses a component that sits next to a heavier one, so one finger whose delta image overshoots into two lobes publishes two contacts, each with a different id and both moving as the lobes breathe. That is the shape the owner describes as jumping. A fix belongs there and not in the gates: after the components are sorted by weight, drop any whose seed lies within one finger radius of a heavier one. The matrix is 50 rows by 32 columns over a 1600x2560 panel, so a node is about 50 by 51 pixels and a finger covers only two to four of them; a suppression radius near DBY_TOUCH_MATCH_PX (220 pixels) would be the same physical idea the pairing already uses, and keeping it in the candidate list rather than in the pairing keeps the change checkable against the same row.  That measurement came back and it rules out both cheap explanations. Holding one finger still on the glass of payload 7da3198a reads pk=3484, 3387, 3232 and 2973 with nca=1, nc=1, nlive=1 and ncmax=1 on every sampled frame. So the amplitude is two and a half to three times the 1200 gate - the thresholds are not marginal for this image and the scale is right - and a stationary contact produces exactly one component, so nothing is being split at rest. The earlier ncmax=5 was seen while the owner was swiping, which means whatever makes the cursor jump is produced by motion: either the moving delta image breaks one finger into several lobes, or the id assignment and velocity prediction lose the contact between frames and re-acquire it somewhere else. Those two have different fixes - the first is suppression or merging in dbyTouchCollectCandidates, the second is the pairing in the assignment step - and the measurement that separates them is the same row read while a finger is dragged in a straight line: nca above one during the drag means lobes, nc flickering between one and two with a stable nca means the pairing. Neither of those needs a new image to measure, which is why the next step is another capture and not another flash. The drag was then measured, and it rules out both of them as well: across nineteen sampled frames of a sustained slow drag every one reads nc=1, nlive=1 and nca=1, one component and one contact, with pk between 1307 and 4402 (a single nca=0 pk=0 beside nc=1 is the clear-and-refill window the review warned about, not a missing candidate). So motion does not split the contact and the pairing does not lose it either; what the owner sees as jumping has to be the position the driver publishes, which no row prints yet.  One reading trap is already ruled out by inspecting the chain rather than the device: the coordinate domains are consistent. The board producer scales panel pixels to 0..30480 on x and 0..20320 on y, the HID driver then rescales each axis independently through transformCoordinate(value, 30480 or 20320) into 0..32767, and the report descriptor declares 16-bit X/Y with logical maximum 0x7fff. Independent per-axis rescaling is what an absolute digitizer is supposed to do, so there is no 'vertical position only reaches 62 percent' bug to chase: a touch at the bottom of the panel does reach the bottom of the range.  The coordinate row then produced its first real samples, and they do not look like a finger following a path. Four contact frames of the witness row read (29298,17335), (24364,13636), (23583,2968) and (12763,7040) in HID units over one and a half seconds; at 19.05 units per pixel on x and 7.94 on y those are moves of -259/-466, -41/-1344 and -568/+513 pixels, and the y axis reverses direction in the middle. The instant peak is healthy in the same rows (pkl 3056, 2788, 3230) and cf climbs from 148 to 561, so frames are not being lost; what jumps is the published position itself. That still leaves two readings of the same numbers: the driver is jumping, or the owner tapped four different places half a second apart, and the witness row cannot tell them apart because it samples one frame in fifty. The next instrumentation therefore prints coordinates while a contact exists - one line every second frame, at most 512 lines per press - so a single tap yields a consecutive run of coordinates: a monotone run with small steps means the mapping is fine and the owner was tapping, a run with hundreds-of-pixels steps or reversals means the centroid or the publish path is the fault. Three rules make that trace readable. Its own cadence cannot be compared with earlier captures, because printing costs time inside the read loop it is observing, so only the sequence and the coordinates are usable. The rate is one line in two frames and the budget is 512 lines per press, reset on a lift, because this board has already run with contacts that never lift. And only samples with n=1 may judge the coordinate: with two contacts the slot order can swap between frames, which would look exactly like a hundreds-of-pixels jump.  The trace then found the phantom itself. Payload 6e516920 printed ten contacts from the first frames of the boot with weights around 238640 and 64780, and the witness row kept reporting tx=29527 ty=4262 - a contact at the top right corner - for the whole twenty seconds the button thread kept printing, with cf climbing by 274 per half second and the unclamped peak sitting at exactly 63744. That number is 0xF900, and there is only one way a node delta can be 0xF900: its reference is zero while its reading is 0xF900. A reference is zero only when it was seeded from a frame in which the chip had not produced that node yet, so those nodes have been referenced at zero since boot and every later real reading has been a huge delta - one permanent finger at the top right, which is why iOS treats every real touch as a second finger and why gestures do not work. The fix is in the driver and has to be measured on hardware: a zero node is not seeded, and an unseeded node adopts its first real reading instead of contributing a delta. What the same capture also shows is that the coordinate path below the phantom is sound: during the owner's touches the [tc] rows read n=1, move one or two pixels per 40 ms sample, and the four corners of the panel reach x from 476 to 29622 and y from 198 to 20113, i.e. the mapping covers the screen., recorded in the limits as 'this unit must name the firmware explicitly; the fallback table is not bootable'. Until that comparison exists the seqlock reading stays a hypothesis rather than a conclusion: touchSend is a correct seqlock on its own, but with eight cores its reader and writer are finally on different cores, which is the first time the question is testable at all. A separate reading to keep straight: thp/new/same/skip in the DbyTouch(s5) row are THP frame peeks, new frames, repeated frames and IRQ skips (DbyTouch.cpp:2082-2110), not contact counts - pub=0 with thp=1 new=1 is the first peek of the first frame and  The zero-reference fix that came out of that phantom carries three rules. It is permanent only because the reference updates downwards alone: any other wrong seed (a stale page worth 0xFFFF, say) is corrected by the next frame through raw < base, and zero is the only value that is both below every real reading (nodes sit near 0x8000) and unreachable by that correction, so treating zero as unseeded is the algorithm's own fixed point rather than a chosen magic number. A pad that legitimately reads zero (masked, unbonded, or simply outside the panel's real matrix, since the geometry is fixed at 50x32 while FWINFO only cross-checks it) will now contribute nothing instead of a permanent phantom, and starts contributing again by itself as soon as it reports a real value. And the fix costs at most one blank frame: a node whose first valid reading happens while a finger is on it keeps that reading as its reference and stays blind until the finger lifts, so the first adopt frame prints no contact and must not be read as a new fault. Two things deliberately stay out of this round. The gate margin is one: with the phantom gone the real finger measures 1307 to 4402 against a 1200 gate, so light or fast touches will drop frames and a drag will stall occasionally - that is a threshold problem and gets its own round. The other is the general case of a non-zero wrong seed, which the zero rule cannot catch: a physical upper bound on the delta (a real peak is about 4400, so anything above roughly 60000 is a broken reference)  That bound was then measured rather than guessed, and the measurement moved the cause again: on payload 90fae7cb the phantom came back with an unclamped peak of 33032, which is 0x7FFF, i.e. 0xFFFF minus a normal 0x8000 reference - the nodes were reporting the chip's no-data pattern, not a zero reference. Payload 54fc9454 treats 0x0000 and 0xFFFF as 'no reading' per node (delta 0, counted) and adds nothing else: a reviewer had to remove an earlier whole-frame rejection because routing a bad frame to the 'found nothing' exit returns with the last coordinates still held, which is the stale-coordinate fault this file fixed once before; with the per-node guard a dead frame simply yields zero candidates and ends through the normal debounce and lift. The result on hardware: at boot the witness row reads cf=0 and tx=ty=-1 for the whole first half minute where every earlier build had ten contacts by the fifth second, [td] never prints, and the owner's first real touch after the fix produced 151 trace lines with n=1 throughout, inv=0 in every line, one to fifty pixels of movement per 40 millisecond sample while dragging down the panel, and a clean lift to tx=-1 with cf frozen at its final value. So the boot phantom and the one-finger-two-contacts shape both came from  Touch is usable. Payload 54fc9454 (kernel 322cc4aa, 56 arguments / 992 bytes) is the first image on which the owner used the interface - tapped an icon, swiped up, dragged content - and reports it working. The chain that got there is worth keeping in order, because each step was a different fault and every one of them had to be removed separately: the DSI enable-toggle kick stopped the touch frame flow and had to go; the firmware image had to be pinned to W2599Z1100 because this unit reports no project id and the table default W2599Z2700 garbles the display and leaves the reader at tp=1; and the phantom contacts that made the pointer jump were no-data nodes (0x0000 and 0xFFFF) entering the pipeline as measurements, which showed up first as a zero reference and then, once that was fixed, as an unclamped peak of exactly 0x7FFF. Treating both no-data patterns as 'no reading' removed the phantom and the one-finger-two-contacts shape together, and on hardware the boot now reads cf=0 with tx=ty=-1 for the first half minute, [td] never prints, and a drag produces 151 trace lines with n=1, inv=0 and one to fifty pixels of motion per sample before a clean lift.  That threshold round moves the gate to 1000, chosen as the geometric midpoint between the 774 phantom measured in the offline recordings and the 1307 weakest real peak seen on hardware (sqrt(774*1307) is 1006), and it ships with the instrument that proves it: because candidates are only created above the gate, the existing peak field can never report a component that was rejected, so the witness row now also carries wmax - the largest component peak of the boot measured before the gate. With nobody touching, wmax is the noise ceiling, and the reading order is fixed: read wmax on an untouched panel first, and only then judge a touch. Two costs are recorded rather than discovered later. The gate also keeps weak-but-invalid components from competing for the 24 candidate slots and from entering the matching stage, so lowering it can produce the same shape the no-data nodes produced - two stable clusters for one finger - and if the two-contact row comes back with n=2 that is the price of the lower gate, not a new defect: the fix is then a tighter match or a merge radius, never raising the gate again. And the 774 phantom is a number from recordings, not from this panel: if an untouched wmax above 1000 ever appears, the gate goes straight back to 1200 and the third noise source gets its own investigation.",
]
completion = ["A touch or key event reaches SpringBoard and the lock screen can be dismissed on hardware."]
limits = ["This area records the accepted DbyTouch stack and the catalog consumer; the hand-built producer that preceded it is retired, so its counters no longer describe the shipped path.", "The RCG read-back mask for the touch SE (DBY_TOUCH_GCC_RCG_CFG_MASK = 0x001037FF, DbyTouchBoard.h) compares more than the driver writes: bits[10:0] carry DIV[4:0] and SRC_SEL[10:8] but also the reserved bits[7:5], and bits[13:12] are MODE, so a reserved bit or a MODE that latches differently from the write would make a correctly latched clock read back as a failed write. The mask that compares only the written fields is 0x0010071F. This is a decision, not an omission: the wide mask is what the board booted with, so it is the only form with hardware evidence behind it, and narrowing it would weaken an assertion on a path that has run in exchange for a risk nobody has measured - the narrow form could hide a reserved bit that does latch. It stays wide until a boot can print both comparisons on the same register, which is what would turn the argument into a measurement. The header states the bits the constant sets instead of repeating a field list it does not implement.", "The N9Z version/trim table exists twice in this repository: package/DbyTouch/DbyTouchProtocol.c for the touch path and package/NvtProtocol.c:53-77 in the pinned ShengNovatekTouch copy. They agreed byte for byte on 2026-11-14, and nothing kept them agreeing - a row added or a mask corrected in one left the other behind, while both feed the same panel's identify step. That gap is closed: scripts/check-nvt-trim-tables.py parses both initialisers and compares row count, ids and masks, and scripts/check-nvt-host.py runs it before its model tests, so a drift fails a gate instead of needing a reader. It looks for each file in the places this repository and an assembled tree put them, and fails when one is missing rather than skipping. Unifying the two copies is still not done - that means exporting the table from the pinned copy (a deviation from its keep-in-sync status) or promoting it into a package header both include - but the comparison is now the thing that would catch what unification would prevent.", "The live GENI SPI implementation is the QcomGeniSpi component, and the size_t underflow this board found on 2026-11-14 is fixed there: handle_rx subtracted the last-word padding from a byte count that can be zero (RX_LAST with a zero word count is a legal empty last packet), which wrapped the count to about 2^64 and made the drain loop read the FIFO that many times. The fix is commit b6852b4391f8 in the org mirror (gitee.com/uni-xnu-dby-w09/QcomGeniSpi), the core catalogue entry names that repository and revision (UniXNU 805668e), and the board build compiles it: the archive's GeniSpi.o disassembles to the clamped form (a csel between the padding and zero) and the kernel carries the component's symbols. The upstream GitHub tree still carries the defect; docs/patches/qcom-genispi-rx-underflow.patch is the diff for that submission, and this entry moves to the upstream revision once it lands."]
next_action = ["Read the thp= row: new=0 means the chip announces no new frame and the doze/host-command path is what to fix; new>0 with an unchanged fingerprint means the report page is elsewhere and the decode is what to fix.", "Compare the vendor's enable/resume sequence and its host commands line by line against this driver, in the vendor tree that is already on this host."]

