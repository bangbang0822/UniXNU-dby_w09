command = "one console row per 1 KiB of the 8208-byte frame (feat f9a60d2), kernel cd8c297c and payload 3add15c0, fastboot flash preload and one boot"
revision = "f9a60d26cc5291cc4947374ad24b058480f41cbf"
result = "The probe settles the question the previous row left open, and it settles it the other way: the read path is healthy. The console carries the full ladder `DbyTouch(s5): read 0/8208` through `read 8192/8208`, then `read 0/8208` again, i.e. the 65 chunked transfers of a whole frame complete and the thread starts the next frame immediately; `s5=0xFFFFFFFE` on the panel means `started, not finished` for a thread that reads frames forever, not a read that stopped. What still does not happen is the contact: `[touch edge] installed=1 contacts=0 from_edge=0 skipped=0`, `[touch multi] reports=0 max=0 lifts=0`, and the HID row stays `touch-reports=0 res=-1` while `key-reports` climbed to 8 on the same boot, so the consumer and the key path are both fine and only the frame decode is silent. The next question is therefore in the payload rather than in the transport: what the 0x1000 region of a frame carries on this part, which is the N9Z decode question the input findings already describe (the structured 0..0xFFF region not moving under a finger, the 0x1000+ region stable per boot and random across boots)."

[[area.evidence]]
kind = "device"
reference = "package/DbyTouch/DbyTouch.cpp"
command = "feat a1c644b adds one row every 64 publishes with the scanned payload-s non-idle byte count, a rolling hash and the word at 0x1000; kernel 4d93c639 and payload dea4bd9f were flashed and the same boot was captured first with the panel idle and then with a finger held on it"
revision = "a1c644b4b4d195244aece6b8220264711517024a"
result = "The comparison the decode question needed, and it answers it: the frame does not change with a finger. Idle, eight consecutive rows read `pub=512..960 nz=4677 sum=688f4116 w1000=14000000`; with a finger held on the panel, ten further rows read the same `nz=4677 sum=688f4116 w1000=14000000` through pub=2368, byte-identical. So stage5ReadChunked-s 0x20 request returns one static page every time rather than the chip-s report page - which is what the comment above the FWINFO block already suspects from the other direction: latching a different page before the read moved the frame from 267 real bytes to 4029, and this page is denser still at 4677. The next step is therefore the page selection the vendor-s get_frame() performs before it reads, not the transport, the HID publish path or the pin/power bring-up - all three of those are now measured healthy on this build."

[[area.evidence]]
kind = "source"
reference = "package/DbyTouch/DbyTouch.cpp"
result = "The vendor source answers what the page selection is, and it is not a page latch: in huawei_thp_core.c the only caller of ops->get_frame is thp_irq_thread, i.e. the frame is read inside the touch interrupt (pin 39, idle high, falling when a report is ready), and novatek_thp.c touch_driver_get_frame is a single full-duplex transfer of THP_MAX_FRAME_SIZE bytes whose first byte is spi_read_mask(0x20) = 0x20 & 0x7F, followed by dummy bytes that clock the read out. This driver does the same command in 65 chunked transfers on a 12 ms timer after each frame read with no interrupt, which is the shape that produces one static page. feat eebd1d9 therefore gated the live loop on pin 39 (kernel 2dd857f6, payload cb3a5ed5) - and the gate measured `skip=0`: the line reads low at boot (`pin39 irq ... level=0`) and stays low through the capture, so the gate never closes and the frame is still the same static `nz=4677 sum=688f4116`. So the two forks left are the transfer shape (one 8208-byte full-duplex transaction, as the vendor does, instead of chunked transfers with CS held between them) and the interrupt line itself (a pad that reads low before any touch is either not this unit-s IRQ or is held asserted because no read ever consumes the report). The first of those is now measured, and it is not the gap: the frame chunk went from 128 to 1024 bytes (8 engine programming gaps per frame instead of 65, kernel a34a75244ef5bef4aa422633ec3fa74a163eeffee047393297ae3b8c2d355148, payload ca73712730f6c38cea4c246ff5323ecad52646e30e9973b00a04b5a562ba7f15) and the fingerprint rows are unchanged - `pub=2304..2624 nz=4677 sum=688f4116 w1000=14000000 skip=0`, byte-identical to the 128-byte build and to the idle baseline. So the chip is holding its interrupt low and answering every read with the same page no matter how the transaction is cut, and what is left is why the report page is never produced: the vendor-s enable/resume sequence and its host commands are the next thing to compare line by line against this driver, in the vendor tree that is now on this host rather than by another flash."

[[area.evidence]]
kind = "source"
reference = "package/DbyTouch/DbyTouch.cpp"
result = "Upstream reads frames differently, and the difference names the question the 2026-11-15 fingerprint could not answer. ShengNovatekTouch's NvtProtocol.c reads a short header at the frame offset first (nvt_peek_frame_header, 24 bytes through read_at's len+2 with the data at rx[2]) and rejects a torn frame (nvt_frame_header_valid); the sheng probe's loop peeks that header, counts peeks that saw no new frame and headers that failed validation, and only reads a whole frame when the header says one arrived - its row carries peek/new/type/reads/bad. Its comment also records the controller's doze behaviour: the controller leaves doze at the first touch and then announces a frame for every scan whatever the frame type, and the host puts it back with the same host command it sends after the firmware download once no finger has been down for three seconds (native_touch_doze[4] counts the requests, the refusals, the wake and the last announced type). This driver reads the frame unconditionally on a 12 ms timer after each frame read behind the pin-39 gate, so a chip that never announces a new frame returns the same page forever and the fingerprint row cannot tell that from a page that simply carries no contact. The 2026-11-15 change adds stage5PeekHeader (the same 24 bytes at 0x20, data at rx[2]) and extends the fingerprint row with thp/new/same/fail and the header's first two words. It does not gate the frame read, so the boot behaves as before while the row answers whether the chip is announcing frames at all. No hardware has read it yet."

[[area.evidence]]
kind = "device"
reference = "package/DbyTouch/DbyTouch.cpp"
command = "kernel 1fa2ecb3 and payload 2c3cb8ba flashed to preload (fastboot flash preload), reboot, console captured on COM20 with DTR raised at enumeration"
revision = "65eb51010c0438d49862b6cce5cbc6a968a38144"
result = "The peek answers the question the fingerprint could not: the chip announces one frame and then nothing. Every fingerprint row of that boot reads the same shape - `pub=0 ... thp=1 new=1 same=0`, then `pub=1664 thp=1665 new=1 same=1664`, `pub=2048 thp=2049 new=1 same=2048` - i.e. of 2049 peeks of the 24-byte header at 0x20, exactly one differed from the peek before it (the first, against a zero buffer), and 2048 were byte-identical, with the header words staying `h=00000040 3220fe01` for the whole run. A second boot of the same build repeated it (`pub=2304 thp=2305 new=1 same=2304`). So the frame content is stable because the chip is not announcing new frames at all, not because the report page is elsewhere: the 0x20 read returns the same page every time and the header never changes. The next question is therefore the doze/host-command path upstream documents - the controller leaves doze at the first touch and announces a frame per scan afterwards, and the host puts it back with the same command it sends after the firmware download - not the decode, the chunking or the pin."

[[area.evidence]]
kind = "device"
reference = "package/DbyTouch/DbyTouch.cpp"
command = "payload 4eb334977d83b051024b2d287e815cf60e28e2a0f89f0151e35dff564be579f7, built from an uncommitted working tree (the reader had no commit of its own; the nearest commit, 7f7e9ca, does not contain it), fastboot flash preload, fastboot continue, console captured on COM20"
revision = "7f7e9ca5ee7b1a6ed3b3972f1dedeecfc5318d94"
result = "The firmware test did not run, and the reason is the boot-argument parser. The console carries `DbyTouch(fwsel): dby-touch-fw=L is not in the table, keeping W2599Z2700` - a one-character value where `1100` was passed. XNU's PE_parse_boot_argn only forces a string copy when the argument *name* begins with an underscore; every other name goes through getval(), and a purely numeric value takes the integer branch, so `1100` was written into the buffer as four bytes (0x0000044C, whose first byte is `L`) and the selector never saw the digits. The boot then uploaded the fallback image again (`image=W2599Z2700 ilm=14547/18f0d943 dlm=0bc47/b674d6db rc=0 attempts=1 state=160`) and the panel showed the same lines, so this boot says nothing about which image the panel wants. The three lcd-kit configurations behind the three images are all 800 x 2560 with the same physical size (145 x 232 mm), so resolution cannot choose between them; the vendor chooses by the project id in oeminfo, and this unit's oeminfo is erased (every byte 0xff). The image therefore has to be named explicitly, and at the time of this boot the name had to be text - the full project id `W2599Z1100` - because a purely numeric value takes the integer branch. The reader now accepts the numeric forms too (1..3 as the index, anything else as a four-digit suffix), and the reset pulse is gated behind dby-touch-reset so the next boot can test the image without the stage-6 pulse confounding it. Neither has run on hardware yet, and the gate has a known condition: the firmware upload follows the identify step, so a chip that does not answer without its reset also uploads nothing, and that outcome means the pulse is needed for identify rather than that the image is right."

[[area.evidence]]
kind = "device"
reference = "docs/display-white-lines-2026-11-16.md"
command = "payload 5e45b8bbfef811fb3fde6539abadec971360283d068c8004b9c7416673c80753 (kernel b053d425, reset gate in place) flashed to preload, fastboot continue, console captured on COM20, panel and touch observed by the owner"
revision = "fe459cf37a487fa8bbf7c59cdf966997e375118b"
result = "The white-line fault is closed on hardware, and the touch image that this unit wants is W2599Z1100. Three rows say it: `DbyTouch: reset pad untouched (pass dby-touch-reset=1 to drive gpio98)` - the gate, so GPIO 98 was never driven; `DbyTouch(fwsel): image W2599Z1100, ilm=146ab/428647e2, source argument` and `DbyTouch(upload): image=W2599Z1100 ilm=146ab/428647e2 dlm=0bc47/45718ee7 rc=0 attempts=1 state=160` - the explicit image was selected and the chip took it without being reset first; and then `DbyTouch(s5): pub=3712 ... thp=3713 new=3713 same=0`, i.e. the chip announced a new frame on every one of 3713 peeks, where the fallback image had produced `new=1 same=2048` and one static page. The owner reports the panel showing the home screen with no lines, and touch responding to tap and swipe - the first time this port has had working input and a working panel at the same time. The owner also reports the pointer is laggy, which is the next item: the live loop prints two console rows per frame and reads the 8208-byte frame in eight 1 KiB transfers on a 12 ms timer after each frame read."

[[area.evidence]]
kind = "source"
reference = "package/DbyTouch/DbyTouch.cpp"
result = "The touch image is no longer chosen by oeminfo, and it cannot be: the vendor reads a panel project id from that partition, this unit's oeminfo has none - the driver says so itself, 'DbyTouch(fwsel): oeminfo 0x3000..0x8fff has no project id' - so the vendor's rule had no input and the table's last image was uploaded instead, which is what the 2026-11-16 white lines came from. The image is now proven on the tablet after a whole enable round: dbyTouchProbeFirmware() uploads a candidate, runs dbyTouchEnableTail (counter probe, the vendor's start-scanning pair, the second counter probe, the IRQ sample), then asks whether the chip announces new frames, and moves on when it does not. The round is in the test because a chip that has just been uploaded does not answer the start-scanning pair at all (2026-11-16 12:12 and 12:26: 'DbyTouch(hostcmd): bt=1 idle=1 active=1' during every probe), so a header read taken before it always sees the same page - which is why four earlier versions of this probe rejected the image that is known to work. Measured with the final code: 'DbyTouch(fwprobe): W2599Z1100 announces frames, selected' followed by new=N same=0 rows, on a build whose command line named that image as the fallback. Not measured working without that name: with the table default first, a second round in the same cold boot does not come up, so the boot falls back to the default and the panel garbles (2026-11-16 13:44) - one reliable round per cold boot is the hardware's limit as measured, so dby-touch-fw stays the per-unit fallback and an oeminfo project id, where it survives, only orders the candidate list. Review caught five defects before any of this ran: the probe read the header before the start-scanning pair, a failed probe left a different image on the chip than the rows named, the restore path could claim a round it never ran, gEnableRc survived from an earlier candidate, and the header was compared from the wrong offset. The probe is OFF by default (dby-touch-probe=1 turns it on) because the boot that used it selected the right image and then had no touch at all: frames kept coming (new=N same=0) and NativeHidInput opened its device, but nothing reached the pointer, and that is not explained yet - the default path is the one the 2026-11-16 01:0x boot proved. Lag, separately and still open: the reader publishes ~32 times a second (64 publishes per 2 s row) against a 60 Hz target, because a frame read costs 7-10 ms of engine time (8208 bytes at 10 MHz) plus the 12 ms gap in DBY_TOUCH_HID_READ_GAP_MS."

[[area]]
id = "gpu"
status = "implemented"
