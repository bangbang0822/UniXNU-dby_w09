result = "2026-11-18 01:00, the display failures are Apple's, not the port's: the string 'verify_swap failed for swap id: %d' that fills the console on a bad boot exists in the donor kernelcache (/root/core-pub/out/ipsw/21H461/kernelcache.decompressed, file offset 0xdd0e21, __PRELINK_TEXT), and no file in this repository or the core contains it. So the port's own validateSwap accepted the request and the original IOMobileFramebuffer path rejected the surface afterwards, which is why the GPU client waits forever ([scanout wait] calls=1890 timeouts=1889) while the GPU keeps submitting: no frame is ever offered because no swap survives Apple's check. Reading that check from the kernelcache needs the string's cross-reference, which an ADRP+ADD scan of every segment does not find (Apple's kext may load the format through a table), so the next measurement stays empirical: a build that prints, on the first three accepted swaps, the display dimensions, the surface width/height/stride/allocation/length and Video[] as the loader published it, which is payload 913f277e (swapok.img) on the build host."

[[area.evidence]]
kind = "source"
reference = "drivers/GopFramebuffer/NativeLegacyDisplay.cpp"
result = "2026-11-18 02:10, why the swap queue cannot simply be reset: the core's newer NativeLegacyDisplay overrides cancelSwapsAfterTimeout() to drop the validated list after a swap's client gives up, and this board builds the device repository's older copy, whose IOMobileFramebufferLegacy has no such virtual - adding the override fails to compile with 'only virtual member functions can be marked override'. So the newer driver's timeout reset cannot be ported verbatim; if the stale queue is what starves kickOnce, the reset has to be emulated inside the old driver (ageing out validated entries when pendingSwapRequest stays unusable), which is a change to review rather than a copy. The same session also learned that the device copy's base ABI predates the newer one, so the newer driver's other overrides (kickSwapQueue ordering, gpuBypass) cannot be assumed either."

[[area.evidence]]
