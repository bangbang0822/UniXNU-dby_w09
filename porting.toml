[[area]]
id = "diagnostics"
status = "device-verified"
components = []
paths = ["package/BootProgress.c", "package/BootLog.c", "package/BootResetDby.c", "package/BootProgressStubs.c", "package/BootProgressCore.h", "package/BootProcessProbe.c", "package/BootUiTraceProbe.c", "package/BootFaultProbe.c", "package/BootWatchdogPolicy.c", "package/LinkStubs.c", "scripts/patch-xnu-entry-probe.py"]
inputs = ["Panel text output as the only device-visible log; boot-progress=2 checkpoints, panic screen and UI trace page.", "An offline QEMU harness reproducing the same image with counters readable as text.", "Build tags in kernel_args to tell images apart on the panel."]
configuration = ["[payload] panic_screen = true and kernel_args boot-progress=2, armcpu-diagnostics=1, boot-ui-focus=launchd, boot-ui-focus4=SpringBoard, sheng-build-tag.", "boot-diag-resume controls when the diagnostic page may retake the panel; 3600 keeps it with the OS.", "LinkStubs/BootProgressStubs provide the zero-value definitions for sheng-specific counters that libBootProgress references."]
procedure = ["For each attempt record the command, the image hash, the last completed checkpoint and the first failing operation.", "Use the offline harness for counter-level questions and the device only for what needs the real panel or the real storage."]
findings = ["The panel is the instrument: without a console, the panic text plus checkpoint numbers are the only evidence, so a build tag per image is not decoration but the way to correlate a photograph with a build.", "Counters beat wall-clock judgement. In the offline harness the guest clock advances while TCG work rate stays roughly ten times slower than the official hypervisor, so elapsed time never proves progress or regression.", "The panel still needed a camera photograph until the official persistent-log writer was linked in: package/BootLog.c was in the tree but not in the build. With it compiled and sheng-log=1 set, writes go to the userdata tail and are read back over EDL - see the storage area for the exact range and for why this is a recorded exception to the no-writes-to-userdata rule.", "The log stores more than a message buffer: every two seconds compose() writes the complete 48-row diagnostics page into a rotating slot, so any value the page carries can be recovered offline without a camera. A row only reaches that archive if it is captured into boot_progress_page_text; until 2026-11-02 the capture path rejected rows >= 48, which is exactly why the HID verdict line could never be read back (corrected below).", "The panel grid is 48 rows (0..47) and only row 43 was free; 48 and 49 were added for new diagnostics and, before the 2026-11-02 fix below, silently never drew.", "2026-11-02 late, the HID verdict row was unreachable and is now fixed: the row lived on grid row 48, but capture() dropped row >= 48 (page_text was [48][BP_COLS]) and BootLog.c archived only i<48, so the one row that separates a link/args fault from a sink fault from a coordinate fault could never be read back over EDL - and every row 0..47 is claimed by some conditional path (history 6+i, trace 6+i..19, console 17+i..23, exits 20+i/21+i, process rows 24+i and 38+i-7, frozen page 31..47), so it cannot simply be moved. Fix: page_text grew to [49][BP_COLS], capture() accepts row < 49, BootLog.c declares [49][120] and archives i < 49, and the HID line is written with capture(48,b) only - it is never drawn, because bp_line lives in a prelinked kit whose bound for row 48 is unverified. Review M1 then corrected the row's own field mapping: driver= now prints results[3] (0 = no IOHIDEventDriver below, 1 = found, -1 = never evaluated) and key-reports= prints events[4] (key-down and button reports); the previous code printed events[4] as driver= (so a healthy match read 0) and events[5] as key-reports (key-ups only).",
 "2026-11-01 the unattended autoreset is deliberately disabled: writing the reboot reason needs the PMIC SDAM cell, the SPMI arbiter answers rc=4 because sheng's PPID 0x071 is an SM8550 value, and whether kona's ABL honours a reboot-reason cell at all is unproven (the misc partition already carries bootonce-bootloader and the tablet still boots the system). boot_reset_probe() therefore refuses, which is the honest gate package/BootLog.c:1154 asks for, and the device no longer restarts itself every 270 s.", "2026-11-01 later: the PMIC route above is superseded. The vendor kernel this tablet ships (msm-poweroff.c:653-689) writes reboot reason 0x77665500 into four bytes of IMEM at 0x146BF65C (kona.dtsi:1947-1962) for `reboot bootloader`, so the board's own mechanism needs no PMIC at all. package/BootResetDby.c now maps that word with ml_io_map() - the physical address cannot be dereferenced in this kernel, there is no physmap - and runs in two stages: S1, the default, only reports the word it finds and refuses to arm; S3, enabled by the payload argument sheng-autoreset-write=1, writes the value, reads it back and only then returns 0. The gate is a boot argument on purpose: switching stages costs a payload rebuild, not a kernel rebuild. If the word still holds 0x77665500 at the next boot, ABL did not consume it, and the probe restores the vendor's normal-reboot value 0x77665501 and refuses; sheng-autoreset-force=1 overrides that once. That fuse is a courtesy, not the loop protection it was written as: measured on 2026-11-02, the word the probe reads differs on every boot (0x586440b7, 0x786408bb, 0x58e404b7), i.e. the firmware rewrites restart_reason before the kernel runs, so `before == 0x77665500` is essentially never true and the refusal path never fires. Loop safety comes from the firmware honouring the marker and parking in fastboot, not from this check. The probe is idempotent across its three call sites (BootLog.c:1090, BootLog.c:1155, BootProgress.c:749) and defers itself when called from the IRQ tail, where ml_io_map is not safe. Answered on the device 2026-11-02 04:06 with the S3 payload: EL1 can write IMEM (row `imem=786408bb -> 77665500 armed`, mark rc=0 after readback) and the firmware does act on it (PSCI SYSTEM_RESET returns the tablet to fastboot with no host action).", "The unattended loop needs the device to come back on its own. Two independent deadlines now do that: package/BootLog.c resets when sheng-autoreset expires (it only exists once the storage-backed log window is open and a round wrote), and package/BootProgress.c runs a second deadline off the monitor thread that needs no storage at all. Both call package/BootResetDby.c, which resets through PSCI SYSTEM_RESET (smc #0, 0x84000009) because PEHaltRestart() cannot work here: PE_halt_restart is never assigned on this port. A reboot reason needs no misc write at all. Correcting an earlier claim in this record - that this boot image never passes AVB, so ABL enters fastboot on every start - measured on 2026-11-02, an EDL Firehose `--power=reset` boots the XNU image and then the tablet keeps restarting itself, so ABL does NOT park in fastboot on every start - it enters fastboot when the IMEM word says so, which is exactly what the S3 write arranged.", "2026-11-02 defect and fix: the storage-independent deadline compared the ABSOLUTE cntpct_el0 against sheng-autoreset. cntpct does not reset on a warm PSCI reset (kona.dtsi:1304,1313 - a 19.2 MHz always-on cxo), so once the accumulated uptime passed the limit every boot fired at its first monitor tick. First seen as a 60 s deadline in ~30 s, then, after an EDL power reset at 04:29, as an unattended reboot loop: each boot armed, fired within a second, wrote the marker, reset into fastboot, and the next continue repeated it. Rescued by catching a fastboot window and re-flashing the S1 read-only payload. Fixed in package/BootProgress.c: the base tick is taken where the probe arms the deadline and the test is (now - base) / freq >= limit, so each boot measures its own interval; arming is a one-shot __atomic_exchange_n latch (the same pattern dby_touch_probe_done uses) and base is loaded before cntpct is sampled, so two poll callers cannot make now - base underflow. The value 60 s and the S1/S3 gates were left unchanged.",
 "Diagnostic polish must not outrank the next root cause; the fastest useful step has repeatedly been one static query that enumerates the answer instead of another flash-and-read cycle."]
completion = ["Every claimed milestone has a reproducible command, a matching source revision and an accessible result."]
limits = ["No serial or USB console in XNU yet; UI-trace and process probes are board-local adaptations of shared sources."]
next_action = ["Keep sheng-log=1 as the kernel-log channel and read it over EDL; the remaining gap is that the writer keeps its region in userdata, so a non-userdata region in NativeUfs is the change that removes the exception."]

