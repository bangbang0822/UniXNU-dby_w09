findings = [
    "Everything currently on the panel is CPU-rendered scanout, so GPU work is an optimization and not the next blocker.",
    "The display stack reaching its started state without GPU proves the surface path is separable from rendering.",
    "2026-11-03 13:55, G-1 cannot be cleared by a bare register read: it hangs this SoC. The reviewed gate was in place (package/DbyGpuSmmuProbe.cpp dbyGpuSmmuReject: any single ID word at 0x0/0xFFFFFFFF, S1TS, SMS, NUMSMRG, NUMCB, NUMS2CB, UBS/OAS codes 0..5, PTFS4K bit12, distinctness of id0/id1/id2, ID2 IAS, ID1 page geometry against the 0x10000 map; the call site also waited for now>=20 and a written log slot). Payload stage22 (sha256 E6DEF527..., 46 args / 989 bytes, dby-gpu-smmu=1) froze the device: evidence/edl-log-s22 read over EDL shows rounds=10 slots_written=10 uptime_s=18, slots r=0..9, last page time=19s with procs=1 (only launchd) and NO GPU SMMU row at all. Slots are written every 2 s, so t=18 is the last one and t=20 is the round in which the probe first ran - it never returned. The comparison is stage21 (sha256 16080DCD..., 45 args / 974 bytes): 345 s, 159 slots, procs=250, SpringBoard p353 - note it is a DIFFERENT kernel binary (2df719f8...), so the 13:07 kernel (949bd994...) has never booted without the argument; the stage23 recovery boot is that first boot. procs=1 on the frozen page is not evidence (stage21 r=9 at t=19 s is identical), and 「no GPU SMMU row」 is entailed by the slot timing rather than independent proof; the discriminator is the missing t=20 store with write_errors=0 state=2. Panic vs stall is UNVERIFIED (no photo, no panic log region). This matches the vendor constraint the review cited: the GPU SMMU block must not be touched before gcc_gpu_memnoc_gfx, gcc_gpu_snoc_dvm_gfx and gpu_cc_ahb are enabled (vendor kgsl_iommu.c:945-956, kona-gpu.dtsi:269-274), and this kernel votes none of them. Conclusion: the input_bits <= 32 gate is real, but its verdict has to be read from inside the GPU bring-up, after gcc_gpu_cfg_ahb_clk (GCC+0x171004), gcc_gpu_memnoc_gfx / gcc_gpu_snoc_dvm_gfx (GCC+0x17100c / +0x171018), gpu_cc_ahb_clk (GPUCC+0x1078), the hlos1 SMMU vote clock (GPUCC+0x5000) and gpu_cx_gdsc PWR_ON (GPUCC+0x106c, poll gds_hw_ctrl+0x1540). That code ALREADY EXISTS in the pinned SoC feed: the missing owner is bits 2->3 of Sm8250Platform/A650GmuPower.c (writes the cfg_ahb enable bit, then clears SW_COLLAPSE and polls PWR_ON, :158-220), which gates the SMMU read on CX PWR_ON + the vote clock at :258-263 and returns SkippedPrereq otherwise - exactly the guard the ad-hoc probe lacked. Sm8250Platform is pinned in the sm8250-common feed but not wired here ([components] has no Sm8250Platform, CONFIG_XNU_NATIVE_ADRENO is not set). The reference board documents the same order (package/GpuProbe.cpp:158 gates GPUCC reads on mode>=3; :1789 starts the sequence 5 s after the late probe). A timeout around the read is impossible: an unclocked slave either SLVERRs or never completes, there is no in-kernel bound, and BootResetDby.c:321-328 returns -1 (no hypervisor watchdog), so boot_reset_watchdog is an inert stub. Ordering is the only protection. The probe stays linked and inert (without the argument it prints only GPU SMMU skipped) and its plausibility gate is kept for that powered path. Recovery payload-stage23-nosmmu-recovery.img (sha256 B9B27572..., 45 args / 974 bytes, the stage21 argument set) was flashed automatically at 14:03 and boots. G0 remains the only GPU result and it is link-only: scripts/build-adreno650.py archives the pinned Adreno650@70771a7 driver plus ArmSmmu4K@83969cd into 28 objects / 1672520 B; work/tracks/gpu-smmu-read-hang/REPORT.md is the full write-up.",
    "2026-11-03 15:10, G1 execution path in place: the GPU power/clock step now exists as code. The missing owner was upstream all along - FFT-infra/UniXNU-sm8250-common@26fd784 adds kits/Sm8250Platform (A650GmuPower.c: mode 2 writes gcc_gpu_cfg_ahb_clk s enable bit, mode 3 clears SW_COLLAPSE on gpu_cx_gdsc, polls gds_hw_ctrl for PWR_ON and waits for the hlos1 SMMU vote clock, and :258-263 refuses to read any SMMU register until those hold). The upstream catalogue never listed that component, so core components.toml gained a LOCAL Sm8250Platform entry (marked local, full sha, path kits/Sm8250Platform), feeds.toml a matching [[source]], and board.toml selects it. The SoC pin was deliberately NOT bumped: 6bb9b02 -> 26fd784 also carries dts/sm8250.dtsi changes to ufshc/ufsphy, and UFS is the only working storage path; verified the tree still uses the pinned adreno-650.0 DT. New package/DbyGpuPowerProbe.cpp maps the seven windows, implements A650GpuIo with bounds checks, calls A650GpuBringup and renders six rows (native_gpupower_rows); scripts/build-gpu-power-probe.py compiles it with the kernel s recorded C++ command and the kit with the recorded C command, force-loaded via defconfig. Boot argument dby-gpu-power=<1|2|3>; this round takes 1 (46 args / 990 bytes) - zero writes, GCC-only by the window mask. Two critical defects were caught in review before any flash. (a) package/LegacyDisplayProbe.cpp:493-496 called sheng_gpu_power_probe() from native_legacy_display_late_probe(), which bsd_init.c:1314-1315 runs inside bsd_autoconf - early, before the log writer stores a slot - and the one-shot guard would then have made the late BootProgress gate a no-op, i.e. exactly the pre-evidence MMIO that froze the device on 13:12. That call was REMOVED (BootProgress is the only call site), and the probe additionally carries its own witness gate: it weak-imports boot_log_slots_ok (new in BootLog.c, incremented only when the slot, message buffer, header write and sync all succeeded - boot_log_rounds is bumped before the header write and cannot serve) and returns without latching stage until that counter is non-zero. (b) mode 1 was not the zero-risk step it was described as: A650GmuPower.c s GPUCC and SMMU reads are gated on prerequisites (cfg_ahb enabled; CX PWR_ON plus the hlos1 vote clock), not on the mode, so a bootloader that left those clocks on would have made mode 1 read GPUCC and the SMMU. Fixed in the probe: the mode decides the have_windows mask the kit receives - mode 1 gets GCC/GCC_VOTE only, mode 2 adds GPUCC, mode 3 adds SMMU/GPU. mode 3 still needs the full capability gate (the old dbyGpuSmmuReject checks) and an answer to the gcc_gpu_memnoc_gfx / gcc_gpu_snoc_dvm_gfx question, both recorded as preconditions. Outcome matrix: survives with GPU PWR m=2 ... ahb=1 -> GPUCC is readable and cfg_ahb works, next is mode 3 (CX + vote clock + SMMU read); survives with GPU SMMU not read: state=2 -> the kit s gate refused as designed, go to mode 3; freezes again -> GPUCC reads are also unsafe on this board and the next step is mode 1 (GCC only).",
    "2026-11-03 20:30, G1 mode 1 and mode 2 measured on hardware, with the power probe now driven by the upstream Sm8250Platform kit. Mode 1 (payload stage28, 8440 s uptime, zero write errors) printed gcc=1 cc=4 smmu=4 gpu=4 cx=0 clk=0 ahb=0, cfg_ahb=00000001>00000001 (the branch is ALREADY ENABLED when the kernel starts), memnoc=80004221, dvm=80000001, gpll0=01206d7f. Two readings in that row had to be corrected afterwards: 80004221 and 80000001 both have CBCR_ENABLE (bit0) set AND CLK_OFF (bit31) set, i.e. enabled-but-halted, not off; an earlier report called dvm on. Mode 2 (payload stage35, 217 s uptime, zero write errors) printed gcc=1 cc=1, cxgdscr=00222001 (SW_COLLAPSE set, PWR_ON clear -> CX GDSC is off), cc_ahb=80000001 and cc_smmu=80000000 (the hlos1 SMMU vote is neither running nor even enabled), ahb=0 (no write happened, as predicted). So GPUCC is readable once cfg_ahb is on, the CX rail is down at boot, and mode 3 is NOT the zero-write case. Consequences recorded: (a) the memnoc pre-enable idea was rejected by review and by the register itself - a bit-0 write is a no-op when the enable bit is already set, and the branch is expected to unhalt once CX/GX power comes up (hypothesis that modes 3/4 test, not a measurement); (b) the SMMU verdict now also requires gpu_cc_ahb to be running, because the kit enables it and never verifies it and that is the SMMU register-interface clock; (c) a new mode 4 (3a) runs the kit mode 3 with the SMMU window masked, so the GDSC/clock writes can be proven on their own before the first SMMU read, since rows render only after A650GpuBringup returns and a freeze during the writes would otherwise leave no evidence. Mode 2 also validated the isolation rule: dby-touch=0 keeps the touch driver off hardware (it returns before mapWindows), so this boot had exactly one new variable. Artifacts: payload-stage28/35 for the two measurements, payload-stage36-gpupower4-3a for the next step; reports work/tracks/g1-mode1 and g1-mode2.",
    "2026-11-03 22:35, GPU route corrected after two independent reviews (external Adreno documentation plus a repository audit; work/tracks/gpu-route-review/REPORT.md). Two of the project s own assumptions were wrong. First, SMMU_IDR2 IAS/OAS is the SMMU s synthesised address width (arm_smmu_id_size_to_bits maps 0..5 to 32..48 bits) and is read-only: it is not a fuse, a client whitelist or a security gate, and mainline returns IOMMU_DOMAIN_IDENTITY for qcom,adreno clients, so the theory that input_bits below 36 refuses non-kernel clients has no mechanism behind it - and the e00002be figure that started it is alioth s driver-side clientWindowBytes()==0 refusal, never measured on this board. Second, the real gate is GPU secure mode: a6xx powers up secure, the supported exit is the signed zap shader loaded through PAS/TZ (DRI-devel 2019-04), and writing RBBM_SECVID_TRUST_CNTL directly is documented to take a secure target down. Neither SECVID writability nor the presence of a secure monitor has been measured here. The GMU cold start also needs five clocks (GPU_CC_CX_GMU_CLK/AHB/CXO, GCC_DDRSS_GPU_AXI, GCC_GPU_MEMNOC_GFX), the RSCC/PDC microcode, a650_gmu.bin and the HFI queues, none of which exist in the ladder; the kit s mode 6 has the clock sequence but nothing calls it. Host-side defects found and to fix before any GMU work: the kit gates on chip id 0x06050002 (AC/PIPA) while this board s vendor DTS says 0x06050000; the kit s HFI table reaches 670 MHz while the board s OPP table stops at 480 MHz; the kit s SMMU gate powers only gpu_cc_ahb and the hlos1 vote where the vendor powers the GDSC plus three clocks; and there are two competing GMU stacks with no declared owner (the G0 archive excludes NativeAdrenoService.cpp, so the linked driver path cannot cold start the GMU at all). Decision: run one bundled probe boot (re-read memnoc/dvm after power, print input_bits on every path, write-readback SCR0 to settle EL1 writability, set the GPLL0 GPU votes and re-read), then PAUSE the GPU track and move capacity to the A track (A7 Data, then A4/A5); resume only when U2 acceptance is met and A7 persists, or a GPU content requirement becomes the top acceptance item, or the GOP-to-GPU handoff gets its own milestone.",
    "2026-11-04, the ladder is measured on hardware, not inferred. package/DbyGpuPowerProbe.cpp (4076 lines, sha256 3C950687D9F202D17242F17258E37937DDAED48FDB0465EDDED14D30B96388F1) runs one bring-up level per boot under dby-gpu-power=1..15 and every level below the driver handover returns PASS in the boot-log window: CX power (gpu_cc_cx_gdsc), GMU clocks, GMU SMMU context bank 1 / ASID 2, A650GmuColdStart, GX power, GPU SMMU context bank 0 / ASID 1, SQE load, ring 0, CP_ME_INIT and CP_MEM_WRITE. Rows are in evidence/edl-log-s70 through s78. The CP proof (s70) reads GPU CP st=00000000 rptr=0000001b wptr=00000024 me=1 mw=2 sf=3 hf=00000000 mark=a6500c0d, where mark is the CP_MEM_WRITE payload, i.e. the command processor really executed from the ring and wrote memory.",
    "2026-11-04, ZAP and secure mode are cleared with the device's own firmware. Mode 15 loads the tablet's /vendor/firmware/a650_zap.elf (13964 B, sha256 ba430ec576dc469a77237d0f47ba4f6feb71478fe643a3fd202413a3a61c03c9) through PAS 13 with that image's own signature metadata instead of the alioth image the shared tree ships (payload stage81 sha256 78ecfc25c7f283fc8d8133ca5232063f91d59c94ce2166325d72d857b4038533, evidence/edl-log-s78): GPU ZAP st=00000000 step=7 init=00000000/00000000 mem=00000000/00000000 auth=00000000/00000000 sec=0 tr=00000001. sec=0 is the CP reporting unsecured mode after CP_SET_SECURE_MODE(0), which is what the vendor sends through the ring once zap_loaded is set (adreno.c:2001-2021), and the order matches the vendor's a6xx_hw_init -> CP init -> a6xx_zap_load -> adreno_set_unsecured_mode (adreno_a6xx.c:922, :926, :931). The first attempt with the alioth zap was refused, init=ffcfffbb (evidence/edl-log-s71); the refusal was the OEM signature, not a missing PAS.",
    "Two writes on this path are known-bad and must not be retried without new evidence: writing RBBM_SECVID_TRUST_CONTROL 0xF400 stalls the interconnect whether or not the value is read back (prog=4, evidence/edl-log-s75 and s79/s80), and the vendor only writes it when zap_loaded == 0 (adreno.c:2039-2043); handing the PAS loader the alioth image with corrected metadata hung the CPU in EL3 (prog=3, evidence/edl-log-s74). A stall here is not a panic: the boot-log page keeps its last slot and the uptime stops.",
    "The remaining step, handing the GPU to a driver, is blocked in the shared tree rather than on the device: src/UniXNU/drivers/Adreno740/NativeAdrenoService.cpp:95 (OSDefineMetaClassAndStructors) makes clang-24 assert in RecordLayoutBuilder.cpp:3439 (reproduced, rc=-6), and NativeAdrenoGmuConfig.h:6 includes ShengGmu.h, the SM8550 GMU backend, which has no SM8250 counterpart. Neither defect is a hardware limit, so the ladder above is not lost work; the route that resolves them is the subject of work/tracks/adreno-build-path/REPORT.md.",
    "pas_supported(13) returning a1=0 on this board is advisory and is not evidence that PAS 13 is unavailable (evidence/edl-log-s76: sup=0/0 avail=0/1 tr=1). kgsl never calls qcom_scm_pas_supported, only qcom_wcnss.c:480 does, and the tablet runs Android with the same TZ, so the query says nothing about the loader; the loader worked.",
    "2026-11-05, the archive builds again and the two records that called it a compiler blocker are corrected. kits/ArmSmmu4K was checked out 4 commits behind origin/main (3ba9245 vs the catalogue pin 83969cd, which carries `feat(smmu): allocate page tables on demand`, 48dbd6c); with the submodule switched, scripts/build-adreno650.py compiles 28 objects into build/adreno740/libAdreno740.a (1672432 B, sha256 85a7bfee9bff615ed50fec095eb0f6cdda022cbd11dfb80c34f345cefe58c116, evidence/gpu-archive-r1/build-report.json). The clang-24 assertion at NativeAdrenoService.cpp:95 is error recovery on an invalid RecordDecl (the XNU type-signature patch reaches RecordLayoutBuilder.cpp:3439) caused by the missing ShengGmu.h and ArmSmmu4KTablePages types, not by flags or by the metaclass macro: work/verify/verify-h1.py reproduces w0/w1 crashing and w2 (both types supplied) not crashing. Link-time gaps left: _native_gpu_dcvs, _native_gop_handoff_call, _native_gop_handoff_memory.",
    "2026-11-05, R2: build/adreno740/libAdreno740.a is force-loaded into the kernel and the link succeeds. CONFIG_XNU_NATIVE_ADRENO=y plus CONFIG_XNU_NATIVE_ADRENO_ARCHIVE in configs/dby_w09_defconfig, build-adreno650.py last in board.toml [kernel] archives; kernel.macho sha256 e9aca811359454c7ebd9209a13da3cbe38f98240a9b4d2a795e1bfadb2bee2f7 (evidence/gpu-archive-r1/kernel-r2.json). Nothing in the driver runs at G0: no caller and no boot argument, so the image cannot change a boot by itself.",
    "Three link failures came out of R2 and each has a cause on disk, not a guess: (1) '_native_gpu_dcvs' and '_native_pmap_user_mappings' undefined -- the driver declares them weak_import and a static kernel link still refuses an undefined weak_import, so package/BootProgressStubs.c now carries the reference board's own answer (alioth package/BootProgressStubs.c: 15-entry DVFS array of zeros, pmap probe returning 0); (2) 41 duplicate symbols between libAdreno740.a and libDbyGpuPowerProbe.a -- both embed AdrenoFirmware/AdrenoHfi/AdrenoPM4/ArmSmmu4K and both are force_load'ed; (3) dropping the probe archives leaves _native_gpusmmu_census and _sheng_gpu_smmu_probe (BootLog.c:148, BootProgress.c:103) undefined, which the same stub file now answers.",
    "The driver archive and the ladder probe cannot both be force-loaded today. The board therefore has two named configurations, switched by work/verify/toggle-gpu-config.py: 'ladder' (probes in, driver archive out -- what the tablet runs, payload stage81) and 'g0' (driver archive in, probes out -- what R2 proved links). Resolving the duplication properly is part of R3: one of the two has to stop compiling its own copy of the kits.",
    "The archive recipe needed a driver lookup because the tree never has one: under schema_version 2 unixnu tree keeps only the components board.toml selects (src/UniXNU/scripts/unixnu/components.py:102 and :111-117), so the feeds.toml Adreno740 [[source]] is dropped even though it is pinned at 70771a7. build-adreno650.py now looks in the tree first, then beside the repository the package symlink resolves to, then beside the script (driver_candidates). Selecting the catalog Adreno740 component instead is not the answer: its dependencies pull Sm8550Platform and its build is build-arm-driver.py Adreno740.",
    "2026-11-06, kit ownership resolved (option ii of work/tracks/gpu-r3-wiring/REPORT.md): the 13 kit TUs (ArmSmmu4K x8, AdrenoPM4, AdrenoFirmware/Hfi x4) are compiled once into build/adreno-kits/libAdrenoKits.a by scripts/build-adreno650.py --kits-only, that archive is the LAST word of CONFIG_XNU_EXTRA_LD_ARCHIVES and is not force_load'ed, so it sits after the driver's force_load on the ld line (build-xnu-4k-baseline.sh:626, :755-757) and satisfies both consumers. The driver archive is now the 15 driver TUs only (1419704 B, sha256 d5a7d3d3354fd0ad1ab68c11b2e34688db664ce5e134d5036b0af8c99083c748) and the ladder probe archive is 4 TUs (754832 B, sha256 a0e5898e724ad81408ee50af3ec26607d0d714b43843129cc60c339e8bd410fc). Both are force_load'ed in one kernel: sha256 33382ba6f1cf793ec94f16dd68dbf8d7743481b09112963beb0b31e5f50f31a6, one definition each of _ArmSmmu4KLivePrepare, _AdrenoPM4Type7, _A650GmuColdStart, _NativeAdrenoGpuContextBringupRoutes and _native_gpu_dcvs, zero undefined symbols. The 41-duplicate problem is gone, so the board no longer needs two configurations; the invariants are checked by work/verify/toggle-gpu-config.py (7/7).",
    "2026-11-06 01:26, G-1 measured on the device, first time: input_bits = 48. The mode-15 ladder now renders the number from the identity word its GPU context encode already reads and proves (package/DbyGpuPowerProbe.cpp renderZap, the row starts with input_bits=), and the archived boot (evidence/edl-log-s79/decoded.txt, 276 of 286 slots) carries `GPU CP st=00000000 rptr=0000001b wptr=00000024 input_bits=48 id2=00005511 me=1 mw=2 sf=3 hf=00000000 mark=a6500c0d` next to `GPU ZAP ... sec=0 tr=00000001`. Decoding ID2=0x00005511: UBS bits[11:8]=5 -> 48-bit input address, OAS bits[7:4]=1 -> 36-bit output, IAS bits[3:0]=1 -> 36-bit input address size, PTFS_4K bit[12]=1 -> 4 KiB granule. So the driver's gate (input_bits <= 32 makes every non-kernel client fail with e00002be) is CLEARED with 16 bits of margin, and a 4 KiB granule is the one this board's tables already use.",
    "2026-11-06, the vendored GPU documentation and pins were audited against upstream (work/tracks/upstream-sync/REPORT.md, 781 lines; work/tracks/upstream-sync/AUDIT.md). Four results: (1) at audit time src/UniXNU was da14170, exactly 392 commits behind UniXNU/UniXNU main 7307c26; upstream main has since moved to e2fdae4 (413 commits behind da14170), and the vendored docs were replaced from that tip in b14e515 - 819 files byte-identical to work/upstream/UniXNU-live/docs - so the local pages are no longer an older-core snapshot. (2) The GPU chapter is written against Adreno740/SM8550, not the A650 line this board runs: it documents sheng-gpu-preempt and sheng-fb-bgra (the preemption mode needs NativeAdrenoPreempt.*, absent from 70771a7) and invokes tools/options the vendored core lacks (make-m2vpack.py, read-sheng-log.py, make-gpu-addon.py --cache-export and --pipeline-pack); following it would wire against code this board does not have. (3) The Adreno740 pin did not move: NativeAdrenoRing.cpp, NativeAdrenoGpuContext.h and NativeAdrenoGmuContext.h at 10304855 and at main 6fa7bae2 contain 0 matches for 0x06050002 and SM8250, the tree comparison against 6fa7bae2 shows 94 common files (64 identical, 30 differing, including those three), and the A650 content is byte-identical to FFT-infra/Adreno650 70771a7. (4) The A650 working tree was committed as 25b448e (49 files, +3111/-857) and pinned by parent commit 5fdcdc0, so it is no longer uncommitted: git submodule update at that gitlink is a no-op and, without --force, refuses to overwrite a dirty submodule. work/gpu/adreno740-a650-workingtree.patch (427180 B) covers 48 of the 49 files (+3040/-857) and reverses cleanly, but it omits tests/test_system_memory.cpp (+71), so it is a record of the earlier working tree, not a complete restore point.",
    "2026-11-06, the earlier claim that no UniXNU port had ever composited the desktop on the GPU is WRONG and is retracted here (work/tracks/gpu-desktop-precedent/REPORT.md, evidence with permalinks). FFT-infra/UniXNU-alioth is a Redmi K40: SM8250-AC and an Adreno 650, the same silicon class as this tablet. Its dated evidence says the GPU renders into the compositor's surface and the display copies it to the panel (docs/evidence/2026-10-29-gpu-gx-and-context.md @5cb506f0: '22 copies of 1080x2400x4 bytes, all retired', 'the picture on the panel is the desktop', 'seen on the panel, not inferred'; commits 76f34824 'evidence: the desktop draws' and bc908974). It also registers the Metal accelerator (GPUROW24: IOGPUFamily loaded, class size 136, IOAcceleratorES -> MetalPluginName -> NSBundle). Two other ports corroborate: UniXNU-sheng (A740) shows the home screen with icons and AdrenoMetal's README states GPU composition verified there, and ShueiTsuki/data-a-live credits UniXNU for the same on an A840. So the ladder below is not speculative work: it is the same route, on the same SoC, one reference board ahead. Alioth is honest that it is not yet boot-to-boot stable ('the desktop appearing is a race'), so the target is 'reaches the panel', not 'deterministic'.",
    "2026-11-06 04:40, mode 18 on hardware: the command processor executes from the archive's own ring. Row, stable across all 52 slots of the boot (evidence/edl-log-s82/decoded.txt, uptime 102 s): 'GPU ARC gx=00000000 gpu=00000000 buf=00000000 bits=48 nrm=8 | RING st=1 at=00000000 cp=00000000 w=00000000 o=1'. st=1 is the verdict (CpInit returned 0, idle() returned 0 and the observed fence reached the one the ring handed out); o=1 is the CACHE_FLUSH_TS timestamp retired by the CP, i.e. the CP really fetched and executed out of the ring the archive allocated at IOVA 0x200000. The path that produced it: the archive's GPU context, then the device-proven hw_init preamble (CP_PROTECT, CP_MEMPOOL, ROQ/IB thresholds, CP_APRIV_CNTL, RBBM_INT_0_MASK=0), then the a650_sqe.fw microcode copied into the archive's SQE buffer with readback, CP_SQE_INSTR_BASE/CNTL, ring gen 6 attach, CP_ME_INIT and a 100 ms fence wait. The previous round without the preamble failed exactly as predicted: 'w=e00002d6 o=0' (evidence/edl-log-s81) - the CP accepted the WPTR and never fetched.",
    "2026-11-06, mode 19 (GPU interrupt + published service) hung the kernel about two seconds into boot: evidence/edl-log-s83/decoded.txt shows rounds=1 slots_written=1, the page stops at time=2s with procs=1 and launchd just exec'd, and there is no GPU row at all - mode 18 writes 52 slots on the same image (evidence/edl-log-s82). A hung kernel also stops the boot-log writer, so in-kernel step markers cannot localise this; the four new calls are therefore bisected across boots with staged modes: 20 = NativeAdrenoIrq attach + programMask(true) only, 21 = + armcpu_spi_attach(332), 22 = + Submit/Timer attach, 19 = + native_adreno_publish. The device was restored to stage87 (mode 18) before the next round.",
    "2026-11-06 13:30, mode 19 on hardware: the GPU service is PUBLISHED and its interrupt is live. Rows, stable across all 149 slots of a 303 s boot (evidence/edl-log-s85/decoded.txt): 'GPU ARC gx=00000000 gpu=00000000 buf=00000000 bits=48 nrm=8 | RING st=1 at=00000000 cp=00000000 w=00000000 o=1' and 'GPU PUB st=7 s=00000000 t=00000000 i=00000000 m=03d0e242 spi=00000000 p=00000000 rb=0000a002 n=1'. Reading it: st=7 is the last step (publish returned); Submit::attach, Timer::attach and Irq::attach all returned 0; m=03d0e242 is exactly kEnableA6xx, so programMask's readback matched the A6xx enable set rather than the A7XX default that would mask the two IB interrupts; spi=0 means armcpu_spi_attach claimed INTID 332 as a level line; p=0 means native_adreno_publish returned success, so IOPMrootDomain and every later user client can find the device; rb=0000a002 is the GIC readback (enabled, level, group 1); and n=1 is the handler count - a GPU interrupt was actually delivered and acknowledged, which is the one thing the row could not have faked before this round. Two earlier attempts at this measurement were void and are recorded so they are not repeated: the board booted dby-gpu-power=18 (the payload's argument was never bumped) and the one-slot log that looked like a mode-19 hang was a boot the owner interrupted at monitor-time 2 s, eighteen seconds before the probe is allowed to run (BootProgress.c:1251-1259, DbyGpuPowerProbe.cpp:4599-4601).",
    "2026-11-06 13:30, mode 19 on hardware: the GPU service is PUBLISHED and its interrupt is live. Rows, stable across all 149 slots of a 303 s boot (evidence/edl-log-s85/decoded.txt): 'GPU ARC gx=00000000 gpu=00000000 buf=00000000 bits=48 nrm=8 | RING st=1 at=00000000 cp=00000000 w=00000000 o=1' and 'GPU PUB st=7 s=00000000 t=00000000 i=00000000 m=03d0e242 spi=00000000 p=00000000 rb=0000a002 n=1'. Reading it: st=7 is the last step (publish returned); Submit::attach, Timer::attach and Irq::attach all returned 0; m=03d0e242 is exactly kEnableA6xx, so programMask's readback matched the A6xx enable set rather than the A7XX default that would mask the two IB interrupts; spi=0 means armcpu_spi_attach claimed INTID 332 as a level line; p=0 means native_adreno_publish returned success, so IOPMrootDomain and every later user client can find the device; rb=0000a002 is the GIC readback (enabled, level, group 1); n=1 is the handler count, i.e. a GPU interrupt was really delivered and acknowledged. Two earlier attempts at this measurement were void and are recorded so they are not repeated: the board booted dby-gpu-power=18 because the payload's argument was never bumped, and the one-slot log that looked like a mode-19 hang was a boot the owner interrupted at monitor-time 2 s, eighteen seconds before the probe may run (BootProgress.c:1251-1259, DbyGpuPowerProbe.cpp:4599-4601).",
    "2026-11-06 14:50, mode 23 on hardware: a client opens the published GPU device and reads its ABI. Row, stable across all 123 slots of a 247 s boot (evidence/edl-log-s86/decoded.txt): 'GPU UC st=7 open=00000000 again=00000000 q=00000000 info=00000000 chip=06050002 ok=1 abi=2 in=48 out=36', with the mode-19 row unchanged beside it. Reading it: the first newUserClient(kernel_task, type 0x4147) returned success, a second open returned kIOReturnBusy (the driver's one-client rule, so the open really reached it), NativeAdrenoMethodQuery and NativeAdrenoMethodGetDeviceInfo both answered with exact record sizes, and the chip id in the reply equals the one published (0x06050002), so the reply came from our device and not from a zeroed record. abi=2, in=48, out=36 agree with the G-1 ID2 decode, i.e. the client is told the same address sizes the SMMU was programmed with. Two defects had to be fixed first and both are instructive: serviceMatching(\"NativeAdrenoGpu\") can never match, because serviceMatching looks up the C++ CLASS name while setName() only writes the registry IOName (the class is NativeAdrenoGpuPublished), so the reference's native_adreno_published_service() accessor is the right route; and the client must be closed with clientClose(), not just released, or the driver keeps kernel_client set, one of its four rows and a leaked core for the rest of the boot.",
    "2026-11-06 18:25, mode 24 on hardware: a client's command buffer is EXECUTED by the CP and its writes land in client memory. Row, stable across all 59 slots of a 117 s boot (evidence/edl-log-s87/decoded.txt): 'GPU BO st=11 a=00000000 m=00000000 c=00000000 mem=00000000 sub=00000000 w=00000000 rd=0', beside mode 23's 'GPU UC st=7 open=0 again=0 q=0 info=0 chip=06050002 ok=1 abi=2 in=48 out=36'. Reading it: two BoAlloc, two BoMap at client IOVAs (0x100004000 / 0x100005000, inside the aperture a client is actually given), two BoCpuMap, clientMemoryForType for both tokens, an IB of three CP_MEM_WRITE packets submitted as one indirect buffer, a fence wait that completed, and then the target buffer holding 0x0badc0de / 0xfeed0001 / 0x600d0003 - the values the IB wrote, not values the probe put there (it filled the buffer with 0xdeadbeef first). Three review catches made this measurement trustworthy and are worth keeping: WaitFence's output record is ZERO bytes, so passing one fails with kIOReturnBadArgument before the method runs; the read-back must start at a sentinel, because a BSS zero renders rd=0 and reads exactly like success; and the BO IOVAs have to be >= GpuClientVaStart, because 0x20004000 only worked for a kernel-owned connection whose scope is zeroed and would have proved the wrong thing.",
    "2026-11-06, a survey of every SM8250/SM8250-AC record in the workspace (work/tracks/metal-survey/REPORT.md) shows what the Metal path really is on this family and corrects two beliefs this record carried. What Metal is: an IOAcceleratorES subclass named AGXAccelerator (drivers/Adreno740/NativeAdrenoAccelerator.cpp:18-27, named after Apple's class on purpose) plus AGXDeviceUserClient as the connection class, whose initializer is stripped from __mod_init_func and must be run by board code after IGPUFamily loads; and in user space a Mach-O BNDL, NativeAdrenoMetal.bundle (plugin + Metal frontend + metal2vulkan + Turnip libvulkan_freedreno inside), delivered as an NGUPADD2 addon that the kernel writes into the Data volume and then binds read-only union mounts over /System/Library/Extensions and /System/Library/LaunchDaemons under sheng-gpu-addon=1. Only one A650 record claims it reached the panel: alioth (device-records/alioth.toml:285-322, 'GPUROW24 METAL ok'); j716f built and registered the accelerator but presents through GOP. Corrections: (1) the clang-24 ICE at NativeAdrenoService.cpp:95 is not a compiler defect and not in this board's build - it is error recovery on a missing type, the in-tree kit now declares ArmSmmu4KTablePages, and this board excludes that TU the same way pipa and alioth do; what is actually missing is the accelerator TU in build-adreno650.py plus the user-space bundle, which is macOS-only to build and exists nowhere in this workspace. (2) The 'four client slots / slot-0 window must exceed 967 MiB' limit describes the older fork snapshot alioth pinned; the driver this board links has no cap and derives each connection's window from input_bits (NativeAdrenoPublish.cpp:143-147, GpuClientVaStart 0x100000000), which is why mode 24 could map a client BO at 0x100004000.",
    "2026-11-06 20:25, mode 25 on hardware: the staged AGXAccelerator is built, bound, initialised and attached; it did not register. Row, stable across all 57 slots of a 114 s boot (evidence/edl-log-s88/decoded.txt): 'GPU METAL st=7 kext=00000000 sz=00000088 init=00000000 inst=00000088 acc=ffffffff on=00000000 reg=ffffffa7', beside the unchanged mode-19/23/24 rows. Reading it: OSKextLoadKextWithIdentifier(\"com.apple.iokit.IOGPUFamily\") returned 0; the live parent metaclass reports class size 0x88 = 136, i.e. it really is the class the platform interface was audited against; preModLoad plus the hand-run __GLOBAL__sub_I_NativeAdrenoAccelerator.cpp plus postModLoad returned 0, so the three absolute IOAcceleratorES bindings resolved against this kernel; our own instance size is 136 as well and init() succeeded; attach(IOService::getPlatform()) succeeded. The one red field is reg: after registerService() the object's state does not carry the registered bit. Two artifacts of the row itself must be read carefully: acc=ffffffff is the sentinel, not a failure (the allocation succeeded - the earlier revision cleared it, this one does not), and reg=ffffffa7 is this board's own code for 'attached but not registered'. So the class is live but invisible in the service plane, which is exactly what a Metal plugin matches against, and the next step is the registration path rather than the class itself.",
    "2026-11-06 20:55, mode 25/26 on hardware: the staged AGXAccelerator is REGISTERED in the service plane. Row, stable across all 98 slots of a 195 s boot (evidence/edl-log-s89/decoded.txt): 'GPU METAL st=7 kext=00000000 sz=00000088 init=00000000 inst=00000088 acc=00000000 on=00000000 reg=00000000 state=000000' (the state word is cut by the 119-byte row: its last two characters are lost, and reg=0 proves bit 1 is set, i.e. 0x00000002). Reading it: IOGPUFamily loaded, the live parent is the audited 136-byte class, preModLoad plus the hand-run initializer plus postModLoad returned 0, our instance is 136, init() succeeded, attach succeeded, and registerService(kIOServiceSynchronous) set the registered bit - state 0x2 is exactly the reviewer's predicted 'registered, nothing matched' value, which is the useful one: nothing claims our accelerator yet, so the Metal plugin will be the first to match it. Two measured lessons: the asynchronous default left the bit clear at row-render time (evidence/edl-log-s88 reg=ffffffa7), because the registered bit is set inside doServiceMatch, which the async path hands to a job thread; and the rendered-order change put the ARC/RING/PUB/BO rows in the log before the inline matching runs, so a block there can no longer look like a GPU hang.",
    "2026-11-06 21:15, mode 25 on hardware with the widened row: the staged AGXAccelerator is not only registered but published. Row, stable across all 46 slots of a 90 s boot (evidence/edl-log-s90/decoded.txt): 'GPU METAL st=7 kext=00000000 sz=00000088 init=00000000 acc=00000000 on=00000000 state=0000001e reg=00000000'. state 0x1E decodes as kIOServiceRegisteredState (0x2) | kIOServiceMatchedState (0x4) | kIOServiceFirstPublishState (0x8) | kIOServicePublishedState (0x10), i.e. the object is in the service plane and its publication ran, so a Metal plugin matching on MetalPluginName now has something to find. The previous boot (evidence/edl-log-s89) showed state 0x0000000? cut off by the 119-byte row; the fix was to drop inst= (it tracks sz=) and print state before reg, which is why this run can read the word at all. Both rich values also settle the earlier question: registration was never failing, only asynchronous - the registered bit is set inside doServiceMatch, which the default path hands to a job thread that had not run when the row was rendered.",
    "2026-11-06 23:40, mode 26 is wired and the row fits. The review of the previous revision found a measurable defect in the row rather than in the calls: with three 0xFFFFFFFF sentinels rendered as ten decimal digits the worst-case line was 138 bytes against a 119-byte row, so find= never printed and sg= showed a plausible-looking 42949 - the exact 'reads as a result' failure the sentinel was introduced to prevent, and it applied to mode 25 as well. The flags now render as one character each (0 clean, 1 set, f never reached), inst= is gone because it tracked sz=, on= is back because gDbyMetalAccelInit is finally rendered, acc= is cleared as soon as allocate() succeeds so an init() failure no longer looks like a refused allocation, and the property keys are single-sourced. Worst case is now 110 bytes. board.toml passes dby-gpu-power=26.",
    "2026-11-07 00:40, mode 26 on hardware: the descriptor the Metal plugin consumes is in place and the published accelerator is discoverable by a matcher. Row, stable across all 615 slots of a 1244 s boot (evidence/edl-log-s91/decoded.txt): 'GPU METAL st=8 kext=00000000 sz=00000088 init=00000000 acc=00000000 on=00000000 state=0000001e n=1 c=1 g=1 f=0'. Reading it: the three properties read back exactly what was set - MetalPluginName is 'NativeAdrenoMetal' (n=1), MetalPluginClassName is 'NativeAdrenoMetalDevice' (c=1) and NativeSandboxGrantProcess is non-empty (g=1) - and waitForMatchingService(\"AGXAccelerator\", 1 s) returned the service (f=0), so it is visible to a matcher, not merely present in the registry. state stays 0x1e (registered | matched | firstPublished | published). This closes the kernel half of the Metal path: everything the plugin needs to find and talk to already exists and is verified on hardware. The row also cost two review rounds over its own width - the sentinel values rendered as ten-digit decimals overflowed the 119-byte row and hid find=, which is why the flags are now one character each.",
    "2026-11-07 00:55, the payload now carries a signed Metal plugin and the kernel still reports no addon: the row reads 'A files=-1 wr=0 same=0 fail=0 err=0 mount=1/2 mount2=1/2 mount3=1/2' (evidence/edl-log-s92), where files=-1 is the counter's 'no addon at all'. Everything on the packing side was verified first: the artifact's three CDHashes re-derive from the signed Mach-Os (type 2, 4 KiB pages, every code page checked), the owner trust bundle parses with three ascending type-2 entries, the addon is 12,151,848 B of eight files that match the artifact byte for byte, and the payload's FAT carries kernel.macho.gpuaddon (5442dc7c) and kernel.macho.trustcache (54dd82de) exactly. The cause is upstream of the kernel: the ADT's /chosen/memory-map GpuAddon and TrustCache slots are zero in the image and the thing that fills them is the boot loader, while this board's UEFI package is a thin seam (src/uefi-dby_w09/UniXNUPkg/Library/UniXNULib/Boot.c, 6.3 KB, no payload file reads) - the shared tree's DarwinBoot driver does have the read and the publish (DarwinBoot.c:235, :583), so either the volume has to ship it or the board loader has to gain the same two reads. Two further items from the packing review are open by design rather than mechanically: the owner trust bundle puts the owner module FIRST, which the kernel treats as the static cache while every later module is engineering-only (kern_trustcache.c:1074-1089), so the ordering is a trust-design decision and not a cosmetic one; and whether AMFI admits platform binaries from a loadable cache is unproven from this workspace.",
    "2026-11-07 12:43, the GPU addon loads and iOS user space reaches the GPU. The blocker was the firmware loader, not the kernel: the flashed volume carried a DarwinBoot forked before the addon feature (its AdtNode had no AddonOffset and never read .gpuaddon), so /chosen/memory-map/GpuAddon stayed zero however often the payload was rebuilt. Porting commit d099354's nine functional items into DarwinBoot.c (sha256 54960388..., reviewed PASS with no must-fix, plus the PHYFB handoff kept) and building the volume from it (SILICIUM_UEFI.fd cd8914b8...) changed the board row from 'A files=-1' to 'A files=8 wr=0 same=8 fail=0 err=0 mount=5/0 mount2=5/0 mount3=1/2' over an 8 h 09 m boot - the plugin bundle and its launchd job are mounted, mount3=1/2 is the wallpaper this addon does not carry - with [gpu clients] mediaserverd 23/0/22 s3, SpringBoard 7/0/6 s1, backboardd 3/0/3, WidgetRenderer_Defa 2/0/1 s2, PhotosPosterProvide 1/0/0 s4, [gpu ibs] submissions=66 ibs=143, and GPU UC st=7 chip=06050002 ok=1 abi=2 in=48 out=36. Evidence: evidence/edl-log-s93, work/tracks/gpu-addon-loader/RESULT-2026-11-07.md and REVIEW.md.",
    "2026-11-08 00:30, the command processor stops on one 32-bit word in a client buffer, not on a fault, a protect trap or a power problem. CP_SQE_STAT, read through its selector (index 1), holds 0x70bc8006 = type 7 / opcode 0x3c / count 6 = CP_WAIT_REG_MEM with payload '14 8108020 1 ffffffff ffffffff 10': POLL[5:4]=1 so the address is memory rather than a register, the address is IOVA 0x1_08108020 inside the client's own window (beside the four indirect buffers, not the driver's fence page), and REF and MASK are both 0xffffffff. CP_HW_FAULT 0x0821, CP_PROTECT_STATUS 0x0824 and CP_INTERRUPT_STATUS 0x0823 all read zero; RPTR==WPTR; CP_IB1_REM_SIZE is frozen at 0x3b (=59 of 155) while CP_IB2_REM_SIZE is 0, and the packet sits in IB2 at dword 0x83, reached by the nested search (hop 4). Note CP_IB1_REM_SIZE is a fetch counter, so it cannot say where execution stopped; CP_SQE_STAT is the register that can. Evidence: evidence/edl-log-s106, work/tracks/gpu-ring-stall/RESULT-2026-11-07-2234.md.",
    "2026-11-07 22:34, the stall dump reads real memory at every level now, after three separate instrument defects. (a) The board readers native_adreno_dram_read32 / native_adreno_cached_read32 were never installed (BootProgressStubs.c left them null, nothing assigned them), so every [gpu stall] IB window printed deadbeef; installing only the DRAM reader, range-gated against gPhysBase/gPhysSize with one page mapped per call, made them real (REVIEW-hooks-2.md). (b) CP_SQE_STAT turned out to be a selector/data pair, not two stat words (REVIEW-sqe.md). (c) The held packet was then found by searching the BR IB1's fetched range, its CP_INDIRECT_BUFFER targets newest-first, and finally IB2 (REVIEW-held.md, REVIEW-nested.md, REVIEW-poll.md). Lesson kept: a diagnostic that writes to flash can break the boot - payload slices flashed to cache made the firmware enumerate a 208 MiB FAT volume inside a 104 MiB partition, and every boot stopped at the menu with 'FatDiskIo: error Invalid Parameter' until the partition was zeroed (work/tracks/gpu-ring-stall/RESULT-2026-11-07-1851.md).",
    "2026-11-09 23:19, the Metal bridge opens the device and renders correctly on hardware, and the only change was userspace. drivers/AdrenoMetal NativeMetalBridgePhase.h hard-coded the translated-shader cache root as confstr(_CS_DARWIN_USER_CACHE_DIR)+m2v and discarded mkdir's result; metal2vulkan refuses the device open when its shader-cache Directory::open cannot create or probe that directory, and that refusal is the whole of the 'M s6501 ... ShaderCache(ShaderCacheEr' row, because 0x6501 is the device step (bridge/NativeMetalBridge.rs:306-310), not a GPU fault. The phase now walks the same five candidates in the same {4,0,1,2,3} order as the plugin's own device path (NativeAdrenoMetalPlugin.mm:271-303), probing each with mkdir plus access(W_OK). The failure row also spends the whole 63-character GPU7 line on the message when no count exists yet, because the counts field had cut it at 33 characters; a step that has counts keeps them, since a 0x6504-0x6506 failure already carries compute/render/import (bridge/NativeMetalBridge.rs:318,323,328) and a second streamText7 call would replace the row instead (NativeAdrenoPublish.cpp:909-926). The bundle came from GitHub Actions run 42641624086, built from fork bangbang0822/AdrenoMetal (the source pin was re-created through the Git Data API because github.com itself is blocked from this workstation while api.github.com answers). It advertises the change as the literal 'M s%x %.54s', which appears once in the new NativeAdrenoMetal (sha256 c37b27ef57e8de6ac21d7b3f2a2da84c6197c5ce7e371c12b8194909424b0ff3) and not at all in the old one (f627df4d4291325556b22c07818d76948c72e842791b5886d9d3738d40200619). Because the signed binary changed, owner-trust was regenerated (three CDHashes 1f47e1cf/b963a77e/da3d8412 became 0227da6e/59ad4b24/ddd082e1) and gpu-addon.bin rebuilt (sha256 5c09eed2...). evidence/edl-log-s130 reads '[metal gpu7] M s0 c0 r0 i0 q167 k4/11 p15/8 F0': stage 0 means every step ran, compute 0 of 1000 bad, render 0 of 64 bad, import 0 of 4096 bad, and F0 is the frontend passing with nothing missing. [gpu zap] st=0 step=30 and [gpu tgt] deadbeef are unchanged, so that boot moved exactly one variable.",
    "2026-11-09 23:45, stage 4 reached: the GPU copies the compositor's surface into the scanout and presents frames. The only change was the boot argument sheng-fb-gpu=1 (board.toml, joined command line 939 of the 1000-byte cap after the rebase removed sheng-autoreset=60 and sheng-disable-jobs). LegacyDisplayProbe.cpp:562-566 is the gate, and it only runs inside if(started && phase==4) at :559; NativeGOPPresenter.cpp:94 parses the same argument into gpuMode and :97 registers gHandoff only then, which is the sole condition handoffCall (:213) tests before answering kIOReturnNotReady - exactly the 'P2 ee00002d8' of s130. evidence/edl-log-s131 reads '[gop] arg=1 step=7', '[gop call] mode=4/0 present=0/0 wait=852/e00002d6 complete=16/0', '[metal gpu7] P4 e0' (GpuScanoutClient.h:33, step 4 is serving) and '[metal gpu7] PF 11/0 r0 v4/0 t26 a35': 11 frames presented with 0 failures, result kOk, v4/0 counts verify() runs, not rows: verify() runs once per presented frame, at most four times (GpuScanoutClient.h:103,125), and each run compares the top min(height,400) rows of the panel buffer against the source surface (GpuScanoutClient.h:117) - so none of those rows differed, the lower panel is outside the check and is painted by the diagnostic renderer (GpuScanoutClient.h:114-115), and the last frame took 26 ms against a 35 ms mean. The kernel side did not move: [gpu zap] st=0 step=30 and [gpu tgt] deadbeef. The switch does NOT remove the CPU framebuffer copy, which an earlier draft of this comment claimed: transfer()'s gpuMode refusal (NativeGOPPresenter.cpp:109) guards the presenter's own user client, whose NGP_METHOD_PRESENT has no caller in the tree, and NativeLegacyDisplay.cpp:445+ still paints every frame that native_legacy_gpu_offer() refuses."]
completion = [
    "A GPU-backed surface presents and the frame counters move without the CPU renderer.",
    "The ladder reaching ZAP clear is the half of that completion this board can prove without a driver: the GMU is up, the CP retired a fence, the service is published with a live interrupt and secure mode is cleared, so the path from XNU to the GPU core is established even before a client exists."]
limits = [
    "A user process has never opened the device: modes 23-24 open it from kernel_task, so the sandbox and MACF path a real client takes is unexercised. The connection class is deliberately named AGXDeviceUserClient so the original sandbox profiles admit it, but that is a design intent, not a measurement.",
    "No GPU-backed surface has been presented: mode 24 proves a client IB executes and writes to client memory, not that a frame reaches the panel. Presentation must use the GPU copy path because zero-copy is unusable on this SoC (secure-world MDP writes).",
    "The Metal path needs the user-space bundle (NativeAdrenoMetal.bundle, a Mach-O BNDL built with xcrun and codesign on a macOS host) and it exists nowhere in this workspace, so it cannot be built here as the tree stands.",
    "This build links the A740 context header, which places the SQE at 0x100000 inside the advertised GMEM aperture of 0x120000 bytes at base 0. Harmless while no client maps GMEM, and the reference uses the same numbers, but it must be checked before a client maps GMEM.",
    "The GMU and SQE images embedded in package/DbyGpuFirmware.h are the alioth copies (41548 B / 31632 B), not the tablet's own (41308 B / 31460 B). Cold start and the ring work with the alioth copies, so the size difference is recorded rather than explained.",
    "The kit gates on chip id 0x06050002 while this board's vendor DTS says 0x06050000, and its HFI table reaches 670 MHz while the board's OPP table stops at 480 MHz; the probe works around both, so neither is fixed upstream yet.",
    "2026-11-09 00:15, the all-ones wait is one CP_INDIRECT_BUFFER hop outside the submission. evidence/edl-log-s115 (payload-stage125-p1, '[gpu ibchain]' added that round) reads: sub n=4 8121000/256/0 8115000/256/0 8111000/256/0 8129000/256/0 and hop n=4 8137000/227/0 812d000/149/1 813d000/24/0 8133000/5/0 - none of the four submitted IBs holds a 0x70bc8006 header, and the first hop at 0x1_0812d000 holds exactly one, at dword 0x83, which is the '[gpu stall] held @40000083' packet. NativeAdrenoVm::dropAllOnesWaits scanned only the submitted list, so it could never remove this packet; that, and not the signature, is why the drop never fired (REVIEW-dropwait round 3 was right about the bytes and could not see the scope).",
    "2026-11-09 00:15, the polled word reads all ones and never moves: '[gpu stall] poll @8108010: 0 0 0 0 ffffffff ffffffff ffffffff 0 1 deadbeef 4 77 90 83 4' (six-word window, NativeAdrenoSubmit.cpp). The query's start timestamp and accumulator are 0, the stop timestamp at 0x1_08108020 is 0xFFFFFFFF, and the previous snapshot read the same value, so the comparison 'wait until it is no longer all ones' can never hold. This is the direct measurement RESEARCH-PRODUCER.md predicted; the producer is absent, not late.",
    "2026-11-09 00:01, the board had no GPU restart at all until this round. native_adreno_set_restart (NativeAdrenoPublish.cpp:198) had no caller anywhere in the tree, so g.restart stayed null, hangCheck counted hangs and recover() never ran - a stalled CP stayed stalled for the rest of the boot (evidence/edl-log-s113: queue stopped at fence 29, 29 minutes, SWAP calls=0). package/DbyGpuPowerProbe.cpp now installs dbyGpuRestart behind dby-gpu-restart=1. evidence/edl-log-s114 measured it: '[gpu recovery] hangs=1 restarts=0 failed=1 fence=32 status=e00002d6 | stop=2', i.e. the hook ran and its ring->idle(100 ms) timed out (0xe00002d6 = kIOReturnTimeout). hw_init + CP_SQE_INSTR_BASE/CP_SQE_CNTL + ring->restart + CP_ME_INIT do NOT revive a CP stuck inside an IB; the vendor's a6xx_recover() adds a GX power cycle and this board has no off path for it (work/tracks/gpu-restart/REPORT.md). RBBM_SECVID_TRUST_CNTL (0xF400) is deliberately not written by the hook: this board recorded that a CPU write of 0 there stalls this side (evidence/edl-log-s77), and a stalled store would park the hangcheck thread holding the publish lock. With s116 showing no hang at all, this is a robustness item, not a blocker.",
    "2026-11-09 00:35, stage 2 unblocked: the CP no longer stops. evidence/edl-log-s116 (payload-stage126-chain, sha256 99948BFD...) reads '[gpu dropwait] calls=505 bytes=182008 dropped=1 hops=1 fail=0 badarg=0 last=0', '[gpu ibs] submissions=95', '[fence wait] calls=996 timeouts=0', zero '[gpu stall]' rows and zero '[gpu recovery]' rows, with six GPU clients (kernel_task, backboardd, mediaserverd 95, SpringBoard, WidgetRenderer_Defa, CollectionsPoster). Against s113 (30 submissions, 23 timeouts, a stall row in every slot) the queue now drains. The one packet is replaced once, in the first hop, and never reappears - consistent with the client rebuilding the same query at the same address. What is left of this area is presentation (sheng-fb-gpu) and memory pressure (s116 ended at procs=75, free=2257 pages, which is not a GPU symptom).",
    "2026-11-09 10:47, the 'GPU stores never reach memory' conclusion is narrowed to the ENGINE. evidence/edl-log-s122 (payload-stage135-tgt2, sha256 3B57E379...) reads '[gpu tgt] @100001000 f3: adc0de1 feed0002 600d0003 deadbeef' - the driver read the userspace self-test's target BO back through the job's own page table, after a clean+invalidate, and found all three CP_MEM_WRITE markers (0adc0de1/feed0002/600d0003) in it; the client's own read of the same page agrees ('[metal gpu7] mediaserv s34 e0 v4/4'). So a CP store into a client BO lands, and the address space, the page tables, the BO mapping and cache coherency are all exonerated. What still fails is the engine's own stores: '[metal gpu8] T s0 r0 v512 c0 g0/4096' (512 of 1024 = the untouched half of the fill target, so the shader wrote nothing), unchanged from s119. The diagnostic reads only: submit() captures the target of the three-packet run (NativeAdrenoSubmit.cpp, three 0x703d8003 headers at stride 4 plus the self-test's three data words, which is what separates it from DbyGpuPowerProbe's identical run at fence 2), wait() reads it once the fence passes. Two reviews rejected earlier versions before this one passed: the first for reading through the member vm_ (the kernel's table, so a client iova could never resolve) and for a flat single-header match, the second for capturing the probe's page first.",
    "2026-11-09 22:29, ROOT CAUSE of the engine-write loss: the GPU was still in SECURE MODE. a6xx powers on secure and 'restricts what memory it can write to'; the CP is a privileged client so its stores land (the [gpu tgt] CP_MEM_WRITE readback), while every shader access was refused by the UCHE and surfaced only as RBBM_INT_0_STATUS bit 24 UCHE_OOB_ACCESS with cpi=0 prot=0 fault=0. No ladder in this project runs Turnip before the exit: the reference board does zap + CP_SET_SECURE_MODE(0) at its mode 10 and Metal/Turnip at mode 12, and this board's dbyGpuZapStart was reachable only from mode 15 while every test ran mode 26. The fix, and the order that matters: after dbyRingBringup and before the packet, dbyZapLoad (PAS 13 init_image/mem_setup/auth_and_reset) then CP_SET_SECURE_MODE(0) on the archive ring. evidence/edl-log-s128 reads '[gpu zap] st=0 step=30 sec=0 tr=1 ld=0' with '[metal gpu8] T s0 r0 v1024 c1024 g512/0' (fill 1024/1024 words, compute 1024/1024, triangle 512 pixels and 0 stray - the reference board's own working row) and '[gpu latch] irq=100000', i.e. bit 24 gone. Two negative rounds bracket it: s127 sent the packet WITHOUT the zap and the CP wedged (st=ffffff30 sec=1, RBBM_INT_0_STATUS 0x900200 = HANG|CP_HW_ERROR|fence, no Metal row), and an earlier draft put the zap before the ring, which s126 disproves is necessary (the ring, SQE base, microcode and SMMU bank all survive auth_and_reset). The exit is now ON by default with dby-gpu-nozap=1 as the escape.",
    "2026-11-09 22:29, what is left of the GPU ladder is userspace, not kernel. '[metal gpu7] M s6501 ... device: ShaderCache(ShaderCacheEr' is NOT a GPU fault: 0x6501 is the bridge's device step (bridge/NativeMetalBridge.rs:306-310) and the message is metal2vulkan's Error::ShaderCache, raised when Directory::open cannot mkdir the cache root, write its probe or unlink it. The plugin already ladders five cache directories for its own device (NativeAdrenoMetalPlugin.mm:271-303) but at that moment the bridge still took one hard-coded confstr(_CS_DARWIN_USER_CACHE_DIR)+m2v - the pre-fix state, no longer in the tree; that line range now holds the ladder, and the fix is bangbang0822/AdrenoMetal baaef2e, see the 23:19 finding; that header has zero commits since the shipped pin, so a plain rebase does not fix it. It is independent of the engine-write fault and masks it: one snapshot has the bridge dead at 6501 while the Turnip row reached its compute and render fences. The fix is a plugin-bundle rebuild on macOS, no kernel and no Turnip change (work/tracks/gpu-metal-bridge/REPORT.md)."]
next_action = [
    "Remaining rung 1, userspace: QuartzCore shader coverage. s131 reports qc k4/11 and p15/8 against q167 enumerated functions: the loop tried 15 kernels and 23 pairs, of which 4 and 15 translate - so the 15 is what was attempted out of 167 functions, not a coverage figure of its own. The names and errors are printed only when NMB_LIST is in the environment (bridge/NativeMetalBridge.rs:254,269,296), so the next boot has to export it and capture stderr; the counters alone cannot say whether the 11 failures are one defect or a family.",
    "Remaining rung 2: performance and stability under a real load. Nothing is measured yet, and s131's 35 ms mean is a nearly static desktop rather than a frame budget.",
    "The work is committed locally but not pushed. The board repository's base predates 37 commits of work on WQSQW/UniXNU-dby_w09 - the touch stack, the CDC-ACM console and a batch of porting records - and 21 of the files this change touches were also changed there, so the branch needs a real rebase before it can go anywhere; do not merge it as it stands. The AdrenoMetal change exists only as bangbang0822/AdrenoMetal baaef2e, which GitHub Actions 42641624086 built the bundle from.",
    "Do not port NativeAdrenoService.cpp; pipa and alioth both exclude it and so does this board."]

