result = "2026-11-18 01:05, the display race is a binding race between two drivers, not a timing detail inside one. The display driver prints 'DbyDisplay: copy=...' from the frame it copies; that row appears eight times in the boot where the panel shows the interface and zero times in the boots where Apple's 'verify_swap failed' fills the console - and those same boots print zero from kickSwapQueue and zero from validateSwap, because our driver was never in the path. So a cold boot binds this driver to the framebuffer and a warm one leaves the original implementation bound, which is what the earlier 'warm reboot race' really was. The fix must make our driver bind every boot (wait for the GOP/PHYFB handover before matching, retry the match, or take the framebuffer over after it appears) rather than assume a single match decides it. Evidence payloads: reject2.img a4565dd5 (0 rows) and the earlier boot in console-final2.log (8 rows)."
