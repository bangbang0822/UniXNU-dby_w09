result = "2026-11-18 00:30, the display driver's swap path is not being called at all. A payload whose diagnostics count the calls printed '[kick] 0', '[swaprej] 0' and '[swapok] 0' while the console carried thousands of Apple's 'verify_swap failed for swap id' lines and '[scanout wait] calls=745 timeouts=744': the family never enters this driver's kickSwapQueue() or validateSwap(), so every swap is decided by the original IOMobileFramebufferLegacy implementation and rejected there. The driver does start and does own the GOP (its scanout preparation prints), which is why the UI draws through it on a good boot, but the swap virtuals land nowhere the family looks - most likely a vtable/ABI mismatch, since this copy is compiled against the tree's headers while the running family comes from the donor kernel. Until the swaps reach this driver, no swap logic in it can change anything, and the GPU client keeps timing out because no frame is ever offered."
