[[area]]
id = "cpu"
status = "device-verified"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["configs/dby_w09_defconfig", "board.toml", "package/ShengPlatformPower.cpp"]
inputs = ["Eight ARM64 cores (SM8250 Kryo 585), GICv3 interrupt controller, PSCI through SMC.", "cpu nodes for all eight cores published by the common converter from the DTS MPIDR reg values.", "AppleARMPlatform and ApplePMGR kept in the prelink roots of board.toml [kernel.prelink]."]
configuration = ["dts/dby_w09.dts includes the SoC description where /cpus carries the eight MPIDR reg values 0x0 through 0x700 and /psci declares the smc method.", "[payload] kernel_args enables sheng-smp=1, armcpu-diagnostics=1 and armcpu-spi-ipi=1.", "early_security_init points at the unmodified AppleMobileFileIntegrity __TEXT_EXEC address of the donor kernelcache.", "ArmCpu is the shared secondary-core and IPI driver this board selects unchanged, and ArmDTPlatform publishes the platform description it reads from the handoff device tree."]
procedure = ["Build the kernel and payload, boot the device and read the boot-progress checkpoints for the CPU stage.", "Where the panel is ambiguous, reproduce the same image in the offline QEMU harness and read the diagnostic counters as text."]
findings = ["Secondary cores come up only when the IPI path matches what the ADT declares; armcpu-spi-ipi=1 was needed after an early bring-up that reached user space on one core.", "A panic string of the form pages=0x… free=0x… printed on the panel is the cheapest confirmation that the kernel is alive and the scheduler is running.", "Unmodified Apple user-space binaries exec only after AMFI is both prelinked and initialized: keeping it in roots is not enough, the early security initializer has to be published."]
completion = ["All cores run, the timer and IPI path are stable and user space is scheduled across them."]
limits = ["Per-cluster frequency and idle states are not ported; the board runs with default regulator choices."]
next_action = ["Record cpufreq and idle-state behaviour once the display and input blockers are cleared."]

