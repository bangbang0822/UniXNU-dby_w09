    "The bring-up is selected by the kernel argument dby-gpu-power=<1..26> (board.toml:253 holds the current level). package/DbyGpuPowerProbe.cpp reads it and runs exactly one level, then stops; levels 1..15 are CX power, GMU clocks, GMU SMMU context, cold start, GX power, GPU SMMU context plus SQE plus ring 0, CP_ME_INIT plus CP_MEM_WRITE, stock ZAP through PAS 13, and the TZ queries.",
