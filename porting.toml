result = "The boot after the gpu-addon fix still died at about 46 s, and the panic text - read back through the panic-to-log-window path added in this same round - is `\"AMFI: No PMGR?\\n\" @ConfigurationSettings.cpp:235`. The stand-in never ran: component:ShengPlatformPower sheng_pmgr_run() opens with `PE_parse_boot_argn(\"sheng-pmgr\", ...)` (ShengPlatformPower.cpp:71) and returns when the argument is missing, and the 2026-11-14 rename to pmgr=2 removed exactly that argument (the comment recording the rename said nothing read it; that comment was wrong). Payload.py only demands exactly one pmgr=2, so both names now travel: pmgr=2 for the payload check, sheng-pmgr=2 for the component. After that boot AMFI prints `AMFI: PMGRAON latched to: ffffffff` instead of panicking, launchd runs its boot tasks (mount-phase-1/2, fsck, finish-restore, keybag, launchd_cache_loader, workload-properties-init, init-exclavekit) and prints `Early boot complete. Continuing system boot.`, AMFI verifies cdhashes for new processes (`isCdhashInTrustCache ... Returning IOReturn 0x0 to process 102`), APFS flushes the Data volume, the audio HAL-s text fixup applies, and the kernel keeps running for minutes instead of 46 s. Still absent at the end of that capture: backboardd and SpringBoard, and IOMFB reports `default_fb_surface: No Default FB Surface found` - the display path is the next area, not the kernel."

