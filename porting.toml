result = "The CPU path is alive only while offer() stays gated on gpuClient. With the gate dropped, the first board self-test frame was accepted before any client existed, NativeLegacyDisplay set transferred on it, nobody ever completed it and the ladder refused every later frame: COPY calls=0 and the panel froze on one slot. Gated as the component repository has it, that frame is refused and the CPU path keeps running: SWAP calls=656 accepted=1 reason=0 COPY calls=655 status=00000000 bytes=16384000 retired=655, i.e. 655 full 1600x2560x4 frames copied and retired on this boot."

