    "UI-trace and process probes are board-local adaptations of shared sources."]
next_action = [
    "Keep sheng-log=1 as the kernel-log channel and read it over EDL; the remaining gap is that the writer keeps its region in userdata, so a non-userdata region in NativeUfs is the change that removes the exception.",
    "Evidence for the CPU round is behavioural only: the owner reports the system much smoother, while the accepted pair (kernel 60f3dbac380b, payload c1303fb6cf93) paints nothing and the console stops at lockdown_mode. alioth's own criterion -- UI work on c4-c7 -- still needs the CPUFREQ and SCHED rows, and the only place left to read them is the UFS window.",
    "Port package/linux-log so UniXNU-sheng/scripts/read-sheng-log.py can fetch the same rows from the UFS window with no panel at all.",
    "Turn the control plane on for the backpressure and drop counters, STATUS and REBOOT: qcom-usb-ctl=1 is no longer within budget (the line is at 999 of 1000 bytes), so it needs an argument retired first. A screenshot still needs a qcom_usb_debug_register_framebuffer() call, and the display side has none, so a shot answers unavailable today.",
    "Before re-enabling the CDC-ACM tee permanently, settle the 2026-11-01 hazard: qcom_usb_debug_write() polls DWC3 and once the cable leaves there is no owner to find."]

