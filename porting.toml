result = "The seed observation is closed from both ends. The kernel console carries `handle_mount:817: disk1s1 vol-uuid: 2138CDAC-F86A-4DED-9EF1-09F27363DB2A block size: 4096 block count: 2097152 (unencrypted; flags: 0x1; features: 1.0.2)`, `setting dev block size to 4096 from 512` and `mount-complete volume OwnerData, requested by: init (pid 1)`, so the packed seed-s volume UUID is the one the kernel was compiled against and APFS mounted it; launchd then says `****** DEVICE HAS EPHEMERAL DATA VOLUME, SKIP INIT ****`, which is the ADT-s ephemeral-storage property being honoured instead of a first-boot data migration. The panel row `D st=2 hdr=0 gpt=0/0 lba=1b055bf pres=1 ld=65 wr=1 cm=1 er=0 pages=2097152` says the persistent store resumed this seed-s overlay, loaded 65 pages and landed a write and a cache flush with no errors, against `st=7 ... pres=0` (Kept, no overlay) before the one-shot sheng-data-reset=1. The 2097152 pages are the 8 GiB seed, matching [payload.adt] packed_data_ramdisk and the grown data-final.dbr."

