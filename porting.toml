paths = ["package/*Gpu*", "scripts/*gpu*", "scripts/*adreno*", "scripts/*metal*", "scripts/data/*air*", "scripts/data/ioaccelerator-*", "drivers/Adreno740/**", "drivers/AdrenoMetal/**", "package/Sm8250Platform/**", "package/*A650*", "docs/handover/2026-11-12-gpu/**"]

inputs = ["Adreno 650 (SM8250). The shared tree's GPU components target Adreno 740, a different generation.", "Signed ZAP firmware and GMU/HFI bring-up inputs, neither of which this board has recorded."]
configuration = ["The board selects no GPU component; com.apple.iokit.IOGPUFamily is kept in the prelink roots only because the donor closure requires it.", "IOCoreSurfaceRoot has to be published for the display stack to complete, which was done without any GPU hardware."]
procedure = ["Before porting, confirm an SM8250 GPU path exists upstream or scope the bring-up as its own project; do not adapt an Adreno 740 source line by line."]
findings = ["Everything currently on the panel is CPU-rendered scanout, so GPU work is an optimization and not the next blocker.", "The display stack reaching its started state without GPU proves the surface path is separable from rendering.",
  "The GPU driver the kernel compiles is now this repository's, and until 2026-11-14 it was not. All three recipes that consume drivers/Adreno740 fell back from the assembled tree - where schema_version 2 never links that directory, because Adreno740 is not a catalog component this board selects - to the core checkout beside the device. That checkout carries a different line: measured 2026-11-14, github UniXNU/Adreno740@6fa7ba2 has no NativeAdrenoGmuContextBringupRoutes, no NativeAdrenoRing::setGeneration and no NativeAdrenoCpInit::reopen, and its own history shows the API was never there (61eb7d3 imported the driver, d834731 rewrote its page tables). This repository's copy, imported by eada6c5 from the tree the verified kernel was built from, has all three, and it is where every GPU fix since then has landed. The cost was exact: the archive step stopped at archive-18-build-gpu-power-probe with those three names and four more unresolved (NativeAdrenoGpuContextBringupRoutes, NativeAdrenoCpInitConfig::generation, NativeAdrenoCpInit::reopen and a one-argument call that gained a parameter), because the probe's headers and the driver's sources came from different lines. scripts/build-adreno650.py, build-adreno650-accelerator.py and build-gpu-power-probe.py now try this repository's checkout first - $UNIXNU_DEVICE when unixnu runs them, else the parent of the kits/<kit> symlink - then the tree, then the core, and build-adreno650.py includes the driver's headers from the same directory it took the sources from rather than from a hardcoded tree path. Measured after that change: archives 18 through 28 build, including the A650 driver archive, the accelerator object and the probe.",
  "The GPU probe's failure paths did not release what they had taken, and two of its rows read state that the compiler was free to cache. dbyClientBoRound() unwound both client BOs, both descriptors and both kernel mappings only on the success path, so a probe boot that stopped between steps 3 and 10 left them behind - and a mapping that outlives its BO is the panic Publish.cpp:260-263 documents; its tail is a lambda now and every exit runs it, with the two BO replies zeroed first so the handle tests are sound. dbyTzMeta() dropped a descriptor whose prepare() failed and dbyTzQueries-s <4 GiB retry then allocated a second over the first, and the GMU table pool released a prepared descriptor without complete(); all three now balance. Separately, gDbyPubIrqCount and its three siblings were plain statics incremented from the GPU SPI handler and printed by the probe thread, so the row could report a count that never moved; they are volatile, like the latch array beside them. And three ELF range checks added 32-bit offsets and lengths as uint32_t, where 0xfffff000 + 0x2000 wraps to 0x10 and passes any size test - they widen to 64 bits first now. All of it builds: the kernel step returns 0 with kernel.macho 436bebc972576c35c84d2c1043da1a9e78fa3ad87f8905592d3d01c45bc83d2e. None of these paths is one a boot on hardware has taken - they are allocation-failure and early-exit paths - so what changed is what the code does when the hardware says no, which is exactly the half the earlier rounds could not observe.", "The [gpu unstick] row prints fifteen counters and the driver maintains twelve: [2], [3] and [8] belong to an earlier design (the count of attempts after which a fence completed, the waits that fence had seen, and the drains after which it completed) and nothing writes them, so they read 0 for the whole boot - which on this row means 'no such event' and 'not maintained' alike. [10] is the same shape for a different reason: the handler has no stage 2, it goes from the write-pointer retry (stage 1) to the bus drain (stage 3), so the middle stage's counter never moves. The comment beside the array now says all of that; what is owed is either to write the three legacy fields where the corresponding event happens or to drop them from the row, which changes a diagnostic surface a boot has already been read on.",
  "The frame rate this board can aim for is bounded by what its own GPU generation has measured, and 120 is not an Adreno 650 number. Read on 2026-11-18: pandora (Xiaomi 17 Pro, SM8850, Adreno 840) reports about 110 frames/s on a 120 Hz panel with GPU composition and direct scanout (docs/devices/pandora.md:13); sheng, the official reference board, measured `fps average 72.1 and 68.2`, lows 41.5 and 35.2, on iPadOS 27 24A446 (docs/devices/sheng.md, its metal-flow evidence row); gts7xlwifi and alioth, both Adreno 650 like this board, publish no desktop frame rate at all - gts7xlwifi's 23-27 fps is a video decoder frame count and alioth reports swap counts (sw 84-210), not a rate; sirius-huajifruit's CPU copy path reached about 16 frames/s once its copy fell from 182 ms to 9.3 ms over the first 211 frames; and thor, rmx3551 and diting each state 'no claim of measured 120fps'. So 120 belongs to Adreno 840, roughly 70 to Adreno 740, and the Adreno 650 generation has no 120 claim to match. The arithmetic agrees: one 1600x2560x4 frame is 16,384,000 bytes, so 120 Hz needs 1.83 GiB/s, while a GOP copy of this class was measured at 88.6-95.7 ms for 14,745,600 bytes - about 153 MiB/s, a 10 fps ceiling for 60 Hz and far below it for 120.",
  "Direct scanout is the only route to a high frame rate on this class of SoC, and it requires the 8-bit BGRA framebuffer, which makes the display area's Data-seed work a prerequisite rather than an optimisation. sheng states it directly (docs/devices/sheng.md:376): the flip waits until the GPU wrote the frame, and 'Direct scanout needs the 8-bit BGRA framebuffer'. gts7xlwifi, the same SM8250 and Adreno 650 as this board, runs dpu-scanout=2 together with an ADT artwork-display-gamut of sRGB and an sRGB/BGRA8 text policy, and its swaps retire by direct scanout with no stripes. This board has never enabled sheng-dpu-scanout - it is absent from [payload] kernel_args - so that path is unqualified here, and the 10-bit surface the compositor chose is precisely what would have to go first. The consequence for the plan is that the driver's acceptance of 'b3a8' is a fallback, and a working seed makes it dead code that direct scanout never needs.",
  "Direct scanout is blocked by an empty symbol, and the implementation that fills it already exists for this SoC - with four corrections a review forced on the first draft of this entry. NativeLegacyDisplay.cpp:153 gates the direct path on native_ufs_dpu_state bit 31, and package/LinkStubs.c:48-53 says in its own words that NativeUfs defines native_ufs_dpu_map and native_ufs_dpu_state while this board selects ShengUfs, so neither exists here: the map returns 0, the state stays 0, the bit is never set, and the path returns immediately. The replacement is DpuWindow.h from the NativeUfs-alioth feed, 216 lines of stage-1 translation for the display's apps_smmu context bank. apps_smmu's base is 0x15000000, mapped at NativeUfs.cpp:275 (an earlier draft cited :273, which is a return statement; the stronger witness is :415 smmuBypassStream, which runs every boot and panics on failure). The first draft also said three edits; there are four, and the fourth is the one that makes the fallback claim true: NativeLegacyDisplay.cpp:150 carries kBootIova=0xb8000000U and kBootStride=0x2fa0, which are sheng's values, while this board's GOP mapping is 0x9c000000 with a 6400-byte row, both visible in this board's own log; directToBoot() would aim both VIG pipes at the wrong address while the copy path writes the right one. The header also does not define dpuWindowBuild, only dpuWindowBuildImpl at :200, so a forwarder is required (alioth has it at :1045) before the exported native_ufs_dpu_window_build. And the link guarantee is not the weak/strong rule alone but scripts/build-xnu-4k-baseline.sh:633's -Wl,-force_load,$UFS_ARCHIVE, because a weak_import reference will not pull an archive member in. The largest risk is one the first draft omitted: reading VIG 0/1 aborts this kernel right after the first frame's copy (this area's evidence at :224-229), flip() writes exactly those registers, and this fork has no MDP clock or power-domain code at all, so the first flip can take the system down rather than return an error - which is why the work starts with sheng-dpu-scanout=1, which installs the window without flipping because NativeLegacyDisplay:153 needs mode>=2 while DpuWindow.h:207 builds for any non-zero scanout. The nine counters in native_legacy_direct cannot be read on the current build - they are written and never read, the only console row from that driver is DbyDisplay: copy= - so a BootLog.c row is a prerequisite for measuring, not a refinement. The stream numbers 0x820/0x821 are unverified on this host (the board dts, the pinned sm8250.dtsi and the cited k40-kernel tree provide no cross-check); a wrong stream fails safe with a 0xdead0001 refusal. Cost: sheng-dpu-scanout=2 is 20 bytes, 971 -> 991 of the 1000-byte gate. A minimal stub that only sets the state bit was rejected - with no page tables the DPU would fault - and swapping in NativeUfs would cost weeks of root-mount and binding work. The full design is docs/gpu-direct-scanout-plan.md.",
  "Two edits in drivers/GopFramebuffer/NativeLegacyDisplay.cpp, both prerequisites for the direct-scanout work and neither of them optional. (1) The direct path's gate accepted a refusal as an installation. DpuWindow.h writes native_ufs_dpu_state as 0x80000000|bank when the window is built and as 0xdead0001 when it refuses - and both have bit 31 set, so the old test '!(state>>31)' returned at once only when nothing had happened and passed a refusal straight through to a DPU that would then fetch an empty page table. The host harness .research/dpu_window_test.cpp proved this with a truth table before any flash: 0xdead0001 reads as installed under the old predicate. The gate now caches the word once (it used to read the volatile twice in one expression) and requires the installed shape: bit 31 set and every bit above the low byte clear. (2) kBootIova/kBootStride were sheng's 0xb8000000/0x2fa0, i.e. the tear-down path aimed both VIG pipes at an address the copy path never writes, so the documented 'falls back to the boot scanout' was not true on this board. They are now 0x9c000000 and 0x1900: the base and row this board's own [swapok] row reports, where 6400 = 1600x4 is bytes per line and matches VIG SRC_STRIDE's unit. The SoC constants beside them (kVig 0x4000/0x6000, kCtlFlush 0x15018, the +0x14/+0x24 offsets, the 0x3 flush and the 16-bit stride mask) are SM8250 DPU 9.2 facts and were left alone. Both edits are in this repository and in the build tree; the build tree's copy is 55 lines longer because it carries the [swapok]/[swaprej]/[kick] diagnostics that this repository's copy has not absorbed. Still unqualified before a flash: DpuWindow.h's own boot IOVA default (native-dpu-boot-iova, 0x9c000000 per its :210, but the file is not in this checkout) has to be read from the header text, because the exported entry point takes only the SMMU base and the header supplies the IOVA itself; and whether sheng-dpu-scanout=1 reaches dpuEnable at all decides whether the first round measures anything.",
  "GPU fence completion was measured, and the cause of the stutter is this board's pause, not the GPU. Round: payload f4a34efa and earlier, the same kernel that presents the UI. The counters read submissions=1753 with gpu wrote=1753 - the GPU executes everything it is given - while fence wait calls=3150 timeouts=726 (23 percent) with the longest single wait at 874 ms and 22.7 s of accumulated waiting. Two facts explain the whole shape. First, the shared driver's wait calls the board's clock.idle between polls (NativeAdrenoPublish.cpp:674) and this board passes nullptr, so every poll is a delay_for_interval(100 us) thread_block plus a timer wakeup, and the [coherence] row's slept/spun columns read symbols no code ever wrote - they were dead observation slots, not evidence. Second, the interrupt that the same driver waits for on alioth cannot reach this kernel: armcpu_spi_attach enables SPI 300 but leaves it in GIC group 0 (its readback 0x0000a002 has bit0 clear), ArmCpu.cpp:1056 records that the group-1 write is RAZ/WI when the secure world owns the line, and ArmCpu.cpp:762 only reads icc_iar1_el1 - so the line is raised and never taken. That is consistent with the measurement: 1502 fence submissions in one boot produced two interrupts. The board therefore has to live without the interrupt wake, which makes the pause itself the completion latency. The same comparison also killed two dead observables worth remembering: native_gpu_perf_vote is only a weak stub, so [clocks] gpu perf/bw is structurally zero, and native_gpu_idle_sleeps/spins had no writer at all. The fix that follows is board-local: an idle callback that spins 20 us for the first four polls of one wait and then sleeps 100 us, counted into those two slots, so a fence that retires within microseconds no longer pays a timer round trip while a genuinely long wait still does not own a core.  The idle callback that followed is recorded as a failed round, because it reached hardware and broke the interface. Payload 164b4a52 (kernel b1556d47) gave clock.idle a board implementation that spun 20 us for the first four polls of a wait and then called delay_for_interval(100 us) for the rest, counted into the two slots the coherence row reads. It passed review, and the review checked the three consumers of the return value, that the production path receives the callback through g.clock = *clock, and that the call sites take no lock. On hardware the system booted and reached userspace: launchd ran its ladder, the touch rows kept printing, and the scanout counter reached 1846 flips, far more than the 118 to 190 of the earlier boots. Then presentation stopped while everything else kept running - the interface was frozen with the kernel alive. The lesson is narrow and worth stating for the next attempt: passing a non-null idle callback changes the shared driver from its own delay_for_interval fallback to calling the board, so the board now owns a scheduling decision inside a wait whose context nobody verified as schedulable; the review checked semantics and locking but not that. The measurement that mattered also came out of that round and should not be lost: the timeout rate did not move (726 of 3150 before, 564 of 2347 after, 24 percent both times) and the longest single wait got worse (874 ms to 1028 ms), so fence polling granularity was never the bottleneck. With the GPU already voted to perf_index 7 (670 MHz) and the average wait at 8.3 ms - one frame - the remaining latency is GPU execution time against the compositor deadline, not the wait loop. The board was reverted to payload e153c7b3, the touch-threshold build without the idle callback."
]
completion = ["A GPU-backed surface presents and the frame counters move without the CPU renderer."]
limits = ["The 120 Hz target is unverified. S0a/S0b instrumentation exists in the source, and a prior kernel/payload was built, but that build's source hashes differ from the current checkout for package/BootLog.c, package/LegacyDisplayProbe.cpp and drivers/GopFramebuffer/NativeLegacyDisplay.cpp; rebuild before using it. No S0a/S0b hardware acceptance exists.", "drivers/Adreno740 and drivers/AdrenoMetal are forks of their components, not pins: against the catalog revisions (Adreno740 @ 6fa7ba2, AdrenoMetal @ 6d7f734) 49 of the 92 files and 48 of the 71 are byte-identical, the rest differ, and this board builds from these copies. Until 2026-11-14 that last clause was only true of AdrenoMetal: the three Adreno740 recipes read the core's copy first and built a different driver line (see the finding).", "The A650 GMU power kit is board-owned in package/Sm8250Platform rather than a feed kit: upstream components.toml has no Sm8250Platform entry, so it could only be selected with a catalogue patch applied to the core checkout on the author's machine, and a clean core refuses the tree. scripts/build-gpu-power-probe.py compiles it from the board package."]
next_action = ["Rebuild the S0a/S0b instrumentation from the current source and record kernel/payload hashes; run the host gates, then collect the frame and submit rows on hardware before choosing S1. Do not use the 2026-11-24 payload, whose source hashes differ from this checkout."]

