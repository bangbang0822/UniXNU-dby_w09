configuration = [
    "[components] selects ShengHidInput, ShengNovatekTouch and QcomGeniSpi from the catalog; the board producer DbyTouch reaches the kernel through [kernel] archives and scripts/build-dby-touch.py.",
    "[kernel.prelink] roots already include com.apple.iokit.IOHIDFamily and com.apple.iokit.IOHIDEventDriver, so the OS side of HID is inside the prelink closure.",
    "[payload] kernel_args carry the stage ladder: dby-touch=8 dby-touch-se=1 sheng-touch-hid=1 sheng-buttons=1, with offline-hid-input=1 offline-hid-home=1 offline-key-events=1 on the consumer side."]
procedure = [
    "Read https://unixnu.com/porting/input completely before writing board code: transport and sensor, publishing reports through the qualified IOHIDDevice ABI, then physical buttons.",
    "Keep the vendor-verified driver sources byte-identical to the accepted implementation, then change one variable per flash and read the stage ladder."]
findings = [
    "The kernel currently contains no HID producer, so the lock screen cannot be dismissed: this is the blocker that separates the presented frame from the desktop.",
    "Publishing reports means subclassing the original IOHIDDevice with its exact 207-slot vtable and 0xd0 instance size; an approximate header changes the instance layout and the failure appears far from its cause.",
    "The touch IC is a Novatek NT36xxx 9Z (support_vendor_ic_type=5), not Goodix: all eight Huawei dtbo overlays carry only a `novatech` child under huawei_thp@10 and the THP core looks that child up by ic_name, whose Goodix enumeration stops below 5.",
    "The SM8250 pin controller is tiled. A pin register is tile_base + *global* pin id * 0x1000 (mainline pinctrl-sm8250.c: ctl_reg = REG_SIZE * id, driver indexes regs[g->tile]); gpio 39/40/41/42/43 are in SOUTH (0x0F500000) and gpio 98 in NORTH (0x0F900000). Reading west + pin * 0x1000 - what this driver did - lands on unused slots and returns 0x00000000, which is why the first census reported six zero words.",
    "The one non-zero value the probe ever produced (0x00000001 at 0x0F500000 + 39 * 0x1000) was the real GPIO_CFG39, not an unknown block; scanning the west window instead hung the kernel because it walked unused slots.",
    "With the same MMIO idiom (IODeviceMemory::withRange + kIOMapInhibitCache) the driver reads GICD_CTLR = 0x00000012 and the UFS HCI version = 0x00000300, so the idiom itself is sound on this platform; the earlier \"pin controller is unreachable\" conclusion is withdrawn.",
    "The official ShengNovatekTouch revision supports the NT36532 family; driving this N9Z needs a variant branch (identify at 0x3F004/0x3F0FE, frame read tx[0]=0x20 with an 8208-byte full-duplex transfer; the no-host-firmware-download part of this note was wrong - see the 2026-11-02 findings, the HAL uploads a 0x30000 image), see work/tracks/nvt-verify/VERDICT.md.",
    "2026-11-01 stage 2 ran for the first time: it had never executed because the payload carried dby-touch=1 and the ladder starts at 2. With dby-touch=2 the board reported clk=1 and t=1, i.e. the five wrapper-2 branch clocks left CLK_OFF on the first poll after the 0x52010 vote.",
    "2026-11-01 the pin plan landed: the page showed pw=2/0 (two writes, no failures) and the post-write words p39=0x00000083 (pull-up + 8 mA) and p98=0x00000080 (8 mA, pull disabled). Before this, the page printed the census snapshot taken *before* the write, so a successful configuration looked identical to an untouched pin.",
    "2026-11-01 the QUP wrapper answers: the version register at 0x8C0004 reads 0x20050000, so the wrapper window is mapped correctly and its clocks are on.",
    "2026-11-01 the serial engine itself still reads zero (se=UNCLOCKED, fw=00000000, sst=00000000) even though its wrapper answers and the branch clocks report running. The next step is the QUP reset release the vendor driver performs before touching SE registers, not another vote.",
    "The kona GCC values differ from the sheng board header: the QUP vote register is 0x52010 (sheng 0x52008) and wrapper 2's halt registers are 0x23270/0x23278 and 0x1e004/0x1e008/0x1e00c. work/refs/kona-qupv3-se14-clocks.md records the per-clock table.",
    "2026-11-01 the serial-engine window had always been mapped at 0x08800000 instead of 0x00880000 - one hex digit too many, sixteen times the DT reg <0x880000 0x4000> - so every SE access, including the identity words that always read zero, went to empty space while the correctly mapped wrapper answered. The base is now 0x00880000 in DbyTouchBoard.h and the QUP2 SE1 A/B probe reads the real 0x00884000 window; row 1 carries f1 (+0x68) and h1 (+0xE24) instead of the ambiguous e1 so the row stays within its 120 bytes.",
    "2026-11-02 finger-held frame measurement, and the hypothesis it kills: a whole boot was spent with a finger held on the panel and the dumped frame compared against the idle baseline (work/verify/diff-focus.py). Payload 0x000-0x0FFF did not move at all - the only differing bytes were the boot counter at 0x03F8-0x0403 and the noise tail 0x0FE1+ - while 0x1000-0x1FFF is stable within one boot and different across boots (2230 of 4096 bytes reused). That is firmware RAM written once at chip initialisation, not a capacitance image, so \"the matrix is at 0x1000\" is withdrawn and the chip was not scanning at all.",
    "2026-11-02 the vendor kernel's entire chip bring-up is four lines: rst98 LOW -> write 0xAA to 0x3F0FE -> rst98 HIGH (novatek_thp.c:310-333). Stage 6 implements it, and it ran: the row reported en=0 (every step answered, including the reset pad's level read back), the identity still matched (id=01236503 row=20), and gpio39 sat LOW the whole time. The frame that followed was 8192 bytes of uniform random (per-1KiB entropy 7.80-7.83, zeros 2-10, int16 lag-1 correlation 0.017) and byte-identical across eight consecutive reads. So the reset took effect and the chip still does not report.",
    "2026-11-02 the missing layer was found by reverse-engineering this tablet's own vendor partition (super -> vendor is EROFS; the daemon and libraries are in evidence/vendor-blobs). Correction to the 2026-11-01 note that expected \"no host firmware download\": the /dev/thp client is not libthp.so but libafehal<project>.so (ours libafehalW2599Z1100.so), which embeds a 0x30000-byte Novatek image (\"NT36523_THP_BIN\", extracted to evidence/vendor-blobs/n9z_thp_fw.bin, 196608 bytes, ends in ASCII \"NVT\") and calls a firmware-update routine unconditionally from thp_afe_forcestart, afterwards polling six bytes at chip 0x2FE60 for a first byte in 0xA0..0xAF. A part with no image returns the uniform random block we measured. Work plan: work/tracks/thp-daemon-re/REPORT.md.",
    "2026-11-02 host-command protocol, corrected twice in one night: the record this firmware parses is seven bytes {0x80|(addr&0x7F), cmd, 0xBB, arg_lo, arg_hi, stamp-1, checksum} sent in ONE transfer after one page latch, acknowledged by the stamp at 0x2FE77 matching what was written (novatek_thp.c:855-913). The official ShengNovatekTouch five-byte {0xBF, cmd, 0, lo, hi} form belongs to NT36532E and has no handshake, stamp or checksum; sending it to an N9Z proves nothing either way. Stage 7 sends the vendor record for three opcodes, the first of which (0xC2, the vendor's own boot command) exists only to prove the mailbox path end to end.",
    "2026-11-02 evening, THE BREAKTHROUGH: the firmware upload works and the chip now reports real capacitance data. Row 47 read `up=0/1* hc=000 fw=255,255 ok=1 xy=32,50` - the upload finished on its first attempt, all three host commands were acknowledged through the 0x2FE77 stamp, the FWINFO block became valid for the first time and reports a 32x50 matrix, and the 8208-byte frame changed from 8192 bytes of uniform random (entropy 7.90) into structured data (entropy 5.4-5.6) that sits around a 0x8000 baseline with +-400 offsets. Two defects had to be fixed first: the SRAM stream must re-emit the page latch AND the opcode byte for every window with CS released between windows (the vendor HAL's rwSPIBuf loops per piece), and the image is a FOUR-partition one - the two 0x100-byte header blocks are also streamed to SRAM 0x2BC48/0x2BD48. The 128-byte window that the frame READ needs is a host RX-drain artefact, not a chip limit: the upload now streams 0x13FD-byte windows like the HAL.",
    "2026-11-02 evening, touch detection confirmed on hardware: a 20-frame sweep (2 s apart, dumped into the export region tail, three blocks per frame) was captured inside ONE boot while the panel was pressed and released repeatedly. Nodes (row 13, col 45) and (row 13, col 46) alternate between about -200 and +2500 with the press rhythm, while the noise floor is +-40..100; the neighbours at cols 44 and 47 respond with a smaller amplitude (500-1700), which is the expected spread of one contact. Cross-boot comparison is useless here - two idle frames from consecutive boots correlate only 0.295 because the firmware's adaptive baseline settles differently every boot - so every touch measurement must be taken inside a single boot.",
    "2026-11-02 evening, what remains for offline touch output: (a) calibrate the matrix orientation by pressing the four corners and mapping row/col to the 1600x2560 panel, (b) turn the responding nodes into a contact (peak detect + centroid; the official ShengNovatekTouch NvtTouchCore.c is pure C and matches this matrix size), (c) scale to panel pixels (magnification 8 is recorded in the DTS). The 32x50 geometry comes from the chip itself (FWINFO x_num/y_num), so it outranks the 32x18 that the factory-test library libthpinterface hard-codes.",
    "2026-11-02 late, review #2 of the in-kernel contact extraction found two fatal defects, both reproduced offline over the recorded 40-frame sweep (evidence/edl-frames40/frames40.img). (a) Sample domain: the matrix payload is 0x8000-centred OFFSET BINARY, and the code read it as int16_t, so half of every frame landed at the opposite end of the signed range - measured coherence was 54.8 %..63.1 % against an 80 % gate, i.e. all 40 real frames were rejected and the diagnostics row stayed 0xFFFFFFFF, indistinguishable from 'stage 5 never ran'. The 'extreme nodes -32704/+31238' that an earlier finding attributed to the sensor were this bug (-32704 is raw 0x8040). (b) Baseline: one frame-wide median for all 1600 nodes is wrong because the top-left cluster (nodes 0,1,2 and row 1) rests 1937..3953 BELOW it, so a full-strength press there still lands below the median and the corner was never detected. Both are fixed by decoding the word as uint16_t offset binary, keeping a per-node min-hold reference (gTouchBase[1600], 3200 B of BSS) and using a fixed 1200 floor with a 6000 ceiling instead of a peak/2 threshold. Emulated statement-for-statement over the sweep, the rewritten reader now finds all four corners: TL (73,45), TR (1551,58), BL (73,2510), BR (1557,2508) against true corners (0,0),(1599,0),(0,2559),(1599,2559), and the sequence BR->TR->TL->BL matches the order the owner pressed them.",
    "2026-11-02 late, the producer seam is written and it does not need the HID archive to be testable. BootProgress.c:1166-1181 already draws a dot overlay from native_touch_seq/count/xs/ys and starts its own 30 ms thread, and the ShengHidInput device consumes the same five globals over the same seqlock (NativeHidInput.cpp:18-19, 155-206), so DbyTouch now defines native_touch_seq/count/xs/ys/ids, a strong native_touch_set_sink (the archive ships a weak empty one) and dbyTouchPublishContact() with the odd/even sequence and dmb barriers of the upstream producer (work/refs/sheng/TouchProbe.cpp:340-358), then keeps sampling every 100 ms while the new kernel argument sheng-touch-hid=1 is passed. Publication is in the consumers' axis domain because both consumers hardcode 30480/20320; publishing pixels would put every touch in the top-left corner. (The formula first written here read x = y_px*30480/2560, y = x_px*20320/1600, i.e. transposed; corrected 2026-11-03 01:35 to x = x_px, y = y_px and then 2026-11-03 12:16 to a bottom-up y - see the last finding in this list.) Row 42 gained hid=<publishes>/<sink registered>, so 'producer silent' and 'consumer never registered' are different rows in the log.",
    "2026-11-02 late, the corner calibration is now a committed artifact instead of a sentence: work/tracks/contact-calibration/REPORT.md plus work/verify/corner-calibration.py regenerate the four corner presses from the recorded sweep. It also reconciles 'y_num = 50' against the observation that one bottom-centroid landed at r48: every bottom press raises nodes up to r49 (extents r48..49 and peaks on node 1599), so the row axis does carry all 50 rows and r48 is a patch centroid, not a dead row. The two candidate mappings (uniform pitch (R+0.5)*2560/50 versus edge-to-edge R/49*2559) differ by at most 26 px, which is below the finger patch, so the data cannot choose between them; the driver keeps the uniform form and the 26 px residual is recorded as UNVERIFIED.",
    "2026-11-02 23:20, the READBACK itself was the defect, and it nearly produced the wrong verdict twice. work/verify/edl/readback-frames40.xml reads 64 blocks of log slots, i.e. slots 0..3, i.e. rounds r=0..3, i.e. the page as composed at t=0..7 s. The stage-5 sweep does not start until ~t=4 s and finishes at ~t=82 s, so row 42 in those four slots is ALWAYS the boot-time census line 'TOUCH st=8 ...' - the handoff's rule 'TOUCH st= means the reader never ran' is only true for the first 8 seconds. The window header (block 0 of LBA 30684672, struct boot_log_header) is the authority: window_blocks=8192, slot_count=509, 16 blocks per slot, one slot every 2000 ms. Read all 8192 blocks and pick the newest slot; note that the window also holds slots from earlier boots, so rank within r < slots_written and remember this boot's slot n carries r = n-1 (a long earlier boot's r climbs past ours, e.g. r=1526, and ranking by r alone reported a different payload's row). read-bootlog.ps1's own header decode reads first_lba at offset 40 and window_blocks at 48, but the naturally aligned AArch64 struct puts them at 24 and 32 - use work/verify/decode-window-2230.py.",
    "2026-11-02 23:33, CONTACT EXTRACTION CONFIRMED ON HARDWARE. A boot of payload-stage12-tx-2230.img with the panel pressed by hand reported 'TX none f=56 h=13 hid=16/0' at t=82 s and held h=13 through t=88 s (the boot's own slots; header uptime_s=88, slots_written=45). gTouchHits only increments, so 13 contacts were really detected, and f climbing 56->112 while h stayed 13 places all of them in the sweep window. The three-state row therefore works as review #3 (D2) required: 'ran and found nothing' (TX none f=.. h=..) is visually distinct from 'never ran' (the census line). The same payload on a boot where nobody touched the panel reported h=0 for 6176 frames over 791 s, which is the correct reading of an untouched panel and not a driver fault - the 40 dumped frames of that boot peak at 945, i.e. 255 below the 1200 floor. Coordinate output is still unobserved: no boot has yet produced a 'TX x,y w= n=' line, because the presses so far were taps that fell between the 2 s dump frames and ended between the ~1 s page compositions. Hold a corner for ~6 s to capture one.",
    "2026-11-02 23:42, the HID consumer is wired in (defconfig:131, board.toml:275). CONFIG_XNU_EXTRA_LD_ARCHIVES gained '-Wl,-force_load,{tree}/build/dby-hid-input/libDbyHidInput.a' after a regenerated .config (editing the defconfig text alone is inert), and kernel_args gained dk=0 (46 args, 996 of the hard 1000 bytes). The archive is supplied into the build tree after ./unixnu tree rather than rebuilt, the same pattern board.toml:121-123 already documents for libVerifiedRootProbe.a. Its only remaining undefined bridge symbols are the five native_touch_* globals now defined by DbyTouch.cpp and native_legacy_transfer_calls from LegacyDisplayProbe.cpp; the weak native_touch_set_sink inside its own DbyHidSinkStubs.o loses to the strong definition in DbyTouch.cpp, so the sink registration cannot be swallowed.",
    "2026-11-03 00:22, the HID round's verdict, read from the newest log slot (payload-stage13-hid-final.img, sha256 20C4CDE8..., uptime_s=472): row 48 'TOUCH HID started=1 drv=1 key-reports=0 touch-reports=0 res=-1 | pad dots=0' and row 42 'TX none f=3416 h=0 hid=3376/1'. (a) The archive is linked and running: started=1 means NativeHidInput::start() completed and drv=1 means results[3]=1, i.e. the stock IOHIDEventDriver really attached BELOW the device on this kernelcache, so IOHIDResource -> IOHIDDevice -> IOHIDEventDriver -> backboardd exists here. (b) hid=3376/1 is the independent sink proof: 3376 publishes and the sink IS registered, so native_touch_set_sink resolved to DbyTouch's strong definition and the weak stub lost. (c) key-reports=0 is neither a fault nor a sink problem: native_hid_input_requested() returns false because its first gate is native_legacy_transfer_calls<2 and its second needs either the offline-hid-auto-home timer (not passed) or a mailbox command (not sent) - HidInputProbe.cpp:36-51. The touch path does not pass through that gate, because dbyTouchPublishContact calls the sink directly. So the 1 Hz Home probe is off by design in this configuration; if it is wanted, offline-hid-auto-home=<s> costs 25 bytes and only 4 are left of the 1000-byte command line, so it must replace another argument. The page also showed [touch edge] installed=1 contacts=0, SpringBoard p27 and backboardd p55 alive, and the sweep's h=0 because the panel was untouched during that boot. What remains is one boot with a finger on the panel: touch-reports must rise above 0 and the UI must react.",
    "2026-11-03 00:35, TOUCH REACHES THE HID EVENT DRIVER - the chain is complete end to end. A 90-second boot with the panel pressed (haphazardly, several fingers, some overlap) read row 48 'TOUCH HID started=1 drv=1 key-reports=0 touch-reports=79 res=0 | pad dots=288', row 42 'TX 1121,2002 w=19933 n=9 hid=88/1', and '[touch edge] installed=1 contacts=2 from_edge=0 skipped=0'. So 88 publishes carried 79 digitizer reports into the stock IOHIDEventDriver and the last IOReturn was 0 (success), which is the first time a finger on this panel has produced an OS-level HID event. res=0 also settles the earlier worry that IOHIDEventDriver would reject a digitizer collection: it accepted them. The dot overlay drew 288 dots from the same globals, so the producer, the seqlock and both consumers agree. Still unverified, and only observable on the panel: whether SpringBoard/backboardd acts on the events (a swipe that moves the lock screen) and whether the coordinates land where the finger was - TX 1121,2002 is inside 1600x2560 and consistent with a press right of centre, but nothing in the log records where the owner actually touched, so the x<-y_px transpose and the 30480x20320 mapping stay unproven. key-reports=0 remains by design (native_hid_input_requested() needs native_legacy_transfer_calls>=2 plus offline-hid-auto-home or a mailbox command).",
    "2026-11-03 00:56, touch tuning round (source rev dby-touch/2026-11-03a) after the owner reported 'gestures unstable, works but not sensitive'. Changes: DBY_TOUCH_HID_PERIOD_MS 100 -> 25 (measured basis: 3376 publishes over the 390 s after the sweep = 115.5 ms per iteration, and IOSleep sits at the top of the loop, so the SPI frame read itself is only ~15 ms - the sample rate was set by the constant, not by the hardware; 25 ms gives ~40 ms per frame, ~25 Hz, at a ~37% duty cycle of one core while the same boot reported idle=97%); DBY_TOUCH_TOUCH_FLOOR 1200 -> 700 and DBY_TOUCH_MIN_NODES 3 -> 2, because a light press raises its centre node ~1500 and its neighbours 500..1700, so at 1200 only one or two nodes cleared the floor and the node gate then dropped the whole touch; a 3-frame lift debounce, because one weak frame used to publish a lift and end a drag mid-gesture; and the 40-frame/78-second sweep is skipped when sheng-touch-hid=1, which removes ~82 s of dead touch at boot (offline frame evidence now needs a boot without that argument). Review M1 rejected the first version of the floor change as unsafe: at (700, 2) the untouched 791-second recording puts 2..4 SCATTERED nodes above the floor in 13 of 39 frames whenever a reference step lands at frame 10, which published phantom contacts at 775,1281 -> 800,519 -> 1025,760 with no finger on the panel, because the downward-only reference cannot absorb a step up. Fixed by requiring a 4-connected component and taking the heaviest one's centroid (dbyTouchFlood), since every real press in every recording is one contiguous patch and the phantoms never are. Row 42's no-contact shape also gained x=, the count of frames whose SPI read failed, so a low publication rate can be told apart from a lossy one.",
    "2026-11-03 01:05, review round on the tuning batch, and the residual it caught. (a) The floor change as first written was unsafe, and the review proved it with our own untouched recording, so the reader gained a 4-connected-component gate plus a second threshold DBY_TOUCH_TOUCH_PEAK 1200 (DbyTouch.cpp:340 and :2983): FLOOR 700 decides which nodes join the centroid, PEAK decides whether a finger exists at all. work/verify/emulate-connected.py replays the exact reader over three recordings: the untouched 791 s boot gives 14 contacts with a flat sum, 1 with connectivity alone (2 adjacent nodes, peak 774) and 0 with the peak gate, while the four-corner recording stays at 18 of 39 in all three variants. (b) Residual risk, stated rather than fixed: the peak gate is component-local, so a reference step that lifted two ADJACENT nodes with one at or above 1200 would still pass; no recording shows it (largest quiet-frame excursion 945, the residual phantom 774). If dull touches persist the next lever is MIN_NODES 1, never removing the peak gate. (c) Two source-comment corrections are owed to DbyTouch.cpp - the sentence 'two nodes above 700 cannot be produced by a quiet frame' is refuted by the same recording - and are deliberately deferred to the next edit of that file, because a comment cannot change codegen and the flashed image was built from the reviewed hash 1CFD0F01. (d) The owner, who used the previous cycle's build, reports that touch is usable but not sensitive and that gestures are unstable. That is the FIRST UI-level observation on this line: 79 reports with res=0 proved only that handleReport returned success, never that an IOHIDEvent reached backboardd, which is the trap that cost another board a round (docs/devices/oneplus13t.md:511). The tuning batch is aimed at exactly that report.",
    "2026-11-03 01:35, the published coordinate domain was wrong and the owner's words name the defect: touch horizontal and vertical are swapped, and tapping an icon lands in the wrong place. Root cause: dbyTouchPublishContact transposed the panel - it fed gTouchPixels[1] (vertical) into the published x and gTouchPixels[0] (horizontal) into y. That transpose was a guess made when the consumer's contract had only been read at its call site. Reading the descriptor settles it: FINGER_DESC declares X and Y as two INDEPENDENT axes, each logical 0..32767 (NativeHidInput.cpp:41), and transformCoordinate(value,maximum) = value*32767/(maximum-1) (NativeHidInput.cpp:140-144) divides each axis by its own input range, so 30480 and 20320 cancel out of the aspect and cannot force a transposition. The panel is also not rotated relative to the framebuffer: the IOMFB dictionary reports 0x640 x 0xa00, the same 1600x2560 portrait space the centroid is computed in. Fixed by feeding panel X into xs and panel Y into ys. BootProgress.c:1197 maps the same two globals through the same maxima, so the dot overlay follows the fix with no edit of its own. This closes the published-coordinate-domain item that had been UNVERIFIED since the producer was written; what remains is only whether an axis is additionally mirrored, which one press at a known corner settles, because row 42's TX x,y is printed in panel pixels and does not depend on the publish mapping.",
    "2026-11-03 01:59, the coordinate system is VERIFIED on hardware, including the mirror question that was left open. The owner pressed top, left, bottom, right and centre in that order while holding each one long enough for the 2-second archive to catch it, and the five archived samples came back in the same order: (801,25) top, (37,1226) left, (798,2518) bottom, (1575,1271) right, (783,1147) centre on a 1600x2560 panel. That rules out both mirrors IN PANEL SPACE: x small on the left and large on the right, y small on the top and large on the bottom. It does NOT rule out a mirror between panel space and the published axis, and row 42 prints panel pixels so it could never have shown one: on 2026-11-03 12:16 the owner reported from a booted OS that portrait touch was inverted up/down, which is exactly that gap (corrected here, see the last finding). Two of the five presses were only 2-node contacts with weights 3540 and 2645, which is the new sensitivity path proving itself: at the old floor of 1200 with a 3-node minimum those two would have been dropped. Same boot: publish rate f=1504 in 62 s = 24 Hz (the 8 Hz of the pre-tuning build is gone), x= is not printed because row 42 was in its contact branch, hid=1504/1 (sink registered), touch-reports=292 with res=0. Earlier in the same session the 12 transient samples of the previous boot already matched left (x~50), right (x~1570), bottom (y~2517) and centre; only the top press had been missed there, because a tap lasts ~100 ms while the page is archived every 2 s and recomposed every ~0.64 s, i.e. about a 15% capture chance. Holding each position for ~5 s is what made the five-sample test reliable, and that is the procedure to reuse.",
    "2026-11-03 02:54, two more changes reached the device in one payload (payload-stage16-cpu-precision.img, sha256 990E735A...): the centroid now weights by (delta - floor) and the kernel carries a read-only CPU-frequency census ported from the official CpuFreqProbe. Precision: a source study of UniXNU/ShengNovatekTouch@a1a6f2b (NvtTouchCore.c:262-263) found the rule this reader lacked - weight each node by delta minus max(30 % of the blob's own peak, the noise floor) - and measured the defect it fixes: our node count swung 1..17 with pressure while the author's stays 5..7, which is the owner's 'position not precise'. The peak must come from the UNCLAMPED delta (pass 1 no longer clamps; the clamp moved into the weight accumulation), because the floor keeps growing while weights cap at 8000. work/tracks/touch-precision/REPORT.md models the gain at light-press error 16 -> 1.5 px, jitter 2.9 -> 1.0 px mean and 14 -> 4 px max, coverage at the 1200 peak gate 68/101 -> 101/101 - MODEL numbers, not yet measured; the study also proved the author's handy node-centre tables are GEOMETRIC (the 60-column table is mirror-symmetric to 0.0 px, pitches only {50,51,52}) and therefore not transferable to this 50x32 panel. CPU: package/CpuFreqProbe.cpp (633 lines, ported from alioth's SM8250 version of the official probe) + scripts/build-cpufreq.py, force-loaded via defconfig:131 because LinkStubs.c:96-99's weak sheng_cpufreq_probe would otherwise satisfy the caller and the probe would silently never run. Default mode is a READ-ONLY census: review confirmed the only hardware store is wr32 called from voteDomain reached only when gMode >= 2, and absent sheng-cpufreq the mode is 1, so it performs zero MMIO writes. It maps 0x18591000/92000/93000 and prints enable/domain_state/decoded LUT on page row 39 and in a 24-row [clocks] census in the log. Also fixed a real type bug: BootProgressStubs.c declared native_cpufreq_row as uint64_t[120] while both readers use char[120]. GPU was deliberately NOT wired: NativeAdrenoPublish.cpp:59,66 reference _native_gop_handoff_call/_memory which nothing in this tree defines, the board has no Adreno740 feed pin at all, and the G-1 SMMU measurement needs pipa-gpu=1 with the owner watching. Owed should-fixes from review round 6 are listed in work/HANDOFF-2026-11-03-night.md §8; the dangerous one is the DbyTouch.cpp:348 comment that still claims two nodes above 700 cannot occur - a future reader could delete DBY_TOUCH_TOUCH_PEAK on the strength of it.",
    "2026-11-03 03:08, GPU G0 wiring was attempted on hardware and stopped at a compiler ICE, then reverted so the tree stays buildable. What worked: adding an Adreno740 [[source]] pin to feeds.toml (FFT-infra/Adreno650 @ 70771a7, verified with git cat-file), unixnu fetch + tree materialising kits/{ArmSmmu4K,AdrenoPM4,AdrenoFirmware}, and selecting the Adreno740 component materialising drivers/Adreno740 with all 29 TU. That also disproved the warning the implementation agent carried: _native_gop_handoff_call and _native_gop_handoff_memory DO exist in this tree - libNativeGOPPresenter.a and libNativeLegacyDisplay.late.a both define them at offset 0x12a4/0x12a8 and the linked kernel has them at fffffff00c009e90 - the agent's check only compared the A650 archive's own symbol set. What failed: clang-24 ICEs while parsing NativeAdrenoService.cpp:95, OSDefineMetaClassAndStructors(NativeAdrenoGpuService,IOService), with the current parser token attributed to kalloc.h:765 (KT_SUMMARY_GRANULES / __builtin_xnu_type_summary). Removing any single suspect flag (-fmerge-all-constants, -fsanitize-minimal-runtime, -ftrivial-auto-var-init=zero) still reproduces it (work/verify/probe-adreno-ice.sh), so it is a compiler-level fault, not configuration. Wiring was reverted (component:Adreno740 removed from [kernel] archives, CONFIG_XNU_NATIVE_ADRENO back to not-set) and the kernel rebuilt green at 03:09. Kept as preparation: feeds pin, scripts/build-adreno650.py, scripts/gen-gpu-firmware-header.py, package/DbyGpuFirmware.h with the three firmware arrays parsed and sha256-checked (gmu 41548 / sqe 31632 / zap 13964). Cheapest way to still clear the GPU entry gate: the SMMU input_bits read needs only a minimal probe mapping GPU SMMU ID2 and printing bits[11:8] - it does not need the 29-TU driver at all, which is why work/tracks/gpu/SPEC.md originally costed G-1 at one boot.",
    "2026-11-03 18:20, G1 mode 1 measured, and it produced two hardware facts that change the plan. The stage28 boot (payload A4219A4E...) ran 8440 s / 4133 archived rounds with write_errors=0, so the read-only GCC step did not disturb the device (touch meanwhile at 24.1 Hz, 203632 frames, 0 SPI failures). Rows: GPU PWR m=1 gcc=1 cc=4 smmu=4 gpu=4 cx=0 clk=0 ahb=0 / cfg_ahb=00000001>00000001 memnoc=80004221 dvm=80000001 gpll0=01206d7f / cxgdscr..before all zero / GPU SMMU not read: state=4 (nomap) / rbbm=00000000 ioerr=0. (a) cfg_ahb (gcc_gpu_cfg_ahb_clk) is ALREADY ENABLED by the bootloader, so mode 2 has nothing to write and degenerates into a GPUCC read - and, more importantly, the mode-1 window whitelist was load-bearing: without it the probe would have gone on to read GPUCC and, had CX been up, the SMMU, i.e. the 13:12 freeze was one missed clock away from repeating. (b) gcc_gpu_memnoc_gfx is OFF (CLK_OFF set) while gcc_gpu_snoc_dvm_gfx is on; the vendor SMMU node lists memnoc as one of its clocks (kona-gpu.dtsi:270-275) and neither the kit nor its SMMU gate touches or checks it, so mode 3 must answer the memnoc question (enable it, a write the kit does not do, or prove it is unnecessary) before any SMMU register is read. G-1 therefore moves behind that answer. Full write-up: work/tracks/g1-mode1/REPORT.md.",
    "2026-11-03 03:40, two more reviewed changes are built but not flashed (the owner is asleep and only a power cycle reaches fastboot). (a) GPU entry gate without the driver: package/DbyGpuSmmuProbe.cpp maps 0x03da0000 for 0x10000 - the base this board's own vendor tree declares at kona-gpu.dtsi:263-266, qcom,kgsl-iommu@3da0000, reg = <0x03da0000 0x10000> - and reads ID0 0x20 / ID1 0x24 / ID2 0x28, decoding input_bits as {32,36,40,42,44}[code] or 48 for code=(id2>>8)&15 and OAS as {32,36,40,42,44,48}[code] capped at 40 for (id2>>4)&15 (NativeAdrenoGmuContext.cpp:31-35). It is opt-in via dby-gpu-smmu=1 and performs no writes, because the SMMU sits behind gpu_cc_ahb and an unanswered read on this SoC is an SError; review confirmed the built payload does not carry the argument, so the flash cannot touch the SMMU at all. (b) Fixed a real cliff in the touch centroid: the relative floor was derived from the UNCAPPED peak while every weight is capped at CEILING 8000, so any raw peak at or above 10*8000/3 = 26667 zeroed its own patch and the contact was silently dropped - pressing harder stopped registering. The floor now uses min(bestPeak, CEILING), which the review verified is arithmetically identical for every peak at or below 8000 (so all three recordings, max 4161, are unchanged: 0/19 untouched, 0/39 press-dump, 18/39 four-corner) and saturates at 2400 above it. Worth recording that the earlier rationale for this 'unclamped peak' was backwards: clamping the stored delta was what would have removed the cliff, and the study's warning applied to a different thing. Both changes are in payload-stage19-s1fix.img (sha256 9547EA8B...), reviewed Y.",
    "2026-11-03 12:16, the published Y axis was mirrored and is now bottom-up, using the official producer's own fix. The owner, on a booted OS (payload-stage19, SpringBoard and backboardd running), reported '现在屏幕竖屏触摸上下颠倒了'. Root cause: dbyTouchPublishContact published the panel's top-down row index as the digitizer Y, and the consumer passes the sign through untouched (ShengHidInput/NativeHidInput.cpp touchSend: y=transformCoordinate(ys[i],20320), no inversion), so the fix is a producer-side mirror: y = (20320-1) - y_px*20320/1600. This is the official mechanism, not an invention - work/refs/sheng/TouchProbe.cpp:351, the same author's own panel, says 'Panel photograph (v94): X is correct and Y is mirrored, so publish Y from the other edge (axis maximum 20320)'. The -1 is load-bearing: with 20320 the producer's clamp folds rows 0 and 1 into one, while 20319 makes the mapping injective with both endpoints exact (review computed t(0)=32767, t(20319)=0, t(10159)=16384). BootProgress.c's dot overlay reads the same globals, so it now flips back (20319-ys[i]) and its output is bit-identical to before the change - which means neither the overlay nor the 25-point precision grid (that reads row 42 TX, in panel pixels, upstream of the publish mapping) can witness this fix. Acceptance is UI-level only: touch the top and bottom edges and see where the response lands. Not bumped: DBY_TOUCH_SOURCE_REV still reads dby-touch/2026-11-03a although the mapping changed; the payload sha256 identifies this image and the rev moves to -03b with the next touch edit. Same round, the kernel command line moved to 974/1000 bytes (45 args): sheng-cpufreq=2 was added to vote EPSS domain 0 after the stage19 census proved the route on hardware (3/3 domains mapped, LUT stride 4 B, 1516/710/844 MHz, work/tracks/stage19-verification/REPORT.md), and the review decoded the real LUT out of the archived window to predict the exact outcome (row 16 = 1804 MHz, so expect v16@1804 and domain_state 0x4f -> 0x5e; the readback at CpuFreqProbe.cpp:535 proves only that the register kept the request, the pre=/post= pair is the evidence). dby-touch-dump=1 and sheng-build-tag were dropped to make the room (both proven inert: the dump path is skipped whenever sheng-touch-hid=1, and the tag only names the image in the log header). dby-gpu-smmu=1 was added and then REMOVED again before the flash because an independent review judged it N: an unclocked SMMU block reads 0xffffffff, which decodes to input_bits=48 and prints a false G-1 pass, and the probe runs on the monitor thread's first round while the log writer is still waiting for UFS, so a fault there would destroy the CPU-vote evidence as well. The gate to add before that argument: all-0/all-ones id0/id1/id2 get their own stage and no decode.",
    "2026-11-03 17:40, multi-contact reader (source rev dby-touch/2026-11-03b). Why: the producer published native_touch_count = 1 by construction (it kept only the heaviest 4-connected component), so pinch-zoom and multi-finger gestures were impossible regardless of sensitivity; the HID consumer supports 10 fingers. What changed: the frame now enumerates EVERY component (keeping the 24 heaviest of DBY_TOUCH_MAX_CANDIDATES), applies the SAME three gates per component (4-connectivity, 2..80 nodes, peak >= DBY_TOUCH_TOUCH_PEAK; the per-blob floor rule is unchanged and factored into dbyTouchCentroid), matches each accepted component to a live id, and publishes up to DBY_TOUCH_MAX_CONTACTS (10, the protocol header cap, within the 12-wide native_touch arrays). Ids are the smallest free value in 1..255 because the HID report packs id&0xff. Lift debounce is now per contact; row 42 gained c=<live count>. Offline regression over the three existing recordings is unchanged for one finger (work/verify/emulate-multitouch.py: untouched 0/39, press 0/39, four corners 18/39, max simultaneous 1), and none of them contains two simultaneous fingers, so multi-touch itself is a hardware-only verdict. The 18:05 review blocked the first version with three must-fixes, all applied before any flash: (1) a fixed 220 px continuation radius turned a fast flick into 2..4 phantom fingers (220 px at 24.5 Hz is ~5400 px/s, and one panel width in 0.3 s is a normal swipe), so matching now uses the contact s own predicted position (last + per-frame velocity, bounded) plus a last-unclaimed-pair fallback; (2) the moment the live set emptied, row 42 could print TX c=0 with a stale coordinate for three publishes, because the whole-frame hold returned before clearing gTouchPixels - the empty case now clears the point and row 42 is additionally gated on gTouchLiveCount; (3) the comment claiming the dot overlay draws one point was false (BootProgress.c draws one dot per published contact), so it is wrong comments of that class this board has already paid for. Also applied: gTouchHits counts confirmed contacts again rather than held frames, the collector applies the node/peak gates before the 24-slot eviction so heavy-but-invalid blobs cannot evict a real finger, and the publish loop is bounded by the array width rather than the macro. A third review round then blocked the candidate-first pairing for two deterministic defects (a minted contact inherited a velocity computed from the recycled slot s stale position, so two still fingers were reported as 2,4,6,8,8 contacts; and a heavier new finger could steal a live contact s id), and a fourth blocked the per-contact greedy order because an aging contact claimed a component belonging to another live finger - the id teleported and the finger that was actually down lost it. The final matcher scores every (contact, candidate, distance) triple, sorts and assigns globally, mints only when nothing is free, gives a new contact zero velocity and miss = 0, and ages a contact with the counter tested before the increment so it lifts on the 4th empty frame (unchanged latency). Verdict on the fourth round: Y with no must-fix. Hardware acceptance 2026-11-03 21:34 (evidence/edl-log-s39): TX c=2 with two fingers, touch-reports=1601 res=0, 375 s and zero write errors; a whole hand on the panel produced max=10 contacts, which is the correct reading of a large contact area as many 4-connected components. Known limitation recorded there: there is NO palm rejection, so a resting hand is published as up to 10 fingers and the UI may act on it - the follow-up is a node-count or total-area gate, which needs palm samples first. Recorded non-blocking facts: the pairs array is exactly 10x10 and would overflow silently if only one cap grew; two fingers closing at >=200 px/frame still swap ids once (harmless - the consumer uses ids only for lift detection, so the acceptance text must not claim ids never swap); and with no radius a lift plus a new press in the same frame transfers the lifted id rather than emitting up+down, which is what the old single-id reader did too.",
    "`DbyTouch` is the accepted producer for this panel (Novatek N9Z, 1600x2560, mode 0): on hardware it reports points on the lock screen against payload `09c3aad6…`, so the earlier no-XNU-HID-device limit is closed. The Home and volume keys go through the board `KeypadDeviceLib` in the firmware tree.",
    "The stage ladder gates the chip side only: once the SE answers (dby-touch-se=1) stage2 chains to stage5, which reads frames and publishes contacts, so dby-touch=2 already reaches the UI. Reading the number as a feature switch misattributes every later failure.",
    "The N9Z command mailbox and the 0x30000 firmware array are board data, not SoC data: taking the SM8550 board's controller sources as-is for this panel is the trap on this line.",
    "The publish cadence question is closed by reverting, not by re-tuning. The rung ladder {8208, 2048, 1024, 512, 128} and every number measured on it (read=11178 us on the 128 rung, loop=25994 us, about 67 us per piece) describe a read path that exists only in our tree: the accepted driver has no ladder, it reads at a fixed DBY_TOUCH_FRAME_CHUNK piece with a memset per piece. On 2026-11-06 the self-invented read path went back with `git checkout e61237a -- package/DbyTouch/DbyTouch.cpp package/DbyTouch/DbyTouchBoard.h`, which removed +470/-24 lines and the nine symbols stage5ReadAdaptive, gTouchChunks, gTouchChunkStep, gTouchChunkFail, gTouchTxPad, gTouchFaultTry, dbyTouchCompensateBase, gTouchBaseLift and gTouchIdleRun; kernel 916f71cd and payload e4a24792 were then rebuilt from the restored source. So the cadence figures above are measurements of reverted code and are not a criterion for anything. What stands: this unit is a three-firmware integration assembled by its owner, the stage-8 upload really does run (dby-touch=8 dby-touch-se=1 sheng-touch-hid=1, byte-for-byte the reference kernel-args.txt values), and the accepted read shape is part of that contract, not a detail to optimise.",
    "Withdrawn inference. The 2026-11-06 sentence that eliminated GENI_ERR_TIMEOUT (-110) because a silent engine would cost about 20 ms at poll_limit 20000 was arithmetic on an unmeasured constant: it assumed one empty-poll iteration costs 1 us, and that iteration cost was never measured on this bus, so both the 20 ms figure and the -110 exclusion it produced are void. The refusals it set out to explain (the cf=1/1/1/0 row) came from the ladder described in the entry above, and the fault latch it defended -- snap_irq, snap_status, snap_txfs, snap_rxfs copied on every failed piece plus a 4-byte CS-release transfer inserted inside stage5ReadChunked -- was itself our addition. Putting an instrument inside the data path it measures is how this panel went from working to dead, and no raw errno was ever recorded for that boot.",
    "A diagnostic column that never moves is a bug, not a baseline: gTouchUsLoopMin was re-armed to 0 at every publish window while the sample test also accepts gTouchRateN == 0, so every row after the first printed loop=26088/0/26305 -- a minimum of 0 us, which reads as a free loop. It re-arms at 0xFFFFFFFF now.",
    "The deferred question -- touch stops working after a while -- did not reproduce at this cadence: the 2026-11-06 capture is 745 lines over a 420 s window and the loop was still publishing when it closed (n=15936, i.e. 15936 x 26 ms = 414 s of it, rf=0 read failures, IRQ timeouts 0, no panic row). Whatever killed the earlier streams sat on the 76 ms path, so the silent read-fail backoff stays a hypothesis about the old cadence rather than a measured cause of this one. A second, free measurement on that same boot, taken at 10:35 while the console ring replayed: 89,800 publish cycles in the captured stream (n=28928 up to n=118750, about 39 minutes at the 26 ms cadence, i.e. roughly 51 minutes of uptime) and every row still reports chunk=128, cf=1/1/1/0, wait=1 us, IRQ timeouts 0, rf=0, with no [touch] link clear row and no panic anywhere in 199807 bytes. So on this cadence the loop does not degrade with age. What the same replay cannot decide: all 360 [touch] p= rows in it read h=0 an=0 live=0 cc=0, i.e. no contact was confirmed during that period -- and whether a finger was on the panel is not recoverable from the console, so it stands as an open observation on this line rather than a measured defect. Both captures in this entry were taken on the reverted ladder build, not on the accepted read path, so they describe our own code and not the panel."]

