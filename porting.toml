[[area]]
id = "diagnostics"
status = "device-verified"
components = ["QcomXnuUsbDebug"]
paths = ["scripts/check-*", "package/BootProgress.c", "package/BootProgressCore.h", "package/BootProcessProbe.c", "package/BootUiTraceProbe.c", "package/BootFaultProbe.c", "package/BootWatchdogPolicy.c", "package/LinkStubs.c", "package/BootProgressStubs.c", "scripts/patch-xnu-entry-probe.py", "scripts/regression-baseline.json", "scripts/regression-baseline-adt.adt", "package/BootProgressLifecycle.h", "package/BootProgressPulse.h", "package/BootProgressTests.c", "package/BootUiTraceCore.h", "package/BootUiTraceDetails.h", "package/BootResetDby.c", "package/BootResetSpmb.h"]

inputs = ["Panel text output (boot-progress=2 checkpoints, panic screen, UI trace page) and, since the 2026-11-05 firmware revert, the CDC-ACM kernel console enumerating as 1209:316d.", "The unit-level QEMU harnesses under drivers/ShengUfs/tests: they run the production root, window and command code against QEMU's generic UFS model, but none of them boots this board's firmware - that volume is an EDK II FV whose platform init needs the real SM8250, so QEMU covers the code around the kernel and the device stays the only place the image runs (tools/qemu-firmware.sh and the 2026-11-15 measurement in the storage area).", "The same rows written to the UFS log by BootLog.c, which is where they live now that the panel is left alone."]
configuration = ["[payload] panic_screen = true and kernel_args boot-progress=2, armcpu-diagnostics=1, boot-ui-focus=launchd, boot-ui-focus4=SpringBoard, sheng-build-tag.", "Since 2026-11-05 nothing paints after the scanout hand-off: BootProgress.c:1045 defaults sheng-banner to 0, so the live banner is off, and boot-diag-resume is gone, which leaves resume_after=0 (BootProgress.c:556 clamps <5 to 0) = never retake the panel. sheng-banner=1 can opt the painting back in and was tried once on 2026-11-05; the owner refused it (the panel is not a debug surface) and the accepted configuration leaves the banner off, so a number has to come from the log route.", "LinkStubs/BootProgressStubs provide the zero-value definitions for sheng-specific counters that libBootProgress references."]
procedure = ["For each attempt record the command, the image hash, the last completed checkpoint and the first failing operation.", "Use the offline harness for counter-level questions and the device only for what needs the real panel or the real storage."]
findings = [
  "The boot text scale now has a device-tree channel. package/BootProgress.c reads [adt.defaults.u32] dby-boot-ui-scale with PE_get_default and falls back to the compiled expression, which is orientation-sensitive: the bind XNU reports here is 1600 wide by 2560 tall, so only the 2160 width bound fails and the fallback yields 1, while the same panel bound landscape would satisfy both bounds and yield 3. That is exactly why the value belongs in board policy rather than in an expression. The key itself is deliberately parked as a comment in board.toml: adding an ADT property changes the blob that scripts/regression-baseline-adt.adt records from an accepted boot, and check-regression.py compares length as well as bytes, so shipping the key without re-recording that baseline would turn the pre-flash gate red for a change that has not been on hardware. Two things remain unproven and are recorded as such: the PE_get_default prototype this XNU exposes (no pexpert.h exists in the workspace, and the file is built with -Werror), and the resulting scale on the panel. This is also the first use of PE_get_default anywhere in package/; the tree is already read through /chosen by LegacyDisplayProbe.cpp:846 and KeyStoreProbe.cpp:84, so the channel is new but the mechanism is not unprecedented.",
  "The board preflight is called with cwd = the device tree and the firmware checkout in $UNIXNU_UEFI (core cli.py), so it has to resolve that variable rather than a literal repository name, tolerate the whitespace the memory-map generator emits, and compare intervals only from PcdSystemMemoryBase upward because MemoryInitPei.c never registers a region below it.", "The panel is the instrument: without a console, the panic text plus checkpoint numbers are the only evidence, so a build tag per image is not decoration but the way to correlate a photograph with a build.", "Counters beat wall-clock judgement. In the offline harness the guest clock advances while TCG work rate stays roughly ten times slower than the official hypervisor, so elapsed time never proves progress or regression.", "The current limits are visible in this area: the offline harness reads counters, but the panel still needs a camera photograph, and a USB console is the change that removes that bottleneck.", "Diagnostic polish must not outrank the next root cause; the fastest useful step has repeatedly been one static query that enumerates the answer instead of another flash-and-read cycle.",
          "The console's blocker was firmware-side, not in XNU: the board shipped a byte-patched UsbConfigDxe (two cbz w10 -> b plus one table entry) that forced the DWC3 HOST init path, so QcomXnuUsbDebug failed at its CORE_NOT_DEVICE gate and 1209:316d never appeared. Reverting to the vendor binary (md5 6340bc7e..., named directly by the INF) enumerated it 74 s into the boot and bound COM4.",
          "A binary patch of a vendor .efi can therefore remove a capability while appearing to add one; check which blob the INF names before believing any note about what reached the FV.",
          "Enumeration was not the last blocker -- reading was. pump() in component:QcomXnuUsbDebug/usb/Dwc3.c:387 refuses to queue an IN transfer while d->dtr is 0, and dtr is set only by the host's SET_CONTROL_LINE_STATE (Dwc3.c:313), so a reader that leaves DTR down sees a live COM port and zero bytes forever. The official collector is a pyserial script and pyserial asserts DTR on open, which is why this never showed up in the module docs; a hand-written System.IO.Ports reader needs DtrEnable and RtsEnable set explicitly. With them the same idle boot yielded 3844 bytes on the first open and 0 on the second: the 4 MiB CPU backlog replays from the module banner on the first read, so no cold-boot timing is required, and after the drain the port live-tails.",
          "The console stops at lockdown_mode: ... in nvram is off because nothing after that prints -- the board's own diagnostic rows go to the UFS log (BootLog.c:1110 native_ufs_log_write) and, until this default flip, to the panel, never to kprintf. Both of those destinations are now wrong in the interesting direction: BootLog.c is not in the image at all (two rows below), so the rows that reach the host are kprintf rows. What the console does carry is the kernel's own output and the panic path, where QCOM PANIC END is the only marker that the two send queues drained.",
          "Turning the panel off with no reader ported leaves the board with zero readouts, and that is what 769d8ef did: the comment at package/BootProgress.c:1040 promises the record reaches the host by itself, but the only host-side stream is kprintf, which ends with the early boot. Measured on the 2026-11-05 CPU-round boot: the CDC console carried 3844 bytes, last line lockdown_mode, and no row after that. Two sources exist: the live banner, sheng-banner=1 (BootProgress.c:1045, it draws the CPUFREQ and SCHED rows over the OS frame) -- flashed and read on 2026-11-05, then reverted because painting over the system was refused -- and the official reader UniXNU-sheng/scripts/read-sheng-log.py, which needs this board-s own package/linux-log bring-up, not ported yet. With the banner off that reader is the only source, so porting it is the next device-visible step. Until one of them is used, no frequency vote or cluster placement claim from this board is evidenced by numbers, only by behaviour.",
          "COM4 mirrors kprintf and not IOLog. Measured on the 2026-11-06 capture: 745 lines carrying every [touch] and [pa] kprintf row and not one IOLog-family row anywhere -- no AMFI line, no Sandbox line, no IOKit class line. That single fact is the whole explanation of the battery line looking dead: package/DbyBattery.cpp wrote all thirteen of its rows with IOLog, so a boot with dby-battery=1 and zero battery rows said nothing about the PMIC, nothing about the SPMI observer engine and nothing about whether the driver started at all. Board code that has to be seen on this console calls kprintf.",
          "scripts/check-regression.py had the right ADT contract and the wrong shape: it demanded that the difference between the recorded baseline and a freshly built ADT be one contiguous 64-byte run sitting under a /chosen random-seed property name. ord208 measured the runs at [(392, 445), (446, 456)] -- 63 of the 64 seed bytes different and nothing outside 392..456 different at all -- because a byte the new random draw happens to repeat splits the run, so an unchanged ADT was reporting as a regression. The gate now bounds the union of the runs at 64 bytes and still requires the property name before it.",
          "Each field of the [apr] row needs a definition before it can carry a verdict: played= is completed regions x 1024 frames, which counts silence as readily as sound; wrot= is the audio server's own out_written cursor; peak= is the largest absolute sample the pump has taken out of the ring; resync= counts ring-phase re-locks; derr= counted write-done events whose status byte was read at the wrong offset. ord209 could be called sound because played and wrot converged to within 31072 frames (0.6 s) while peak= held at 9787 and late= stayed at 0.",
          "The reading that said package/BootLog.c is not compiled was true of the branch this port grew up on and is false of this repository: measured 2026-11-14, llvm-ar t on build/boot-progress/libBootProgress.a lists AdspFirmware.o, BootFaultProbe.o, BootLog.o, BootProcessProbe.o, BootProgress.o, BootUiTraceProbe.o, BootWatchdogPolicy.o, FatVolume.o and QcomMdt.o, and scripts/build-boot-progress.py:115 is what puts BootLog.c in it - feat(repo) eada6c5 carried that tree into the repository, and the 2026-11-06 measurement (five objects on kernel b587c637, no builder naming BootLog.c, llvm-nm missing boot_log_export_put, diag_flush and copy_msgbuf) predates it. What that changes: the [battery] row does print, so native_battery_stats has its reader and the two slots this board repoints are visible there (which is why BootLog.c:1083 now labels them why/why2 instead of upstream's drop/refuse); the UFS-log sentence above stays wrong in the opposite direction, because BootLog.c's own writer is in the image even though the rows this board cares about go out through kprintf; and console silence still has to be explained from the kprintf sink, but now against a log window that exists.",
          "Two audio instruments were added while the transport question was being settled, and both belong to the diagnostics record rather than the audio one because they read state that has nothing to do with classification. The first is the pre-flash gate: scripts/check-regression.py compares the kernel arguments and the counters this board is accepted on against the boot that is known good, so a change that silently removes one of them fails before a flash instead of after it. Measured on the tree as it stands here: checks=91, pass=91, fail=0, kernel_args_bytes=992, REGRESSION_GATE=0. The second is the kernel print of the plug-in trace ring: package/DbyAudio.cpp skipped kind 0, which is a property read of an object this plug-in answers, so a boot could stream for half a minute while every row naming what the audio server actually asked sat unread in the low slots -- ord203 printed slots 42..64 and dropped 0..41, and unk= only ever held the reads that were refused. Every kind now prints, spelled get, set, call or throw, which turns a refused-property count into the list of questions themselves.", "The gate's payload-input section also pinned adt_sha256, and that check failed on a build which had changed nothing: devicetree.py:308 writes os.urandom(64) into /chosen/random-seed, so an ADT digest is a per-build draw. Measured on two payload builds from the identical three run #25 carriers: 7d836064... and 4e32cedd..., same 14736 bytes, one differing run at 392..456, and the property holding those bytes is random-seed. The fix pins bytes instead of a digest. scripts/regression-baseline-adt.adt is the accepted boot's own ADT, extracted from payload-ord203.img with mcopy -i (no root, no loop mount), which reproduces the e91c7e80... digest the baseline had already recorded -- so the extraction is faithful to what the board booted -- and the gate now allows exactly one 64-byte difference, only where the preceding property name is random-seed. That is stricter than the digest it replaces: flipping one character inside root-matching, the 171-byte property carrying the Data volume UUID the kernel looks the seed up by, is refused, while replacing all 64 random bytes is accepted, and both cases are exercised in the same step that rewrites the check. The three genuine carriers were re-recorded beside it because this delivery swaps them on purpose (trust 400d5667..., addon a267725c..., seed 423d4000... for the CI run 42504049040 plug-in). Verdict over the built artifact: checks=93 pass=93 fail=0, kernel_args_bytes=992, REGRESSION_GATE=0.",
  "The torch hook follows the one-shot rule the touch hook was accepted on: `package/BootProgress.c:1146` requires the latch clear, `!ml_at_interrupt_context()` and `nprocs>0`, and `:1147` sets `dby_torch_hook_runs` before calling `dby_torch_start()`, so a `monitor()` that runs every tick cannot start a second thread. The entry point still needs a sleeping context of its own, which is why it returns void and reports instead: `DbyTorch.cpp:238` records -6 if `kernel_thread_start` fails, and the rest of the story goes out as `[torch]` kprintf rows -- the family COM4 mirrors, where IOLog rows have already once made a live driver look dead.",
  "The pre-flash gate caught a launcher that had fallen behind the record, and the arbiter was the accepted image itself. `f2-payload.sh` was still passing `run23/data-audio.dbr` (997ca7ee...), so the payload-input row failed against `scripts/regression-baseline.json:72`, which pins 423d4000...; measured rather than argued, `payload-ord209.img` (sha256 592c632b74abcf0d..., 218103808 B) lists `EFI/UniXNU/Payloads/scratch-data.img` at 1511664 B and that extracted file hashes to 423d4000d4d9de1f..., byte for byte `audio-addon/run25/data-audio.dbr`, while the trust bundle (400d5667de0da464..., 61408 B) and the plug-in (a267725cd48bf899..., 12088 B) are already identical between run23 and run25 -- only the seed had advanced. With the launcher naming run25 the same tree reports checks=93 pass=93 fail=0 and kernel_args_bytes=992, and the freshly built payload (d1d71fed8d6e32c1...) re-extracts to 423d4000... Nothing was written into the baseline to get there, which is the point of pinning an input hash: it indicts a stale command, where a digest of a build directory would have indicted the tree."
,
  "The addon-mount counters the flashlight round adds follow this area-s established link shape rather than a new one: `package/BootProgressStubs.c` defines `native_gpu_addon5_stage` and `native_gpu_addon5_status` weakly, next to the four pairs already there, so `libBootProgress.a` links before the kernel carries them, and `scripts/check-dby-torch-host.py --tree` grew a `mount` step that replays the tree-s own recorded `xnu-inputs.json` series with the torch patch after it. The diagnostics that have been *read* are unchanged: no `[torch]`, `mount4=` or `mount5=` row exists on hardware yet, because the console component of this area has not enumerated since the argument swap.",
  "The exit row can name why a process died, which no row could before. The working branch's boot-progress patch had already given boot_progress_exit a sixth argument - the libsystem exit reason's own text, the only place a check like 'FD_SET overflow' appears, because every OS_REASON_LIBSYSTEM_CODE_FAULT is ns=18 code=2 - while this board's producer still took five, so the kernel step stopped at archive-16 with `conflicting types for boot_progress_exit` (package/BootProgress.c:685 against osfmk/kern/boot_progress.h:19). The patch here now carries that argument, passes the reason through exit_reason_get_string_desc, and bp_exit_add prints it as `why=%.40s` when the kernel supplies one, so a row that used to read `ns=18 sub=2` also names the failing check. This is an ABI between core and board code: neither side can move alone, and the next change to that prototype has to move package/BootProgressLifecycle.h with it.",]
completion = ["Every claimed milestone has a reproducible command, a matching source revision and an accessible result."]
limits = ["The console only carries kernel text while the firmware hands DWC3 over in DEVICE role, so a firmware-side role change can silence it again without any XNU fault.",
          "The gadget is kernel-side, so COM4 exists only from about 74 s after power-on and ABL or UEFI text can never appear on it.",
          "UI-trace and process probes are board-local adaptations of shared sources."]
next_action = ["Evidence for the CPU round is behavioural only: the owner reports the system much smoother, while the accepted pair (kernel 60f3dbac380b, payload c1303fb6cf93) paints nothing and the console stops at lockdown_mode. alioth's own criterion -- UI work on c4-c7 -- still needs the CPUFREQ and SCHED rows, and the only place left to read them is the UFS window.", "Port package/linux-log so UniXNU-sheng/scripts/read-sheng-log.py can fetch the same rows from the UFS window with no panel at all.", "Turn the control plane on for the backpressure and drop counters, STATUS and REBOOT: qcom-usb-ctl=1 is no longer within budget (the line is at 999 of 1000 bytes), so it needs an argument retired first. A screenshot still needs a qcom_usb_debug_register_framebuffer() call, and the display side has none, so a shot answers unavailable today.", "Before re-enabling the CDC-ACM tee permanently, settle the 2026-11-01 hazard: qcom_usb_debug_write() polls DWC3 and once the cable leaves there is no owner to find."]

