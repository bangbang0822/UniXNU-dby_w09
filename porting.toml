[[area.evidence]]
kind = "source"
reference = "docs/display-research-merge-2026-11-19.md"
result = "2026-11-18 01:10, a hypothesis tried and disproved, kept so it is not tried again: removing '-v' from the kernel arguments was expected to fix the warm-reboot boots where the display driver never binds, on the reading that DarwinBoot zeroes Boot_Video.v_display when -v is present. It does not. BootVideo.h:31 sets Video[1] = 1 unconditionally in every copy of the tree, the arm64 layout puts v_display second (pexpert/pexpert/arm64/boot.h:31-33), XNU copies it at pe_init.c:438, and the driver's primary=video.v_display==1 therefore cannot be false because of -v. The tree also has no reader of 'v' at all: no PE_parse_boot_argn(\"v\"), no PE_verbose, and the detailed rows come from -enable_kprintf_spam plus debug=0x14e. The change was reverted unbuilt, and the review that rejected it also found it would have failed check-regression, whose baseline still lists -v. The cause of the warm-reboot zero rows is still open; the remaining source-backed lead is the firmware side, where DarwinBoot looks the PHYFB protocol up exactly once and falls back to the GOP heap canvas if it is not there."

[[area.evidence]]
kind = "source"
reference = "patches/uefi/darwinboot-addon-handover.patch"
result = "2026-11-18 02:00, two results from building the board's DarwinBoot outside the Mu tree. First, a real defect in the addon handover code: EDK2's CLANGPDB build refuses it with 'variable Addon is used uninitialized whenever if condition is true' because the Fail label frees Addon while the early reads can fail before Addon is set; the Mu build this file normally goes through does not flag it, so the latent double-free-on-garbage path shipped. The fix hoists AddonOffset/Addon/AddonSize up with the other locals, before the first goto Fail, and the same hoist has to be in the patch before it is regenerated. Second, the board's DarwinBoot now builds as a UEFI driver in the core's EDK2 workspace and loads from the ESP in QEMU (26,624 bytes; 'DARWINBOOT: loader v2 installed EL1'), which gives a place to exercise the loader without flashing. That run stops at 'boot refused: Unsupported' because the ADT declares a ramdisk offset while the request carries no ramdisk (DarwinBoot.c:616), so the PHYFB block is not reached yet: the QEMU fixture needs a ramdisk before the retry can be observed there. The PHYFB retry itself passed review after two corrections (its failure row said 51 attempts for 50 tries, and a UINTN was printed with %u), with one caveat worth keeping: SimpleFbDxe is dispatched through APRIORI.inc before BDS, so a post-dispatch miss is deterministic and a retry only rides out a transient - a tablet log that always says 'attempt 1' would mean the retry never helps and the publisher is the defect."

[[area.evidence]]
kind = "device"
reference = "docs/display-research-merge-2026-11-19.md"
result = "2026-11-18 09:35, the PHYFB retry is ruled out as the fix for the bad boots, which is what the review predicted. Firmware 44815136 (DarwinBoot retries the PHYFB lookup 50 times over one second) booted a warm reboot and behaved exactly like before: zero 'DbyDisplay' frame copies, zero '[kick]' and zero '[swaprej]' from the display driver's own entry points, 3256 Apple 'verify_swap failed' rows, and '[scanout wait] calls=5141 timeouts=5140'. The addon still installed ('A files=6'). So the protocol is genuinely absent after DXE dispatch, not merely late: the fault is on the publisher side, SimpleFbDxe, which either does not start or skips its PHYFB install on these boots. The next measurement has to come from that driver, not from DarwinBoot: record why its start or its install did not happen somewhere the kernel can read, since its own debug output only goes to the panel's log band."
