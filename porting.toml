[[area]]
id = "display"
status = "device-verified"
components = ["GopFramebuffer"]
paths = [".github/workflows/package.yml", "configs/dby_w09_bootstrap_defconfig", "docs/reviews/2026-11-26-cold-build.md", "scripts/build-boot-progress.py", "scripts/build-gop-legacy-display.py", "scripts/patch-xnu-entry-probe.py", "scripts/xnu-panic-screen.c", "package/BootProgressDisplay.h", "package/BootUiTraceProbe.c", "package/AppleARMBacklight*", "package/BacklightProbe*", "package/LegacyDisplayProbe.cpp", "drivers/GopFramebuffer/**", "scripts/patch-data-seed-prefs.py"]

inputs = ["Firmware GOP framebuffer handed over by the UEFI port.", "Panel mode published through /chosen display-scale.", "Unmodified IOMobileFramebufferLegacy and IOMobileGraphicsFamily from the donor kernelcache."]
configuration = ["[kernel] archives build the legacy display backend with build-gop-legacy-display.py and force_load it.", "[payload] kernel_args keep the official offline-legacy-* sequence with offline-legacy-unit-scale=1 and offline-legacy-phase=4.", "panic_screen = true patches the panic screen into the payload copy of the kernel.", "GopFramebuffer is the selected shared component that publishes the firmware framebuffer to that backend."]
procedure = ["Rebuild the payload for an argument change, rebuild the kernel only for a driver change, flash and photograph the panel.", "Read the display checkpoints (stage, client calls, swap validation, frame count) as text from the diagnostic page."]
findings = [
  "The GOP mapping assertion protects a value the whole display stack reads. If an object other than the wrapped legacy display asks for the mapping, package/LegacyDisplayProbe.cpp:816 panics rather than adopting it, because the frame buffer base, size and geometry recorded there are what every later scanout publishes through. The branch is unreachable on the accepted path -- the only caller is the original IOMobileFramebufferLegacy instance this probe wrapped -- and it has never fired on hardware, which is recorded as an absence rather than a proof.",
  "native_legacy_backend_guard is NOT board-local dead code, and this record exists because a first conclusion said it was. The wrap in LegacyDisplayProbe.cpp replaces exactly two slots (168 external, 175 register) and that is the user-client vtable, but the guard belongs to NativeLegacyDisplay's own vtable in the shared GopFramebuffer component: NativeLegacyDisplay.cpp declares it at :28, calls it unconditionally from registerService() at :562, and generates seven opaque leaf overrides from it at :1223. Deleting the definition therefore leaves _native_legacy_backend_guard undefined and the display build cannot link. The mistake was survivable only because a submodule that is not materialised in a checkout is invisible to git grep: searching this repository and the core tree both returned nothing, while the same search inside the GopFramebuffer mirror found three call sites. Any future claim that a symbol is unused has to include the component repositories.",
  "scripts/build-gop-legacy-display.py binds the legacy backend to the reference candidate and writes original-bindings.S with absolute addresses from that image. On a cold tree it now emits a temporary archive defining only the three patched XNU callbacks, allowing the bootstrap kernel to link; the shipping build replaces that archive with the audited backend. The macOS workflow also patches the fetched HID recipe for the same first-pass-only fallback, then copies the bootstrap candidate into the shipping tree. Its display ABI JSON reuses the recorded QEMU checkpoint hash as provenance and is regenerated from the candidate; no new device observation is claimed.",
  "The separate cold-build output tree uses the shipping authenticated-root settings. The macOS workflow copies the already verified owner key and OS/SystemOS policy inputs into that tree before the kernel build; this keeps UFS, VerifiedRoot, Virtio, RPMh providers and boot-progress instrumentation in one audited link configuration.",
  "The legacy-display cold-build fallback records the temporary callback archive's SHA-256 and the generated stub source's SHA-256 in build-report.json. This satisfies the kernel link gate without claiming the stubs initialized or presented a display; after the candidate exists, the shipping tree rebuilds the audited backend.",
  "The display and PMGR builders import native_prelink from the official kit directory kits/XnuPrelink in the assembled tree. They previously prepended kits/NativePrelink, a name retired upstream, so that path never existed for a fresh clone.",
  "scripts/build-boot-progress.py compiles the board BootProgress.c with the panic-screen glyph table (Font.h) taken from the Mu-Silicium checkout passed with --uefi, so the firmware tree is a build input of the kernel step; a missing checkout is now the documented prerequisite error instead of an empty -I that surfaces as a fatal missing-header error.", "The legacy backend's own start already dispatches the hardware start; calling it a second time from board code produced a crash storm that looked like a panel failure.", "Scale is the gate that decided everything: preferredScale 0 makes the unchanged -[FBSDisplayMode _initWithWidth:height:preferredScale:] trap, SpringBoard never finishes and the render server ignores the panel. Publishing /chosen display-scale with unit-scale=1 closed it.", "Once the OS owns the panel, the diagnostic page must not take it back. boot-diag-resume=10 alternated our text page with the iPadOS lock screen because an ambient screen legitimately scans out nothing for more than ten seconds.", "The lock screen with its clock and home indicator is now on the panel on hardware, which is the first presented iPadOS frame observed on this board.",
  "scripts/build-gop-legacy-display.py:293 asserted that the only ready reader of native_battery_stats[16] is the [battery] row in BootLog.c and that the row never printed for lack of a producer. The second half is an assumption, and the first half was answered both ways at different times: on 2026-11-06 twelve commands over the working branch found no reader at all, and on 2026-11-14 the archive this tree builds lists BootLog.o, so the row does print (see the diagnostics area). What the display side still owns is the other half - no producer has yet filled the array on hardware - and that is what its comment should say.",
  "Four report writers in package/LegacyDisplayProbe.cpp are called with a buffer and a capacity, and three of them stored out[0] before looking at the capacity while the fourth opened with `if(!out || !cap)return 0;`. A caller that passed a zero capacity got a one-byte write past its buffer from each; all four open the same way now. The writers are host-callable helpers for the UFS log, so the guard is what a caller can rely on rather than something a boot exercises.",
  "Three answers recorded earlier in this area were wrong, and the panel's own counters say so. (1) The display backend does bind on the boots that show nothing: `DISPLAY stage=10 PM=4 calls=4 callbacks=1 guard=0` is the phase-4 terminal state LegacyDisplayProbe.cpp:995 records, and both kickSwapQueue and validateSwap are entered. (2) The PHYFB protocol was never the fault: `GOP actual mapping virtual=fffffff8efca6000 physical=9c000000 bytes=16384000` can only come from the PHYFB block (DarwinBoot.c:691), because 0x9C000000 is the EfiReservedMemoryType region MemoryMapLib.c:38 names and the pool allocator cannot return it for the logical canvas. (3) It is not a cold-versus-warm boot: the two boots this was measured on carry the same 54 kernel arguments, token for token, and both reach stage 10. What differs is whether the GPU addon mounted - `A files=6` with backboardd, mediaserverd, SpringBoard, WidgetRenderer_Defa and CollectionsPoster as clients, versus `A files=-1` with AMFI rejecting the Metal kext and no client - and only with Metal does the compositor ask for the deep spelling. What actually blocks a frame is that surface: `REJ acc=0 rej=153388 r=4 SURF 1600x2560 fmt=62336138 pl=2 st=1600 al=20480000 ml=20480000`, which is Apple's two-plane lossless 'b3a8': plane 0 holds plain 32-bit BGRA, and the stride accessor reports the last plane's row (1600 bytes) rather than the width*4 the copy steps. The old predicate refused it twice over, once on the format and again on the bound, since 1600 is less than width*4.",
  "The upstream repair for that surface is in the Data seed, not in the driver, and this board's seed did not carry it. The ADT declaration is not the switch: profiles/os/ipados-17.7.11-21H461/profile.toml:79 defaults artwork-display-gamut to P3, the sheng-family records override it to sRGB, and this board nonetheless presented 44 swaps under P3 on 2026-11-15. The switch is the three CoreAnimation preferences that scripts/make-data-seed.py:88-91 and scripts/add-gpu-plugin-data.py:88-93 write into root and mobile Library/Preferences: CAEnableDeepFramebuffer, CAEnableFramebufferCompression and CAEnableIOSurfaceCompression, all false, because the render server reads them when it starts, before any plugin code can run. Unpacking this seed with packed_ramdisk.regions and searching it found zero occurrences of all three names and no backboardd.plist at all. Writing APFS needs hdiutil, which the Linux host has neither in nor can install, so the patch was applied on a GitHub macOS runner in the private repository bangbang0822/dby-w09-data-seed (workflow data-seed-prefs.yml, run 44250907150): the seed went from 1,261,728 to 1,417,376 bytes, its APFS volume UUID stayed 2138CDAC-F86A-4DED-9EF1-09F27363DB2A so CONFIG_XNU_OWNER_DATA_VOLUME_UUID still matches and only the payload needs rebuilding, all four plists were written and independently re-read, and a page-level comparison of the two seeds shows 39 differing pages, no page present in the base and absent from the result, and every extent growing or staying equal.",
  "Two corrections and the bindings this round owes. (a) The previous entry's arithmetic is right but its reconciliation is not: the 39 differing pages are page 0 modified in place (the container superblock, o_xid 8 -> 10) plus 38 pages that exist only in the result. Both the first artifact (57177be5) and the hardened one (3b509f95) carry o_xid 10 in page 0, so the earlier claim that read-only verification added a checkpoint (xid 9 -> 11) does not hold for either published artifact. Switching that verification to a read-only mount is still correct - verification must not write what it verifies - but it does not explain a hash difference. The honest statement is that seed construction is not byte reproducible: two runs from identical inputs differ in the APFS timestamps and allocation order of the metadata pages beyond the four plist pages, so every rerun yields a new hash and the payload must be rebuilt with it. (b) The bindings, which the record did not carry: artifact 3b509f95eedc3dfb509dfa32c809c7b02479105a26c5207cff7af53d3cf129b1 (1,417,376 bytes) from run 44253411207 of the private repository bangbang0822/dby-w09-data-seed, workflow data-seed-prefs.yml (the repository's .gitignore was confirmed from the remote as blob 97e093d770, 114 bytes: one comment plus *.dbr, *.raw, *.cdr and *.img on separate lines, so the gitignore really refuses seed images); page evidence 308 existing pages unchanged except page 0, 38 new, 0 removed, 1 modified; fsck_apfs -n reports both containers OK (base xid 8, result xid 10); the four plists were re-read from a read-only mount with every pre-existing key intact and the three switches false. The payload built around it was e8709ff1d5b81e9a, superseded by whatever the next run produces.",
  "Kept is not a barrier, and reading it as one came from an old record rather than from the code this kernel builds. PersistOverlay.h:69 declares `enum class Open { Resumed, Fresh, Blank, Kept, Failed }`; checkHeader (:62) answers 3 for a seed whose digest does not match, and open() then returns Kept at :100 unless reset was asked for. NativeRamBlock.cpp:112-116 turns Kept into native_data_persist_state = 7, sets overlay.active = false and logs 'the persistent store holds no Data of this seed (header %d); kept, Data runs from the seed'. So on the first boot of a foreign seed the overlay is simply not applied: the disk runs from the new seed and its Library/Preferences plists are the ones backboardd reads. That is why the preference change is testable with the 54-argument payload already built - a one-shot sheng-data-reset=1 would take [payload] kernel_args to 55 and make a different payload from the one under test, and is only needed to give the store an overlay again, not to make the new preferences visible. The observable that decides it: state 7 with hdr=3 means no overlay is applied, so a missing preference cannot be blamed on the store; state 2 or 6 means an overlay IS applied, and the judgement then depends on whether the plist pages fall inside its bitmap - an overlay belonging to this same seed after a reset does not hide them, an overlay belonging to an older seed does. The evidence for Kept on this board is not only the source: tools/console-policy.log:356 carries the log line verbatim ('...header 3); kept, Data runs from the seed...'), APFS mounts OwnerData with 2138CDAC-... right after :365-368, and the first APFS write answers 'disk1: device is not ready' at :376-377 - readable but not writable. One caveat for the next reader: the two PersistOverlay.h copies in this workspace (dated 2026-10-30 and 2026-10-31) still declare the four-value enum at :66 without Kept and return Fresh at :103, so the :69 and :100 references point at the newer RamBlock revision the kernel builds; the mechanism is proven by the device log rather than by whichever copy happens to be at hand.",
  "The patched seed reaches the point where the compositor's surface is accepted, and this round's own capture cannot say what happens next - because the counters first read from it belonged to the previous run. First boot of artifact 3b509f95 on payload e8709ff1 (54 arguments, no sheng-data-reset): NativeRamBlock logged 'the persistent store holds no Data of this seed (header 3); kept, Data runs from the seed: use Install and boot to start it over', which is Open::Kept becoming state 7 with overlay.active = false, so the disk really did read from the new seed. Userspace came up: [metal askers] lists mediaserverd, backboardd, SpringBoard, WidgetRenderer_Defa, CollectionsPoster and Spotlight. The live section of the capture - everything after '[prev] --- end ---' at line 2623 - carries exactly three [swapok] rows, at lines 14852, 15378 and 23225, each reading 'disp=1600x2560 surf=1600x2560 stride=6400 alloc=16384000 len=16384000 | video=1600x2560 row=6400 depth=32 rot=0 base=9c000000', plus one 'IOMFB: default_fb_surface: No Default FB Surface found. Return error' at 14855. stride 6400 and alloc 16384000 are width*4 and width*height*4, i.e. a plain 8-bit BGRA surface rather than the 'b3a8' shape (st=1600, al=20480000) the earlier boots refused, so the seed preferences did reach backboardd, the compositor did stop asking for a 10-bit framebuffer, and validateSwap accepted what it submitted. Nothing after the accept is measured by this capture: the rows a first reading quoted - '[scanout prepare] prepare calls=0', '[gop] arg=1 step=7', '[gop call] mode=1/0 present=0/0 wait=163/e00002d6 complete=0/0', '[scanout wait] calls=164 timeouts=163' and '[mfb clients] calls=10011 fails=5010' - sit at lines 539-545 and 750, inside the '[prev]' replay block, and describe the PREVIOUS boot (the sheng-fb-gpu=1 run in which nothing was accepted). With sheng-log-replay a capture is two runs end to end: up to '[prev] --- end ---' is the previous boot's window report and only what follows is live, and the two must not be read together - that mistake is why this entry exists. Two corrections to the first reading: e00002d6 is kIOReturnTimeout, not kIOReturnBusy (0xe00002d5), and the wait counter belongs to the client waiting for an offer the previous boot never made. What the next round tests is the accepted swap's CPU copy path with sheng-fb-gpu=0 as the single variable, and the judge is '[swapok]' plus 'DbyDisplay: copy=' - [gop] and [scanout wait] stop printing once no presenter is created, so their absence is expected rather than a regression.",
  "One uncommitted build-tree change has to be remembered or a resync will silently remove a diagnostic another reader is relying on: the '[swapok]' print exists only in /root/dev-qud/drivers/GopFramebuffer/NativeLegacyDisplay.cpp (line 681 there), not in this repository's copy, which was added to the build tree by .research/add_swapok_print.sh. The assemble step copies this repository over the build tree, so one rsync drops that print and with it the only row that says a swap was accepted. It is not the only difference: the same file also carries this round's uncommitted b3a8 acceptance (nativeLosslessBgra/nativeSourceRow, 26 lines), which the build tree already has, so a resync would change neither the predicate nor the kernel - only the diagnostics - while 're-apply add_swapok_print.sh' is no longer behaviour neutral either. Confirmed before the flash: strings kernel.macho finds [swapok], [swaprej], [kick] and DbyDisplay, and the recipe's build report records the compiled source as 235c43c82bd237fb..., which is exactly what the build tree holds, so that kernel is the one described here. Until the print is brought into the repository, a round that depends on it must either re-apply the script or judge on 'DbyDisplay: copy=' alone.",
  "The accepted swap reaches the scanout copy for the first time on this port, and the frame it copies is opaque black because nothing has rendered it yet. Round: sheng-fb-gpu 1 -> 0, one variable, payload 347e1952, kernel 34a6da79 unchanged, seed 3b509f95. Live section of tools/console-fbgpu0.log - after '[prev] --- end ---' at line 2027 - reads: [swapok] three times (lines 10881, 16739, 17484, each 'disp=1600x2560 surf=1600x2560 stride=6400 alloc=16384000 len=16384000'), then 'DbyDisplay: copy=1 fmt=42475241 stride=6400 src=ff000000 ff000000 ff000000 dst=00000000 ...' at 10882 and copies 2-4 at 16742, 17487 and 17661 with dst now ff000000, one 'IOMFB: default_fb_surface: No Default FB Surface found' at 13898 that does not block the copy, and NO 'verify_swap failed' at all, against 1594 of them in the previous round. So the whole chain the display area has been chasing - compositor submits 8-bit, validateSwap accepts, the CPU copy writes the GOP scanout - completed, and the blocking item is now upstream of it. [gop] and [scanout wait] are absent as predicted (BootLog.c:478 suppresses the row when neither gate word is set; no presenter is created with gpu=0), which is a signature of this round and not a regression.",
  "Userspace stops at launchd on this seed, and the reason is visible in the same live section: backboardd and SpringBoard never appear, there is no [metal askers] row, no 'A files=', no [cryptex os], and the tail repeats 'disk1: device is not ready' / 'executeRequest: request failed to start!'. That is the Kept state doing exactly what PersistOverlay.h documents - state 7, overlay.active = false, every write refused - and it confirms the risk the earlier entry left open: with a foreign seed whose overlay was never started, the disk reads from the seed but cannot be written, so nothing past launchd comes up. The fix is sheng-data-reset=1, which costs 19 bytes against the 23 left under the 1000-byte gate (958 + 19 = 977) and does not undo the seed: a Fresh overlay starts empty and DirectDisk.h serves every page whose overlay bit is clear from seed.find(), so the CAEnable* preferences stay in force while writes go to the store. It is not one-shot in the code - leave it in and Data resets every boot - so it must be removed before the boot after the one that measures it. The same capture carries two seed-side symptoms the writable case has to separate: 277 'Cannot find extent ... (.db-wal)' rows, which are the write refusal itself, and 19372 'Container corruption detected by obj_checksum_verify' rows reading all-zero blocks (cksum 0x0, oid 0x0, o_xid 0x0), which may be that refusal seen from the metadata side rather than a bad seed. If the not-ready rows fall to zero while the checksum rows persist, the next variable is a new seed rather than another boot argument. The judges for that boot are not the obvious ones either: the DATA row and the backboardd/[metal askers] rows are window and panel lines, so they are read from the NEXT boot's [prev] replay, and what the boot itself shows is the not-ready count, the absent IOLogs, and whether 'DbyDisplay: copy=' still carries src=ff000000.",
  "Two readings in this session were taken from the '[prev]' replay block and were wrong, and the lesson belongs in the record. With sheng-log-replay=1 a capture is two boots end to end: everything up to '[prev] --- end ---' is the PREVIOUS boot's window report and only what follows is live. The first mistake quoted '[gop] arg=1 step=7', '[gop call] wait=163/e00002d6' and '[scanout wait] calls=164' from lines 539-545 and 750 of console-prefs.log, all inside a block that ends at 2623, and concluded the frame was stuck in the hand-off. The second quoted '[metal askers]' from line 720 of the same file and concluded userspace was complete; in the next capture the same row sits at line 800 against an end marker at 2027, so that conclusion was wrong too. The rule that follows: locate the end marker first and read only what is after it, and treat any counter that looks unchanged between rounds as suspect until its line number is checked against the marker. Both mistakes were caught by review, not by the author.",
  "The panel shows the iPadOS home screen with a correct picture. This is the first boot of this port that gets there, and it is the end of the display area's chase. Round: payload 513671cc (kernel 34a6da79 unchanged, seed 3b509f95), one variable against the previous boot - sheng-data-reset=1 added - with sheng-fb-gpu=0 kept from the round before. Live section of tools/console-reset.log, after '[prev] --- end ---' at line 2090: 'Early boot complete. Continuing system boot.', launchd runs its whole boot-task ladder (mount-phase-2, init-with-data-volume, keybag, usermanagerd, sysstatuscheck, finish-restore, workload-properties-init, init-exclavekit), then mobileactivation[117], contextstored[55] and usermanagerd come up, 'tx_flush: disk1 xid 310' shows APFS committing transactions continuously, and the owner confirms the home screen with icons, dock and status bar drawn correctly and no banding or colour shift. The three counters that had to move did: 'disk1: device is not ready' from 28611 to 0, 'executeRequest: request failed to start' from 28611 to 0, and 'Container corruption detected by obj_checksum_verify' from 9689 to 0 - so those checksum rows were the write refusal seen from the metadata side, not a damaged seed, and this round settles the question the previous entry left open. [swapok] still carried stride=6400 alloc=16384000 and DbyDisplay copy=1..8 still read fmt=42475241, so the 8-bit CPU copy path is what presents the desktop.",
  "Touch produces data and does not reach the compositor, and an earlier entry in this area named the wrong cause - corrected here. That entry said the missing piece was 'sheng-touch-split=1'; it is not. Opening split builds a second IOHIDDevice, and native_touch_set_sink() is a single global slot (TouchProbe.cpp:435-439) that the last service to start overwrites, so with split on the reports would come from the second device while only the first one is patched - board.toml:393-400 already records that reasoning for alioth and uke. What actually blocks touch is that the usage patch was dead code: HidInputProbe.cpp:125 defines native_hid_live_checkpoint(), the only code that sets PrimaryUsagePage/PrimaryUsage to (0x0d,4), and nothing in this repository or the build tree called it. backboardd's rule (HidInputProbe.cpp:148-153) is that a digitizer event whose sender is not (0x0D, 1|4|0x20) is dropped as coming from an unsupported service, so the 378 reports counted on the first desktop boot all went into a service it read as a keyboard. The repair is to call that function from the match thread (helper at package/HidInputProbe.cpp:222, called at :260 and :274, the thread itself at :253), on both success paths, and to print the resulting property row so a boot that still has no touch can be told apart from a boot where the code never ran. No boot argument changes for this: the earlier entry's sheng-touch-split=1 recommendation is withdrawn.",
  "A method note that cost this session two wrong conclusions: the boot-log rows the display area quotes are of three different kinds and only one kind reaches a serial capture. kprintf and IOLog lines appear on COM20. The BootLog window rows - [metal askers], [gpu clients], [gpu objects], DISPLAY/SWAP/REJ, [swapok], [display] - are drawn into the log band and recovered through sheng-log-replay on the NEXT boot as '[prev]' text slots, except the handful that also kprintf. The DATA and D st= rows are panel lines from BootProgress.c. So a serial capture of the boot that produces them shows nothing, and looking for 'backboardd' or '[metal askers]' in it reads as 'userspace never started' when the desktop is on the panel. Read the panel, or replay the next boot, or judge on rows that are actually kprintf.",
  "Direct scanout's window builds on this board: [direct scanout] state=80000004, i.e. installed with context bank 4. Round: payload ff2ddd10 (kernel 6586c526, the first with the ShengUfs DpuWindow integration), sheng-dpu-scanout=1, 55 arguments / 991 bytes. The row reads 'state=80000004 flips=0 surfaces=0 mapfail=0 latches=0 longest=0 total=0 released=0 fallback=0 boot=0'. That word is 0x80000000|bank and only dpuEnable writes it, so the whole chain ran: apps_smmu mapped through mapPhys rather than dereferenced as a physical address (the previous round died there with x0=0x9c000000 and esr=0x96000010; this boot has no such abort), the stream match and the CBAR/SCTLR/TTBR preconditions passed, the boot IOVA 0x9c000000 was accepted, and stage-1 is now translating for the display bank. flips=0 is the =1 contract: DpuWindow.h:207 builds for any non-zero scanout while NativeLegacyDisplay's startDirect needs mode>=2 before it flips. The round also settled how these rows are read, which had cost two wrong conclusions: the window rows ([direct scanout], [gpu ibs], [gpu objects], GPU METAL, A files) reach the serial only through the NEXT boot's [prev] block, because the writer composes into its slot and sheng-log-replay re-reads it a boot later; kprintf rows ([swapok], DbyDisplay, panic) are visible in the live section of the boot that prints them. Reading a window row in the boot that produces it always looks like 'the row is missing'. Next round raises the argument to 2, which adds the per-surface mapping and the first flip; state cannot distinguish 1 from 2 because scanout is only tested for truth, so the =2 evidence is flips climbing, surfaces settling at a handful, mapfail=0, latches=0, longest a few ms, fallback=0, and the DbyDisplay copy= rows disappearing - flips and a CPU copy cannot be the same frame. The risk is the first flip(): it writes VIG 0x4000/0x6000 and kCtlFlush, and this fork has no MDP clock or power-domain code, so the failure is a hard stop rather than a refusal; the known 69 s vsync death is unreachable this round because sheng-vsync is not in the argument list. Rollback is payload /root/payloads/scanout1.img (ff2ddd10), preserved before the =2 build overwrote that filename; the kernel does not change.",
  "The =2 round stops after a single accepted swap, and the research names the two candidate mechanisms plus one board-value error that this port carries. Round: payload b98beee4, kernel 6586c526, sheng-dpu-scanout=2. The live section shows [swapok] exactly once (line 2273, the last line of the capture), DbyDisplay copy= zero times, no crash marker at all, and userspace stopped after 'Early boot complete' - backboardd, SpringBoard and tccd appear only inside the [prev] replay block, i.e. from the previous =1 run. So one swap was accepted and then nothing moved. Two corrections to my own reading: copy=0 does NOT prove direct scanout took over, because =2 touches no hardware before the first swap (NativeLegacyDisplay.cpp:156-178 maps and sets directOn only), and an alioth =2 boot has the same own=0 sw=0 shape; and the state=80000004 row is the =1 run's window row, not this one, since window rows are only visible in the next boot's [prev]. The research's strongest finding is a wrong constant: kCtlFlush=0x15018 at NativeLegacyDisplay.cpp:155 is SM8550's CTL base, and the same-SoC gts7xlwifi discovers the controller at runtime instead (0x1000 + 0x200*c, flush = base + 0x18; its :300-351), which puts kona's CTL0 flush at 0x1018. The same-SoC alioth measured the consequence directly (docs/evidence/2026-11-01-gpu-presentation-fix76-78.md:341-427): with VIG and CTL writes the board stayed alive 178 s but flips stayed 0 and flip() never returned; with every write skipped, flips=1 and it completed; writing the old value back still hung, so the act of storing is what blocks, not the value. Its attribution is sde-secure-sid-mask=0x4000821 with smmu_sde_sec_cb vmid=0xa - the secure world owns the display controller, reads proceed, writes are intercepted and the CPU stalls in the store. That matches this boot's shape exactly: console alive, no panic, copy never runs again, userspace stuck. Two things this port lacks relative to upstream GopFramebuffer (a654ed86): the GPU fence gate (upstream :375-413 gpuWrote() called at :682, 200 us polling, 250 ms marks slow without giving up, and Test/check-fence-wait.py enforces it as a hard requirement in display.md:90-94), and the family's 5 s swap watchdog cancelSwapsAfterTimeout() at :815-834. Also corrected: the latch-timeout retires-as-presented behaviour at our :217-228 is line-for-line upstream behaviour at :417-430, not a defect of this fork, so it must not be 'fixed'. Deciding evidence for the next boot is one number in the [prev] [direct scanout] row: surfaces>=1 with flips=0 means flip() stalled before its own counter increment (:470), which is the CTL-address/secure-world hypothesis; flips>=1 instead points at a translated-page fault being latched with no handler, since DpuWindow.h:111 enables CFIE while nothing in this tree services it and native_ufs_dpu_live() has no caller. Nothing reported this exact symptom anywhere in the ecosystem, and upstream documents no launchd or userspace ordering dependency for scanout.",
  "The DSI kick is armed behind dby-dpu=2, its judgement row is decidable, and the bit names come from the vendor register table rather than from mainline DPU. Round: kernel ff068187, payload 9a181e72, 55 arguments / 986 bytes, one variable against payload d168a53a - dby-dpu 1 -> 2 - with every other kernel argument unchanged and the sheng-dpu-scanout=2 of the round before left in place. Mechanism: both hosts CTRL is written as the whole word 0 and 2 ms later the exact value the boot loader left is written back, with the two hosts switched off together and restored together, because this panel is split across DSI0 and DSI1 on one shared PLL and a one-at-a-time window would leave a half panel running for milliseconds. Nothing else is touched - VID_CFG0, the timings and the lane setup stay as the loader wrote them - which is what makes this the smallest action that could make a lost panel re-lock. The bit names are dsi.xml ones at the 6G layout (+4): CTRL bit0 ENABLE, bit1 VID_MODE, bit2 CMD_MODE, bits4-7 LANE0..LANE3, bit8 CLK_EN, so the 0x77 both hosts read is ENABLE|VID_MODE|CMD_MODE|LANE0|LANE1|LANE2 with bit7 and bit8 clear. The kick therefore restarts ENABLE together with three lane enables, not ENABLE alone, and a frozen panel after a real toggle means EN plus LANE0-2 is not enough - never that the host cannot restart; the next step in that case is CTRL=0 plus full reprogramming, which is a different experiment. The mechanism is a hypothesis rather than an upstream contract: mainline dsi_ctrl_disable writes the whole word 0 but only as one step of a teardown that dsi_ctrl_enable rebuilds from VID_CFG0 upwards, and msm_dsi_host_disable states that on this IP clearing the enable bit does not by itself stop the video engine. The row is decidable because the value is read back after the clear: mid with bit0 clear and after==before is a real toggle, mid==before means the store was ignored (secure world or hardware - stop there, the panel then says nothing about DSI), and anything else is a mismatch whose after==0 shape sends the tablet back to the previous payload. Two further observations ride on the same row: STATUS0 (0x008) bit3 VIDEO_MODE_ENGINE_BUSY, which was set in both hosts in the previous round, so set before and clear after is engine-lost and means roll back instead of pressing on; and FIFO_STATUS (0x00c) bit0 overflow, bit3 video underflow, bit7 command underflow, plus VID_CFG0 (0x010) DST_FORMAT[6:4] and TRAFFIC_MODE[9:8] read before the write, which together name the third cause the kick cannot treat - a host that stays enabled while it starves or emits the wrong format. Read the row in its printed order: before, mid, after (CTRL), st before>after (STATUS0), fifo before>after (FIFO_STATUS), vidcfg (VID_CFG0), verdict. An underflow that appears only in fifo after the kick is the kick having starved the link rather than a pre-existing fault, and DST_FORMAT describes the pixel format, so a wrong value there reads as a colour error and not as a frozen picture - the bits that point at a frozen picture are TRAFFIC_MODE and the *_POWER_STOP bits. Two notes for the next reader: the value is a write, so it runs only after the snapshot's store test has proved that a store to this block returns, and a hang kills the boot at t~20 s with the log slot keeping everything printed before it; and dby-dpu=2 prints no [dby-dpu] t= rows because the timeline keeps its own gate at dby-dpu==1, so their absence is not a fault. This payload was built from the build tree's board.toml set to dby-dpu=2 and with dby-pcie=1 removed; the repository board.toml keeps dby-dpu=1, so a rebuild for another area does not inherit the write. That kernel still links the wireless area's DbyPcie census, which a concurrent session added to the same build tree today: dby-pcie=1 is its only gate and that argument is absent here, so the probe returns on its first line and the module is dead weight in this image rather than a second variable. Two sessions sharing one build tree is itself a hazard this round hit - their kernel build landed in the same output directory between two of these builds - so the flash plan assumes the tablet is flashed by one session at a time.",
  "The store test answered the question that gated direct scanout: a store into the display block returns on this board. Round: payload d168a53a, kernel 807f2146, cold boot captured from the first line of the kernel on the serial console. The row reads 'store vig0.src0 ok before=9c000000 after=9c000000' at t=32.5 s, so writing VIG0 SRC0_ADDR with the value it already held neither stalled nor faulted - the alioth finding, that a store to the controller stalls the CPU because the secure world owns it, does not hold here for the MDP block. The same boot shows what sheng-dpu-scanout=2 was supposed to do: '[dpu start] mode=2 mapSym=1 state=80000004 installed=1 primary=1 / [dpu start] mdpMap=1 pages=1 timer=1 loop=1 add=00000000 / [dpu start] mdp=0xfffffff7429c1000 mapOnly=0 directOn=1', and the apps_smmu stream that the boot loader left bypassing now translates - stream 0x820 reads smr=84020820 s2cr=00000004 bank=4 cbar=0001f000(stage1) sctlr=00000061 ttbr0=df095000 tcr=00800020, where the previous round read sctlr=000000e0 with ttbr0=0. So the DpuWindow stage-1 tables are live, the display IOVA 0x9c000000 is translated rather than used as a physical address, and stream 0x821 is still not mapped. The scanout judges could not be met on this boot for a reason outside the display: '[gpu windows] ovf 0/0K/0M ... mount fail stage 1 st e00002d5 slot 0 n 1', an empty '[metal askers]' row and '[gpu clients] kernel_task 0/0/1 s- 4096M r0' mean the GPU addon never mounted, no compositor rendered, and '[direct scanout] state=80000004 flips=0 surfaces=0 mapfail=0 latches=0 longest=0 total=0 released=0 fallback=0 boot=0' is a boot with nothing to scan out rather than a refused surface. Three swaps were accepted all the same ('[swapok] disp=1600x2560 surf=1600x2560 stride=6400 alloc=16384000 len=16384000 | video=1600x2560 row=6400 depth=32 rot=0 base=9c000000' three times, with '[kick] kickSwapQueue calls=1' and 'calls=3' and one 'IOMFB: default_fb_surface: No Default FB Surface found'), and no DbyDisplay copy= row appears, which is the shape directOn=1 predicts: the copy path is bypassed and the flip path had no surface. The t=2/5/10/20 timeline rows that did print (t=8, t=9, t=10, then the t=20 snapshot) are identical in every field, so there is still no transient MDSS gate to chase. Two operational facts from this round: the console on COM20 delivers nothing unless DTR and RTS are asserted - two captures of 200 s and 300 s read zero bytes before that, and the first read after asserting them returned 222 KB of buffered early boot - and a boot is only reproducible when the log is captured from the first QCOM banner, because the [dby-dpu] rows are kprintf and are never replayed. One item this capture cannot settle: the persisted panic slot replayed 'Unhandled implementation specific error' with a frame list at t=24.5 s, which belongs to a run that died before this one. The 15:52 boot's own live capture (15:55:55 to 16:00:55) holds no panic line, so the text is either stale from an older kernel or from the last half minute of that boot, and it has to be dated before the store result is extended to a block other than VIG0 - in particular the DSI host block at 0xae94000, which is where the next round writes and which no store test has touched yet.",
  "The DSI kick landed, and on the same boot direct scanout presented a frame for the first time on this port. Round: payload 9a181e72, kernel ff068187, dby-dpu=2, cold boot captured from its first console line and watched for eight minutes without a panic. The two rows read '[dby-dpu] dsi0 kick ctrl before=00000077 mid=00000000 after=00000077 st=00002008>00002008 fifo=10001010>1ddd1019 vidcfg=00009230 toggled' and the same for dsi1 with st=00000008>00000008. Four things are settled by them. (1) The store lands: mid reads 0 after the whole-word clear, so unlike alioth this block is not held by a secure owner, and the DSI host at 0xae94000 joins VIG0 as a block this board may write. (2) The video engine survived: STATUS0 bit3 is busy before and after, so this is toggled and not engine-lost, and the enable really did come back (after==before). (3) The link did break for the 2 ms the hosts were held down: FIFO_STATUS goes from 10001010 to 1ddd1019, whose bit0 overflow and bit3 video-underflow are set only afterwards, so a fifo that stays clean across a kick would mean the write did not take effect and this one did. (4) The third cause is excluded: VID_CFG0 reads 00009230, i.e. DST_FORMAT=3 (RGB888) and TRAFFIC_MODE=2 (burst), which is what this panel wants, so a host enabled but emitting the wrong format is not the explanation here. One caution stays attached: an underflow created by the kick is the kick starving the link, and it must not be read as a pre-existing fault. On the same boot the scanout counter finally moved - '[direct scanout] state=80000004 flips=6 surfaces=2 mapfail=0 latches=0 longest=4759 total=16294 released=0 fallback=0 boot=0' - with no DbyDisplay copy= row anywhere, so the DPU fetched six frames straight from compositor surfaces and the CPU copy path stayed bypassed. That boot had the userspace half the previous one lacked: '[metal askers] backboardd:1 mediaserverd:1', '[gpu clients] kernel_task 0/0/1 s- 4096M r0 backboardd 2/0/1 s0 4332M r0', SpringBoard with a live page table, '[gpu ibs] submissions=693' and '[fence wait] calls=476 timeouts=0'. What the counters cannot say is whether the panel showed those flipped frames: flips=6 proves the controller took surfaces and latched them, and only an eye on the panel closes that gap, so this entry claims the flip and not the picture - until the owner reported the next morning that the home screen did appear on the panel after several minutes, which closes it: a compositor frame reached the panel through the DPU with the CPU copy bypassed, the first time on this port. The several minutes are not the display: only one core runs, because ArmCpu.cpp:333-336 makes secondary startup opt-in behind smp=1 and this board dropped that argument on 2026-11-18 to keep touch working. Two side findings. The persisted panic text every boot replays now has an explanation: 'debug_log_init: Error!! gPanicBase is still not initialized' prints twice at start, so the panic slot cannot be written on this kernel and the text is a permanent stale record from an older run - it must not be dated from the boots that show it. And the apps_smmu stream 0x820 keeps translating on this boot too (sctlr=00000061, ttbr0=df08e000, cbar=0001f000 stage1), with a different TTBR from the previous boot as expected.",
]
completion = ["An iPadOS frame is presented and stays presented across a normal idle period."]
limits = [
  "The mapping-owner assertion has never been observed firing, so its message and its recovery path are untested. If it fires, the panic text names the object; the next step is the previous boot's DISPLAY row (native_legacy_stage, native_legacy_pm_stage) to identify which service took the mapping.",
  "A fresh clone needs one kernel pass that produces a prelink candidate before the legacy display archive can link; build/xnu-prelink/ is a build product, not a repository input.", "No hardware cursor, no vsync-driven swap accounting and no DPU-specific timing on this SoC: the path is a GOP-backed legacy scanout.", "drivers/GopFramebuffer is a fork of the component, not a pin: 6 of its 11 files are byte-identical to the component repository, 4 differ (NativeGOPresenter.cpp and NativeGOPWire.h among them) and one file exists only here.", "package/LegacyDisplayProbe.cpp reads Apple objects at hand-derived offsets: the swap request's surface ids at 2624, its state words at 792/796/800 with their options at 804/808/812, width and height at 816/820, the rectangle bytes at 17 and 81, and the display object's retirement counters at 5472/5480/5820/5824/252. They are raw on purpose - reporting what a refused swap and a retirement carried is what the probe is for - and the classes are opaque, so no offsetof or _Static_assert can check them; the two functions now carry the offset map and say the layout is the one the 21H461 objects have. That is a decision rather than a gap: the probe is written for the 21H461 objects and says so, a generated layout header needs class metadata this repository does not carry and that the binary does not store (IOKit C++ ivars have no name table), and a different build would need a new probe rather than a reused offset table."]
next_action = ["Read the [dby-dpu] rows from the read-only probe (dby-dpu=1, package/LegacyDisplayProbe.cpp). vig*.src0 is the address the controller fetches: 9c000000 with ctl*.pipe/fetch set means it still scans the copy target. The smmu rows decide whether that IOVA is translated or used as physics; measured 2026-11-20 the 0x820 stream routes to bank 4 with CBAR stage1 but SCTLR.M=0 and zero TTBR0/TCR, and 0x821 is not mapped, so the fetch is physical. The dsi row gives the eight DSI branches in dispcc (pclk0/1, byte0/1, byte0/1_intf, esc0/1) and must be read four ways: all zero together with power=0 is not a reading (the block is not answering); every word with bit1 set (clock off) means the link is gated, which a command-mode panel survives by holding its last frame, so the fault is that nothing ever opened DSI; the 0-series enabled and the 1-series gated means the boot loader drove DSI0 (cross-check ctl0 intf=0x6); PHY-side byte clocks on while byte*_intf is off means the controller is not forwarding. esc on is normal during command-mode LP and proves nothing. The dsi lane row is read three ways only: identical LANE_CFG0/CFG1 on both links (a difference is the anomaly; a value other than our own driver's 0x21/0x84 is not a fault, the loader's swap encoding may differ), LANE_CTRL0 bits[4:0] == 0x1f (four data lanes plus the clock lane released), and LANE_CTRL1 bits5|6 == 0x60 (continuous clock, which video mode needs - a clear pair is a real candidate for a panel that holds its last frame). LANE_STATUS0/1 have no documented bitfields and are recorded raw only. The dsi phy row is the last block before the panel: lock bit0 (PLL locked), status bit0 (REFGEN), cmn0 bits[4:0] (lane power-down-B, 0x1f = lanes live, 0x00 = off) and bit5 (PLL bias), cfg1 bit0 (pclk mux; the PLL source is BITCLK_SEL, 0 = internal). Read it as three verdicts: lock=1 + status=1 + (cmn0 & 0x1f)==0x1f means the PHY is live and only the panel remains; lock=1 + status=1 with the lanes down means nothing is being sent while the DPU keeps fetching; lock=0 means the DSI never transmitted. An enabled PHY reads cmn0 in the 0x7f shape - a 0xffffffff or unrelated value means the offset is wrong and the row must be discarded rather than interpreted. The probe refuses to touch the MDP block unless both MDSS clocks and the power domain read on, because the 2026-11-15 pipe read aborted the kernel. The earlier name dby-dpu=2 was withdrawn with that row.", "Keep the panel with the OS across idle, then make the lock screen passable (see the input area)."]

