[[area]]
id = "packaging"
status = "device-verified"
components = ["DarwinBoot", "XnuPrelink"]
paths = ["dts/dby_w09.dts", "package/unixnu.toml", "README.md", "patches/**"]

inputs = ["Prelinked kernel image from the donor kernelcache plus board archives.", "Firmware volume, ADT generated by scripts/make-adt.py from the compiled hardware DTB, trust cache bundle and Data seed.", "Payload FAT volume labelled DBYW09ESP, 208 MiB."]
configuration = ["[payload] loader = firmware places DarwinBoot inside the firmware volume; title, timeout and kernel_args are written into the ESP unixnu.toml of the image.", "[payload.adt] unique_chip_id = required and --unique-chip-id carry the identity at build time.", "[userdata] describes which IPSW components become root windows inside the assembled image.", "XnuPrelink is the kit stage that assembles the prelinked kernel image the payload then carries."]
procedure = ["Build the payload, inspect the produced image (menu entry, kernel arguments, ramdisk size) and flash it to the payload partition named in README.md.", "Keep every produced image: rebuilds overwrite the output path, and a checkpoint that cannot be re-flashed cannot be repeated."]
findings = ["[kernel] patch_series is an array override, not an append: a device layer that adds a fifth series repeats the four inherited arch:/soc:/device:/os: entries, and the order inside that array is the order patches.py:prepare applies them.", "Argument counts come from the command line embedded in the built image, never from the board.toml array: the array spans comment lines, so an unfiltered grep reported 48 arguments / 1038 bytes for an image that carries 44 / 955, and the DarwinBoot header caps the string at 1000 bytes, which is what makes the difference decisive.", "The menu entry's kernel arguments come from the payload, which is why an argument change is a three-minute payload rebuild rather than a kernel rebuild.", "The payload partition had to change because the image exceeds the official cache partition; the flash target is recorded with its reason instead of being a local habit.", "A seed larger than what the packed container can carry silently produces an unbootable image; check the packed size and the logical size together.",
  "A second `patches/xnu` series now ships: `patches/xnu/series-torch`, naming exactly one patch (`zze-dby-torch-media-mount.patch`), resolved after `series-audio` in `board.toml`. Two things this area records because the last round taught them: the patch is generated from the work-tree file and verified by `git apply --check` plus a `diff -q` against the intended post-state rather than typed (tabs and context lines do not survive retyping), and a series is only reviewable by replay, since the next `unixnu build kernel` re-clones and applies 67 patches where it applied 66 - the replay is `scripts/test-dby-torch-media-mount-patch.py --inputs xnu-inputs.json`, now a step of the torch host check.",]
completion = ["One command produces a bootable image that is reproducible from the recorded inputs and hashes."]
limits = ["One image is assembled from two repositories: the firmware repository builds SILICIUM_UEFI.fd, and a workbench script splices that volume behind the verified 144-byte boot shim into a stock Android boot header, because this tablet cannot boot an unpacked image and the flashed partition is not ./unixnu bootimg's output.", "./unixnu bootimg packs this board's image correctly but bootimg.verify() unpacks the v0/v1 header fields, so any header_version >= 3 board rejects its own output; the check is read as a layout diff, not as a pass/fail gate."]
next_action = ["Bring the boot packaging (shim + FD into the stock boot header, with its size and shape gates) into this repository so one recorded command produces the image that is flashed to boot."]

