[[area.evidence]]
kind = "source"
reference = ".github/workflows/package.yml"
result = "The GPU addon has never been in this board's payload, and the reason is a missing table rather than a missing capability: `unixnu build payload` only asks for an addon when board.toml carries [payload.runtime], and this board never had one, so every payload.json this tree produced records gpu_addon_sha256 as null. The table now exists (tool scripts/build-boot-runtime.py, target ios, build 21H461, the two trust components this profile fetches) and the macOS workflow that already builds the images gains a step that keeps the runtime outputs - runtime/gpuaddon.bin, runtime/owner-trust.bundle and runtime/generated.json - as an artifact, because the addon is the one image input a Linux host cannot make (Turnip and the Metal plugin need Xcode's clang and the iOS SDK). Two consequences are recorded with it: a payload built on any non-macOS host now has to pass --gpu-addon and --owner-trust-cache as a pair from the same macOS run, or the runtime step stops with 'Pass both --gpu-addon and its --owner-trust-cache'; and the owner_trust_cache_sha256 pin at the top of board.toml cannot match a CI-built bundle, because that bundle carries the freshly built plugin's CDHash. One prerequisite is unconfirmed: the reviewer could not establish whether build-adreno-metal-plugin.py needs cargo/rustc (RustPacBoundary.o) and whether the workflow's tools step provides it. Nothing here has run on the runner yet."

[[area.evidence]]
kind = "source"
reference = "drivers/Adreno740/NativeAdrenoPublish.cpp"
result = "Three rows of the 2026-11-16 01:0x boot read wrong at first and are now decoded against their renderers. (1) `GPU ARC step=5 gmu=00000000 pay=00000000 cpu=00000000 cold=00000000` is not a stalled cold start: gmu/pay/cpu/cold are the RETURN CODES of the four phases in package/DbyGpuPowerProbe.cpp, all zero - the GMU cold start (A650GmuColdStart), the GPU address space and its five kernel buffers all returned success - and step=5 is the last assignment in dbyArcGpuContext(), so the sequence finished. The power/GMU path this board runs is the SM8250 kit (kits/Sm8250Platform/A650GmuPower.c plus the GMU image in DbyGpuFirmware.h), not the Adreno 740 driver's, so there is no 650/740 GMU mismatch to resolve. (2) `[gpu gx] ... up=0` is the expected reading: BootLog.c:786-790 says up is the (v & 0x38) == 0x28 test, that test belongs to Linux's a6xx_sptprac_enable, which returns early for a non-legacy GMU, and this board's GMU is not legacy - up=0 is normal and not a fault. (3) `[gpu windows] ... mount fail stage 1 st e00002d5 slot 0 n 1` is not the addon: NativeAdrenoPublish.cpp:360 returns kIOReturnBusy for a second kernel-client mount when g.kernel_client is already set, and a kernel mount has no user space, which is what the stage field records. The addon's own row is `A files=-1 wr=0 same=0 fail=0 err=0 mount=1/2 mount2=1/2 mount3=1/2 mount4=1/2 mount5=1/2`: files=-1 means the payload carries no addon at all, and all five union mounts stopped at stage 1 with status 2 (ENOENT) because the addon is what writes their source paths under /private/var/ngpu. That row is the measurement the Metal question needs, and it says the addon is absent rather than mismatched."

