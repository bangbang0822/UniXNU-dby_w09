[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "SoftwareAES", "AppleKeyStoreState", "VerifiedRoot"]
paths = ["README.md", "board.toml", "configs/dby_w09_bootstrap_defconfig", ".github/workflows/package.yml", "scripts/build-link-stubs.py", "package/BootWatchdogPolicy.c", "package/KeyStoreProbe.cpp", "scripts/*storage*", "drivers/ShengUfs/**"]

inputs = ["UFS on LUN 0 with 4096-byte logical blocks; this model ships with 128 or 256 GiB and the tested unit has 128 GiB, so the capacity is read from the device instead of assumed.", "Backup GPT read from a full 9008 dump: the userdata entry spans first_lba 0x29B600 to last_lba 0x1D455FF, i.e. 27,959,296 blocks = 114,521,276,416 bytes.", "fastboot in the same session reports the userdata partition size as 0x14651E0000 = 87,595,810,816 bytes, so the two sources disagree and neither number is used to write anything.", "OS and Cryptex1,SystemOS root images, mounted read-only as disk windows.", "A scratch Data volume seed carrying the writable /private/var."]
configuration = ["[userdata] records the two windows and the LBA range read from the backup; nothing about the geometry is estimated.", "[kernel.prelink] roots keep com.apple.filesystems.apfs and com.apple.iokit.IOStorageFamily, so offline-apfs-load=1 can resolve the identifier it loads.", "[payload.adt] root_match_volume_uuid and packed_data_ramdisk = true describe the delivered form; CONFIG_XNU_OWNER_DATA_VOLUME_UUID in the defconfig must equal the seed's volume UUID.", "The selected components split by role: ShengUfs drives the UFS host on hardware, RamBlock backs the packed Data seed as a block device, VirtioMmioBlock is the root block device of the offline harness, AppleKeyStoreState publishes the key-store events userspace waits for (package/KeyStoreProbe.cpp, sheng-aks=1), VerifiedRoot carries the OS and SystemOS root trust and SoftwareAES is chosen because no Qualcomm crypto engine driver is ported."]
procedure = ["Build the kernel, then the payload with --data-ramdisk, flash the payload partition and read the Data mount checkpoint.", "For a seed produced by the official fixture workflow, verify the packed form against [payload.adt] packed_data_ramdisk before blaming the driver."]
findings = ["The payload partition choice is a capacity fact, not a preference: the official kernel image is 119 MiB and the cache partition is 104 MiB, so the payload lives in the preload partition. userdata is never imaged because it holds the tablet's own iPadOS root volume.", "A missing or mismatched Data seed is unambiguous: native_ram_block_volume_seed() fails, kern_exec reports the mount error and the boot stops. Growing an existing seed keeps the volume UUID and needs only a payload rebuild; a fresh fixture changes it and forces a kernel rebuild.", "Persistent Data (sheng-data-persist=2) writes every dirty page through the UFS store. It eventually fills its own container and the next write returns ENOSPC, which surfaces as a watchdog-policy panic; sheng-data-reset=1 starts the overlay over.", "Copying the fixture onto a dense container instead of a packed one only moves the failure: the loader stalls on the read instead of the kernel stalling on allocation.", "UFS capacity is a per-unit input the same way: 128 and 256 GiB units exist, so the userdata range in board.toml is this unit's backup table and is never a number to carry to another device.",
  "The kernel link closed on 2026-11-14 against the pinned core branch, and the last symbol it asked for was the key store's device identity. AppleKeyStoreState hashes native_aks_device_id into the 32-byte key that wraps every keychain item (NativeKeyStoreEvents.cpp:28 declares it, :109 calls it, and deviceKey() returns false when it answers nothing); its README says the board must return one, and no board file did - the whole build tree, the core and every fetch were searched and only the extern remained. The answer used here is the owner Data volume's UUID, because it is the one identity this port already has that is both stable across boots of a unit and different between units, and because it is a build input rather than a new hardware read: CONFIG_XNU_OWNER_DATA_VOLUME_UUID sits in the generated .config and build/xnu/owner-data-volume.h carries the same string for kern_exec.o. build-gop-legacy-display.py reads that .config and compiles KeyStoreProbe.cpp with it, so the kext and the kernel cannot disagree about the value. Measured with it in place: the kernel step returns 0, kernel.macho is 53,231,616 bytes with sha256 da8e43523338d5c2c0447098454846b3c8f1d1e045cc9e4789cffc08b4676415, and the run covered the bootstrap pass, every archive, the link and the prelink step. Nothing was flashed: this says the tree builds, not that the port boots."]
completion = ["Root and Data volumes mount on hardware, the overlay survives a reboot and no partition other than the payload partition is written."]
limits = ["The UFS geometry is read from a backup of the factory table rather than from the running device tree, and no vendor UFS calibration blob is used.", "The recorded userdata range belongs to the 128 GiB unit this record was measured on; a 256 GiB unit has a different table and has to be read before anything is written.", "drivers/ShengUfs is this board's copy of the tree the verified kernel was built from, not a feed: no repository this project pins or mirrors carries the component, so there is nothing upstream to diff it against.", "The store/log/whole-userdata write windows are a lease since 2026-11-14: the four open/close helpers take gHost.lock and the four I/O entry points test the window inside the same critical section as the copy and the SCSI command, so a close from the IOKit thread is observed wholly before or wholly after a transfer from the block-device thread. What the change rests on is that no callee inside the critical section takes another lock - hostScsiDir is the only one and it takes none - and what it cannot prove here is the scheduling interleaving itself: the host harnesses (run-native-ufs-bsd-root-core.sh, RootCommands, RootWindowRead, check_legacy_descriptors) pass with the lock in place, but the race itself needs a boot that drives start/stop against I/O.", "RootLayout.lbaBytes is the driver's fixed media unit, not what the device reports: findRootLayout assigns 4096 because that is the unit the GPT header at LBA 1, the entry array and the partition size are parsed in, so its check compares the field with itself. The real comparison now happens before the parse, in NativeUfs::startWholeUserdataRoot: it reads READ CAPACITY and refuses the whole-userdata route unless the device answers kMediaBlockBytes, which is what the storage limits used to record as an open question here. What remains is that the probe path (native_ufs_root_check) still only prints the device's block size rather than refusing on it - it is a diagnostic rather than a route, so a mismatch there shows up as a row and not as a refusal.", "Two groups of hardware values in drivers/ShengUfs name their source without a line, and reading the sources settled which half of that can be fixed. The SM8550 GCC offsets in GccUfs.h now cite a revision and the entries they came from: linux 97d73c825122, drivers/clk/qcom/gcc-sm8550.c:2651-2676, where 0x77018 is the halt/hwcg/enable register of the UFS PHY branches (the header still says those offsets are SM8550's and only a heuristic on this SM8250 board). The SMMU stream ids in NativeUfs.cpp are the other answer: mainline's sm8250.dtsi at the same revision has the ufshc node at :2510 and it carries no iommus property at all, so the 0x60/0x0e0/0x4e0 values cannot be cited from upstream - they are the vendor DT's, which is not in this repository. That is where it stops: no public source carries the line, and the vendor tree is not in this repository nor in hand, so the boundary is recorded rather than chased. The ids stay as the driver was written against, and the note in NativeUfs.cpp says which property they came from.", "drivers/ShengUfs/NativeUfsBsdRootCore.h/.cpp is host-tested policy that the kernel build does not compile: drivers/ShengUfs/tests/run-native-ufs-bsd-root-core.sh builds it against an in-memory GPT/HFSX fixture and prints its PASS line, while the root path the kernel runs is NativeUfs.cpp's own. That is now a decision rather than an omission: the two paths answer different questions - the core is the fault-injection target for the GPT/HFSX decisions (duplicate entries, overlaps, ranges, write protection), the kernel path owns the transport and the IOKit plumbing - and binding one to the other would put the test's fixtures behind a live controller before anything on hardware had exercised the combination. The header used to describe that binding as if it existed; it now says what is true. If the two are ever unified, the fixture is the part to keep and the binding is what to add.",
  "The hardware readback the UFS clock handling leans on, recorded here so the two comments that cite it can point at one entry: on 2026-10-17 this unit answered 0x80000003 for the UFS PHY branch's CBCR after the hand-off -- bit 0 (CLK_OFF) and bit 1 (the hardware clock-gating bit) both set -- while the AHB branch was enabled and its AXI was running. That is why a branch whose CBCR advertises hardware gating may read CLK_OFF while idle (drivers/ShengUfs/GccUfs.h) and why the probe's own note in NativeUfs.cpp treats the same value as normal rather than as a powered-down branch. The value is a field reading, not a register-table entry: the clock summaries it came from are not carried in this repository, so the date and the value are the provenance."]
next_action = ["Record the store capacity and wear counters of the overlay once the boot is repeatable."]

