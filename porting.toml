inputs = ["SM8250 Wi-Fi/BT combo plus the modem subsystem, both requiring firmware blobs this port does not carry.", "No serial or USB console is wired in XNU, so device observations come from the panel."]
configuration = ["No network component is selected; com.apple.iokit.IOSlowAdaptiveClockingFamily and friends are in the prelink roots only as closure dependencies.", "launchd jobs that need the modem or Bluetooth are suppressed by sheng-disable-jobs rather than started and failed."]
procedure = ["Read the bring-up order first: a console or log path that survives a panic makes every later subsystem cheaper, so the USB debug console is the step before Wi-Fi."]
findings = ["Disabling identityservicesd, locationd, CommCenter and bluetoothd is a bring-up measure to keep noisy subsystems out of the boot, not a statement that they work.", "The absence of any host-visible log is what makes each iteration cost a physical flash and a photograph.",
  "The `A` row of `package/BootLog.c` - a file this area owns the paths for - is wider and carries two more mount pairs: `char row[120]` became `char row[200]`, and `mount4=stage/status mount5=stage/status` were appended after `mount3=`, with the comment naming what each pair stands for (the audio HAL plug-in and the flashlight plug-in overlay) and what each stage of the ladder means. Fixing the row also fixes the claim attached to it: `mount4=` was recorded as printed before it was, and `checks=93 pass=93 fail=0` after the change says the row width cost nothing else.",]
completion = ["An interface is enumerated, associates and obtains an address on hardware."]
limits = ["Nothing is implemented and no vendor firmware inventory exists for this board."]
next_action = ["Port the SM8250 USB debug console to get a log path, then evaluate Wi-Fi."]
[[area.evidence]]
kind = "source"
reference = "package/BootLog.c"
result = "the [audio] row prints the legacy APR ladder (st, q, ans, status, refused, to, ign, rdy, up, down, op, drop, sendfail, lvl, done, map) over the 16 native_audio_stats slots in a 240-byte buffer, in place of the AudioReach probe mode field. It is a row format change, which is why this area sits on it: BootLog.c is the console and panel row composer"

[[area]]
id = "audio"
status = "device-verified"
components = []
paths = ["package/*Audio*", "package/*Adsp*", "package/*Gpr*", "scripts/*audio*", "scripts/*adsp*", "scripts/*gpr*",
         "package/DbySmartPA*", "package/DbyPaTables.h", "package/GeniI2c*", "hal/*",
         "package/FatVolume*", "package/QcomGlink*", "package/QcomMdt*", "package/QcomQmp*", "package/QcomQrtr*",
         "package/QcomRpmh*", "package/QcomScm.h", "package/QcomSmem*", "package/QcomSmp2p*", "package/SmmuBypass.h",
         "package/ShengApr*", "package/ShengCs35l43*", "package/ShengQrtr.c", "package/tests/**", "hal/**",
         "patches/xnu/series-audio", "patches/xnu/zzyd-sheng-audio-addon-mount.patch",
         "scripts/trust-append-module.py", "scripts/addon-add-dir.py"]

inputs = ["SM8250 (kona) audio DSP (ADSP, LPASS) and the firmware image inside this unit's own modem partition; the playback graph this machine's vendor kernel defines for it - legacy APR over GLINK with PRI TDM at 0x9000, not MI2S and not a WCD codec - and the four TFA9874 amplifiers on the qupv3_se3 I2C bus.", "Apple audio kexts are in the prelink closure (IOAVFamily, IOAudio2Family, AppleIISController, AppleAudioClockLibs) because the donor roots list requires them."]
configuration = ["Three arguments are enabled on the audio path and they are a chain, not three switches: sheng-adsp=2 is power.md section 2 tier 2 (start the subsystem and bring up GLINK), dby-audio=2 runs the legacy APR playback ladder in package/DbyAudio.cpp, whose own gate at :709 also demands that tier, and sheng-gpu-addon=1 gates the boot-time addon mount that presents /private/var/ngpu/audio over /System/Library/Audio/Plug-Ins/HAL.",
  "The codec half this field used to call missing was never what stood between the ladder and sound: ord209 plays out of the four TFA9874s with no SM8550 AudioProbe.cpp compiled for this board and no clock provider selected here, because the Kona path hands PRI TDM at 0x9000 to the amplifier and the ADM brings its own backend clocks up. What was missing is the timestamp-valid bit of the ASM write, recorded in findings.",
  "The audio server plug-in is donor code, kept here as a copy rather than as a patch. hal/ShengAudioPlugIn.c is the donor tree's file minus its authenticated-pointer branches: the ptrauth.h include, the two-way handling of the AudioGetHostClockFrequency dlsym result and the ptrauth guard around the image-load trace, leaving the plain 47-bit mask, because the bundle is built as arm64 while the audio server that loads it is arm64e. hal/Info.plist, da8a31bf, and package/ShengAudioAbi.h, 9ef36987, are byte-identical to the donor's, and scripts/build-sheng-audio-hal.py is the donor builder with its TARGET argument removed, which pins arm64-apple-ios17.0. So the board-specific part of the OS half is only which seed carries the bundle and which trust cache names its CDHash - and the seed CI builds the donor commit it pins (68940017) rather than this copy, because that is the tree it can fetch today, so the trust entry is read from that build's own trust.json and bundle and CDHash cannot come apart."]
procedure = ["Follow the shared guide for the ADSP and audio path before writing board code; the closure presence of the audio kexts is not an implementation.", "Survey before loader, in the order power.md section 2 sets it: read what the boot stages left, write nothing, and let that decide whether a PIL-TZ load sequence is needed at all.", "Before a constant is taken from another board's kit, diff the compatible string first - pas_loader and pil-tz are different hardware paths and their addresses are not interchangeable."]
findings = [
  "GLINK identity, not the DSP, is what kept apr_audio_svc down. Our own OPEN_ACK carried our number in the field the peer uses to find the channel, and a repeated OPEN reset a live channel. The vendor rule, now written at the branch points of package/QcomGlink.c: qcom_glink_rx_open() finds a channel by name and only there does rcid get assigned, from the peer's OPEN (:321-338); qcom_glink_send_open_ack() keys the ACK on channel->rcid and the peer resolves it in its own lcids, so an ACK confirms an open and never reveals a number (:340-349, and the local-initiated ack goes out from progress() at :196-201 once both halves are known); both ends therefore have to send OPEN. Each branch counts itself now (QcomGlink.h:53-54 lcid, rcid, open_sent, open_acked, remote_open, ack_sent, up and :75-77 unmatched, last_unmatched_cid, last_unmatched_cmd), so a channel that stays down names the command that matched nothing instead of only a refusal count.",
  "package/ShengAudioService.cpp sat in the tree named by nothing: DbyAudio.cpp:39-43 externs its static initialiser, its start routine and its two ring entry points, but no builder compiled it, so the second kernel pass died on three undefined symbols. It is now compiled and archived the way the donor kit does the same file (its scripts/build-gop-legacy-display.py compiles it, objcopies it and lists it in the archive): __DATA,__mod_init_func is removed and __GLOBAL__sub_I_ShengAudioService.cpp is globalised, because publishService() at DbyAudio.cpp:431-438 registers those two classes by name between OSMetaClass::preModLoad and postModLoad, and registering them from the initialiser section as well is the duplicate-OSMetaClass panic this board has already paid for.",
  "The classification knob has two measured positions and its third candidate is now closed by enumeration rather than by taste. Answering kAudioDeviceTransportTypeBuiltIn is the only built-in lever the AudioServerPlugIn API gives a plug-in: across the five headers a HAL bundle can include (AudioServerPlugIn.h and, through it, CoreAudioTypes.h and AudioHardwareBase.h, plus AudioHardwareDeprecated.h and AudioHardwarePropertyData.h) the only Port-spelled names are kAudioStreamTerminalTypeDisplayPort and kAudioDeviceTransportTypeDisplayPort, so the Apple port descriptions the donor record points at (docs/devices/sheng.md:461) belong to the DriverKit side and a plug-in cannot reach them; the AudioTransportManager that would vend end points is an AudioPlugIn subclass whose CreateDevice and DestroyDevice return kAudioHardwareUnsupportedOperationError in the donor file and in this repository's copy alike (hal/ShengAudioPlugIn.c:129-130), and Apple declares no TransportManager plug-in type UUID -- the bundle's CFPlugInType is kAudioServerPlugInTypeUUID -- so that branch is unimplemented, not a verified road to built-in. The device-level spelling of the volume fails the same test from the other side: volm, vold, vdb#, v2db and db2v are declared only in AudioHardware.h:1248-1252, the client header AudioServerPlugIn.h does not include (its CoreAudio includes are CoreAudioTypes.h and AudioHardwareBase.h, :110-111), and AudioHardware.h:994-1022 documents each of them as implemented by an AudioVolumeControl subclass -- the object this plug-in already vends through the device control list. Answering them on the device would mean pulling the client API into a server-side bundle to duplicate an answer the server already knows how to reach, and the curve declaration that goes with them, 'lctf' and 'vctf' (AudioHardwareDeprecated.h:115 and :505), is not asked of this plug-in on any boot, so neither is added. What is left is the one knob that is: hal/ShengAudioPlugIn.c answers kAudioDeviceTransportTypeBuiltIn again, the value the sheng plug-in it descends from ships.",
  "The transport question is closed by the official source rather than by our own ranking, because it was reopened twice. The UniXNU sheng plug-in this one descends from answers kAudioDeviceTransportTypeThunderbolt at hal/ShengAudioPlugIn.c:279 (introduced by 08cde20), and its comment at :276-278 states the alternatives and why they are not reachable from a bundle: built-in devices are used only through Apple's port descriptions and a USB device must carry a USB location the HAL does not take from a plug-in (i529). That same file carries exactly one volume path -- an AudioVolumeControl object, set at :170-182 and read at :353-369, with no device-scope volume family -- so the official delivery is this transport plus this control, and this board matches it. Our own two boots rank identically: on Thunderbolt the audio server wrote the volume (os=1000 want=0 sets=0 at boot, then os=225 want=3 sets=1, sets=1 played=3653632 late=0, 1000 to 225 milli); on built-in it streamed and never moved the gain (ord203: opens=1, played=1429504, late=0, holes=0, volume_sets=0). Two things follow, and both are now settled rather than argued: the display label of an external-looking device is what the official mechanism costs, and the device-scope volume spelling (volm, vold, vdb#, v2db, db2v) stays out -- it was implemented this cycle, then reverted, because those selectors belong to the control object the server already reaches and the official file does not answer them at all. The built-in classification is not a knob this plug-in can win, so anything that trades the volume for the label is a regression, not a fix.",
  "The built-in experiment of ord198 was judged on half an instrument, and the other half is now printed. The unknown-property ring the plug-in writes on the shared control page records only calls that reached this plug-in and were refused; the audio server's own failing calls (kind 4, against any object) and VirtualAudio's C++ throws (kind 8, with an image offset in place of the selector) are recorded in a second ring on the same page -- package/ShengAudioAbi.h:81-86, SHENG_AUDIO_TRACE_OFFSET 2560, SHENG_AUDIO_TRACE_SLOTS 128, two words per entry, deduplicated by selector and info word -- and no kernel code had ever read it, so every boot discarded the one record that could say what the server did instead of setting the volume. package/DbyAudio.cpp grew traceRow(), called from paceFired() beside serviceRow() and unknownRow(): one [apr] tr= row per unread entry with the fourcc or offset spelled twice (letters for a property, hex for a symbol address), the object, the scope character, the kind and whether the call failed, with kind 0 skipped because a refused read already gets its unk= row and an answered read says nothing. The info word is packed by the plug-in as object in the top byte, the first byte of the scope under it, the kind in the low half and the failure in bit 1, which none of the kinds it uses occupies, so the decode masks 0xfffe rather than clearing bit 1 of the whole word. With that the next built-in boot names the layer instead of only the refusal count: kind 1 rows are writes reaching the control, kind 4 rows are the server failing to talk to something else, kind 8 rows are the routing layer throwing.",
  "The plug-in ships out of this repository and the ABI between the two halves is proved, not asserted: the macOS Data-seed workflow takes sheng_repository with a pinned sheng_commit as its plug-in source and hard-gates on shasum -a 256 kit/package/ShengAudioAbi.h = 9ef369877cfae3d2255129f7fdf332448b71300a0fc840d6522ec83e09754b52, which is byte-for-byte this repository's copy, so the kernel service and the user-space bundle cannot disagree about the control page or the two sample rings. The seed the board boots is that workflow's data-audio.dbr, grown from a recorded base, so the volume UUID F26D17C8-45E7-4C47-9AD9-A2A8C208E44A that configs/dby_w09_defconfig pins as CONFIG_XNU_OWNER_DATA_VOLUME_UUID survives and a plug-in change stays payload-only (kern_exec.c:7993 looks the seed up by that string; a mismatch is the offline scratch Data mount failed: 2 screen).",
  "The host checks call cc literally (scripts/check-adsp-host.py:15), and with Debian's gcc as cc every one of them fails in the compile rather than in a check; they pass when cc resolves to clang. Measured both ways on 2026-11-08.","Carrying the donor's audio providers in the prelink roots is required for the closure to relocate correctly; it says nothing about audio working on kona.", "Audio is out of scope while the system cannot be operated: the panel and one input event come first.",
  "The amplifier silicon on this unit is TFA9874 in all four slots, read off hardware on 2026-11-06 rather than guessed from the three-BOM DTBO set: [pa] set=tfa9874 ... alive=0xf id=0x00000c74,0x00000c74,0x00000c74,0x00000c74 rc=0,0,0,0, then 42 registers pushed per slot and [pa] done set=tfa9874 invert=0 transfers=180 errors=8. The aw88262 branch returned rc=2 (ADDR_NACK) on all four slots on both invert settings, and those 8 refusals are exactly the errors=8 that the done row counts, so the counter reconciles and the tree is a TI/NXP part, not an AW one. st= on those rows is the GeniI2c controller error_status (0x40000409 on every row, including the successful set), not codec state -- reading it as device status is how a healthy bus looks broken. What still blocks audible sound is upstream of the PA, and the missing input is now located rather than declared absent: this unit's own whole-machine readback D:\\Windows\\Android\\华为\\matepad11\\QCTool_ParReadback_2026.03.18_21.43.31.196\\images\\modem.img (197132288 B, md5 704ead969fd17d23bf2b309254263fe9, raw FAT16) carries /image/adsp.mdt plus adsp.b00..b18 - 22 files, 15061894 bytes - and /verinfo/ver_info.txt names the build ADSP.HT.5.3-00618-SM8250-1.63882.3 (2024-08-30 08:40:52, asic), while dsp.img (raw ext4, volume dsp) holds the /adsp runtime libraries rather than the executable; a working copy is at D:\\Linux\\stock\\adsp_unit\\. Saying earlier that the board had no adsp.mbn anywhere was an absence claim made without enumerating D:\\Windows, and fastboot fetch is refused here (Device does not support fetch command), so the readback is the only route to that input. What is missing is the AP side - and the way that was worded here before was an absence claim that did not enumerate the trees, so it is withdrawn: upstream does carry XNU subsystem-loader implementations. /home/wqsqw/upstream/sheng/package/ has AdspProbe.cpp (688 lines), AudioProbe.cpp, AdspFirmware.c, ShengGpr.c/h, ShengAdsp.h, ShengAudioReach.c/h and ShengAudioService.cpp plus QcomGlink.c, QcomMdt.c, QcomSmem.c and QcomSmp2p.c, with hal/ShengAudio.driver, the xnu patch zzyd-sheng-audio-addon-mount.patch and three host checks (check-adsp-host.py, check-gpr-host.py, check-audioreach-host.py); /home/wqsqw/upstream/alioth/package/ carries the same ADSP set minus the AudioReach/service half, and core/docs/porting/power.md section 2 documents the tiers - sheng-adsp=1 surveys what the boot stages left and writes nothing, =2 starts the DSP and brings up GLINK - while section 3 gives the audio layer order (ShengGpr, ShengAudioReach, AudioProbe, the codec, the service, the HAL plug-in). Neither of those boards is this one: both are SM8550 PAS (kAdspBase 0x9ea00000, compatible qcom,sm8550-adsp-pas, SMEM 0x81d00000, RPMh ARC proxy rails lcx/lmx, MIAM mailbox at 0xc300000), whereas this tablet's own kona.dtsi:4386 declares qcom,lpass@17300000 as qcom,pil-tz-generic with pas-id 1, smem-id 423, sysmon-id 1, ssctl-instance-id 0x14, firmware-name adsp, memory-region pil_adsp_mem = 0x8a100000 + 0x1d00000 (no-map), proxy rails L11A (vdd_cx) and L4A (vdd_mx) both at RPMH_REGULATOR_LEVEL_TURBO over RPMH_CXO_CLK, proxy-timeout-ms 10000, mboxes <&qmp_aop 0> named adsp-pil, inputs <&pdc 6> plus adsp_smp2p_in 0/2/1/3 and one smem-state (force-stop) on adsp_smp2p_out. Copying either kit's constants onto a PIL-TZ board would be invention, so the kit supplies the method and this machine's own Android source supplies the numbers - and the two do meet in the places that matter: the SMEM item ids coincide (kona-smp2p.dtsi:9 gives qcom,smem = <443>, <429> for the SMP2P items and qcom,smem-id = <423> for the subsystem failure reason, the same three numbers sheng hard-codes), and the decode formats are generation-independent - the partition table sits in SMEM's last 4 KiB (smem.c:1055) with magic $TOC, version 1 and 48-byte entries; a partition header is 32 bytes with magic $PRT; a private item is a 16-byte header carrying the 0xa5a5 canary, with next = here + 16 + padding_hdr + size; the SMP2P item is a $SMP header plus sixteen name/value pairs (smp2p.c:66-88); and cmd-db is version, magic {db,30,03,0c}, then 16-byte rsc_hdr slots (cmd-db.c:53-98). f2-payload-175 ships power.md's first tier - the survey, not the loader - inside package/DbySmartPA.cpp under the dby-pa argument that is already shipped, rather than as a new boot argument: the command line sits at 998 of the 1000-byte gate and no functional argument was going to be deleted to host a survey. It maps SMEM 0x80900000+0x200000, cmd-db 0x80860000+0x20000 and the 16 KiB head of pil_adsp_mem 0x8a100000, decodes the SMEM header, the partition table and exactly the two partitions qcom_smem_get() would consult (the host-0-with-host-2 peer partition and the 0xfffe/0xfffe global one), reads items 443, 429 and 423 including the failure-reason string, and counts non-zero words in the PIL region. It writes nothing: no window is written, no rail is voted, no clock is touched. Two windows are left alone on purpose, and that is a decision rather than an oversight - LPASS CSR 0x17300000 is pil-tz's own register block and no source in this tree says a read with the ADSP unpowered cannot hang the bus, so a working boot is not a price worth paying for one more number; and IPCC 0x408000 has no register semantics in this kernel's source, so a read back would be raw data with no vendor meaning. The rows settle next round's fork by themselves: an all-zero PIL region with no SMP2P item means the boot stages left no ADSP running and the work is subsys-pil-tz.c's load sequence plus the RPMh proxy votes, while a loaded region and live SMP2P bits mean the loader can be skipped and the audio reach layer can start against a DSP that is already up.",
  "The volume slider cannot reach anything until an audio server plug-in exists in user space, and the official carrier for one is the Data seed, not the boot image. The donor ships its HAL the way core ships its Metal plug-in: a directory inside the writable container that the kernel union-mounts over a system path (docs/zh/porting/gpu.md:95-99 with scripts/add-gpu-plugin-data.py). It is one of the four mounts in kern_exec.c's boot-time addon block, gated by the boot argument sheng-gpu-addon=1 at kern_exec.c:7649, and the gate is entered with no addon blob at all because native_gpu_addon_install() returns at its first step without a blob (:7405-7407, the NGPUADD2 check would only be at :7410) while the four native_gpu_addon_mount() calls run regardless -- so the blob route (scripts/make-gpu-addon.py, Payloads/kernel.macho.gpuaddon) is not needed and the loader is not touched. Audio is the fourth mount: window 0xa00, source /private/var/ngpu/audio, point /System/Library/Audio/Plug-Ins/HAL, and the union is only accepted after comparing BuiltinAudioPlugin.driver against ShengAudio.driver/Info.plist; its counters are native_gpu_addon4_stage and native_gpu_addon4_status, and the BootProgress A row now prints them as mount4=stage/status (the two weak symbols are defined in package/BootProgressStubs.c so the archive links before the kernel carries them). What else the same gate buys is part of the decision, not a side note: that region of kern_exec.c also runs native_cryptex_os_view (the /private/preboot union plus the /System and /usr binds, reported as [cryptex os]), native_gestalt_cache_drop and native_ls_store_drop, so turning on the audio mount also rebuilds the launchservices store once. The argument took the slot left by boot-ui-focus=launchd, which BootProcessProbe.c:105 does not need because launchd already sits in slot 0 of its own default table; measured after the swap, 49 arguments and 992 of the 1000 bytes core/scripts/unixnu/payload.py:35 allows.",
  "Staging a plug-in into an existing seed keeps the volume UUID and so costs no kernel rebuild (docs/guide/userdata.md), but this board has no growable seed left: the macOS seed workflow keeps artifacts for one day, so the next seed is a fresh fixture, and scripts/prepare-owner-data-fixture.py takes no volume-uuid option -- a fresh fixture means a new UUID, which the kernel pins as CONFIG_XNU_OWNER_DATA_VOLUME_UUID (configs/dby_w09_defconfig, copied into build/xnu/owner-data-volume.h by scripts/build-xnu-4k-baseline.sh and looked up by that exact string at kern_exec.c:7993, where a miss is the panic offline scratch Data mount failed: 2). That coupling, not preference, fixes the order of this round: cloud seed first, then its UUID into the defconfig with ./unixnu defconfig re-run, then the kernel, then the payload -- and the plug-in CDHash into the owner trust cache in the same payload, because an ad hoc bundle the cache does not name is refused before the audio server ever loads it, which would read back as a working mount and no device.",
  "ord206 measured the pump and the audio server on two different clocks: at the plug-in's first client write its out_written stood at 4426164 frames while the ladder had issued 3727360, so 14.6 s -- ten turns of a 1.37 s ring -- had been cleared unread, and the distance kept growing while a stream was stopped. package/DbyAudio.cpp now derives the read position from out_written minus the 300 ms lead the control page itself publishes (kRingLagFrames), re-locks ringBase whenever the skew exceeds half a ring, and prints the phase as resync= and gap=.",
  "A pace timer alone cannot feed the ASM: four 1024-frame regions at 48 kHz hold 85 ms of sound and the tick is 100 ms, so 15 % of every round is missing by construction. ord207 measured exactly that ratio -- plug-in cursor 218112 frames against 184320 issued, 0.845. The refill now fires on the write-done event the way the vendor feeder does (q6asm-dai.c:186-212), behind a wall-clock cap the vendor does not need: issued frames may not run more than the four regions in flight past (mach_absolute_time() - playAt) / (ticks_per_frame_q32 >> 32), 400 host ticks per frame here.",
  "The silence was one bit. apr_audio-v2.h:7214 spells the flags field of ASM_DATA_CMD_WRITE_V2 as bit 31 = 1 for a valid timestamp and 0 for an invalid one, and both drivers write a session-less PCM stream as the caller's NO_TIMESTAMP (0xFF00) -- q6asm.c:9693-9699 in this SoC's own tree, mainline q6asm.c:1216-1219 in the same branch -- which the encoder emits as 0x0000FF00. Eight rounds sent 0x80000000 with the timestamp left at zero, so the ADSP believed every buffer was due at 0 us and returned each one unrung: that is ord208's 44x write-done rate, and it was never a starved pump. package/ShengApr.h now names the value APR_ASM_NO_TIMESTAMP and apr_asm_write() sets bit 31 only for a caller that really supplies a timestamp; payload-ord209.img is audible from the built-in speaker and the slider follows it.",
  "A rising counter is not evidence until its increment condition is quoted. derr= grew one per write-done event and read as a failing link, but asm_data_event_write_done_v2 (apr_audio-v2.h:7351, opcode ASM_DATA_EVENT_WRITE_DONE_V2 0x00010D99) carries buffer address low word, buffer address high word, mem_map_handle and status -- the status at payload+12 -- while package/ShengApr.c read payload+4, which is the high word this driver always sets to 1 through kSidTag. The count measured my offset, not the DSP, and the next round moves it.",
]
completion = ["A playback path is established and audible on hardware."]
limits = ["The DSP loader is not the gap: package/AdspProbe.cpp is 696 lines and carries the AP side itself - the QCOM_SCM_SVC_PIL calls at :275, QCOM_SCM_PAS_MEM_SETUP at :337, qcom_mdt_parse, qcom_mdt_metadata and qcom_mdt_place at :322, :332 and :351, the RPMh proxy votes under its own header at :233, the AOSS load_state adsp message at :566 and the SMP2P and GLINK bring-up - and build-gop-legacy-display.py:232-233 archives the protocol cores with it (QcomMdt, FatVolume, QcomQrtr, ShengQrtr, QcomSmem, QcomSmp2p, QcomGlink, QcomQmp, QcomRpmh, ShengGpr, ShengAudioReach, ShengCs35l43, ShengApr). The survey-versus-loader fork this entry used to describe is therefore closed. What is genuinely missing: no hardware readout of native_adsp_stats is recorded in this repository, so the loader has repo evidence as compiled code but not as a measured stage; the SM8550 codec half is deliberately out of the link (package/AudioProbe.cpp votes another machine's GCC registers and TLMM pins), so ShengCs35l43.c is archived yet is not this unit's amplifier either; and the AFE, ADM and ASM ladder in package/DbyAudio.cpp has no accepted audible result. What is not missing is the firmware input - adsp.mdt plus adsp.b00..b18 are read off this unit's modem.img and inventoried above.", "Nothing beyond the TFA9874 INIT_CHIP tables is written to any codec, and the survey tier writes nothing at all; LPASS CSR and IPCC are unread by decision, not by omission."]
next_action = ["Read the stage ladder the loader already publishes - native_adsp_stats[0] names the step that failed when negative - together with the DbyAudio ladder rows, then carry the sample path the rest of the way: the ASM and AFE/PRI-TDM open that no board result has confirmed yet.",
  "Flash the staged seed with the kernel rebuilt for its UUID and the trust cache that names the plug-in CDHash, then read mount4=stage/status on the A row and move the slider: non-zero means the union took and the audio server saw a second HAL, while silence past that point is the ASM and PRI TDM playback half, not the mount."]
