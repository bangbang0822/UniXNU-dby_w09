inputs = ["The board's radio, identified on 2026-11-20 from this unit's own device tree and vendor image and recorded in the `wireless` area: Qualcomm QCA6390 on PCIe0, with Bluetooth inside the same part. This area keeps the console, row-composer and job-suppression scope; it no longer carries its own radio inventory.", "A device log path exists: package/BootLog.c composes its rows over the QcomXnuUsbDebug CDC console, and that is how every hardware row since 2026-11-04 was read."]
configuration = ["No network component is selected; com.apple.iokit.IOSlowAdaptiveClockingFamily and friends are in the prelink roots only as closure dependencies.", "launchd jobs that need the modem or Bluetooth are suppressed by sheng-disable-jobs rather than started and failed."]
procedure = ["Read the bring-up order first: a console or log path that survives a panic makes every later subsystem cheaper, so the USB debug console is the step before Wi-Fi."]
findings = ["Disabling identityservicesd, locationd, CommCenter and bluetoothd is a bring-up measure to keep noisy subsystems out of the boot, not a statement that they work.", "The absence of any host-visible log is what makes each iteration cost a physical flash and a photograph.",
  "The `A` row of `package/BootLog.c` - a file this area owns the paths for - is wider and carries two more mount pairs: `char row[120]` became `char row[200]`, and `mount4=stage/status mount5=stage/status` were appended after `mount3=`, with the comment naming what each pair stands for (the audio HAL plug-in and the flashlight plug-in overlay) and what each stage of the ladder means. Fixing the row also fixes the claim attached to it: `mount4=` was recorded as printed before it was, and `checks=93 pass=93 fail=0` after the change says the row width cost nothing else.",
  "2026-11-20: this area's two inputs used to read 'SM8250 Wi-Fi/BT combo plus the modem subsystem, both requiring firmware blobs this port does not carry' and 'No serial or USB console is wired in XNU, so device observations come from the panel'. Both were written from the SoC family rather than from the unit, and both are now false: the radio is a Qualcomm QCA6390 on PCIe0 (recorded in the `wireless` area with the device-tree and vendor-image rows behind it), and the console that this area called missing has been carrying the boot rows since 2026-11-04. The correction is written here as well as in the new area because a reader who started at this area would have planned the wrong bring-up; this area keeps only its own row-composer and job-suppression scope.",]
completion = ["An interface is enumerated, associates and obtains an address on hardware."]
limits = ["No iPadOS network interface, association or traffic has been demonstrated. The `wireless` area has identified QCA6390 at PCIe0 17cb:1101, trained the link, read the modem and Bluetooth firmware volumes, and reached a BHI rejection; it has not reached MHI mission mode or an ath11k MAC."]
next_action = ["Wait for the `wireless` area to prove firmware mission mode and MAC operation, then qualify the iPadOS 17 ifnet and Apple80211 path and record scan, association, DHCP and traffic separately."]
