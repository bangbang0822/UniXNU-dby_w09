inputs = ["LPDDR5 whose size is a per-unit input rather than a board constant: this model ships with 6 or 8 GiB, and the tested unit has 6 GiB (dram_size 0x180000000 in [payload]).", "DarwinBoot contiguous window selected by [payload.adt] owned_memory_size.", "Persistent Data overlay pages held by the RAM block device."]
configuration = ["[payload.adt] owned_memory_size = 0x100000000: the value the same-SoC official board uses. Without it DarwinBoot falls back to its 256 MiB window and XNU sees only 256 MiB.", "The ADT generator writes the reserved-memory nodes that the stock bootloader expects, including the splash region."]
procedure = ["Build the payload, boot and read the memory checkpoints from the panic or diagnostic page.", "Compare the reported free pages against the window size before concluding a memory shortage."]
findings = [
  "The image measured on hardware on 2026-11-05 is payload `09c3aad671332eee4b0771e3592196d06e2b32a3f167164c1f20722f0934910f` (218,103,808 bytes) over prelinked kernel candidate `a6382e526e02747b952f45fd4878d194e4796cfa2ead0b6932da87078006b707` (125,677,568 bytes); those are the numbers the 4 GiB register window and the tested unit's dram reg in board.toml were sized against, so any window or seed change restates both.", "The window size was the first silent limit: the kernel booted, then user space stalled with a memory-shaped failure while 3.7 GiB of the declared RAM was simply unavailable to it.", "Free-page counts printed by a panic are the decisive measurement; an allocation failure that survives a rebuild with more free memory is a different bug, not a size problem.", "A sparse Data container is what makes an 8 GiB seed usable: the firmware reads the initrd as one whole File->Read(), so a dense container stalls the loader.", "DRAM is not a board constant on this model: units ship with 6 or 8 GiB, so dram_size 0x180000000 and the device tree memory node both record the tested 6 GiB unit, and another unit re-measures that pair rather than reusing it."]
completion = ["The kernel reports the intended DRAM size and the payload's window reaches user space."]
limits = ["The 6 GiB figure is the tested unit's, taken from the product specification of that variant; a SMEM RAM table read-out has not been recorded.", "DRAM size is not fixed on this model, so a unit of the other variant needs dram_size and the device tree memory node re-recorded together before the payload is built."]
