  "The sibling QCA6390 ports: `UniXNU-alioth` (same SoC and chip; `docs/wifi-qca6390-board.md` is the resource sheet, `package/alioth_pcie.c` the step ladder) and `gts7xlwifi` (same SoC, chip and OS build, with WiFi and Bluetooth working)."]

configuration = ["No component is selected and no boot argument exists: nothing in this tree touches PCIe, MHI, ath11k or a Bluetooth transport yet.", "The board DTS enables CPU, memory, UFS and its PHY only; it has no wlan or bluetooth node, so MobileGestalt has nothing to answer for either radio (`dts/dby_w09.dts`).", "The kernel arguments were re-measured after this area's own argument went in, by the payload builder's rule (`check_args`: the arguments joined by single spaces must not exceed 1000): the number is re-measured rather than carried: 56 arguments and 994 bytes with 6 free at 2026-11-20 22:40 (997 with 3 free when the argument first went in; a sibling round swapped dby-ti=1 for smp=1 the same evening). The `dby-pcie=1` probe itself costs 11 of it. An earlier draft of this field said 55 and 986 with 14 free, which was the line before that argument."]

procedure = ["Read this area's findings and the available wireless research notes before touching anything; the chip and the bus are settled at the source level and only two questions remain (device ID 1101 versus 1103, and the Bluetooth transport).", "Run experiment 1 first because it does not write the tablet: EDL read of the `firmware` partition (and `oeminfo` and `dtbo`) with `python3 edl.py r <partition> <file>` after `edl.py printgpt`, then look for `image/qca6390/` with m3.bin, amss20.bin, a board file and regdb.bin.", "Only then add code, and only in the alioth order: read-only register probe, controller power/clock/reset, GPIO20/GPIO79, link training, DBI ID, BAR0, SMMU bypass, MHI. One variable per flash, payload flashes only until a stage passes."]

findings = [
  "The chip is a Qualcomm QCA6390 and the bus is PCIe0. The device's own device tree declares `qcom,cnss-qca6390@b0000000` as a child of `pcie0_rp` (alias `wlan`), the vendor image carries the CNSS wireless stack, and Bluetooth is inside the same part (the `btfmslim` BT-audio codec alias is `/soc/slim@3ac0000/qca6390`). The question this record deliberately left open - whether Huawei fitted its own Hi110x instead - is answered by the device and not by the SoC family, with one residual doubt recorded rather than dropped: no `hi110*` file, firmware, kernel driver or device-tree node exists on this unit, but strings over `lib64/hw/vendor.huawei.hardware.fm@1.0-impl.so` in the same vendor image find the bare token `hi110x`, which is Huawei's FM-radio HAL knowing a HiSilicon tuner (its `fmhal_service` is declared disabled in init.huawei.wcnss.rc, and a converged vendor image for several kona products would carry the other branch anyway). So the record says the WiFi and Bluetooth radios are QCA6390; it does not say no HiSilicon silicon of any kind exists.",
  "The bus is not SDIO and not USB: the device tree's only SD host (`sdhci@8804000`, alias sdhc2) is `status = \"disabled\"` (the decompiled device tree at /root/dby-full.dts:4030-4054), the endpoint is `pcie0_rp/cnss_pci` with SID 0x1c01, and the USB controller this port already runs is the DWC3 console. What XNU needs is therefore not `IOPCIDevice` enumeration: the precedent (gts7xlwifi, same OS build) drives the controller from board code and speaks Apple80211 from its own ifnet, which is a contract this board can implement.",
  "The iOS side is matched by node name, not by chip: AppleOLYHAL wants a `wlan` node and AppleBluetooth wants a `bluetooth` node, both exported into /arm-io. gts7xlwifi's `dts/gts7xlwifi.dts` is the working example (`wlan { compatible = \"qcom,qca6390\"; unixnu,adt-name = \"wlan\"; }`, `bluetooth { device_type = \"bluetooth\"; ... }`), and its record states that enabling them without a driver behind them makes wifid start against a nonexistent interface - so they are scaffolding for a driver, never a result.",
  "The minimum viable iOS provider is a BSD ifnet with the Apple80211 ioctl ABI, not an IO80211Family kext: gts7xlwifi answers `SIOCSA80211`/`SIOCGA80211` (0x802869c8 / 0xc02869c9) on an Ethernet ifnet, posts `KEV_VENDOR_APPLE` class 6 subclass 1 events (scan-done, association-done, link/ssid/bssid-changed, plus the 0xB8-byte LQM payload event 39 the framework refuses to shorten), sets IFF_RUNNING with `KEV_DL_LINK_ON`, and taps BPF because the stack does not copy frames to the filter for a KPI interface - without which `IPConfiguration`'s router check never completes.",
  "What the userspace side costs: the supplicant has to be a launchd job, which means a modified `/System/Library/xpc` launchd cache in the addon and Sandbox exec plus AMFI launch-constraint exemptions for the exact owner-trusted paths (gts7xlwifi `patches/xnu/t970-wifi-service-mount.patch`). This is the part that looks like an OS-integrity change and is instead the price of running any non-Apple network service on 21H461.",
  "Upstream, this is a solved problem on this SoC, at two levels. The full native chain is device-verified on zizhan (QCA6490, 17cb:1103): Linux ath11k on the Ath12kWifi shim, firmware to station ready, scan of 42 channels and 15 networks, WPA2 with key install, DHCP, DNS and HTTPS 200 with reconnect, native Settings join, and its stated limits are polled operation and unqualified roaming. gts7xlwifi (Samsung SM-T970, kona, QCA6390, the same 21H461) has the same shape with the same chip this board carries: PCIe0 link at 13-15 ms with endpoint 17cb:1101, BHI firmware to mission mode, QRTR and WLFW, then scan, the 856-byte 21H461 join request, WPA2, DHCP, DNS, TCP and the WiFi icon - but no signal bars. So the route is not speculative and the port work is the board-specific third of it: GPIO/rail/power sequence, a firmware inventory this unit has never had, and the network layer.",
  "The catalog cannot supply either radio. Ath12kWifi is ath12k (WCN7850/QCC2072/QCN9274) and this is an ath11k part, which is why alioth, zizhan and gts7xlwifi each carry their own copy; there is no ath11k, QCA6390 or QCA6490 entry in components.toml. The Bluetooth half does have a component - QcaBluetooth, Qualcomm BT over GENI UART for Apple's stack, verified on sheng - and Bluetooth is device-verified there (pairing, reconnect, A2DP), which is the one part of this area a selection could cover rather than an import.",
  "Route B (a USB network adapter) has no precedent in this ecosystem and cannot give WiFi: no board record uses a host-mode USB NIC, the nearest network result is sm-t733's device-mode CDC-ECM interface for LLDB (its own record says Wi-Fi transport is pending), and an Ethernet-like ifnet leaves Settings and wifid with nothing 802.11 to show. It is a debugging convenience at most, and the record says so before a flash is spent on it.",
  "Nothing is implemented, and the two facts that could still change the plan are unmeasured: the DBI vendor/device ID (17cb:1101 versus 17cb:1103, because the vendor image carries configs for QCA6390 and QCA6490 alike) and the Bluetooth HCI transport. For the second, the DT enables exactly one 4-wire GENI UART (SE0 at 0x980000, GPIO28-31, wake line GPIO31) and leaves the reference BT port (SE6 at 0x998000) disabled, while the same vendor image also ships an Airoha GNSS stack - so the UART is either BT or GNSS and must be measured, not assumed.",
  "Two upstream traps are recorded here rather than rediscovered: SMMU S2CR type bits are 0 = translate and 1 = bypass, and alioth's first bypass was silently a translate to an unconfigured context bank, so the write has to be read back; and alioth's MHI power-up completed and then the CPU stopped inside the SBL load (console frozen at ~13 s, watchdog reset), which is the same stage gts7xlwifi only passed after cache maintenance fixed a PBL error - and gts7xlwifi then superseded the bypass-first model with a private stage-1 bank because bypass hung its board at the first DMA access.",
  "There is no IO80211Family kext and no IOBluetoothFamily kext in 21H461: a decode of the kernelcache's __PRELINK_INFO lists 238 kexts and none of them is IO80211* or IOBluetooth*, and the image's six IO80211 strings are bare class names in the KPI stub block at the head of __PRELINK_TEXT (IO80211APIUserClient and the AppleBCMWLANSkywalkInterface land inside Sandbox.kext, i.e. they are sandbox rule names). The donor's own device tree shows what the stack expects instead, and it is a Broadcom part: /arm-io/uart2/wlan compatible wlan-pcie-uart,bcm4355 and /arm-io/apcie/pci-bridge2/wlan compatible wlan-pcie,bcm4355 (one per AppleOLYHAL personality), and /arm-io/uart3/bluetooth compatible bluetooth,n88 with transport-speed 3000000 and transport-encoding 3. So the Apple-stack route would mean impersonating a BCM4355 behind AppleOLYHAL's DriverKit dext, which is why it is not the recommendation.",
  "The last mile to Settings and the status bar is a fixed, public contract rather than a research problem, and it has three parts that must all be present: classes literally named IO80211Controller and IO80211Interface (configd and wifid open the driver by IOKit class name and Sandbox refuses iokit-open-service without a grant, so the board also needs the iokit-open grant patch); a complete Apple80211 handler including the 856-byte 21H461 association layout, the XML plist sets wifid pushes in (IO80211InterfaceIPConfigurationBusy, IPV6Params, AppState, HeartBeat, RoamParams, WifidEnumeratedInfra, ExternelPowerState, BSP_CommandParams, refusal = errno 102) and the kAuthType numbering (lower 1, upper 8 = WPA2-PSK, or wifid polls forever); and the APPLE80211_M_RSSI_CHANGED event 39 with its 0xB8-byte LQM payload, because KEV_DL_LINK_ON alone yields zero signal bars - exactly the symptom gts7xlwifi recorded before it posted that event.",
  "Bluetooth is smaller than WiFi on this OS and its shape is now known: the kernel side is only com.apple.driver.AppleBluetooth (BTReset, a 2,040-byte reset/power stub matching a node named bluetooth), the HCI channel is the kern-control socket com.apple.uart.sk.bluetooth built from AppleOnboardSerial's com.apple.uart.sk.%s and opened by BlueTool and bluetoothd, and MobileGestalt reports Bluetooth only when it sees a non-zero 6-byte controller address (local-mac-address or /chosen/mac-address-bluetooth0). So the port needs a UART transport, the node, and a MAC - not a Bluetooth driver stack.",
  "2026-11-20, M1 implemented and built (docs/wireless-research-2026-11-24.md): `package/DbyPcie.cpp` plus `scripts/build-dby-pcie.py`, one `-Wl,-force_load` line in configs/dby_w09_defconfig, one weak call site in package/BootProgress.c at now>=26, and `dby-pcie=1` on the command line (11 bytes; the line is now 56 arguments and 997 bytes against the 1000-byte gate, so 3 bytes are free). The kernel links and the archive reports its four exports (`dby_pcie_probe` T, the three globals S); the payload is c547ec8f from kernel 8b131b10 (an earlier build of the same stage was e6737e11 from 2fec1d36, superseded by the review fixes below). It has NOT run on the tablet, and it writes nothing when it does: GCC and the three TLMM tiles are read as always-on domains, PARF and ELBI only after GCC_PCIE_0_GDSCR bit 31 says the controller is powered, and the DBI identification registers only after ELBI reports XMLH_LINK_UP.",
  "The independent review of M1 returned FAIL on five points, all documentation or failure-path class, and all five are fixed rather than argued: the TLMM map-failure path returned without unmapping the tiles it had already mapped (the same defect the GPU probe's own finding records), the boot-argument figure in this area's configuration field was the pre-M1 55/986 instead of 56/997, board.toml carried the older 981/55/19 in a nearby comment, the spec's row grammar listed field names the code does not print (`xmlh_up`, `dbi_id`, `step`) and claimed GPIO80/81 were read when M1 reads only 20 and 79, and the page mirror was exactly eight rows full so a ninth row would have been dropped silently - it is twelve now. The review also confirmed what mattered most: no read precedes the power gate, the absent/zero argument path does no MMIO at all, and no display or touch source is touched by this change. The re-review then returned PASS on all five points, with one residual it found outside them - the stage-acceptance table's M1 row still named `dbi_id=` and `xmlh_up` - folded in as well. The kernel and payload were rebuilt after these fixes: kernel.macho 8b131b10f1617cab77811b7b07f6335f0d239bff41064381d16ab30d2ef428d9, payload c547ec8f, still 56 arguments and 997 bytes.",
  "The first attempt at that build failed in the linker with `ld: file not found: .../build/dbypcie/libDbyPcie.a`, and the cause is a step this repository has now paid for once: a new archive needs BOTH the recipe in `board.toml [kernel] archives` and its path in `CONFIG_XNU_EXTRA_LD_ARCHIVES`. Only the defconfig half was written first, so no recipe produced the archive and the link stopped. A second trap is recorded beside it: `unixnu tree` has to run after a new `scripts/` recipe appears, because the build runs `tree/scripts/build-*.py` and the board package lands in `tree/kits/dby_w09/` - the recipe's own lookup order finds it there, not in `tree/package/`.",
  "Since that review round the argument line moved again: a sibling round swapped dby-ti=1 for smp=1 the same evening, so the line measures 56 / 994 with 6 free instead of 56 / 997 with 3. The rule recorded here is that this number is re-measured with the gate's own rule before every flash and never carried from an earlier round - two sessions share this build tree.",
  "2026-11-20 22:30, the pulls this round asked for. The board repository is level with gitee: fetching https://gitee.com/uni-xnu-dby-w09/UniXNU-dby_w09 brings nothing new, local HEAD a0a455b being gitee/main. The core checkout is 622 commits behind github.com/UniXNU/UniXNU main (8542980d) and carries 8 local commits on top of gitee origin/main (2366e33); nothing in those 622 makes the wireless plan cheaper, because the catalog still carries exactly two radio components - Ath12kWifi (ath12k: wcn7850, qcc2072, qcn9274) and QcaBluetooth (Qualcomm BT over GENI UART, verified on sheng) - and no ath11k or QCA6390 entry, so the driver stays a board-local import. Two of the 622 commits are directly about the class of failure this area hit: fix(build): validate archive providers and root policy inputs before compilation, and fix(payload): refuse packaging after an incomplete rebuild; the first would have caught the missing board.toml [kernel] archives entry before the linker did. Moving the core to that head is a project of its own (8 local commits to rebase, a patch series and a defconfig to re-resolve), so it is recorded as the pinned-base gap rather than attempted inside a wireless round.",
  "2026-11-20, M2 written as a sheet before any M2 code: docs/wireless-research-2026-11-24.md, and the census widened so the stage has a measured before-state (gcc2 votes/tbu/phyaux/ddrss at 0x52008/0x9000C/0x6F004/0x8D058, resets bcr/phybcr/phycom at 0x6B000/0x6C01C/0x6F000 - still reads only). Every number in the sheet carries its source: the six branch votes and their halt registers from mainline drivers/clk/qcom/gcc-sm8250.c (linux master fetched 2026-11-20, 3,674 lines), the reset map from its gcc_sm8250_resets[], the clear-SW_COLLAPSE-and-poll sequence from package/Sm8250Platform/A650GmuPower.c that this board already runs for the GPU, and the rails from UniXNU-alioth/package/alioth_pcie.c with its verified vote. It also states what M2 must not do: not touch 0x6F000/0x6F00C (alioth removed them from its sequence), never write GDSCR with a value that clears its timing fields, and never read the endpoint before the halt registers acknowledge. The independent review of that round returned PASS, having re-derived the three citations (QcomRpmh.h exports, the A650GmuPower.c clear-and-poll sequence, alioth_pcie.c's rail block), confirmed all seven new offsets lie inside the mapped GCC window, and confirmed the reads-only property the strongest way available: the file contains exactly one store, inside rd(). Its two corrections were applied in the same round - the mirror comment claimed the full path fills eight rows when it now fills ten, and the spec's boot-argument item still said 14 free next to the measured 994 bytes (6 free) - and the kernel rebuilt byte-identical (01cac2e1), which is what a comment-only change should do.",

  "2026-11-20 22:52, M1 on hardware, and the answer is the one that decides M2: the bootloader hands PCIe0 over POWERED DOWN. The rows are [dby-pcie] gcc gdscr=0022f001 clkref=80000000 refgen=00000001, halt 80000000 80000220 80000220 80000000 80000000 80000000, then block gated, parf not read, stage=1 rc=1. Read against alioth's same-SoC record: 0x0022f001 is exactly their collapsed value, the six halt registers are exactly their collapsed shape (slv_axi and mstr_axi carry 0x80000220, the other four bit 31 only), GCC_PCIE_WIFI_CLKREF_EN is off (bit 0 clear) and GCC_PCIE_0_PHY_REFGEN is ALREADY on (0x1) before anything of ours runs - which is alioth's finding too, refgen was never missing. So M2 is not re-voting a running controller: it must bring the block up from reset, rails first. The payload also left the system healthy: the same capture reaches SpringBoard p27 and the [dby-dpu] rows still print, and the packed command line reads len=997 with dby-pcie=1 present.",
  "2026-11-20, the census's tile question was NOT answered on hardware, and the reason is a design error worth recording rather than retrying: the row prints west=00000000/00000000 south=00000000/00000000 north=00000001/00000000 for both GPIO20 and GPIO79, and the verdict is tile wlan_en=none perst=none. Matching the DT's cnss_wlan_en_active programming cannot work at this point in the boot, because that config is what M3 writes - before M3 the pads sit at their reset defaults, and a default CFG (pull-down, function gpio) matches nothing. The three reads do say something: WEST and SOUTH return all-zero CFG/IN for these pin numbers while NORTH returns CFG=0x1 (pull-down, input) for both, so at most one of the three tiles is implemented at these offsets, but which one owns the DT's GPIO20 is still open. The replacement measurement is to read a pin whose configuration is provably applied already - a display or touch pin the driver is using in this same boot - across all three tiles; the tile whose CFG matches that pin's observed configuration is the one M3 must drive. That belongs to M3's build, not to M2's, because M2 writes only GCC and the rails.",

  "2026-11-20 23:10, M2a implemented and built, and it is the first stage of this area that writes. Mechanism: vote the six PCIe0 branches through 0x52008 (0x3f) plus the four single-bit enables (0x6f004, 0x6f02c, 0x8c004, 0x9000c, 0x8d058), read-modify-write GDSCR.SW_COLLAPSE clear at 0x6b004 and poll PWR_ON for up to 2 ms, then - only when the GDSC reports power - release GCC_PCIE_0_BCR and GCC_PCIE_0_PHY_BCR and read them back. The rail vote is deliberately absent: M1 measured the controller as handed over powered down (gdscr=0022f001), and one boot now answers whether the GDSC needs the vendor rail vote or not. If power is refused every one of the six snapshots is written back and the row says so, so the boot ends where it started and M2b has exactly one new variable. Built: kernel.macho 8b58a6a8a947db2a, payload aef32a8b (56 arguments / 994 bytes, dby-pcie=2). Not flashed yet; independent review still pending at the time of writing.",
  "The argument moved from dby-pcie=1 to dby-pcie=2 for that build, and the record says what that costs: from 2 on the probe writes registers, so a build for another area must put the value back to 1 or drop the argument entirely, or that image inherits this write. The same rule was recorded by the display round the same day when it built with dby-dpu=2. board.toml carries the warning next to the argument itself.",

  "The independent review of M2a returned FAIL on five points and every one was fixed rather than argued, including the one that mattered: on the refusal path the six votes were restored but GDSCR itself was not, so SW_COLLAPSE stayed clear and the GDSC kept asking for power on rails nobody voted for the rest of the boot - the exact opposite of the code comment that said the boot ends where it started. GDSCR is now written back from the snapshot. The other four: the post-vote halt registers were never re-read, so §5 M2a verdict (a halt that stays asserted names which leaf is off) could not be read from any row and a m2 halt row now prints them; the mirror comment claimed the rows reach the boot page when package/BootLog.c never walks native_dbypcie_census, so the claim was removed and the gap recorded instead of a follow-up touching a file another work line holds; the file header still described an M1-only probe that never writes and its ROWS list had no m2 rows; and the boot-argument comment contradicted itself, saying the stage writes in one paragraph and is read-only in the one above it. Review also confirmed the parts that matter for safety: read-modify-write on GDSCR, no path that releases 0x6B000/0x6C01C with PWR_ON clear, 0x6F000 only read and 0x6F00C absent, and every wr() call site inside stage2a() so nothing writes below stage 2. Rebuilt after the fixes: kernel.macho e91e645b513b1501..., payload 2c80f27f (56 arguments / 994 bytes, dby-pcie=2). The re-review of the five is pending at the time of writing, and the payload is not flashed.",

  "2026-11-21 12:5x, M2a on hardware and the answer is the good one: PCIe0 powers up from GCC alone, so M2b (the RPMh rail vote) is NOT needed on this board. The rows: m2 before gdscr=0022f001 votes=063c23c0, m2 voted votes=063c23ff (0x3f in), m2 gdsc after=f822f000 pwron=1 waited=0us, m2 resets bcr=00000000 phybcr=00000000 released, then parf sys=2000361c phy=00000900 refclk=00001019 dbi_base=00000000 ltssm=0. Three things that matter: 0xf822f000 is exactly the powered value the same-SoC record carries, so the GDSC came up and PWR_ON was already set on the first read after the SW_COLLAPSE clear (waited=0us); 0x2000361c is exactly alioth's step-8 parf sys_ctrl, so the controller answers and this port's PARF offsets are right; and ltssm=0 with dbi_base=0 is the expected detect-quiet state, because PERST# is still asserted and LTSSM has not been enabled - that is M3. What the row does NOT say is that the PCIe rails are absent: it says the GDSC powered with no vote of ours, so either the bootloader left pm8150_l9/l5 up or the GDSC tolerates them, and the moment a rail could matter is the PHY work in M3.",
  "One defect in that round's own row placement, recorded so it is not read as evidence: the m2 halt row prints after the votes and BEFORE the GDSC write, so its six values are identical to the pre-vote snapshot by construction - a halt ack bit only changes once its branch is both voted and powered. The informative read is after PWR_ON comes up, and that moves in the M3 build; spec §5's M2a wording gets the same correction so an unchanged halt row is not read as a fault.",

  "2026-11-21, the M1 census's tile question is retired and the answer came from source rather than from another boot: mainline drivers/pinctrl/qcom/pinctrl-sm8250.c (fetched from kernel.org, 45,514 bytes) carries the tile of every pin, and all five pads this area drives are NORTH - [20] WLAN_EN and [21] BT_EN at lines 1151-1152, [79] PERST# and [80] CLKREQ with pci_e0 as their first function at 1210-1211, [81] WAKE at 1212. That matches the board's own touch header, which already recorded pinctrl-sm8250.c as the authority for the same question (package/DbyTouch/DbyTouchBoard.h:222-236), and it explains the hardware reading exactly: WEST 0x0 and SOUTH 0x0 for pins 20 and 79 are pins that do not exist in those tiles, while NORTH's 0x1 is a real CFG at its reset default. The matcher that deduced the tile from the pad's CFG is therefore retired - it could never have worked before M3, because the programming it matched against is what M3 writes - and the row now prints the source tile beside the pad state, which is what M3 needs to catch a bad write. The spec's unknown list is down to one: the DBI vendor/device ID.",

  "2026-11-21, M3 implemented and built: the stage that can actually train the link, and the first one that drives a pad. Mechanism, in the vendor order: NORTH-tile GPIO20 written as function-gpio/16 mA/pull-up/output high (WLAN_EN), 1 ms, then GPIO79 as function-gpio/2 mA/pull-down/output high (which releases the active-low PERST#), 1 ms; the 99-write PHY sequence; then PARF 0x1B0 bit 8 (LTSSM) with ELBI bit 10 polled every 100 us up to 100 ms. On link-up it reads DBI 0x00 and 0x80 and BAR0 0x60300224 (TCSR_SOC_HW_VERSION, major in bits 11:8, which ath11k requires to be 2) - that is where the chip's 17cb:1101 versus 17cb:1103 finally comes from. On timeout both pads are driven back to sleep and the row says so, so a boot cannot end with a released reset on an untrained link. Built: kernel.macho ee1737449c7444f5..., payload d4c2ab80 (56 arguments / 994 bytes, dby-pcie=3). Not flashed; the independent review of this stage is pending.",
  "The PHY programming is not typed into the source: package/DbyPciePhySeq.h is generated from this tablet's own device tree (/root/dby-full.dtb decompiled to /root/dby-full.dts, line 8983: qcom,phy-sequence), 99 triples, offsets 0x010..0xCE0 - all inside the single page the tree gives the PHY window - and every third element (the delay) is 0 in this tree, so the table is 99 writes and no waits. The header carries the dtb path, the line and the reason it is generated: one transposed hex digit is a silent PHY misconfiguration no host check would catch. M2a deliberately did not replay it - it only released the resets - which is why the link stayed down there and why this stage exists.",

  "The independent review of M3 returned PASS on the link-training logic (pad constants recomputed from the TLMM layout, the 99-entry PHY table re-parsed against the device tree entry, the LTSSM bit, the ELBI poll and the row budget all confirmed) with four corrections, all on the timeout and skip paths, and all four are now in: the timeout restores PARF 0x1B0 from its snapshot so LTSSM_EN does not outlive the pads; both pads' CFG are restored, not just GPIO20's, so 'pads low' is true for both; a stage>=3 boot whose GDSCR is gated now prints 'm3 skipped, block gated' instead of nothing; and the pad write itself was made glitch-free and verified - level first, then CFG with output-enable, then a read-back compared under a 0x3FF mask of the fields this code owns (func, drive, pull, OE), with a mismatch naming the pin and aborting with the endpoint held in reset. That last one is the same shape package/DbyTouch/DbyTouch.cpp uses for its pads, and the review was right that a blanket CFG write with OE set first can pulse an active-low PERST#. Rebuilt after the fixes: kernel.macho 890e602ee1aad017..., payload 036e5a5f (56 arguments / 994 bytes, dby-pcie=3). The re-review of the four is pending at the time of writing, and nothing of M3 has run on hardware yet.",

  "Three non-blocking gaps the M3 re-review left, recorded so the next round starts from them rather than rediscovering them: (1) stage3a's contract comment still lists only 0/3/-1 and not the -7 that a pad read-back mismatch returns; (2) the caller folds every m3 < 0 into rc -6, so the census rc cannot tell a window that did not map from a pad that refused its programming - only the console row distinguishes them, which is accepted for now because the row is the evidence channel anyway; (3) on the GPIO20 mismatch abort the endpoint is only implicitly in reset (the pad write for GPIO79 never happened, so nothing drove its level), unlike the pad79 path which explicitly re-drives both - whether that is safe depends on those pads' reset defaults, which no source in this tree states. None of the three changes behaviour on a boot where the pads accept their programming, which is the case M3 exists to find out.",

  "2026-11-21, M3 on hardware: the pads and the PHY work, the link does NOT come up, and the rows say exactly where it stops. m3 pads gpio20=000003c3/00000003 gpio79=00000201/00000003 - both CFG read back the values that were written and both IN registers read 0x3, i.e. input high and output driven high, so WLAN_EN is on and PERST# is released; m3 phy count=99 first=840:03 last=844:03 - the sequence ran; m3 ltssm 0->107 elbi=00007001 up=0 waited=100000us - the LTSSM enable bit took (0x100) and the ELBI state field (bits 17:12) reads 7, but bit 10 XMLH_LINK_UP never sets. After the timeout restored the pads and the enable, parf reads ltssm=5 and elbi=00005001, so the state machine keeps moving between 5 and 7: the link is TRAINING INTO CONFIG and not completing, which is a different place from 'nothing happened'. The boot stayed healthy (DbyTouch rows climb through pub=4736, no panic), and the payload is 036e5a5f from kernel 890e602e.",
  "What M3 is missing is now a short, sourced list, and all three items come from the same-SoC record rather than from guesswork: (1) the delay between WLAN_EN and PERST# release - the device tree's qcom,ep-latency = <10> means 10 ms and M3 waited 1 ms; alioth's finding is explicit that the DT's ep-latency had to be honoured before PERST release for its link to train; (2) the PARF initialisation block, of which the loudest is dbi_base at 0x350, which reads 0 on this boot because nothing wrote it - alioth writes it (2.7.0 layout) before touching DBI; (3) the seven DWC GEN3 training words the vendor writes after PERST release and before LTSSM (DWC_GEN3_SPCIE_CAP 0x154, DWC_DEVICE_CONTROL_STTS 0x78, DWC_GEN3_GEN2_CTRL 0x80c, DWC_GEN3_RELATED 0x890, DWC_GEN3_EQ_CONTROL 0x8a8, DWC_GEN3_MISC_CONTROL 0x8bc, DWC_CORE_PRESET 0x55555555), which are alioth's own pci-msm constants and are what a DWC core needs to negotiate a Gen3 link. M3b is those three in that order - not another attempt at the same thing.",
  "2026-11-21, M3b written and built from the M3 measurement rather than from another guess: the link stopped in LTSSM state 7 with dbi_base reading 0, so this round adds exactly the three things the same-SoC record shows were missing. (1) The device tree's qcom,ep-latency = <10> ms is now honoured between WLAN_EN and PERST# release (M3 waited 1 ms). (2) The controller init block from UniXNU-alioth's hardware-validated step 10 is ported: assert then release GCC_PCIE_0_BCR, PARF device type 4, PHY refgen RCG 0x105/root-enable 0x2 for 100 MHz, phy_ctrl bit 0 out, phy_refclk bit 12 out, pm_ctrl bit 5 out, dbi_base 0x350 = 0 with a read-back, sys_ctrl bits 6|1 in and bit 29 out, slv_addr_space_size 0x358 = 0x4000000 (the DT's own value), mhi_clock_reset bit 4 in, axi_mstr_wr_addr_halt bit 31 in, and every PARF interrupt masked and cleared. (3) The vendor's seven DBI GEN3 training words are written after PERST# release and before LTSSM, and the poll now requires all three of ELBI bit 10, DBI 0x80 bit 29 and a DBI ID that is neither 0 nor 0xffffffff - pci-msm's own three checks, where M3 accepted ELBI alone. Built: kernel.macho 73653d9432c4f00b..., payload 37174d9f (56 arguments / 994 bytes, dby-pcie=3). Not flashed; the review of this rewrite is pending.",
  "The review of that rewrite returned FAIL and one of the five findings was the kind that would have cost a flash and possibly the boot: the PHY reference generator's RCG registers (0x6F018 = 0x105 and 0x6F014 = 0x2) are GCC registers but were being stored through the 4 KB PARF PHY mapping - an out-of-window MMIO write roughly 0x6F018 bytes past it. They now go through the GCC window and the constants are renamed kGccRefgen*, so the window cannot be re-confused. The other four: the DBI block is now gated on the dbi_base read-back (non-zero means the DBI window is unaimed, so the stage prints that, drives WLAN_EN back low and returns 4 instead of writing training words into nothing); the link poll reads ELBI first and only touches DBI 0x80/0x00 inside the link-up branch, which is what this file's own guard demanded; the extra GCC_PCIE_0_BCR assert/release was dropped because stage2a had already released it and the sibling record's init does not re-toggle it; and the early GCC unmap that made the exit lists disagree was removed. Rebuilt after the fixes: kernel.macho a6e958977e37f9d1..., payload 4e585672 (56 arguments / 994 bytes, dby-pcie=3). The re-review is pending and nothing of M3b has run on hardware.",
  "2026-11-21 13:3x, M3b on hardware and the PCIe0 link trains: this tablet's endpoint answered for the first time. The rows: m3 wlan_en high, ep-latency 10000us waited; m3 parf dev=4 sys=0000365e refclk=00000019 dbi_base=00000000 slv=04000000; m3 phy count=99; m3 pads gpio20=000003c3/00000003 gpio79=00000201/00000003; m3 dbi gen2=00020190 eq=04000060 misc=00000000 devctl=00105810; m3 ltssm 0->111 elbi=00011401 dll=b0120008 id=010b17cb up=1 waited=10100us; m3 dbi id=010b17cb dllla=1 bar0_soc_hw=ffffffff major=15; stage=3 rc=0. ELBI 0x11401 is bit-for-bit the value the same-SoC record reports for its own successful link, and it came up after 10.1 ms, which is the ep-latency the device tree asks for. So the three changes of M3b are what the link needed: the 10 ms wait between WLAN_EN and PERST#, the controller init block (dbi_base 0x350 held its zero, slv_addr_space 0x04000000 took, sys_ctrl read back 0x365e), and the vendor's seven DBI GEN3 training words before LTSSM. M3 without them stopped in state 7 with ELBI 0x7001.",
  "Two readings from that success that must not be over-read, recorded so the next stage is aimed correctly. (1) The DBI ID reads 0x010b17cb, i.e. vendor 0x17cb (Qualcomm, as expected) with device id 0x010b - and that is exactly what the same-SoC record reports at this point too ('endpoint 17cb:10b'). 0x010b is what the DWC core's own configuration space reports before the outbound window is aimed, so this is NOT evidence against the QCA6390 and NOT the 17cb:1101 that ath11k will match; the real device id arrives when M4 programs the iATU outbound window and reads the endpoint's own config space. (2) bar0_soc_hw=ffffffff with major=15 is the same fact from the other side: BAR0 at 0x60300000 is not reachable yet because the outbound window was never programmed, so the all-ones is an unaimed read rather than a dead endpoint - M4 is the step that makes TCSR_SOC_HW_VERSION readable and its major field has to be 2.",
  "2026-11-21, M4 implemented and built: the translator stage. It programs iATU region 0 as a MEM outbound window covering BAR0 (0x60300000 + 1 MiB) and region 1 as a CFG0 region that turns the conf window (0x60100000) into the endpoint's configuration space for bus 1 device 0 function 0, both in the qcom order (disable, write the four addresses, re-type, enable), then reads what only a real endpoint answers: vendor/device at 0x00, class/revision at 0x08, and BAR0's TCSR_SOC_HW_VERSION at 0x224 whose major field must be 2. It also prints what region 0 held before it wrote anything. The verdict is rc 0 only when the vendor id reads 0x17cb. Built: kernel.macho 62a24903858b3119..., payload 9be6157f (56 arguments / 994 bytes, dby-pcie=4). Not flashed; review pending. Everything M4 can prove is bounded by what M3b already showed: the link is up, so a failure here is the translator or the CFG0 encoding, not the link.",
  "The review of M4 returned FAIL on nine points and they mattered more than the previous rounds': the stage could not have produced a real vendor id in any configuration. Three were structural. (1) The iATU LIMIT is the region's last address, so 0x603FFFFF and 0x60100FFF, not size-1 - with LIMIT below BASE the region matches nothing and the first read after programming is an unmatched outbound access, i.e. the same all-ones shape M3b measured, which would have been read as 'the endpoint does not answer'. (2) A region is disabled through CTRL2 bit 31, not by zeroing CTRL1: the first draft left both regions enabled while rewriting their addresses, which is exactly the state the same-SoC record names as reading back all ones. (3) The root complex's own type-0 header was never programmed - DBI 0x04 and 0x18 with 0x8BC bit 0 around them - and without it the translator has nothing to translate however the windows are set. The rest: region 1 had no read-back so a failed CFG0 region was silent; the CFG0 read is now gated on both enable bits; the endpoint's own command/BAR0 are read and, if needed, written (BAR0 = 0x60300000, memory|master) before BAR0 is dereferenced; the BDF field was 1<<20 (the device field, i.e. bus 0 device 2) and is now 1<<24; plus two stale prose claims. Two more were found here before the review landed and are also in: PARF_ATU_BASE_ADDR/HI must name the iATU window (mainline qcom_pcie_configure_dbi_atu_base, pcie-qcom.c:446-459) and none of this boot had written it, and a config read is only issued when ELBI reports link-up (the rule mainline states in dw_pcie_rd_conf and this file already applies to DBI). Rebuilt after the fixes: kernel.macho 4d36c58c816e0a58..., payload 309db13f (56 arguments / 994 bytes, dby-pcie=4). The re-review of the nine is pending and nothing of M4 has run on hardware.",
  "2026-11-21 14:0x, M4 on hardware: the link came up again in the same boot (m3 ltssm 0->111 elbi=00011401 up=1 waited=9900us), and the translator stage failed in a way that names its own cause - every field of the window the device tree calls iatu read 0xffffffff, before programming and after: m4 atu r0 ctrl1=ffffffff ctrl2=ffffffff base=ffffffff limit=ffffffff, same for the MEM and CFG0 read-backs, and then m4 ep cmd=ffff bar0=ffffffff id=ffffffff with stage=4 rc=5. The DBI window is fine in the same boot, which is what makes this a layout fact rather than a power or link problem: m4 rc hdr cmd=00100007 busn=00ff0100 shows the root complex's own header took the write (0x7 = io|mem|bus-master, 0x00ff0100 = primary 0 / secondary 1 / subordinate 0xff) and read back.",
  "The cause is in the same-SoC record and I had read past it: UniXNU-alioth/package/alioth_pcie.c:1086 states that 'dm_core and iatu both hang on their first access', and its step_config probes the translator at DBI+0x900 - the viewport layout inside the core's own 4 KB - instead of the unrolled block at 0x60001000. So this board answers the viewport layout and not the unrolled one, and M4 now does what alioth does: read DBI+0x900 as the probe, program a region each way, keep whichever reads back, and say which one answered (m4 atu layout vp=n unrolled=n). The rest of M4 stands unchanged: LIMIT is the region's last address in both layouts, CTRL2 = 0 disables before the addresses are rewritten, the RC header is written with 0x18 keeping its top byte, and the endpoint's command and BAR0 are set before BAR0 is dereferenced. Rebuilt: kernel.macho d96f119b6d5b26ca..., payload 3b94818e (56 arguments / 994 bytes, dby-pcie=4). Not flashed - the tablet is back in iPadOS with the previous M4 image.",
  "The M4 failure on hardware (every iATU field 0xffffffff while DBI in the same boot read and wrote correctly) has two candidate explanations and M4b tests both in one boot instead of guessing. Mainline's own layout test reads IATU_VIEWPORT through DBI (drivers/pci/controller/dwc/pcie-designware.c:942) and treats 0xffffffff as 'unrolled', which points at the device tree's iatu window; but this board returns 0xffffffff from that window too, so the vendor test alone does not decide it. The second candidate is the PARF DBI/ATU base pair: mainline's qcom_pcie_configure_dbi_atu_base() (pcie-qcom.c:440-465) writes DBI_BASE_ADDR_V2/_HI with the DBI's physical address and SLV_ADDR_SPACE_SIZE_V2/_HI with 0x80000000, while this boot has only ever written 0x350 = 0 because that is what the same-SoC record found made ELBI work. So stage4a now tries, in order, the viewport layout, the unrolled layout, and - only if both read back wrong - re-points those four PARF registers the way mainline does and retries both, restoring the previous values if it still fails. The row says which attempt answered (m4 atu layout vp=n unrolled=n, then m4 atu retry layout vp=n unrolled=n). Built: kernel.macho fa8472330084cc09..., payload 072276b6 (56 arguments / 994 bytes, dby-pcie=4). Not flashed: the tablet is in iPadOS.",
  "2026-11-21 14:1x, M4 SUCCESS, and it settles the chip identity from hardware instead of from the device tree's compatible string: [dby-pcie] m4 cfg id=110117cb class=02800001 soc_hw=400a0200 major=2, stage=4 rc=0. That is vendor 0x17cb (Qualcomm) device 0x1101 - a QCA6390, the ath11k hw2.0 part - with class 0x0280 (network controller, other), exactly the pair the same-SoC record reports for its own endpoint. BAR0's TCSR_SOC_HW_VERSION reads 0x400a0200 and its major field is 2, which is ath11k's hard requirement. The endpoint had memory and bus master disabled (m4 ep cmd=0000->0006), and BAR0 read back 0x60300004 after being written 0x60300000 - bit 2 is the 64-bit BAR indicator, not an error.",
  "The cause of the previous round's wall of 0xffffffff is now measured, and it is not either of the two explanations M4b was built to test - it is the third thing M4b added as a fallback. The probe read 0xffffffff from both the viewport register at DBI+0x900 and the unrolled block at 0x60001000, so neither layout answered while PARF_DBI_BASE_ADDR_V2 (0x350) held 0. Writing the pair the way mainline's qcom_pcie_configure_dbi_atu_base() does - DBI_BASE_ADDR_V2 = 0x60000000 (the DBI's physical address) and SLV_ADDR_SPACE_SIZE_V2_HI = 0x80000000 - made the UNROLLED block answer immediately (m4 atu retry dbi_base=60000000 slv=00000000/80000000, then m4 atu retry layout vp=0 unrolled=1), and the two regions then read back as programmed (base=60300000 limit=603fffff, base=60100000 limit=60100fff). So the same-SoC record's choice of 0x350 = 0 is enough for ELBI and the link but not enough for the translator on this board: that divergence is the finding worth carrying, because 0x350 = 0 is exactly what M3b wrote and it looked correct (it read back 0).",
  "2026-11-21, M5 implemented and built: the endpoint's SMMU stream and the DMA arena the MHI rings will come out of. It does not hand-write the mapping - it reuses package/SmmuBypass.h, the planner the audio and touch paths already run, and that is the point: that header records the fact a hand-written copy would get wrong on this firmware (a TYPE=BYPASS S2CR reads back as FAULT, so the stream is pointed at the last context bank - which the firmware leaves in S1_TRANS_S2_BYPASS - with S2CR TYPE=TRANSLATE, S2CR written before SMR). stage5a allocates a 32 MiB physically contiguous IOBufferMemoryDescriptor the same way package/DbyAudio.cpp does, maps the applications SMMU at 0x15000000 + 0x100000 (the size the touch and audio paths map), plans stream 0x1c01 - the device tree's requester 0x100 at qcom,smmu-sid-base 0x1c00 - and applies the plan, then prints slot/bank/smr/s2cr plus the S2CR type field so 'the write landed' is a reading and not an assumption. The row also carries the arena's physical address and size, which is what M6 needs next. Built: kernel.macho 6f2f523cf7813bdd..., payload abfc898c (56 arguments / 994 bytes, dby-pcie=5). Not flashed - the tablet is in iPadOS - and the review of this stage is pending.",
  "The review of M5 returned FAIL on seven points and all seven are fixed: the boot-argument block header still said =4 while the argument was =5; package/SmmuBypass.h's consumer list still named three consumers and now names the wireless probe as the fourth (that header is shared with the audio area, so the change is a one-line comment and the record says so); M5 had no 'm5 skipped' row when the translator stage failed, unlike M3; the stream row and the gSmmu* latches were taken even when smmu_configure_bypass() returned an error, which is the shape of evidence this project has been burned by, so they are now gated on error==0 while the failure branch prints the raw slot/bank/smr/s2cr; a failed prepare() left the arena descriptor armed in a static that gDone can never revisit, so it is released and cleared; the row mirror was 30 and could silently drop the stage verdict, so it is 40 and row() prints one 'census full, page mirror stopped' line when it overflows; and SID 0x1c01 finally has its provenance written where it is used (/root/dby-full.dts:8968-8969: qcom,smmu-sid-base 0x1c00 and the iommu-map entry mapping requester 0x100 to 0x1c01), with the note that this repository's own dts has no iommu-map yet.",
  "2026-11-21, M6a added in the same build: a read-only census of the endpoint's MHI register block through the outbound memory window M4 programmed - reglen at 0x00, BHIOFF 0x28, BHIEOFF 0x2c, MHI_CTRL 0x38, MHI_STATUS 0x48, with the state and execution-environment fields decoded from bits 15:8 and READY/SYSERR reported. The offsets are cited to the working same-chip port (rui12366B/UniXNU-gts7xlwifi package/MhiBoot.h:15-29) rather than derived here, and the stage writes nothing: a device that has never been given firmware should read state PBL with READY clear, and that baseline is what M6b has to move. It returns 7 when the block does not look like MHI (length zero, all ones or above one page, or SYSERR set) instead of pretending the census succeeded. Built together with the M5 fixes: kernel.macho 9bcbbf2a78c600bb..., payload fe3cc534 (56 arguments / 994 bytes, dby-pcie=5). Neither stage has run on hardware yet.",
  "2026-11-21 14:2x, M5 on hardware and it passes: [dby-pcie] m5 arena pa=e5e44000 size=33554432, then m5 smmu sid=1c01 slot=7 bank=73 smr=80001c01 s2cr=00000049 t=0, stage=5 rc=0. Three things are worth reading off that row. The arena is real and physically contiguous - 32 MiB at 0xe5e44000, the size the same-SoC record settled on - so M6 has somewhere to put the MHI rings. The stream landed in slot 7, which is also the slot the same-SoC record's own endpoint used, with SMR 0x80001c01 (VALID plus SID 0x1c01) and an S2CR whose type field is 0 = TRANSLATE, which is the correct shape on this firmware precisely because the bypass lives in the context bank (bank 73, the last one) rather than in the S2CR - a TYPE=BYPASS S2CR would have read back as FAULT. And the planner's own bank test passed, so this is not a write that was merely issued.",
  "2026-11-21 14:3x, M6a on hardware and the baseline is exactly what a device that has never been given firmware should read: [dby-pcie] m6 mhi reglen=00000100 bhi=00000100 bhie=00000224 ctrl=00000000 sts=00000000, then m6 mhi state=0 ee=0 ready=0 syserr=0, stage=6 rc=0. Decoded: the endpoint's MHI register block is 0x100 bytes, its BHI registers start at BAR0+0x100 and the BHIe block at +0x224, the execution environment is 0 = PBL (the ROM bootloader, i.e. the state a firmware download has to move away from), READY is clear and there is no SYSERR. So the whole chain below the firmware now works and is measured on this tablet: power and clocks (M2a), link training (M3b), the address translator and the endpoint's own configuration space (M4, 17cb:1101), the SMMU stream and a 32 MiB contiguous arena (M5), and the MHI register block in PBL (M6a). What remains is the firmware itself: amss, m3 and a board file, which this unit has never had read off it.",
  "One process mistake worth recording because it cost a capture: two console captures were left running at once and the second could not open COM20 at all - Windows reports Access is denied, and the rows that mattered had already been written into the first capture's log. tools/catch-console.ps1 holds the port for its whole -Minutes window, so the rule is one capture at a time and kill the previous one before starting the next.",
  "2026-11-21, M7a written and built (a way to learn the firmware inventory without EDL): the board already carries a read-only FAT reader and the two ShengUfs hooks package/AdspFirmware.c uses to take the ADSP image out of a partition in place, so stage7a mounts the firmware partition, walks the root and /image and prints the 8.3 names it finds - read-only, no install, no copy, nothing written to any volume. That answers the one input M6b is missing: which qca6390 blobs this tablet actually ships and where. FatVolume opens files rather than listing directories, so the walker is written in the probe, with the FAT16 fixed root and FAT32 root-cluster cases, the 0x00 end / 0xE5 deleted / LFN 0x0F / label 0x08 handling it needs. Built: kernel.macho e4f25bb228cc086b..., payload 9ca79d4f (56 arguments / 994 bytes, dby-pcie=7). Not flashed.",
  "The review of M7a returned FAIL on two blocking bugs that would have made the whole stage dead code, and both were the same mistake: the ShengUfs hooks are truthy-on-success (native_ufs_part_find returns 1 when the partition exists, native_ufs_part_read returns 1 when the read worked - the opposite of this file's own 0-is-success convention), and the probe tested both the wrong way round. As written it would always have printed 'no firmware partition by any known name', or mounted nothing after a successful read. The declaration comment now states the polarity, which is what was missing. Four more, all real: the walker did not fence its reads against the partition (FatVolume's own check only covers files it opened), did not validate a FAT32 root cluster against the volume's cluster count, could spin on a cluster full of deleted or long-name entries because its only counter counted emitted names, and did not reject a chain that points at itself; and the row mirror was 40 rows when stage 7 adds up to twelve. All fixed, and the comment that claimed 'never loops' now describes what the code does instead.",
  "2026-11-21 15:0x, M7a on hardware, and its answer is a negative one that matters: [dby-pcie] m7 part=modem lun=4 first=1286 blocks=48128, then m7 fat mount failed rc=-2, stage=8 rc=8. Read literally: this tablet has NO partition named firmware, firmware_a or firmware_b - the only name out of the four tried that answered was modem, on LUN 4 - and that volume is not FAT (rc -2 is FatNotFat), so the vendor's qca6390 blobs are not where the sibling board keeps them and the port still cannot name them. Two things follow. First, the earlier plan of 'read image/qca6390 out of the firmware partition' is disproved for this unit rather than untested. Second, the partition *names* are now the only unknown left before M6b, so the next stage reads the GPT itself rather than guessing names; that is M7b, built in the same round (native_ufs_abs_read, two 4 KiB blocks, EFI PART signature, entry array, UTF-16LE names, read-only) and waiting for a flash as dby-pcie=9.",
  "Worth recording as a process point too: the flash that produced these rows only worked once usbipd attach, the product check, the flash and the reboot were issued as one command. Run separately - attach in one call, flash in the next - the attachment does not survive the device's re-enumeration and fastboot waits forever with no output, which looks exactly like a hang. The console capture then shows the previous boot, and the obvious conclusion ('the probe did not run') is the wrong one.",
  "2026-11-21 15:3x, a defect of the probe's own making, found by reading the rows of the =8 boot rather than by any tool: M6b never ran. Every later stage was gated on native_dbypcie_rc == 0, so M7a's honest rc=8 (no firmware partition by that name) deleted the firmware-download stage from the boot - the console shows m7 rows and then stage=8 rc=8 with no m6b row at all. That is the same shape of mistake as the census row-cap and the skipped-row gaps: a gate that is cheap to write and silently removes evidence. The dispatch now takes one busOk snapshot right after M5 (the chain that everything later genuinely needs) and every later stage runs on that, records its own verdict, and only fills the final rc if it is still zero - so M6a, M7a, M7b and M6b can each fail without hiding the others. Rebuilt: kernel.macho 1615a360e71cea18..., payload 86369fe6 (56 arguments / 994 bytes, dby-pcie=9), archived at /root/payloads/86369fe6.img. Not flashed.",
  "2026-11-21 15:5x, M7b on hardware and the partition table answers: [dby-pcie] m7b gpt entries_lba=2 num=64 size=128, then part 0 ssd, 1 persist, 2 nvme, 3 misc, 4 bsp_info, 5 reserved1, 6 oeminfo, 7 bootfail_info, 8 rrecord, 9 cache, 10 frp, 11 log, stage=9 rc=8. Two things follow, and the second is the interesting one. First, the reader itself is right: the header was found at 4096-byte block 1 with entries_lba counted the way the driver counts them, which is what the two unit bugs would have broken. Second, the twelve names printed are only the first twelve of sixty-four, and this unit's firmware partition is not among them - while M7a found a partition called modem on LUN 4, which means the name is either past entry 11 on LUN 0 or on a DIFFERENT LUN's table, because native_ufs_abs_read is LUN 0 only and native_ufs_part_find scans LUNs 0..5. The twelve-name cap was the reason this boot could not settle it, so M7b now prints the whole table packed into rows (64 names, eight-ish per row) instead of one row per entry.",
  "M6b ran for the first time in this boot and said exactly what the evidence predicts: m6b firmware volume does not mount - it looks for a volume named firmware/firmware_a/firmware_b/modem and the only one that exists (modem, LUN 4) is not FAT. So the gating fix did what it was for: the stage that matters for the mission reached hardware and reported its own verdict instead of being deleted by the listing's failure. Next build: kernel.macho da18720015d3515e..., payload cb7d2e2b (56 arguments / 994 bytes, dby-pcie=9), archived at /root/payloads/cb7d2e2b.img, carrying the full-table listing.",
  "2026-11-21 16:2x, the whole partition table of this unit, read off the device through the probe (LUN 0..7, 4096-byte blocks, header at block 1): LUN 0 has 64 entries - ssd, persist, nvme, misc, bsp_info, reserved1, oeminfo, bootfail_info, rrecord, cache, frp, log, reserved3, eng_system, eng_vendor, erecovery and its three companions, recovery and its companions, ramdisk, five vbmeta partitions, patch, kpatch, metadata, reserved2, fw_ufsdev, preas, preavs, super, version, preload, userdata; LUN 1 has xbl and xbl_config; LUN 2 reserved4; LUN 3 ALIGN_TO_128K_1, cdt, ddr; LUN 4 has 23 - aop, tz, hyp, modem, bluetooth, abl, dsp, keymaster, boot, devcfg, qupfw, vbmeta, dtbo, uefisecapp, featenabler, devinfo, dip, apdp, limits, rawdump, storsec, uefivarstore, secdata; LUN 5 has ALIGN_TO_128K_2, modemst1, modemst2, fsg, fsc. There is NO partition named firmware anywhere, which retires the whole 'read image/qca6390 out of the firmware partition' line of work for this unit for good.",
  "Where the firmware is not, checked on the host rather than assumed: /root/dby-zap/vendor.img is an erofs image (962 MB; debugfs cannot read it, dump.erofs can), and inside it /firmware holds only CAMERA_ICP.elf, a650_gmu.bin, a650_sqe.fw, a650_zap.{b00,b01,b02,elf,mdt}, ipa_fws.{b00..b04,elf,mdt}, ipa_uc.{b00,b01,b02,elf,mdt} and ufs_emer_fw.bin - GPU, IPA and UFS firmware, nothing radio; /firmware/wlan/qca_cld holds one file, WCNSS_qcom_cfg.ini; /firmware_mnt is an EMPTY directory; and a scan of the whole image for amss*.bin, m3.bin and imgs/*.bin finds nothing. The board data does ship, but in the vendor tree's /etc/wifi: bdwlan.bin plus seven per-board variants (dby_lx9, dby_ddr_lx9, dby_fem_lx9, dby_fem_5g_lx9, dby_fem_vi_lx9, bindby_*), marxd_w09_bdwlan.bin, WCNSS_qcom_cfg_qca6390.ini/_qca6490.ini and the qca6390/qca6490 directories. So the executable images (amss/m3) are in neither the vendor image nor any OTA artefact on this host: they were supposed to be in the firmware partition this unit does not have.",
  "The next probe answers the remaining question - whether some existing partition is a container we can read - by classifying every partition's first block: F for a FAT boot sector (MSWIN or the FAT tag at offset 82), e for the ext4 magic at 1080, M for a Qualcomm MBN header (0xD1DC), ? for none, printed after each name. bluetooth and modem on LUN 4 are the two candidates that matter, and if neither classifies then the only remaining route is the publisher's own firmware package, which this host does not have. Built: kernel.macho 5ca7c9cbf10d16b8..., payload d59fd22a (dby-pcie=9), archived.",
  "2026-11-21 16:3x, and it CORRECTS an earlier conclusion of mine rather than adding to it: the modem partition IS a FAT volume - it was our reader that refused it. The classifier added to M7b, which reads each partition's first block and tags it F (FAT boot sector), e (ext4 magic), M (MBN header) or ? (none), printed 3=modemF and 4=bluetoothF on LUN 4, with dspe, patche, metadatae, loge and persiste as ext4, preloadF as FAT, and everything else unrecognised. So the earlier row 'm7 fat mount failed rc=-2' did not mean 'not FAT': rc -2 is FatNotFat from package/FatVolume.h, which is a FAT12-refusing reader with a 4085-cluster minimum written for the ADSP image, and these two containers are small. The lesson is the same one this probe keeps teaching - a library's refusal is not a property of the disk, and the row should never have been read as one.",
  "M7d therefore reads the two volumes the way their own geometry says: parse the BPB from the partition's boot sector, compute the FAT12/FAT16 fixed root-directory region ((reserved + fats * fat_sectors) * bytes_per_sector), and walk 32-byte entries directly - no mount, no allocation table, no writes, with the entry's GPT name checked against the one the stage meant before anything is read. That listing is what decides the next branch: if bluetooth carries AMSS20.BIN/M3.BIN (plausible, since the same QCA6390 part carries both radios) then M6b reads the SBL from there and the download path is complete; if it carries only BT firmware, the WiFi images are absent from this unit and the only remaining source is the publisher's firmware package, which this host does not have. Built: kernel.macho 819cd98097316a99..., payload 12c020eb (dby-pcie=9), archived at /root/payloads/12c020eb.img.",
  "2026-11-21 17:0x, both FAT volumes list, and the structure is now known: modem (LUN 4 entry 3, first block 1286, root at byte 110592, 512 root entries, 16 KiB clusters) holds /image with 366 entries and /verinfo with one; bluetooth (entry 4, first block 49414, root at 28672) holds /image with 10 entries. The modem image is the familiar Qualcomm split set - JSN, XML, MBN, BRD, FW and runs of .B00..B20 with a .MDT at the head of each - plus a subdirectory inside /image, and the bluetooth image is six .BIN and two .TLV files with two more .BIN. Two corrections of my own work came out of this run: the BPB read bps=4096 (a 4Kn FAT volume, legal, and my 512-only guard had refused both partitions), and the files' real names are long names whose 0x0F entries I was skipping, so the listing showed PCAFUI~2/AUL5K3~2-style short names until the assembly was added - which is why the root now reads '/image /verinfo' and the subdirectory still read 'EPUZJI~2.B00'.",
  "The listing was then rewritten as one recursive walker rather than two ad-hoc loops: long names assembled at every level, two levels of descent (root -> /image -> the subdirectory inside it), printing capped at sixteen names per directory with the true count on its own row, the fixed FAT16 root handled as the special case it is, subdirectory chains followed through the 16-bit allocation table with a hop bound and a self-reference check, and everything read-only. That is what will name the files: the decision point for M6b is whether bluetooth/image carries amss20.bin/m3.bin (the same QCA6390 part carries both radios, so it is plausible) or only BT images.",
  "2026-11-21, the FAT walker the probe now runs was exercised off the tablet before trusting it with another flash: a 24 MiB FAT16 image was built with mkfs.fat -F 16 -s 4 -S 512, a directory image/ was copied into it with mcopy carrying four files whose names are long names plus one 8.3 name, and a byte-for-byte port of the probe's own offsets was run over the image. It parsed the root, descended into image/ through its cluster and printed 'very-long-name-for-testing.bin' (29 characters, three 0x0F entries assembled in order), 'M3.BIN', 'BDWLAN.BIN', 'AMSS20.BIN' and 'SHORT.BIN' - the names that were written. Two mistakes were in the harness itself rather than the walker (a None-padding character that the C++ stores as NUL, and a child-name prefix that the C++ builds from the parent path), and the harness's final pass/fail line is unreliable for the second reason; what the run does establish is the LFN assembly across multiple entries and the subdirectory descent, which is exactly the part that had never executed on hardware when the last listing printed PCAFUI~2-style names.",
  "2026-11-21 17:4x, the tablet was put into EDL for the first time in this line of work, and it got there: `fastboot oem edl` answered OKAY and the unit came back as 05c6:9008 QUSB_BULK_CID:0412_SN:E3931613 on bus 2-1, which is Sahara. Reading the partition table over it did not complete, and the reason is worth recording because it is not the loader: dmesg showed `qcserial 1-1:1.0: Qualcomm USB modem converter detected` and the interface disappeared into /dev/ttyUSB0, so the kernel driver owned the bulk endpoints and every pyusb transfer timed out (`DeviceClass - [LIB]: Timed out` repeated, then Errno 110). The interface was freed (modprobe -r qcserial, the sysfs unbind, and a modprobe.d blacklist so a re-plug cannot take it again - verified as 'interface free' with no /dev/ttyUSB*), and that alone did not fix the handshake.",
  "With the interface free, `python3 edl.py --loader=/root/loader.elf printgpt` still stops right after 'Device detected :)' and waits forever: that line is printed when the device's Sahara hello has been read, so the stall is at the next step, the ready packet after the tool's hello response. Two candidate causes remain and both need something from outside this host. (1) The Sahara session may be spent: it has been opened and abandoned by six attempts now, and only a device reset back into EDL gives a fresh one - software cannot do it from EDL itself. (2) /root/loader.elf is a 97 KB aarch64 ELF of unknown provenance; a Huawei unit with secure boot needs the vendor-signed programmer, and qdl (installed, 1.0+git20230411) refuses this invocation and is not an alternative without it. Either way the next EDL attempt needs a fresh session, and a Huawei firmware package would supply both the signed prog_firehose loader and the firmware image whose qca6390 blobs this line is after.",
  "2026-11-21 18:0x, the vendor programmer was located and the loader was ruled out as the cause. /mnt/c/Users/HW/Downloads/MatePad11Toolkit_v3.3.1.zip carries assets/img/devprg.elf (697,840 bytes, an aarch64 ELF) and the official assets/tools/fh_loader.exe, so the toolkit for this exact tablet is on the host - the extraction needed python's zipfile rather than unzip because the archive stores Windows backslash paths as literal characters in the member names. Running edl.py with THAT programmer stalls in exactly the same place as with the 97 KB /root/loader.elf: 'Device detected :)' then nothing, even after a detach/attach cycle that left the interface free from the first moment (qcserial blacklisted, no /dev/ttyUSB*). So the loader, the kernel driver and the usbip attachment are all excluded, and what remains is the device's own Sahara state: six attempts have opened and abandoned the session, and software cannot reset it from inside EDL. The next step needs the tablet power-cycled and put back into EDL, after which the same command with /root/loader-dby/devprg.elf is the one to run. Nothing has been written to the device at any point in this EDL work.",
  "2026-11-21 20:4x, THE FIRMWARE IS ON THIS DEVICE, and the path is the one the plan predicted: the recursive walker read the long names inside modem (LUN 4) and printed m7d modem/image/qca6390 with Data.msc, amss20.bin, bdwlan.e01 through bdwlan.e0e among its first sixteen of thirty entries, under /image in the same FAT16 volume whose two subdirectories had only ever shown as PCAFUI~2 and AUL5K3~2. So the earlier conclusions were right about the mechanism and wrong about the location: there is no firmware partition on this unit, and the vendor put the WLAN image inside the modem container instead, which is exactly what the 'modem' name from M7a hinted at before the FatNotFat reading sent this line hunting.",
  "The other listings in the same boot say the rest: modem/image carries 364 entries (adsp split images among them - adspr.jsn, adspua.jsn, cdspr.jsn, adsp.b00 through adsp.b12 - and the qca6390 subdirectory), modem/verinfo one, and bluetooth/image the eight board files this tablet actually uses: dby_ddr_htnv20.bin, dby_fem_htnv20.bin, dby_htnv20.bin, mrr_htnv20.bin, htbtfw10.tlv, htbtfw20.tlv, htnv10.bin and one more - the htnv20 suffix is this board's own naming, which is why the vendor tree's generic bdwlan.bin was never going to be enough. What M6b has to do next is therefore settled to the file: read image/qca6390/amss20.bin out of that FAT16 volume with the probe's own walker (package/FatVolume.h refuses it: 4Kn sectors and under its cluster floor), copy it into the 32 MiB arena M5 allocated, and hand it to the boot host interface.",
  "2026-11-21 20:5x, state of the wireless line, written down because the question 'how far from a working radio' deserves a measurement rather than an impression. PROVEN ON HARDWARE (readings, not code): power and clocks for PCIe0 (GDSC on, no RPMh vote needed); the link trains (ELBI 0x11401, 10.1 ms, DLLLA=1); the address translator works and the endpoint identifies itself as 17cb:1101 with TCSR_SOC_HW_VERSION major 2; the SMMU maps SID 0x1c01 to the last context bank and a 32 MiB physically contiguous arena exists; the MHI register block reads 0x100 bytes with BHI at +0x100 and BHIe at +0x224 and the endpoint sitting in PBL with no SYSERR; the whole GPT of all six LUNs is read and classified; and both FAT16 volumes list with long names, which located the firmware at last: modem/image/qca6390/amss20.bin with Data.msc and bdwlan.e01..e0e, and bluetooth/image with the htnv20 board files. WRITTEN BUT NOT YET RUN: M6c reads amss20.bin out of that volume with the probe's own FAT16 walker, copies it into the arena and hands it to BHI. NOT STARTED, in order: the MHI channel contexts and the BHIe full-image load that take the endpoint to mission mode; QRTR/QMI over MHI, which is what actually asks the firmware for the WLAN MAC and downloads the board data; the WLAN MAC driver itself (rings, copy engines, HAL) which on the same-SoC record is the largest single piece; and the iOS side - IO80211Controller/IO80211Interface by name, the Apple80211 ioctl contract, an ifnet and the kernel-event stream, then a userland supplicant. Bluetooth is further back still: its firmware shipped in bluetooth/image and its transport is not even identified yet, so for BT this line is at the census stage. In one sentence: the bus, the identity and the firmware's location are done and measured, the firmware download is written, and everything from mission mode upward (MHI contexts, QRTR/QMI, the MAC driver, the iOS kext-shaped side) remains.",
  "2026-11-21 21:0x, EDL WORKS and the firmware is on the host. The blocker was the spent Sahara session, not the loader or the driver: after a fresh `fastboot oem edl`, `edl.py --loader=/root/loader-dby/devprg.elf printgpt` detected the device, uploaded the vendor programmer and printed every LUN's GPT - and the offsets agree with the probe's own readings to the byte (modem at 0x506000 = 1286 * 4096, bluetooth at 0xc106000 = 49414 * 4096), which cross-validates the two independent readers. Then `edl.py r modem` dumped the whole 188 MB partition at ~22 MB/s, and mtools confirmed the volume's own structure on the host: root holds image and verinfo exactly as the probe's long names said.",
  "What that copy contains, byte-exact, in /root/dby-edge: modem.img 197,132,288 bytes, bluetooth.img 1,048,576, oeminfo.img 100,663,296; and extracted from modem.img's image/qca6390: amss20.bin 4,352,144 bytes (sha256 2f8feca4f30e4f38...), m3.bin 266,684 (9c1d1853f89911c6...), Data.msc 645,753, and twenty-nine bdwlan.e01..e25 plus bdwlan.elf at 57,932 bytes each - the board data this tablet actually uses. The bluetooth volume's image/ holds the ten files the listing showed, with htbtfw10.tlv 129,964 and htbtfw20.tlv 203,956 being the two HCI firmware payloads. oeminfo is not an erased partition: only 14.9% of it is 0xFF and its first bytes are 0xFF, so the earlier 'oeminfo erased, MAC must be synthesized' note needs revisiting rather than trusting - the strings search over the first 4 KiB found no MAC, but the volume is not uniformly blank.",
  "This changes M6b's options rather than its goal. The probe can already read image/qca6390/m3.bin out of the tablet's own modem volume with its FAT16 walker (that is M6c), which keeps proprietary blobs out of the repository and uses the device's own data - the project's preference. The host copy exists now for two other purposes: it is the byte-exact reference the on-device read can be checked against, and it is what a test harness can serve if a later stage needs to simulate the download without the tablet. Recorded with it: the M6c review's blocker, that M6b must not run after M6c already handed an image to BHI (it overwrote the success verdict and could ring the doorbell twice), and the seven smaller corrections it listed.",
  "2026-11-21 21:1x, the firmware read works on hardware and the download does not, and both halves are informative. The row [dby-pcie] m6c image/qca6390/amss20.bin bytes=4352144 copied=4352144 pa=14a12a000 says the probe read the whole image out of the tablet's own modem volume with its FAT16 walker - byte count exact against the EDL copy on this host - and placed it in the arena M5 allocated. The row that follows says the boot host interface did nothing with it: bhi exec=00000000 status=00000000 ee=0 err=00000000 waited=300000us. Every BHI register reading its reset value, with M6a's earlier census having read MHI_CTRL (0x38) as zero in the same boot, means the MHI block is present but not enabled: the doorbell goes nowhere and the status reads back reset.",
  "M6d is the answer to that reading rather than a guess: it reads MHI_CFG (0x10) and MHI_CTRL, sets the enable bit, delays a millisecond, reads the bit back, prints m6d mhi cfg=... ctrl=...->..., and refuses to hand anything to BHI when the bit did not stick - so the next boot either shows the block coming alive or shows that enabling takes more than this bit, and neither outcome can be mistaken for a download that was attempted. MHI_CTRL 0x38 is from the same-chip reference (/root/MhiBoot.h:19); MHI_CFG 0x10 is assumed, which the review is asked to check. Built with kernel.macho 1783117e6093f5a5..., payload f5aafbc5 (56 arguments / 995 bytes, dby-pcie=10). Not flashed yet: the review comes first this time.",
  "2026-11-21 21:3x, the review of M6d was right and the stage was wrong. The claim it rejected - that MHI_CTRL's enable bit gates the boot host interface - is false: BHI is used in PBL with MHE clear and the firmware sets MHE afterwards, so exec/status/ee all reading zero was ordinary PBL state, not evidence of a disabled block. The doorbell had in fact moved nothing for two other reasons, and drivers/bus/mhi/host/boot.c's mhi_fw_load_bhi() names both: it writes BHI_STATUS (0x2c) to zero BEFORE the address and size, and its doorbell carries a NON-ZERO sequence id in the low thirty bits rather than the constant 1 this probe wrote. Completion is BHI_STATUS's low two bits (2 = transfer complete, 3 = error), polled - not the execution-environment field the first attempt watched. bhiHandoff() now does exactly that and prints sts/xfer/exec/ee/err, so the next boot either moves the transfer to complete or reports an error code that can be looked up.",
  "Recorded because it cost an hour and could have cost the probe: deleting that wrong stage with a scripted string-range edit cut more than intended - bhiHandoff's header, struct PartitionReader with partitionRead(), and the M7a listing helpers all disappeared with it, and the file spent five builds failing on undefined identifiers until the pieces were restored from the patch scripts and re-ordered so every declaration precedes its first use. package/DbyPcie.cpp is not tracked by git (it shows as ?? in git status), so there is no rollback: the lesson is that every edit of this file needs a copy first, in the same spirit as the payload archives. The repaired file compiles with zero errors as kernel.macho 4460d0bd857fd08a..., payload 0d5450f5 (56 arguments / 995 bytes, dby-pcie=10), archived.",
  "2026-11-21 22:1x, the missing rows were diagnosed rather than argued about. Two entry markers and one gate row settled it on hardware: `[dby-pcie] gate stage=10 busOk=1 rc=8 hooks=1`, then `m6c enter`, then `m7d enter` - so the download stage and the FAT listing ARE called and DO start, and the rows they print afterwards simply never reach the capture. The same capture printed `m7 no firmware partition by any known name` twice, which the code cannot do (one call site, one row), and an earlier capture had a command-line row with two characters missing (`tail=o=2` for `tail=io=2`). That is a CDC endpoint without flow control dropping and duplicating data, not a logic fault.",
  "Two fixes, both about evidence rather than about the download. (1) The probe's rows now also go into the persistent boot log: package/BootLog.c gained a weak `native_dbypcie_census[72][120]` reader next to the CPU-frequency and GPU SMMU ones, which closes the gap this record has carried since M1 - the rows existed only on a serial console that this board may not even attach. (2) row() now paces the console with a 3 ms delay, because the drop happens at burst speed: 60-odd rows cost about a fifth of a second in total and the console becomes trustworthy, which matters more than the boot time. The M7b name listing is also gated to stage 9 only, so the stage-10 boot is not spending its serial bandwidth on an inventory that is already recorded. Built: kernel.macho 7d1843d828489879..., payload 38ef052c (56 arguments / 995 bytes, dby-pcie=10), archived.",
  "2026-11-21 22:3x, in EDL, and the durable-log idea needs one more step than the first attempt assumed. Reading the `log` partition (offset 0x10900000, length 80 MB per the table) returned only 3.7 MB and contains no SHLOG magic and no probe rows. The reason is in the driver, not the read: native_ufs_log_open() does NOT use the partition named log - it places the log at the END of the root store region (first = gStoreGeometry.last + 1 - kLogReserveBlocks, with an export region in front of it), so the slots live near the end of that window rather than at the start of the log partition. The right way to read them back over EDL is therefore to know the store geometry first (the probe could print it, or the export region could be dumped by its own path), and a blind read of the log partition will keep returning something that is not our log. Recorded so the next attempt does not repeat it: the console pacing fix is the cheap answer, and the durable log is the thorough one that needs the store window.",
  "2026-11-21 22:4x, the durable-log chase is parked with a negative result rather than a guess: the log region sits at the end of the port's store window, and the most likely candidate for that window - userdata - does not contain it. Reading the last 8 MB of userdata (offset 0x29b600000 + 0x1aaa000000 - 8 MiB, i.e. rs 245526528 16384) returned 7.1 MB with no SHLOG magic and no probe rows, so the store window is a sub-range the driver knows and the probe has not printed. Parked on purpose: the cheap fix (3 ms pacing in row(), plus M7b giving the stage-10 boot its serial bandwidth back) is already built and is what the next boot will use, while the thorough one needs the probe to print gStoreGeometry - a row, a rebuild and a boot, not a guess made over EDL.",

  "2026-11-22 13:0x, an EDL session wedged and the device needed a physical power cycle - recorded because the way it happened is repeatable. Reading the dtbo partition (24 MB) with `edl.py r dtbo` timed out after 400 s (the log filled with progress dots but no file was written), and from there the Firehose session stopped answering: `edl.py reset` also hung, a usbipd detach/attach cycle left the device enumerating as 0000:0002 with 'descriptor request failed' for the next minute. So a large read that times out can wedge the programmer rather than just fail. The operating rules that follow: prefer `rs <start> <count>` in chunks of a few megabytes over one big `r`, keep each session short, and treat a timeout as 'power-cycle next', not 'retry immediately'. dtbo itself is parked - the tablet's full device tree is already in /root/dby-full.dts, which is the authoritative source for the Bluetooth transport question, so the overlay was a convenience, not a gap.",

  "2026-11-22 14:1x, the download path was validated off the tablet against the REAL volume, which is the closest thing to a QEMU run this work line can have: a byte-for-byte port of the probe's FAT16 walk was run over /root/dby-edge/modem.img (the 197,132,288-byte dump taken over EDL) and it resolved image/qca6390/amss20.bin to first cluster 3546 with size 4,352,144, then followed the cluster chain to exactly 4,352,144 bytes over 266 hops - match. Two things follow. First, the geometry assumptions M6c makes are right on this volume: 4096-byte sectors, four sectors per cluster, a 512-entry fixed root at byte 110592, FATs at 4096. Second, the path walk needs the directory chain, not one cluster: image/ holds 364 entries and its long names push it past a single 16 KiB cluster, which is why the first version of the harness reported 'qca6390 not found' while the probe (which follows chains) found it on hardware - the harness was wrong, not the probe. That makes the on-device stage-10 boot's silence even more clearly a console-drop artefact, and it means the M6c logic does not need another flash to be trusted.",

  "2026-11-22 14:2x, two things advanced without the tablet. (1) The QEMU boot-chain regression is GREEN: the smoke suite failed one expectation because the built-in configuration had grown a fourth entry (Tools), not because anything regressed - package/Scripts/smoke.sh expected 'shown 3 entries' while the log said 'shown 4 entries, default 0 exit'. With the expectation corrected the suite reports SMOKE PASS across all six scenarios, so there is now a baseline that will catch a broken payload, command line or kit staging without a flash. Note that package/Scripts/smoke.sh lives in the core checkout, not this board repository.",
  "2026-11-22 14:2x, (2) the BHI handoff now has a host model (scratch harness test-bhi-model.py) that runs the same sequence the probe performs against a simulated register file in three device behaviours - completes, reports an error, never answers - and asserts what matters: BHI_STATUS is cleared before the address and size, the write order is status/high/low/size/intvec/doorbell, the doorbell's sequence id stays inside BHI_TXDB_SEQNUM_BMSK (29:0, so bit 30 must stay clear - the value the review caught), IMGSIZE carries the real image length, the success verdict comes from BHI_STATUS & 3 == 2, the error verdict from 3, and a device that never answers reaches the timeout branch instead of a false success; a zero length or a length that is not a multiple of 4 is refused before any write. All of it passes. The model's device semantics are assumptions and are labelled as such in the file - what it validates is our sequence and verdict logic, which is the part a wrong flash would have cost a boot to discover.",

  "2026-11-22 16:2x, the polarity fix did it and the download stage finally speaks on hardware: [dby-pcie] m6c image/qca6390/amss20.bin bytes=4352144 copied=4352144 pa=14e729000 - the probe read the tablet's own firmware out of its modem FAT volume, byte count exact against the EDL dump on this host, into the arena M5 allocated - then [dby-pcie] bhi sts=00000000 xfer=0 exec=00000000 ee=0 err=00000000 waited=300000us followed by 'bhi did not complete'. So the sequence now runs end to end: BHI_STATUS cleared, address and size written, doorbell rung with a sequence id inside bits 29:0, and 300 ms of polling. The endpoint answers nothing - status stays zero - which is the next question rather than a regression.",
  "Two defects this boot exposed. (1) The probe ran more than once: the rows appear three times and the arena address differs each time (14e729000, 15372b000), so a second and third 32 MiB arena were allocated in one boot despite gDone - which means either the archive is linked twice and each copy has its own statics, or a second call site exists. (2) The lesson for the repair that caused this morning's silence: restoring code from a patch script put back an already-fixed bug (partitionRead's inverted polarity), so a restore must re-check the known fixes rather than trust its source. Both are on the list; the download question is the priority.",
  "For the download itself, mainline's internal.h points at a preamble this probe has not written: MHI_SOC_RESET_REQ_OFFSET (0xb0) with MHI_SOC_RESET_REQ (bit 0) - mhi_soc_reset() asserts a reset request through the BHI window before the image is handed over on some devices. The next attempt adds it, with the read-back the probe always prints, and checks the MHI/BHI register definitions from the same kernel tree (common.h) rather than the truncated header this round fetched.",

  "2026-11-22 16:4x, two corrections of my own record, both from the read-back row. (1) The doorbell writes DO land: 'bhi wrote addr=00000001:53428000 size=00426890 db=1a5a0001' read back as '00000001:53428000 00426890 1a5a0001', so the outbound window, BAR0 and the endpoint's decode are all fine, and the fault is that the endpoint never reacts - BHI_STATUS keeps its reset value and EXECENV stays zero through 300 ms. (2) The defect I recorded as 'the probe ran three times with different arena addresses' is withdrawn: the repeated rows carry boot-log timestamps and the probe's own run counter reads #1, so what looked like multiple runs is the boot-log replay reaching the same console, and the differing arena addresses came from different boots inside one capture window. Recorded so the next reader does not chase it.",

  "2026-11-22 16:5x, the three-preamble experiment found the lever: BHI+0xb0. The rows are [dby-pcie] m6e before reglen=00000100 bhi=00000100 bhie=00000224, then attempt 1 (plain clear and ring) sts=00000000 xfer=0 for 150 ms, then 'm6e after mhe reglen=00000100 bhi=00000100 bhie=00000224 ctrl=00000001' - the MHE bit STICKS, so the block is writable and not gated by whatever the review assumed, and it still changes nothing - then attempt 2 no better, then attempt 3, which writes MHI_SOC_RESET_REQ (BHI+0xb0, bit 0) and rings: its status reads FFFFFFFF with xfer=3, and the final handoff's ERRCODE reads ef128100 instead of zero. All-ones is not a status field, it is a window that stopped answering: the SOC reset request did exactly what it says, and the endpoint went away underneath the mapping. That is the first time this chip has reacted to anything since the link came up. Three things follow: the reset request IS part of the sequence; it must be cleared and given time (the attempt wrote it and rang 2 ms later); and reads must treat 0xffffffff as 'endpoint away', not as an error code.",

  "2026-11-22 17:1x, the SOC reset request works and BHI still does not answer, and the boot says so precisely: [dby-pcie] m6f soc reset req 00000000 -> set -> 00000001 -> cleared -> 00000000 - the register at BHI+0xb0 holds the bit while it is set and drops it when cleared, so it is a real control, not a phantom - then [dby-pcie] m6f link after reset elbi=deadbeef up=1 ltssm=111, and [dby-pcie] m6f after reset reglen=00000100 bhi=00000100 bhie=00000224, and finally [dby-pcie] m6f bhi sts=00000000 xfer=0 exec=00000000 ee=0 waited=300000us. Three readings matter here. (1) The link survives the reset: PARF's LTSSM is back in L0. (2) BAR0 answers again after the reset with the same three offsets it had before it, so the reset neither broke the window nor changed the layout. (3) ELBI reads 0xdeadbeef, a poison value rather than the 0x11401 of a live link block - which is why the 'up=1' beside it is meaningless (bit 10 of 0xdeadbeef is set): after a SOC reset the endpoint's own ELBI block reports a sentinel, and any future check must treat 0xdeadbeef like 0xffffffff, as 'not a reading'.",
  "So the state of the download is now pinned down on three sides at once: the sequence matches mainline's mhi_fw_load_bhi (status cleared first, address high then low, size, interrupt vector, doorbell with a sequence id inside bits 29:0, completion polled from BHI_STATUS bits 31:30); every one of those writes reads back exactly as written, so the outbound window and the endpoint's BAR0 decode are fine; the SOC reset request is accepted and released; the link stays in L0 through all of it - and BHI_STATUS still never leaves its reset value. What is left is not a puzzle about our code but a question about the endpoint's willingness: either the image is not where the device can DMA to it (the arena is at 0x13cd2b000 and SID 0x1c01 is bypassed, but a BHI fetch that cannot reach the buffer could look exactly like this), or this silicon wants a preamble that neither mainline's boot.c nor internal.h documents. The next comparison worth making is against a known-good trace of the same operation on the same chip - the sibling port - rather than another guess on hardware.",

  "2026-11-22 17:3x, the clean experiment (no SOC reset, arena under 4 GiB, 512 KiB slice, clean+invalidate) gave two DIFFERENT answers in two boots of the same image, and that difference is the finding. Boot A: pa=eae0d000, writes read back exactly, then sts=ffffffff xfer=3 err=ef128100 - the window went to all ones, i.e. the endpoint reset itself. Boot B: pa=eadea000, writes read back exactly, then sts=00000000 xfer=0 for the full 300 ms - no reaction at all. Same code, same slice, same doorbell; only the arena address differed by 0x3000. An endpoint that tried to run what it was handed and died in one boot, and ignored it in the other, points at the CONTENT of the slice rather than at the sequence: the 0x80000-byte head of this unit's amss20.bin is probably not the boot loader the sibling port hands over from ITS amss.bin. So the next boot makes the slice the only variable - whole file versus 0x80000, one constant, one row saying which - and compares: whole+high gave xfer=0 earlier, sbl+low gave dead-or-nothing, whole+low is the combination not yet tried.",

  "2026-11-22 17:5x, the matrix is complete and every combination answers the same way, which is itself the result. whole file, low arena, clean+invalidate: [dby-pcie] m6c offer whole 4352144 of 4352144 bytes, [dby-pcie] bhi wrote addr=00000000:eae4d000 size=00426890 db=1a5a0001 | read back 00000000:eae4d000 00426890 1a5a0001, then [dby-pcie] bhi sts=00000000 xfer=0 exec=00000000 ee=0 err=00000000 waited=300000us. The three combinations now read: whole + above 4 GiB -> no reaction; 512 KiB + below 4 GiB -> one boot all-ones (endpoint reset itself) and one boot no reaction; whole + below 4 GiB -> no reaction, with every write verified by read-back. So neither the slice nor the address width is the answer, and the sequence is mainline's own. What remains is that this endpoint's boot host interface is not live in the state this driver leaves it in: the chip answers register reads and takes register writes, its ELBI goes to a poison value after a SOC reset request (so the reset path reaches it), but nothing it is handed is ever processed. The next question is not another register guess but whether the chip is powered and clocked for more than its PCIe core - which on this board means the WLAN rail/reset sequence the vendor stack runs before any of this, not the GCC block this probe drives.",

  "2026-11-22 18:1x, the SoC global reset sequence killed the probe at its FIRST access, which narrows the fault to the register's address rather than to the reset: the boot prints '[dby-pcie] m6c offer whole 4352144 of 4352144 bytes' and then nothing - no m6g row (whose first act is a READ of BAR0+0x3008), no retrain row, no bhi row - while the rest of the system boots on. So touching 0x3008 takes the driver down before it can even report, and the revision that wrote the register without reading it first did the same, which means the write itself faults too. ath11k uses that offset against a BAR it maps whole (its 0x1e081b0 and 0x1f8031c offsets imply a BAR of tens of megabytes); this probe maps one megabyte at 0x60300000 and its own BAR0 read-back in M4 showed 0x60300004 (a 64-bit memory BAR). The next measurement is therefore not another register guess but the BAR's real size, read from the endpoint's configuration space the standard way - write all ones, read back the mask, restore - because if this BAR is only a few kilobytes then 0x3008 is outside it and every ath11k-derived offset needs re-basing onto whatever aperture this unit actually exposes.",

  "2026-11-22 18:2x, BAR0 is exactly one megabyte - measured, not assumed: [dby-pcie] m4 bar0 size=00100000 (mask fff00004, restored 60300004). So offset 0x3008 IS inside the BAR this probe maps, and the two boots that died on touching it did not die on an out-of-BAR address. That reframes ath11k's offsets entirely: its 0x1e081b0 and 0x1f8031c cannot be BAR offsets at all on a 1 MB BAR, and the same source has the answer - ath11k_pci_power_up() calls ath11k_pci_select_static_window() when ab->hw_params.static_window_map is set, and the pcic layer reaches the chip's SoC registers through a WINDOW register rather than by addressing them directly. The offsets ath11k writes are window-relative, which is why writing 0x3008 through a plain BAR mapping took the driver down instead of resetting the chip: the address decoded to something the endpoint does not implement, and an unsupported request on this link arrives as an abort. The next implementation step is therefore the window protocol (select window, then write the offset inside it), taken from ath11k's pcic layer, not another direct BAR poke.",

  "2026-11-22 18:3x, the window protocol is now understood, and it does NOT explain 0x3008. ath11k/pcic.c splits on ATH11K_PCI_WINDOW_START (0x80000): a smaller offset is written straight into the BAR, a larger one goes through the window selector (ath11k_pci_window_write32: select, then write at mem + window_start + (offset & 0x7ffff)); and ath11k_pcic_write32 additionally requires a wakeup for offsets at or above ATH11K_PCI_ACCESS_ALWAYS_OFF (0xfe0), but only once ATH11K_FLAG_DEVICE_INIT_DONE is set, which it is not during power-up. So 0x3008 is a plain BAR offset and needs no window and no wake, and ath11k's big offsets (0x1e081b0) are the ones that use the window. Our BAR0 is 1 MB, measured, so 0x3008 is inside it - yet the probe dies on the access. The remaining explanation is that this endpoint does not implement every byte of the BAR it declares: an access into an unimplemented hole completes with an unsupported request, and on this link that arrives as an abort, which a kernel probe cannot tolerate. Two consequences: the SoC global reset is not reachable by a direct poke from here without fault handling, and it is arguably unnecessary anyway because every boot of this tablet starts from a fresh power-on - the chip has already been reset by the time the probe runs. The download's silence therefore has to be explained by something else, and the honest next move is a read-only census of what the BAR does implement (which offset ranges answer and which abort) rather than more writes.",

  "2026-11-22 18:4x, the spec gained the section it was missing: docs/wireless-spec-2026-11-20.md section 10, 'where the line actually stands', a table of every step with the reading that decided it (measured or open) plus the list of what the open step is NOT - sequence, image slice, address width, coherency and the window protocol are all excluded with the reading that excludes each - and what it most likely is: this endpoint does not implement every byte of the 1 MiB BAR it declares, so a direct access into an unimplemented hole completes as an unsupported request and arrives as an abort, which is how the two SoC-global-reset boots died. The spec now says the next move is a fault-tolerant read-only census of the BAR rather than another write, which is a tooling change (an exception-return path around the probe) before it is a driver change. Written because the plan up to section 9 described the ladder we intended, and after two days of hardware the useful document is one that says what the tablet has actually answered.",

  "2026-11-22 18:4x, BAR0+0x3008 is a hole from this side of the link and the SoC-global-reset route is abandoned with evidence rather than by preference: a WRITE-ONLY version of the sequence (write V, wait, write 0, wait, no read at any point) also took the driver down before it could print its first row, so it is not the read that faults but the register itself - an access into an unimplemented address in a declared 1 MiB BAR completes as an unsupported request and arrives as an abort, which a kernel probe cannot survive without touching the exception vectors. That also settles how ath11k's offsets should be read: its 0x3008 and its 0x1e081b0 cannot both be plain BAR offsets on a device whose BAR is a measured 1 MiB, so its register map belongs to a different aperture than the one this endpoint exposes. The reachable equivalent is the MHI block's own reset - MHI_CTRL bit 1, at 0x38 inside the block this probe has read and written successfully many times - and that is what the next build does (mhiCtrlResetPulse, row '[dby-pcie] m6h mhi ctrl reset <before> -> set -> cleared -> <after>').",

  "2026-11-22 19:1x, the MHI block's own reset is the wrong direction, and the reading is unambiguous: [dby-pcie] m6h mhi ctrl reset 00000000 -> set -> cleared -> 00000000 (the bit is accepted and self-clears), then [dby-pcie] retrain ltssm 10d->10d elbi=0000d401 dll=b8120008 id=010b17cb up=1 (the link and the DBI are alive), and then [dby-pcie] m6h after reset reglen=ffffffff bhi=ffffffff bhie=ffffffff ctrl=ffffffff - the MHI register block now reads all ones, where before the pulse the same four offsets read 00000100, 00000100, 00000224 and 00000000. So resetting the block through MHI_CTRL does not wake it: it takes the block's registers away while leaving the link and DBI answering, which also means the block has its own enable that this probe has not found and that a reset pulse cannot substitute for. That closes the preamble hunt with a definite result: of the five things tried before the doorbell - plain ring, MHI_CTRL enable (MHE), the MHI_CTRL reset pulse, the SOC-reset request at 0xb0, and the SoC global reset at BAR0+0x3008 (unreachable, it faults on both read and write) - none makes the boot host interface accept an image, and one of them (the block reset) actively removes the block.",
  "Where that leaves the download: the MHI block answers reads and writes on a live link, the image is in memory below 4 GiB and coherent, the doorbell is written in the documented form and reads back, and the endpoint never changes BHI_STATUS. Every one of those facts is measured. What is missing is knowledge of this specific part's enable sequence, and the only remaining source for it is a trace of the vendor stack doing the same operation on the same chip - the sibling port's record, or an Android-side capture - rather than more register guesses. The probe itself is left in a state that is safe to run: with the reset pulse removed (it is disabled in the next build), the sequence is read-census, arena, handoff, listing, verdict, and nothing it does leaves the endpoint worse than it found it.",
  "The PERST# toggle inside the boot-host handoff is the first suspect for the all-ones register reads of the last boot, and the next boot tests it as a hypothesis rather than as a proven mechanism: package/DbyPcie.cpp:1161 retrainLink drives GPIO79 low, then high, and then sets PARF_LTSSM bit 8, and a PERST# assertion resets the endpoint's configuration space - BAR0 returns to its default, Command loses Memory-Enable, and from that moment every BAR0 read is answered UR, which reads back as 0xffffffff, while the DBI window still returns the endpoint id because it addresses configuration space through the unrolled translator. The 2026-11-22 19:50 boot (payload e60e3bf6, tools/console-m30.log) printed retrain ltssm 10d->10d elbi=0000d401 dll=b8120008 id=010b17cb up=1 waited=0us immediately followed by m6h after reset reglen=ffffffff bhi=ffffffff bhie=ffffffff ctrl=ffffffff and then bhi offset ffffffff outside the mapped window, refused, and the same ladder ran twice with two different arena addresses (eae93000 and eae9d000). The retrain was the recovery step of the soc-reset experiment, which has since been removed, so it now resets an endpoint that M4 had already armed; if the mechanism is what it looks like, the doorbell that follows is rung through a BAR that no longer decodes. The frame quoted above cannot settle it either way, because the retrain's poll starts only after its two PERST# delays, so a link that dropped and recovered inside them also reads as up=1 waited=0us. What the frame does establish is narrower and still worth having: the block's own reads returned real values on the boots without this toggle and all ones on the boot with it, in the same frame as the toggle's row. The next boot gates it off, which restores the readable MHI block the boots before it had.",
  "The same-chip reference orders the boot-host writes differently and gates on the execution environment, which this probe has never read before the doorbell: UniXNU-gts7xlwifi package/MhiBoot.inc start_sbl writes BHI_INTVEC first (mhi_boot_begin, commented a reset clears it), then clears BHI_STATUS, then address high, address low, size and the doorbell, whose value is a small nonzero sequence number (seq, masked by MHI_SEQ_MASK 0x3fffffffu) rather than this probe's fixed 0x1A5A0001; mhi_boot_begin refuses to start unless BHI_EXECENV (bhi+0x28) reads PBL (0) or EDL (6), and mhi_boot_step treats a 0xffffffff read of MHI_STATUS or BHI_STATUS as the device not answering rather than as a status. This probe sets ee = PBL for its own row instead of reading BHI_EXECENV, so a device that is not in PBL would have its doorbell ignored with no evidence in the log; the pre-handoff read is added next to the row that already prints the layout.",
  "With the PERST# toggle gone the boot-host interface finally reads as a device: the 2026-11-22 20:10 boot (payload 49898a3b, kernel f4c9f27c, tools/console-m32.log) printed m6h before handoff reglen=00000100 bhi=00000100 bhie=00000224 ctrl=00000000 sts=00000000 ee=00000000, so the register space is 0x100 bytes, the boot host interface sits at 0x100, the vector interface at 0x224, MHI_CTRL and MHI_STATUS are both zero and BHI_EXECENV reads PBL - the execution environment the same-chip reference insists on before it starts a download. The writes then landed: bhi wrote addr=00000000:eba90000 size=00426890 vec=1 db=1a5a0001 read back 00000000:eba90000 00426890 1a5a0001, which is the first boot in which the interrupt vector 1 is actually written (every earlier boot refused before reaching it). The device still did nothing: bhi sts=00000000 xfer=0 exec=00000000 ee=0 err=00000000 waited=300000us. That combination - the doorbell visible in the register file, no transfer, no error code, and the execution environment unchanged - is not a rejected doorbell, it is the shape of a transfer the device never started, so the next question is whether the device can read the image memory at all.",
  "The console gadget replays its previous ring contents when its host handle is opened, which is what every duplicated ladder in this record was: tools/console-m32.log begins with the previous boot's last three rows (m6h after reset ... ffffffff, bhi offset ffffffff ... refused, stage=10 rc=8), which the new image cannot print because the strings are gone from it (grep -a 'm6h after reset' on payload 49898a3b returns zero), immediately followed by the current boot's rows. So a repeated block at the top of a capture is the ring being flushed, not the probe running twice, and the earlier note about two runs with two arena addresses should be read with that in mind; the probe's own run counter is the only reliable evidence of a second run.",
  "The endpoint's inbound window was the first thing this probe had never programmed, and programming it changed nothing: the 2026-11-22 20:35 boot (payload 24f3d376, kernel 194a2513, tools/console-m33.log) printed m6j inbound r1 unrolled before c1=00000000 c2=00000000 base=00000000 lim=00000fff tgt=00000000 and then m6j inbound r1 mapped=1 c2=80000000 base=ebb21000 lim=ebf47fff tgt=ebb21000 - the region had never been enabled by anything, and after this boot it is an identity window covering exactly the 4,352,144 bytes of the image - and the doorbell was still not consumed: bhi sts=00000000 xfer=0 exec=00000000 ee=0 err=00000000 waited=300000us. That is a sharper answer than it looks: mainline's BHI_STATUS carries the doorbell's sequence number in bits 29:0 and the transfer status in 31:30, so a sequence that never appears and a status that never leaves zero means the device did not consume the doorbell at all, rather than starting a transfer that hangs. So the missing piece is upstream of both the DMA path and the register protocol.",
  "The working same-chip port performs a whole ath11k power-on sequence before its first doorbell, and this probe had never done any of it: UniXNU-gts7xlwifi package/T970WifiProbe.cpp:687-741 (commented as ath11k_pci_sw_reset(power_on), per Linux v6.6 drivers/net/wireless/ath/ath11k/pci.c for QCA6390) reaches the chip's SoC-side registers through a WINDOW - selector at BAR0+0x310c, 0x40000000 enable bit, 0x80000 + (offset & 0x7ffff) - and then writes PCIE_PCIE_PARF_LTSSM 0x1e081b0 to 0x111, sets GCC_GCC_PCIE_HOT_RST 0x1e402bc bit 4, clears PCIE_PCIE_INT_ALL_CLEAR 0x1e08228, clears WLAON_QFPROM_PWR_CTRL_REG 0x1f8031c bits 0 and 2 (VDD4BLOW and the shutdown bit cnss2 clears with it), reads PCIE_Q6_COOKIE_ADDR 0x1f80500, zeroes WLAON_WARM_SW_ENTRY 0x1f80504 so the chip's Q6 does not take the warm path into a dead loop, clears the MHI vector registers 0x360/0x368/0x394/0x39c, then pulses PCIE_SOC_GLOBAL_RESET 0x3008 and writes MHICTRL=2 before it opens the boot host interface. It also hands the boot host interface 0x80000 bytes with msi_vector 0 and waits up to 20 s. Two things follow for this record: the window protocol is what the 2026-11-22 note about 'window-relative' ath11k offsets was looking for, and every earlier conclusion drawn on this probe - 'MHE changes nothing', 'the MHI reset pulse is harmful', '0x3008 is unreachable' - was measured with the subsystem unpowered and un-warm-entry-cleared, so none of them says what the sequence does when it runs in the order the vendor driver uses.",
  "The WLAN subsystem really was unpowered, and the boot host interface really does need the vendor's power-on order: the 2026-11-22 20:52 boot (payload a1f26718, kernel ea610509, tools/console-m34.log) printed m6k qfprom 00000006 -> 00000002 (clear mask 5) plausible=1, i.e. WLAON_QFPROM_PWR_CTRL_REG read VDD4BLOW (bit 2) and bit 0 SET before anything was written to it - a register this probe had never touched in a week of work - and m6k cookie=00000000 warm=00000000, so the warm-entry WAR found nothing to clear on this unit. The same boot then exposed the next gate: m6k mhi ctrl 00000000 -> 00000002 reglen=00000100 sts=00000000, the reset bit taken and still set ten milliseconds later, which means the doorbell of that boot - and of every boot before it - was rung with the block in reset. That is the first reading in this record that explains the doorbell being ignored without blaming the doorbell.",
  "Read the state, not just the rows: MHI_CTRL's reset bit staying set is the condition the working same-chip port's state machine refuses to pass. Its mhi_boot_begin writes the bit only when MHI_STATUS carries SYSERR, moves to phase MhiResetting, and mhi_boot_step returns from that phase without starting the boot loader until the bit reads clear, only then calling start_sbl (UniXNU-gts7xlwifi package/MhiBoot.inc:58-62 and :84-87). That port also pulses PCIE_SOC_GLOBAL_RESET (0x3008) 1 then 0 with 10 ms on each side before writing the MHI reset (T970WifiProbe.cpp:732-735), and clears all interrupts through the register window first (:712), with a comment that a reset leaves one pending that crashes the secondary boot loader as soon as it unmasks interrupts. So the order this record now implements is the reference's own: power, interrupt clear, soc global reset, MHI reset, wait for the reset bit, then the boot host interface.",
  "The boot host interface finally consumed a doorbell on 2026-11-22 21:19 (payload 871e37a3, kernel 31d3d49c, tools/console-m36.log): bhi wrote addr=00000000:eae55000 size=00080000 vec=1 db=1a5a0001 read back 00000000:eae55000 00080000 1a5a0001, then bhi sts=ffffffff xfer=3 exec=00000000 ee=0 err=ef128100 waited=416500us. Two changes to the same handoff had produced this, and the record should keep both: the offered image went from the whole 4,352,144-byte amss20.bin to its first 0x80000 bytes (kBhiWholeFile false), and the status poll window went from 300 ms to 3 s. The second one is why no earlier boot could see this: the device spends 416 ms on the transfer before it answers, so every 300 ms poll in this record - including the ones that read sts=00000000 and were written down as 'the doorbell is ignored' - would have reported silence even if the device was working. The first one is what made the device start at all: with the whole 4.3 MB offered it did nothing, which is what an impossible size request looks like from the outside.",
  "What the device said when it did answer is an error, and it is the first device-side diagnostic this line has: xfer=3 (BHI_STATUS bits 31:30 = ERROR) with BHI_ERRCODE = 0xef128100, 416 ms after the doorbell, and then BHI_STATUS reading 0xffffffff - the endpoint resetting itself after the failure, which is the same all-ones signature the PERST# experiment produced and is why the error-debug registers have to be read immediately rather than in a later row. So the state after this boot is no longer 'the doorbell is ignored'; it is 'the secondary boot loader was handed the image, ran, and failed', and the next reading has to be BHI_ERRDBG1..3 (bhi+0x34/0x38/0x3c), which is where mainline's mhi_fw_load_error_dump() and the working same-chip port both look at that exact moment.",
  "The error-debug registers are a descriptor echo, not a crash report, and that is now measured: the 2026-11-22 21:24 boot printed bhi dbg eda99000 00000000 00080000 sts2=ffffffff reglen=00000100 ctrl=00000000 in a boot whose arena was pa=eda99000 and whose transfer size was 0x80000, so BHI_ERRDBG1 held the image address and BHI_ERRDBG3 the size, with ERRDBG2 zero. Read that way the row says something useful instead of nothing: the device latched this transfer's descriptor (it is not reading stale state), BHI_STATUS then read all ones while MHI_REGLEN stayed 0x100 and MHICTRL 0, i.e. the status register went away rather than the block, and BHI_ERRCODE stayed 0xef128100. The row came back out of the console gadget's ring replay after the boot, which is worth remembering as a way to recover a boot's tail when a capture misses it.",
  "The image itself was the mistake, and the host says so without a tablet: amss20.bin is a single ELF32 ARM executable in 4,352,144 bytes - e_entry 0x16bfe00, e_phoff 0x34, eighteen program headers, and exactly one ELF magic in the whole file (offsets of 7f 45 4c 46: [0x0] only) - so handing its first 0x80000 bytes, the size ath11k calls sbl_size, sends half an ELF header followed by code, which is precisely a boot loader that starts and dies, i.e. BHI_ERRCODE 0xef128100. m3.bin beside it in the same directory is its own ELF of 266,684 bytes with e_entry 0x401, the shape of an M3 secondary boot loader, and it is the image ath11k's QCA6390 flow loads through the boot host interface before the main firmware comes up; m3.bin was already in this probe's candidate list as a fallback and is now preferred. Note what this corrects in the earlier record: the same-chip port's statement that the boot loader is the first 512 KiB of ITS amss20.bin does not transfer to this unit's amss20.bin, whose bytes do not have that structure, and neither does mainline's fbc_download check, which looks for an ELF magic at offset sbl_size and would not find one here.",
  "m3.bin is the image the boot host interface wanted, and the error is not about the image: the 2026-11-22 21:53 boot (payload 9cb12075, kernel 33bc1b46, tools/console-m38.log) read image/qca6390/m3.bin bytes=266684 copied=266684, offered it as sbl 266684 of 266684 bytes, wrote size=000411bc and got back bhi sts=ffffffff xfer=3 exec=00000000 ee=0 err=ef128100 waited=115000us, with dbg=ee130000 00000000 000411bc. Two things follow. The transfer is proportional to what is sent (115 ms for 266,684 bytes, 416 ms for 524,288 the boot before) so the device is transferring at about the same rate and the transfer itself is not the problem; and the error code is byte for byte the same as the one the truncated amss20.bin produced, which means it cannot be a verdict on the image content. The link also ended this boot healthy (link elbi=00011401 up=1 dbi=010b17cb dllla=1), so the endpoint recovers by itself.",
  "The error code format is 0xEF followed by the failing stage and a code, and the working same-chip port recorded what that meant for it: an ERRCODE of ef0e0003 with PBL stage 0x0e02, which it wrote down as 'the PBL runs from the chip's own oscillator, then fails 300 ms after the boot loader arrives, which fits a wait for an XO that never comes' (UniXNU-gts7xlwifi package/T970WifiProbe.cpp:227-231). The same port's answer to that was to turn on PMIC clock outputs through RPMh - four of them, rfclka1, rfclka3, lnbclka2 and lnbclka3, with one word each at value 1 - because the device tree names no clock for cnss and which output feeds QCA6390's XO is not recorded anywhere. This probe's 0xef128100 decodes to stage 0x12, a later point than theirs, so it is not the same failure yet, but the class of cause is the same one: a boot loader waiting on something the host was supposed to switch on. This board has package/QcomRpmh.c/.h, which plans cmd-db lookups and RSC TCS writes for exactly this kind of vote, and no driver here has ever turned those clock outputs on.",
  "The primary boot loader's own log is readable on this part and this probe now reads it. The working port's periph23 census (UniXNU-gts7xlwifi package/T970WifiProbe.cpp:774-786, taken from cnss2's cnss_pci_dump_qca6390_sram_mem) reads TCSR_PBL_LOGGING at 0x1b000f8, PBL_WLAN_BOOT_CFG at 0x1e22b34, PBL_BOOTSTRAP_STATUS at 0x1910008, the PCie error-debug register at 0x1e0e238 and a twenty-word log buffer at 0x1403d58, all through the 0x310c window; that is how it established that its device read every page of its boot loader, still failed its check at stage 0x0e with code 3, and faulted at an address in the 0xa0000000 range - the IOVA pool the device tree gives cnss_pci (qcom,iommu-dma-addr-pool = <0xa0000000 0x10000000>). The last point matters for this board's own approach: this probe hands the device a physical address and relies on the SMMU's bypass bank, while the device's driver-side convention is an IOVA in 0xa0000000.. and a stage-2 translation the host builds.",
  "The PBL log is readable and it names the failing stage: the 2026-11-22 22:18 boot (payload 18ef28ed, kernel abc91bbc, tools/console-m39.log) printed m6l pbl log=ef128100 cfg=00000200 boot=00000040 dbg2=00000000 and then twenty log words, of which the first ten have structure (log00 ef128100 00000000 00120700 00000000 00f84271 and log05 42100100 00000005 0080ead8 00000253 ef000008) while the rest look like ciphertext or uninitialised memory. TCSR_PBL_LOGGING holding the same value as BHI_ERRCODE means the primary boot loader itself raised it, not the host interface's DMA engine, so the transfer side of the handoff is confirmed working for a second time and the failure is inside the loader's own checks.",
  "The strongest remaining explanation comes from the working same-chip port and is testable: it records that at Gen2 the boot loader read its image and rejected it even though DRAM held the right bytes, and that forcing the root port's LNKCTL2 (DBI 0xa0) target link speed to 1 - 2.5 GT/s, before the link trains - is what it does about that (UniXNU-gts7xlwifi package/T970WifiProbe.cpp:388-392, quoting Samsung's msm_pcie leaving LNKCTL2 at 0x00010001). This probe trains at Gen2: its own m3 row has always printed dll=b0120008, whose LNKSTA speed field (bits 19:16 of the 0x80 link control/status pair) is 2. That is also the only explanation in the record for two different images - a truncated amss20.bin and the whole m3.bin - failing with the same code: a loader rejecting data it could not read correctly. The probe now asks for Gen1 before it enables the LTSSM, prints what LNKCTL2 held first, prints the negotiated speed, and re-applies the request inside its retrain helper so a recovery cannot quietly restore Gen2.",
  "Both firmware candidates are complete, well-formed ELF images, which rules out the truncation theory on the host side and leaves the read itself as the suspect: parsed with a plain ELF32 header reader, m3.bin is one PT_LOAD segment of 0x40000 bytes at physical 0x4ff00000 with entry 0x401 (its code starts at file offset 0x1000), while amss20.bin is an ARM ELF with eighteen program headers whose segments land at 0x01000000, 0x01477000, 0x016b0000, 0xf0000000 and 0xf0020000 with entry 0x16bfe00. Neither file is a container that expects to be sliced at 0x80000, and both are the shape of something a boot loader would parse rather than a raw blob - so the 0xef128100 that both produce is a verdict on data the loader read, not on a header it could not parse.",
  "The stage after the boot host interface is designed and written down before it is needed: docs/wireless-research-2026-11-24.md gives the gate order from the working same-chip port's own state machine (READY with the reset bit clear, contexts, M0 through MHI_CTRL's state field, EXECENV SBL, then the vector transfer, then EXECENV AMSS or WFW), the seven base registers and two MHICFG fields mainline programs in mhi_init_mmio (/root/mhi-init.c:470-600), the BHIe register order and the rule that BHIE_TXVECSTATUS bits 29:0 must carry back the sequence that was sent, and the three quantities that are still unknown and must be measured (event ring counts, context array sizes, whether the control segment base is needed). It is deliberately written while the tablet was in EDL rather than during a flash cycle.",
  "Gen1 is refuted, and the refutation is clean: the 2026-11-23 15:25 boot (payload 192d7f09, kernel fe09e7f3, tools/console-m40.log) printed m3 lnkctl2 00010003 -> 00010001 (target Gen1) and m3 ltssm 0->111 elbi=00011401 dll=30110008 id=010b17cb up=1 spd=1 waited=6300us - so the root port had been asking for 8 GT/s and the link really came up at 2.5 GT/s - and the handoff still answered bhi sts=ffffffff xfer=3 ee=0 err=ef128100 waited=415500us. The working same-chip port's note that at Gen2 its boot loader rejected the image does not transfer to this unit with this probe's link programming.",
  "The most useful thing measured on 2026-11-23 is a number that did not change: the failure arrives 415-416 ms after the doorbell whatever is handed over - 266,684 bytes (m3.bin, tools/console-m40.log), 524,288 bytes (the amss20 head, console-m36.log) and 4,352,144 bytes (the complete amss20.bin, tools/console-m41.log, payload de9804c8, kernel 52be5e85, waited=415000us) - and with the PBL log's log05 line byte for byte identical in every one of those boots (42100100 00000005 0080ead8 00000253 ef000008), while log00 differs in a single word. A transfer time that does not scale with size is not a transfer; it is a fixed timeout, and a boot loader that gives the same answer to three different images and two link rates is not judging the image. This also corrects an earlier reading in this record: the 115,000 us that the m3.bin boot first showed was an outlier, and 'the transfer is proportional to the size' was wrong.",
  "The clock hypothesis is now the leading one and it is testable with code this tree already has. The working same-chip port's note is specific: the boot loader runs from the chip's own oscillator and fails a fixed time after the image arrives, 'which fits a wait for an XO that never comes', and its remedy was to vote the PMIC clock outputs through RPMh - four names, one word each at value 1 (UniXNU-gts7xlwifi package/T970WifiProbe.cpp:227-231). This repository already contains everything needed to issue such a vote: package/QcomRpmh.h plans the command-database lookup and the RSC TCS writes, package/AudioProbe.cpp's micRail() is a working end-to-end copy of the sequence (cmd-db at 0x81c60000, apps RSC at 0x17a20000, writes at rsc+0xd00+offset, 2 ms, then qcom_rpmh_finish), package/AdspProbe.cpp uses the same planner on another TCS, and the audio comment records that TCS 0 is the WiFi bring-up's. Nothing in this line had ever turned a clock on.",
  "The PMIC clock hypothesis is refuted, and the vote is the first time this line has turned a clock on at all: the 2026-11-23 15:54 boot (payload de2392ed, kernel 038e1804, tools/console-m42.log) printed m6k clocks found=f voted=f 00042900 00042a00 00042700 00042800 - all four of the names the working same-chip port votes (rfclka1, rfclka3, lnbclka2, lnbclka3) exist in this board's command database, at those four resource addresses, and each was sent one active command with value 1 through TCS 0 of the applications RSC - and the handoff answered exactly as before: bhi sts=ffffffff xfer=3 ee=0 err=ef128100 waited=414500us, with the same constant wait and the same code. So an unclocked XO is not what the loader is waiting for, at least not through these four outputs, and the note this hypothesis came from (T970WifiProbe.cpp:227-231) described that port's own board rather than this chip's loader.",
  "Getting the vote right needed one correction that is worth keeping: the addresses in package/AudioProbe.cpp's micRail(), which reads like the reference copy of the sequence, are still SM8550's (cmd-db 0x81c60000, apps RSC 0x17a20000). This board's are cmd-db 0x80860000 and apps RSC 0x18220000 with the TCS window at +0xd00 (package/AdspProbe.cpp:15 and :57), and package/DbyCamera/DbyCamera.cpp:8-10 says so explicitly while explaining why its own copy took the SM8550 numbers. Copying the audio addresses without reading that note would have voted into a window that is not the RSC at all - and the vote would have looked issued in the row while doing nothing, which is the failure mode that costs the most boots.",
  "A collision the clock vote exposed, recorded rather than papered over: TCS 0 is the WiFi bring-up's by convention (package/AdspProbe.cpp:248, and the audio path's comment), but package/DbyCamera/DbyCamera.cpp:32 also takes kArcTcs = 0, because its header (:8-10) concluded that this board had no WiFi path and that the convention did not apply here. That reasoning stops being true now, and the camera is the one that should move - TCS 2, which the audio copy nominally uses and which does not run on this board. Until it does, the probe and the camera driver must not vote in the same instant: the probe votes once, early, before anything opens a camera.",
  "The boot loader is not starting, and that is now measured rather than assumed: the 2026-11-23 16:05 boot (payload 4e306d32, kernel 282c6605, tools/console-m43.log) printed bhi post mhi_sts=00000000 state=0 ready=0 exec=00000000 and then waited two full seconds without a READY row. So MHI_STATUS answers (the block is not reset - it is not all ones) and reports state 0 with READY clear, i.e. the device is still in PBL after the transfer, while the boot host interface it used for that transfer reads all ones and parks BHI_ERRCODE at 0xef128100. Both halves of that are consistent with a device that read something, rejected it and stayed where it was; neither is consistent with a loader that ran.",
  "Which puts the last unwritten assumption under the microscope: this probe has verified its own register reads and its write-backs, and has never verified that the bytes the device reads out of DRAM are the bytes in the file. The cache sweep before the handoff (dc civac over the exact range, then dsb sy) is a claim in a comment, not an observation, and if it did not do what it says the device would read zeros or stale data and reject every image alike - which is exactly the pattern: a constant ~415 ms and one invariant error code for 266,684, 524,288 and 4,352,144 bytes, at Gen2 and at Gen1, while the boot loader's own log05 line stays byte-identical. The working same-chip port does this comparison explicitly (T970WifiProbe.cpp:658, periph20: what the device reads is DRAM, not the cache, every page through an uncached mapping of its physical address), so this probe now does it too: a second uncached mapping of the arena's first page, summed against the CPU's copy, with four words printed from each side.",
  "The image really is in DRAM, and that closes the copy path for good: the 2026-11-23 16:19 boot (payload aace987f, kernel 5820c57e, tools/console-m44.log) printed m6i dram 464c457f 00010101 00000000 00000000 sum=c9711ed6 cpu=c9711ed6 match - the first word through the second, uncached mapping is 0x464c457f, the ELF magic of amss20.bin, and the running sums over the first 4096 bytes agree. So the dc civac sweep does what its comment claims, the FAT16 chain put the file where the row says, and whatever the device rejects it is not a bytes problem. This also removes the last explanation that did not depend on the device: with the data verified, a constant ~415 ms and one invariant error code for three image sizes and two link rates can only be about what the device does or fails to do with a correct image.",
  "What is left is two explanations that look identical in every register read so far: the device read the image and rejected it, or it never managed to read it at all. The apps SMMU answers that, because its global fault registers carry both the faulting address and the stream id of the access, and they are readable without writing anything - the working same-chip port compares them before and after its transfer for exactly this reason (T970WifiProbe.cpp:749 'sGFSR before the transfer' and :770-772 sGFSR/sGFSYNR0/sGFSYNR1 after), and that is how it learned its own boot loader was faulting at 0xa0026000. The probe now snapshots the four registers before the doorbell and after the poll; a fault with an address inside the arena and a syndrome naming stream 0x1c01 would mean the read failed, and two identical snapshots would leave the device's own verdict as the only explanation. Nothing is cleared, because the same SMMU carries the audio and touch streams and acknowledging a fault here would hide it from its owner.",
  "The endpoint's reads do not fault, so the SMMU is not what the handoff is missing: the 2026-11-23 16:29 boot (payload 17357f59, kernel 3a1f9c52, tools/console-m45.log) printed m6n smmu before fsr48=00000000 r40=00000000 synr50=00000000 synr54=00000000 before the doorbell and the same four zeros after the transfer, while the same boot reproduced err=ef128100 waited=415000us and bhi post mhi_sts=00000000 state=0 ready=0. Read with the caveat the review attached - the stream is mapped to the bypass bank, so a matched read cannot fault in the first place, and the four registers are shared with the audio and touch streams and keep only the latest fault - the honest conclusion is narrower than 'the reads worked': no fault was recorded, and the fault-address and syndrome columns are there so that if one ever is, it will name the address and the stream instead of leaving another guess.",
  "The transfer descriptor has now been varied to its last field. Every value the boot host interface is given has been changed one at a time and each left the answer identical: the image (three sizes, two different files), the address width, the coherency of the copy (verified byte for byte through an uncached alias), the link rate (Gen2 and forced Gen1), the subsystem's power and reset sequence, the endpoint's inbound window (never programmed before, now a power-of-two identity span), the PMIC clock outputs (four voted through the apps RSC), and finally the interrupt vector, which is now written as 0 because the same-chip port's caller only ever passes 0 and mainline does not write it at all. What is constant across all of it is 415 ms and 0xef128100, with an MHI_STATUS that answers and reports PBL - which is the shape of a boot loader that is given a correct image and refuses it for a reason that is not in the image, the transport, the power or the descriptor.",
  "The transfer descriptor is exhausted: writing BHI_INTVEC as 0 - the last field whose value had never been varied - changes nothing.  The 2026-11-23 16:50 boot (payload 49299c12, kernel 09e5b151, tools/console-m46.log) printed bhi wrote addr=00000000:eaecf000 size=00426890 vec=0 db=1a5a0001 with the usual read-back, and the answer was again bhi sts=ffffffff xfer=3 ee=0 err=ef128100 waited=414500us with bhi post mhi_sts=00000000 state=0 ready=0 and the SMMU registers still zero before and after.  So every value the boot host interface is given has now been varied one at a time - image file and size, address, size, interrupt vector, doorbell, poll window - and each left the same 415 ms and the same code.",
  "What the record can now say with evidence is a boundary rather than an answer.  Inside it, all measured and all excluded: the image is the file (ELF magic read back through an uncached alias), the copy and its cache sweep are correct, the address is below 4 GiB and reachable through an identity inbound window that covers it, the link runs at both Gen2 and Gen1, the subsystem is powered and reset in the vendor's order (VDD4BLOW cleared, interrupts cleared, SoC global reset pulsed, MHI reset seen to release), the PMIC clock outputs are voted, and no SMMU fault is recorded across the transfer.  Outside it, and not reachable from any register this probe can read: what the boot loader's 0xef128100 means and what it wants instead.  The next step is therefore documentation or the vendor's own loader, not another register: the candidates are the tablet's cnss2 (the kernel-side WLAN driver in the vendor image, which contains the SBL load flow the vendor's own boot used), the text file modem/image/qca6390/Data.msc, and QCA6390's BHI contract if a vendor document can be found.",
  "The tablet's own device tree states what the WLAN subsystem needs powered, and this line had never looked: the cnss node at /root/dby-full.dts:6270 carries vdd-wlan-aon and vdd-wlan-dig on one supply, plus vdd-wlan-io, vdd-wlan-rfa1 and vdd-wlan-rfa2, and those four phandles resolve to the rpmh regulators smpa6 (0xe7ef0 = 950 mV), smpa4 (0x1b7740 = 1800 mV), smpa5 (0x1cfde0 = 1900 mV) and smpc8 (via pm8150a-s8, 0x149970 = 1350 mV); the node also names smpa6 outright as its command-database resource (qcom,cmd_db_name = smpa6). That is the same four rails the working same-chip port votes for its own board (T970WifiProbe.cpp:145: smpa4 1800, smpa6 950, smpa5 2040, smpc8 1350), with one difference - our tree wants 1900 mV on smpa5 where that port wanted 2040 - and the tree is the authority for this unit.",
  "The same node also answers three of the four quantities spec section 11 listed as unknown and 'must be measured, not assumed': mhi,max-channels = 0x1e (30 channels, each described in the mhi_channels sub-node with its own event ring, direction, data type, doorbell mode and mhi,ee), mhi,timeout = 0x2710 (10000 ms) and mhi,buffer-len = 0x8000 (32 KiB); it sets qcom,smmu-s1-enable, i.e. the vendor driver runs the endpoint's stream with S1 enabled rather than through the bypass bank this probe uses; and its reg property gives the TCS command registers at 0xb2e5510 (reg-names smmu_iova_ipa and tcs_cmd). The fourth unknown, the context-array sizes, is still open. Two flags matter as well: qcom,set-wlaon-pwr-ctrl is what told the vendor driver to do the WLAON QFPROM power write this probe now performs, and qcom,wlan-ramdump-dynamic = 0x420000 sizes the dump region, not the image.",
  "The WLAN rails are not it either, and this boot is the first in which this line ever powered the subsystem: the 2026-11-23 17:33 boot (payload 51718497, kernel 2b01955c, tools/console-m47.log) printed m6k rails found=f voted=f 00040200 00040000 00040100 00040400 - all four of smpa6, smpa4, smpa5 and smpc8 exist in this board's command database and each was voted high-power mode, its device-tree voltage and enable through TCS 0 - followed by m6k clocks found=f voted=f with the four clock resources as before, and then the same answer: bhi sts=ffffffff xfer=3 ee=0 err=ef128100 waited=414500us with mhi_sts=00000000 state=0 ready=0. Power and clock are both out.",
  "What the device tree still offers that this probe has not used is a fourth block the vendor driver owns: the cnss node's reg property is <0xb0000000 0x10000 0xb2e5510 0x5c0> with reg-names smmu_iova_ipa and tcs_cmd, i.e. the WLAN subsystem has its own address-translation block and command registers at 0xb0000000 / 0xb2e5510, plus qcom,smmu-s1-enable and the thirty-channel MHI description (mhi,max-channels 30, per-channel event ring, direction, data type, doorbell mode and mhi,ee, and mhi,m2-no-db-access). None of that has been touched. Whether the boot loader needs its own translation block programmed before it can fetch a host image is the next question the evidence supports, and it is the same class of omission as the inbound window was: a block the vendor programs and this probe never has.",
  "The image this line has been handing to BHI is the wrong artefact, and that is now documented from a second port of the same tablet rather than inferred: youzjuzi/dby-w09-linux docs/firmware-preparation.md builds its Wi-Fi from public linux-firmware - ath11k/QCA6390/hw2.0/amss.bin plus the matching public m3.bin - and takes only the board file from the tablet (dby_fem_lx9_bdwlan.bin installed as board.bin), and it states outright that the vendor modem's amss20.bin is not equal to the amss.bin verified for ath11k. svesnav/linux-dby-w09 agrees in the sources it needs: its Wi-Fi firmware comes from the distribution's linux-firmware, and the only tablet files it copies are the GPU zap, SLPI, ADSP and Venus images. Read together with the vendor's answer on the ath11k list for this exact code - the ELF header is bad, so the PBL rejected it - the failure that this record has been chasing for a week is one wrong input file, not a broken handoff. The host-side checks that passed were all about bytes reaching DRAM intact, which they do: amss20.bin is a well-formed ELF32 ARM image, it is just not the image the boot loader expects.",
  "The public QCA6390 firmware and this tablet's vendor image were compared byte for byte, and the difference is a build, not a malformation: public ath11k/QCA6390/hw2.0/amss.bin (3,628,672 bytes, md5 682f7ca2e0b3ea16644c3585772a2cba, from pop-os/linux-firmware@4a0e59f9 and byte-identical at endlessm/linux-firmware@master, so unchanged since 2022) and the tablet's amss20.bin (4,352,144 bytes, md5 a828dd0bc8d821f8d1a25c4abf05d445) are both mature ELF32 ARM ET_EXEC images with the same eighteen-entry program-header skeleton, the same first two PT_NULL entries and the same 0xf0000000 segment, differing in size, entry (0x16c0e00 vs 0x16bfe00), data segments and build string (WLAN.HST.1.0.1-05266 dated 2021-11-04 against WLAN.HST.1.0.1.r1-01083-SILICONZ, with m3.bin ucode 2.0.7 against 2.0.15). Two structural facts about both files matter more than the version: neither contains an ELF magic anywhere but offset 0, so there is no SBL stage at 0x80000 as mainline's fbc slicing assumes; and fifteen PT_LOAD segments run to the exact end of file with ten starting at or beyond 0x80000, so 512 KiB cannot hold either image and a loader that honours PT_LOAD needs every byte. The vendor image is therefore not malformed and the public one is not obviously the cure - but it is the artefact both working ports of this tablet use, so feeding it to BHI is the cleanest remaining image-side experiment.",
]

completion = ["PCIe0 trains on this unit, the endpoint reports its real vendor/device ID, the chip's firmware reaches mission mode, an iOS interface joins a WPA2 network, and traffic passes - each recorded as its own evidence row, because a link or a firmware download is not WiFi."]

limits = ["PCIe0 is device-verified: link trained, endpoint 17cb:1101 read, BAR and SMMU/DMA setup probed, and modem/Bluetooth FAT volumes read on the tablet and via EDL. The selected vendor amss20.bin reached BHI but did not enter MHI mission mode. No ath11k MAC, iPadOS interface, scan, association, traffic or Bluetooth transport is verified.", "The public QCA6390 amss.bin plus matching m3.bin used by same-tablet Linux ports is a candidate, not a proven fix; both public and vendor images are valid but different ELF builds. BHI rejection may also involve transfer geometry, cache/IOVA state or the device-tree WLAN translation block.", "Bluetooth UART, IRQ, pins and board-data selection remain unverified on this tablet. The UART6 hypothesis must be checked against its stock DT/DTBO before any power or pin writes.", "Display and input paths are live on this tablet; a new mapped block or radio power change needs a separate reviewed probe and one variable per flash."]

next_action = ["First complete the pinned cold build and retain the last booted payload with its hash. For the next Wi-Fi experiment, pin the public ath11k QCA6390 amss.bin and matching m3.bin with source revisions and SHA-256, change firmware selection only, and record BHI status, error, execution environment and transition out of PBL.", "Before device write paths, host-check full ELF transfer bounds, bus-visible bytes, cache synchronization, IOVA reachability and the tablet DT WLAN translation registers. Then stage MSI, MHI mission mode, QMI, ath11k MAC and iPadOS network service as separate gates from docs/wifi-upstream-development-2026-11-28.md.", "For Bluetooth, identify the tablet UART and selected firmware/NVM from stock DT/DTBO and controller revision before adding a transport; follow docs/bluetooth-upstream-development-2026-11-28.md."]


















