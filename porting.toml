inputs = [
    "Panel text output (boot-progress=2 checkpoints, panic screen, UI trace page) and, since the 2026-11-05 firmware revert, the CDC-ACM kernel console enumerating as 1209:316d.",
    "An offline QEMU harness reproducing the same image with counters readable as text.",
    "The same rows written to the UFS log by BootLog.c, which is where they live now that the panel is left alone."]
configuration = [
    "[payload] panic_screen = true and kernel_args boot-progress=2, armcpu-diagnostics=1, boot-ui-focus=launchd, boot-ui-focus4=SpringBoard, sheng-build-tag.",
    "Since 2026-11-05 nothing paints after the scanout hand-off: BootProgress.c:1025 defaults sheng-banner to 0, so the live banner is off, and boot-diag-resume is gone, which leaves resume_after=0 (BootProgress.c:551 clamps <5 to 0) = never retake the panel. sheng-banner=1 can opt the painting back in and was tried once on 2026-11-05; the owner refused it (the panel is not a debug surface) and the accepted configuration leaves the banner off, so a number has to come from the log route.",
    "LinkStubs/BootProgressStubs provide the zero-value definitions for sheng-specific counters that libBootProgress references."]

procedure = ["For each attempt record the command, the image hash, the last completed checkpoint and the first failing operation.", "Use the offline harness for counter-level questions and the device only for what needs the real panel or the real storage."]

findings = [
    "The panel is the instrument: without a console, the panic text plus checkpoint numbers are the only evidence, so a build tag per image is not decoration but the way to correlate a photograph with a build.",
    "Counters beat wall-clock judgement. In the offline harness the guest clock advances while TCG work rate stays roughly ten times slower than the official hypervisor, so elapsed time never proves progress or regression.",
    "The panel still needed a camera photograph until the official persistent-log writer was linked in: package/BootLog.c was in the tree but not in the build. With it compiled and sheng-log=1 set, writes go to the userdata tail and are read back over EDL - see the storage area for the exact range and for why this is a recorded exception to the no-writes-to-userdata rule.",
    "The log stores more than a message buffer: every two seconds compose() writes the complete 48-row diagnostics page into a rotating slot, so any value the page carries can be recovered offline without a camera. A row only reaches that archive if it is captured into boot_progress_page_text; until 2026-11-02 the capture path rejected rows >= 48, which is exactly why the HID verdict line could never be read back (corrected below).",
    "The panel grid is 48 rows (0..47) and only row 43 was free; 48 and 49 were added for new diagnostics and, before the 2026-11-02 fix below, silently never drew.",
    "2026-11-02 late, the HID verdict row was unreachable and is now fixed: the row lived on grid row 48, but capture() dropped row >= 48 (page_text was [48][BP_COLS]) and BootLog.c archived only i<48, so the one row that separates a link/args fault from a sink fault from a coordinate fault could never be read back over EDL - and every row 0..47 is claimed by some conditional path (history 6+i, trace 6+i..19, console 17+i..23, exits 20+i/21+i, process rows 24+i and 38+i-7, frozen page 31..47), so it cannot simply be moved. Fix: page_text grew to [49][BP_COLS], capture() accepts row < 49, BootLog.c declares [49][120] and archives i < 49, and the HID line is written with capture(48,b) only - it is never drawn, because bp_line lives in a prelinked kit whose bound for row 48 is unverified. Review M1 then corrected the row's own field mapping: driver= now prints results[3] (0 = no IOHIDEventDriver below, 1 = found, -1 = never evaluated) and key-reports= prints events[4] (key-down and button reports); the previous code printed events[4] as driver= (so a healthy match read 0) and events[5] as key-reports (key-ups only).",
    "2026-11-01 the unattended autoreset is deliberately disabled: writing the reboot reason needs the PMIC SDAM cell, the SPMI arbiter answers rc=4 because sheng's PPID 0x071 is an SM8550 value, and whether kona's ABL honours a reboot-reason cell at all is unproven (the misc partition already carries bootonce-bootloader and the tablet still boots the system). boot_reset_probe() therefore refuses, which is the honest gate package/BootLog.c:1154 asks for, and the device no longer restarts itself every 270 s.",
    "2026-11-01 later: the PMIC route above is superseded. The vendor kernel this tablet ships (msm-poweroff.c:653-689) writes reboot reason 0x77665500 into four bytes of IMEM at 0x146BF65C (kona.dtsi:1947-1962) for `reboot bootloader`, so the board's own mechanism needs no PMIC at all. package/BootResetDby.c now maps that word with ml_io_map() - the physical address cannot be dereferenced in this kernel, there is no physmap - and runs in two stages: S1, the default, only reports the word it finds and refuses to arm; S3, enabled by the payload argument sheng-autoreset-write=1, writes the value, reads it back and only then returns 0. The gate is a boot argument on purpose: switching stages costs a payload rebuild, not a kernel rebuild. If the word still holds 0x77665500 at the next boot, ABL did not consume it, and the probe restores the vendor's normal-reboot value 0x77665501 and refuses; sheng-autoreset-force=1 overrides that once. That fuse is a courtesy, not the loop protection it was written as: measured on 2026-11-02, the word the probe reads differs on every boot (0x586440b7, 0x786408bb, 0x58e404b7), i.e. the firmware rewrites restart_reason before the kernel runs, so `before == 0x77665500` is essentially never true and the refusal path never fires. Loop safety comes from the firmware honouring the marker and parking in fastboot, not from this check. The probe is idempotent across its three call sites (BootLog.c:1090, BootLog.c:1155, BootProgress.c:749) and defers itself when called from the IRQ tail, where ml_io_map is not safe. Answered on the device 2026-11-02 04:06 with the S3 payload: EL1 can write IMEM (row `imem=786408bb -> 77665500 armed`, mark rc=0 after readback) and the firmware does act on it (PSCI SYSTEM_RESET returns the tablet to fastboot with no host action).",
    "The unattended loop needs the device to come back on its own. Two independent deadlines now do that: package/BootLog.c resets when sheng-autoreset expires (it only exists once the storage-backed log window is open and a round wrote), and package/BootProgress.c runs a second deadline off the monitor thread that needs no storage at all. Both call package/BootResetDby.c, which resets through PSCI SYSTEM_RESET (smc #0, 0x84000009) because PEHaltRestart() cannot work here: PE_halt_restart is never assigned on this port. A reboot reason needs no misc write at all. Correcting an earlier claim in this record - that this boot image never passes AVB, so ABL enters fastboot on every start - measured on 2026-11-02, an EDL Firehose `--power=reset` boots the XNU image and then the tablet keeps restarting itself, so ABL does NOT park in fastboot on every start - it enters fastboot when the IMEM word says so, which is exactly what the S3 write arranged.",
    "2026-11-02 defect and fix: the storage-independent deadline compared the ABSOLUTE cntpct_el0 against sheng-autoreset. cntpct does not reset on a warm PSCI reset (kona.dtsi:1304,1313 - a 19.2 MHz always-on cxo), so once the accumulated uptime passed the limit every boot fired at its first monitor tick. First seen as a 60 s deadline in ~30 s, then, after an EDL power reset at 04:29, as an unattended reboot loop: each boot armed, fired within a second, wrote the marker, reset into fastboot, and the next continue repeated it. Rescued by catching a fastboot window and re-flashing the S1 read-only payload. Fixed in package/BootProgress.c: the base tick is taken where the probe arms the deadline and the test is (now - base) / freq >= limit, so each boot measures its own interval; arming is a one-shot __atomic_exchange_n latch (the same pattern dby_touch_probe_done uses) and base is loaded before cntpct is sampled, so two poll callers cannot make now - base underflow. The value 60 s and the S1/S3 gates were left unchanged.",
    "Diagnostic polish must not outrank the next root cause; the fastest useful step has repeatedly been one static query that enumerates the answer instead of another flash-and-read cycle.",
    "The board preflight is called with cwd = the device tree and the firmware checkout in $UNIXNU_UEFI (core cli.py), so it has to resolve that variable rather than a literal repository name, tolerate the whitespace the memory-map generator emits, and compare intervals only from PcdSystemMemoryBase upward because MemoryInitPei.c never registers a region below it.",
    "The current limits are visible in this area: the offline harness reads counters, but the panel still needs a camera photograph, and a USB console is the change that removes that bottleneck.",
    "The console's blocker was firmware-side, not in XNU: the board shipped a byte-patched UsbConfigDxe (two cbz w10 -> b plus one table entry) that forced the DWC3 HOST init path, so QcomXnuUsbDebug failed at its CORE_NOT_DEVICE gate and 1209:316d never appeared. Reverting to the vendor binary (md5 6340bc7e..., named directly by the INF) enumerated it 74 s into the boot and bound COM4.",
    "A binary patch of a vendor .efi can therefore remove a capability while appearing to add one; check which blob the INF names before believing any note about what reached the FV.",
    "Enumeration was not the last blocker -- reading was. pump() in package/QcomXnuUsbDebug/usb/Dwc3.c:387 refuses to queue an IN transfer while d->dtr is 0, and dtr is set only by the host's SET_CONTROL_LINE_STATE (Dwc3.c:313), so a reader that leaves DTR down sees a live COM port and zero bytes forever. The official collector is a pyserial script and pyserial asserts DTR on open, which is why this never showed up in the module docs; a hand-written System.IO.Ports reader needs DtrEnable and RtsEnable set explicitly. With them the same idle boot yielded 3844 bytes on the first open and 0 on the second: the 4 MiB CPU backlog replays from the module banner on the first read, so no cold-boot timing is required, and after the drain the port live-tails.",
    "The console stops at lockdown_mode: ... in nvram is off because nothing after that prints -- the board's own diagnostic rows go to the UFS log (BootLog.c:1110 native_ufs_log_write) and, until this default flip, to the panel, never to kprintf. Both of those destinations are now wrong in the interesting direction: BootLog.c is not in the image at all (two rows below), so the rows that reach the host are kprintf rows. What the console does carry is the kernel's own output and the panic path, where QCOM PANIC END is the only marker that the two send queues drained.",
    "Turning the panel off with no reader ported leaves the board with zero readouts, and that is what 769d8ef did: the comment at package/BootProgress.c:1020 promises the record reaches the host by itself, but the only host-side stream is kprintf, which ends with the early boot. Measured on the 2026-11-05 CPU-round boot: the CDC console carried 3844 bytes, last line lockdown_mode, and no row after that. Two sources exist: the live banner, sheng-banner=1 (BootProgress.c:1028, it draws the CPUFREQ and SCHED rows over the OS frame) -- flashed and read on 2026-11-05, then reverted because painting over the system was refused -- and the official reader UniXNU-sheng/scripts/read-sheng-log.py, which needs this board-s own package/linux-log bring-up, not ported yet. With the banner off that reader is the only source, so porting it is the next device-visible step. Until one of them is used, no frequency vote or cluster placement claim from this board is evidenced by numbers, only by behaviour.",
    "COM4 mirrors kprintf and not IOLog. Measured on the 2026-11-06 capture: 745 lines carrying every [touch] and [pa] kprintf row and not one IOLog-family row anywhere -- no AMFI line, no Sandbox line, no IOKit class line. That single fact is the whole explanation of the battery line looking dead: package/DbyBattery.cpp wrote all thirteen of its rows with IOLog, so a boot with dby-battery=1 and zero battery rows said nothing about the PMIC, nothing about the SPMI observer engine and nothing about whether the driver started at all. Board code that has to be seen on this console calls kprintf.",
    "scripts/check-regression.py had the right ADT contract and the wrong shape: it demanded that the difference between the recorded baseline and a freshly built ADT be one contiguous 64-byte run sitting under a /chosen random-seed property name. ord208 measured the runs at [(392, 445), (446, 456)] -- 63 of the 64 seed bytes different and nothing outside 392..456 different at all -- because a byte the new random draw happens to repeat splits the run, so an unchanged ADT was reporting as a regression. The gate now bounds the union of the runs at 64 bytes and still requires the property name before it.",
    "Each field of the [apr] row needs a definition before it can carry a verdict: played= is completed regions x 1024 frames, which counts silence as readily as sound; wrot= is the audio server's own out_written cursor; peak= is the largest absolute sample the pump has taken out of the ring; resync= counts ring-phase re-locks; derr= counted write-done events whose status byte was read at the wrong offset. ord209 could be called sound because played and wrot converged to within 31072 frames (0.6 s) while peak= held at 9787 and late= stayed at 0.",
    "package/BootLog.c is not compiled into this kernel, which is what supersedes the UFS-log sentence above (BootLog.c:1110 native_ufs_log_write as the destination of the board rows) and the same assumption in the display area. Measured on kernel b587c637: llvm-ar t on build/boot-progress/libBootProgress.a lists BootProgress, BootFaultProbe, BootWatchdogPolicy, BootProcessProbe and BootUiTraceProbe and no BootLog.o; no builder in the assembled tree or in core names BootLog.c (it is referenced only in comments); and llvm-nm finds its own symbols absent -- boot_log_export_put, diag_flush, copy_msgbuf. The grep the build wrapper used as a proxy was boot_log_tick, which package/BootProgress.c defines, so that check answered yes and proved nothing; it now greps the three BootLog-only symbols. Two consequences: the [battery] row at BootLog.c:837-843 can never appear, so native_battery_stats[16] has no reader in this image and the only way to see a battery reading is IOPMPowerSource or the producer-s own kprintf rows; and console silence anywhere in the battery or boot-record path has to be re-explained from the kprintf sink, not from a log window that does not exist.",
    "Two audio instruments were added while the transport question was being settled, and both belong to the diagnostics record rather than the audio one because they read state that has nothing to do with classification. The first is the pre-flash gate: scripts/check-regression.py compares the kernel arguments and the counters this board is accepted on against the boot that is known good, so a change that silently removes one of them fails before a flash instead of after it. Measured on the tree as it stands here: checks=91, pass=91, fail=0, kernel_args_bytes=992, REGRESSION_GATE=0. The second is the kernel print of the plug-in trace ring: package/DbyAudio.cpp skipped kind 0, which is a property read of an object this plug-in answers, so a boot could stream for half a minute while every row naming what the audio server actually asked sat unread in the low slots -- ord203 printed slots 42..64 and dropped 0..41, and unk= only ever held the reads that were refused. Every kind now prints, spelled get, set, call or throw, which turns a refused-property count into the list of questions themselves.",
    "The gate's payload-input section also pinned adt_sha256, and that check failed on a build which had changed nothing: devicetree.py:308 writes os.urandom(64) into /chosen/random-seed, so an ADT digest is a per-build draw. Measured on two payload builds from the identical three run #25 carriers: 7d836064... and 4e32cedd..., same 14736 bytes, one differing run at 392..456, and the property holding those bytes is random-seed. The fix pins bytes instead of a digest. scripts/regression-baseline-adt.adt is the accepted boot's own ADT, extracted from payload-ord203.img with mcopy -i (no root, no loop mount), which reproduces the e91c7e80... digest the baseline had already recorded -- so the extraction is faithful to what the board booted -- and the gate now allows exactly one 64-byte difference, only where the preceding property name is random-seed. That is stricter than the digest it replaces: flipping one character inside root-matching, the 171-byte property carrying the Data volume UUID the kernel looks the seed up by, is refused, while replacing all 64 random bytes is accepted, and both cases are exercised in the same step that rewrites the check. The three genuine carriers were re-recorded beside it because this delivery swaps them on purpose (trust 400d5667..., addon a267725c..., seed 423d4000... for the CI run 42504049040 plug-in). Verdict over the built artifact: checks=93 pass=93 fail=0, kernel_args_bytes=992, REGRESSION_GATE=0.",
    "The torch hook follows the one-shot rule the touch hook was accepted on: `package/BootProgress.c:1134` requires the latch clear, `!ml_at_interrupt_context()` and `nprocs>0`, and `:1135` sets `dby_torch_hook_runs` before calling `dby_torch_start()`, so a `monitor()` that runs every tick cannot start a second thread. The entry point still needs a sleeping context of its own, which is why it returns void and reports instead: `DbyTorch.cpp:238` records -6 if `kernel_thread_start` fails, and the rest of the story goes out as `[torch]` kprintf rows -- the family COM4 mirrors, where IOLog rows have already once made a live driver look dead.",
    "The pre-flash gate caught a launcher that had fallen behind the record, and the arbiter was the accepted image itself. `f2-payload.sh` was still passing `run23/data-audio.dbr` (997ca7ee...), so the payload-input row failed against `scripts/regression-baseline.json:72`, which pins 423d4000...; measured rather than argued, `payload-ord209.img` (sha256 592c632b74abcf0d..., 218103808 B) lists `EFI/UniXNU/Payloads/scratch-data.img` at 1511664 B and that extracted file hashes to 423d4000d4d9de1f..., byte for byte `audio-addon/run25/data-audio.dbr`, while the trust bundle (400d5667de0da464..., 61408 B) and the plug-in (a267725cd48bf899..., 12088 B) are already identical between run23 and run25 -- only the seed had advanced. With the launcher naming run25 the same tree reports checks=93 pass=93 fail=0 and kernel_args_bytes=992, and the freshly built payload (d1d71fed8d6e32c1...) re-extracts to 423d4000... Nothing was written into the baseline to get there, which is the point of pinning an input hash: it indicts a stale command, where a digest of a build directory would have indicted the tree.",
    "The addon-mount counters the flashlight round adds follow this area-s established link shape rather than a new one: `package/BootProgressStubs.c` defines `native_gpu_addon5_stage` and `native_gpu_addon5_status` weakly, next to the four pairs already there, so `libBootProgress.a` links before the kernel carries them, and `scripts/check-dby-torch-host.py --tree` grew a `mount` step that replays the tree-s own recorded `xnu-inputs.json` series with the torch patch after it. The diagnostics that have been *read* are unchanged: no `[torch]`, `mount4=` or `mount5=` row exists on hardware yet, because the console component of this area has not enumerated since the argument swap."]

