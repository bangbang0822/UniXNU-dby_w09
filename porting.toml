result = "Official order ran kernel then payload: REBUILD_RC=0, KERNEL_RC=0, DbyBattery.o rebuilt at 18:58:31 from the 18:52:39 source and kernel.macho relinked at 18:59:27. The link proof is __ZN9IOService15getPMRootDomainEv as an undefined reference in tree/build/native-legacy-display/DbyBattery.o; receivePowerNotification itself is virtual (RootDomain.h:266 under the public: at :155) so it dispatches through the vtable and cannot appear as a symbol, and a strings match on the macho proves nothing because XNU defines it in IOPMrootDomain.cpp. The shipped argument line is 998 of the 1000-byte gate and carries the five restored families - sheng-data-reset=1, sheng-log=1, offline-legacy-retire=1, boot-ui-focus=launchd, boot-ui-focus4=SpringBoard - plus sheng-data-persist=2 and dby-battery=1. No serial was armed: this console port must not be held across a boot. The pass criterion is at the panel, with no drawn diagnostics: the mark clears when the cable leaves USBIN_PLUGIN_RT_STS without any brightness slide, returns on plug, and the percentage is stable across reboots."

