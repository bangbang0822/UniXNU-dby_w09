result = "2026-11-17 late: the display failures of that day are a warm-reboot race, not a property of any image. The same firmware and the same payload were booted three times: once the panel showed the userspace UI with no 'verify_swap' lines, once it stayed on the kernel's boot page with 1489 of them, once with 2882. A cold boot (power off ten seconds, then power on) brings the UI back every time, so the handover is timing dependent. The code matches: DarwinBootPkg/Driver/DarwinBoot.c:664 looks up gDbyPhyFbInfoProtocolGuid exactly once and falls back to the GOP canvas when the lookup fails ('no PHYFB protocol; video stays on GOP logical canvas'), and the kernel's NativeLegacyDisplay only accepts a swap when its boot mapping is the physical panel base. Two candidate fixes, both to be reviewed before any flash: retry that lookup for a bounded time, or re-program the DSI scanout in SimpleFbDxe on every boot instead of only on a cold one. One more datum from the same series: the boot image must carry the full 738 KB device tree; the 359-byte stub this repository ships today leaves the panel dark with 'verify_swap failed' on every boot."

