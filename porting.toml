[[area.evidence]]
kind = "host"
reference = "drivers/ShengUfs/tests/check_qemu_root_commands.py"
command = "python3 drivers/ShengUfs/tests/check_qemu_root_commands.py --output /root/qemu-ufs-dby --verified-root /root/core-pub/kits/VerifiedRoot --openssl-prefix /root/openssl-prefix (Ubuntu QEMU 8.2.2), then the same with --qemu /root/qemu-v9.2.3/build/qemu-system-aarch64 after building 9.2.3 from source; check_root_path_host.py and check_legacy_descriptors.py ran beside them"
revision = "72c6a8156c86e10c5134a40b77128dfda1efaac8"
result = "The harness builds (clang 18, OpenSSL 3.0.13, VerifiedRoot at its pinned revision) and is usable: it finds the UFS PCI device, starts the link and passes NOP. What it needs is a QEMU whose UFS model echoes a QUERY RESPONSE. QEMU 8.2.2 stops at hostQueryRead(0x03, 0x02) with kIOReturnError because its hw/ufs/ufs.c answers the query by setting only qr.value and never the opcode/idn/index/selector that RootCommands.h:265 requires back; ufs_build_query_response() exists in 9.2.0 and 10.0.0 and not in 8.2.2, 9.0.0 or 9.1.0. On a locally built 9.2.3 the attribute query passes and both harnesses then stop at the same step: TEST UNIT READY comes back as a failed CHECK CONDITION whose response the driver refuses as protocol error 4 (hostResponseHeader rejects a data segment length above 480 bytes in the 512-byte response area, RootCommands.h:159-162; the model fills that length from its whole UFS_SENSE_SIZE sense buffer rather than from the sense bytes it used, which is a model-side defect - master sizes the assertion but 10.0.0 still declares the buffer), so check_qemu_root_commands.py and check_arm64_root_commands.py both report kIOReturnIOError at the first SCSI command and the root windows, the store and log windows and the image-after comparison still have not run. The 2026-11-14 note that recorded only a bare 0xe00002ca here is superseded: that is this refusal, not a scheduling limit. The two harnesses that need neither QEMU nor OpenSSL pass on this tree: check_root_path_host.py prints PASS for RootDiagnostics, RootPublication, SmmuTakeover, TransferPoll, RootCommands and the wide-diagnostics row, and check_legacy_descriptors.py prints PASS 14 comparisons."

[[area.evidence]]
kind = "device"
reference = "drivers/ShengUfs/NativeUfs.cpp"
command = "./unixnu build kernel -j 20 -D /root/dev-qud (twice, pre-link deleted first) and ./unixnu build payload -j 20 -D /root/dev-qud --unique-chip-id d0b1e0a11ce0f00d --trust-cache /root/dev-qud/build/original-static-system-trust/original-static-system.bundle --data-ramdisk /root/seed/data-final.dbr, then fastboot flash boot /root/work/uefi-dby_w09/Mu-dby_w09.img, fastboot flash preload <payload.img>, fastboot reboot"
revision = "37944648986f5f6461a7c42d927802f741a4eac3"
result = "Two boots (03:21 and 10:36 on 2026-11-15) hung in bsd_init with `NativeUfs: root preparation failed phase=1 window=0; nothing published`, the panel row `UFS requests=0 verified4K=0 ... published=0 | probe=20 match=1 root=3 root window preparation failed`, a stage list ending `bsd_init: calling setconf?`, and a PC sample sitting in `_machine_idle` - the kernel was not spinning, it was waiting in IOFindBSDRoot for a root device that never appeared. The cause was the build input: tree/build/verified-root-os-xnu-bundle/archive.json read `LINK-ONLY STUB: kit sources compiled, but the signed policy bundle is absent ... verified_root_policy_count=0`, so configureVerification refused at its first check. The real two-policy bundle was still on disk under the old board slug, /root/unixnu-out/dby_w09/... (underscore, not the catalog slug dby-w09): archive.json reads `link_only_stub: false`, `verified_root_policy_count: 2`, manifests 47,481,664 and 25,805,344 bytes for images of 6,078,634,496 and 3,302,860,800 bytes, anchor ee0354120c537efa4c4fda72af4692bfd495515d5800b118032b1705fdea0ebd. Copying that directory over the stub and rebuilding gave kernel 3a51f9c5f7fb6da86bc285a9b14328a017833fadfea145a3b0fc049964d67e31, 126,570,496 bytes against the stub kernel's 53,284,864 - vm_page_bootstrap wired pages went from 39,028 to 56,711, 17,683 pages, the 73 MB of policy data now in the image - and payload 76227a62dc2edf801a5f869270aa57e5381feb5a768fcc50180c6b688204c578. That boot printed `load_init_program: attempting to load /sbin/launchd`, `stage: target pid=1 launchd exec process signature accepted` and `launchd p1 n1 r1 w0 b0 t1`, so the root mount, the owner-verified OS and SystemOS windows and the first userspace process now all happen on this board, which is the first time since the accepted 2026-11-08 boot. A second build with the root-refusal diagnostic added (kernel 9e44b87626ea2164e7611ff6cfb3fc9a30869ca7000c6db5421105d8f2391c8f, payload d084cb0fd3a62a0e0239d5564f33ded6c1663b9dffad65efbb73172ed661767a) reproduced it, and its new `NativeUfs: root fail ...` row never appeared because the refusal it describes no longer happens. The console still goes silent at about 46 s in both the failing and the working boots (last row DbyBattery #15), so silence after that point is not a progress signal; the panel slot on the medium is."

