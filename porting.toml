[[area]]
id = "audio"
status = "device-verified"
components = ["ShengGpr", "ShengAudioReach", "ShengCs35l43", "QcomGeniI2c"]
paths = ["package/*Audio*", "package/*Adsp*", "package/*Gpr*", "scripts/*audio*", "scripts/*adsp*", "scripts/*gpr*",
