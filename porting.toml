kind = "device"
reference = "package/BootLog.c"
command = "./unixnu build payload -j 20 -D /root/dev-qud --unique-chip-id d0b1e0a11ce0f00d --trust-cache /root/dev-qud/build/original-static-system-trust/original-static-system.bundle --data-ramdisk /root/seed/data-final.dbr (with sheng-data-reset=1 added to board.toml for one boot), fastboot flash boot/preload, then one plain reboot to read the previous run through the sheng-log-replay=1 path"
revision = "c83230084a56debe024d2a877363e088cf90be54"
result = "The first boots that had a root device went: OS and SystemOS refused by the link-only stub (previous row) -> after the real bundle, `UFS requests=12865 verified4K=356076 failures=0 integrity=0 published=2`, `root=1`, and `load_init_program: attempting to load /sbin/launchd` with `stage: target pid=1 launchd exec process signature accepted`. launchd then mounted its own Data volume - `handle_mount:817: disk1s1 vol-uuid: 2138CDAC-F86A-4DED-9EF1-09F27363DB2A block size: 4096 block count: 2097152` and `mount-complete volume OwnerData` - but the panel row `D st=7 ... pres=0` said persist::Open::Kept, the store still held the previous seed-s pages - which Kept does not apply, so the disk read its content from the seed - and the first APFS write answered `disk1: device is not ready.`. One boot with sheng-data-reset=1 (NativeRamBlock.cpp:82) changed it to `D st=3 hdr=3 lba=1b055bf pres=1 ld=1 wr=1 cm=1 er=0`, Fresh with the overlay active and a landed write, and no `device is not ready` in that boot at all. What is left is userspace: `Process exits: total=2 nonzero-status-or-reason=0`, launchd keeps running but `backboardd: absent`, `SpringBoard: absent`, `runningboardd: absent`, every exec logs `shared_region: ... vm_shared_region_start_address() failed`, launchd is throttled for `46392 times over ~14 seconds ... violating a limit of 4` CPU wakes, and the panel rows read `[cryptex os] stage=0 status=-1 gestalt-cache=-1 ls-store=-1` and `A files=-1 ... mount=0/-1 mount2=0/-1 mount3=0/-1 mount4=0/-1 mount5=0/-1`. The payload carries no GPU addon (payload.json gpu_addon_sha256 is null, the ESP has only kernel/adt/trustcache/scratch-data) while scripts/regression-baseline.json pins the accepted boot-s `a267725cd48bf899...`; board.toml ties that addon to native_cryptex_os_view and the union mounts, which is the same carried-input loss the verified-root bundle had, and it is the next thing to restore before the missing shared cache can be ruled out as the reason no child process starts."

[[area.evidence]]
kind = "device"
reference = "board.toml"
command = "board.toml sheng-gpu-addon=1 -> gpu-addon=1, then ./unixnu build payload -j 20 -D /root/dev-qud --unique-chip-id d0b1e0a11ce0f00d --trust-cache /root/dev-qud/build/original-static-system-trust/original-static-system.bundle --data-ramdisk /root/seed/data-final.dbr, fastboot flash boot/preload, one plain reboot to read the previous run"
revision = "29d73bc45f1d499fab055728aba4b746d61a3690"
result = "The launchd stall had a second stale boot argument behind it. native_gpu_addon_prepare() reads PE_parse_boot_argn(\"gpu-addon\") (kern_exec.c:7661) and returns on its first line when it is absent, so the board's long-standing sheng-gpu-addon=1 - renamed nowhere when upstream 47ec6a5 dropped every sheng- prefix - had been closing the gate: no addon install, no union mounts, and none of native_cryptex_os_view, native_gestalt_cache_drop or native_ls_store_drop. After passing gpu-addon=1 the panel row reads `[cryptex os] stage=5 status=0 gestalt-cache=2 ls-store=-2`, the five addon mounts move from `0/-1` to `1/2`, and the replayed message buffer no longer contains a single `shared_region: ... vm_shared_region_start_address() failed` line - the dyld shared cache path now works. `D st=2 hdr=0 pres=1 ld=65 wr=1 cm=1 er=0` shows the Data store resumed this seed-s overlay instead of resetting. This row first read the mounts- status 2 as an ENOENT on the mount proof file and asked whether /System/Library/LaunchDaemons was empty; that reading was wrong - native_gpu_addon_mount sets stage 1 and returns on the *source* lookup, so 1/2 only says /private/var/ngpu/<dir> is absent, which it is because the addon blob itself is still missing. The boot after the PMGR fix then had backboardd, SpringBoard and runningboardd running, so nothing was missing from /System after all."

