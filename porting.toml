[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["scripts/check-dby_w09.py", "proprietary-files.txt"]
inputs = ["Mu-Silicium based UEFI tree exposing Platforms/Huawei/dby_w09Pkg/dby_w09.dsc and Resources/Configs/dby_w09.toml.", "EDK II base packages and the DarwinBoot driver package, resolved from the build tree.", "Stock Huawei boot image: the panel, the three physical keys and USB device mode are already usable at the firmware level."]
configuration = ["board.toml [firmware] records config = dby_w09, the DSC path, Build/dby_w09Pkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, preflight scripts/check-dby_w09.py and the PACKAGES_PATH list.", "[firmware.defines] sets DEVICE_MODEL = dby_w09, ENABLE_SECUREBOOT = 1, MEMORY_PROTECTION = TRUE and SHIP_MODE = FALSE."]
procedure = ["Build the firmware in its own tree, then pass the checkout to the payload build with --uefi.", "Boot the tablet into fastboot from that firmware and flash the payload; read the screen state after each attempt."]
findings = [
    "The firmware handoff is what makes XNU visible: the GOP framebuffer and the entry-argument HOB are consumed by the legacy display backend, so a display failure is usually a firmware-side reservation problem, not a driver problem.",
    "This checkout is an offline derivative installed by its own script, so ./unixnu build firmware is not wired to it yet; [firmware] states the intended paths and the build is run by hand.",
    "The device enters fastboot from the UEFI port, which is the only supported way to write the payload partition.",
    "The panel's Error: Image at <address> start failed: Not Found, followed by USB boot desired, but no USB devices found on first attempt, is Mu BDS walking its default boot sequence, not a UniXNU failure. MsBootPolicy is a boot-option application and returns the boot-policy status; Silicium's MsBootPolicyLibGetBootSequence returns EFI_UNSUPPORTED, so the library falls back to HDD, USB and PXE, and the USB step fails because no USB disk is attached. The address is EDK2's reused boot-option image buffer and identifies nothing. Silencing it means implementing that library class and reflashing the firmware partition, so the message is documented instead of worked around.",
    "2026-11-06, the firmware repository was pulled and fast-forwarded from 35b09b4 to 423e222 (8 commits, https://github.com/WQSQW/uefi-dby_w09). The local pin probe in UniXNUPkg/Library/UniXNULib/Main.c survived the merge unchanged, and no header the payload build consumes changed - scripts/build-boot-progress.py:34-36 does add the FrameBufferSerialPortLib directory to the payload include path and its .c changed, but the compiled payload is unaffected.",
    "What those 8 commits change, in order of consequence: (1) UniXNUDxe is now in the FV and registers a Boot#### moved to the head of BootOrder, so the platform BDS starts UniXNU the way it starts any boot option; the old DbyW09StartUniXNU() LoadImage-by-GUID path in PlatformBootManagerLib/BootManager.c is now the fallback when BDS cannot boot anything: PlatformBootManagerUnableToBoot calls DbyW09BootManagerMenu unconditionally and only falls back to the EDK2 menu when StartUniXNU returns EFI_NOT_FOUND (BootManager.c:717-718, :875-876) - not 'when the driver is absent' (dby_w09.dsc:223-238, dby_w09.fdf:76-92). (2) PcdDebugPrintErrorLevel is pinned to 0x80000000, errors only: the platform's real value had been coming from SiliciumPkg.dsc.inc DEBUG settings, and this board's SerialPortLib is Silicium's FrameBufferSerialPortLib, which bypasses GOP and writes the physical framebuffer directly, so every extra line landed on the menu - the initial frame is Menu.c:140-153 and status line 0 is redrawn every second (Menu.c:190, DrawCountdown). (3) SecurityLockAuditLib is bound to the official silent instance, removing the 'VariablePolicy Lock' line that is not a fault (SecurityLockAuditDebugMessageLib.c:43 prints on every lock event by design). (4) FrameBufferSerialPortLib now wraps its log band into the lower half of the screen instead of row 0. Measured against the menu geometry that is not 'below the menu': the band starts at row 22 (y=792) while UniXNU's entries start at MenuTop=777 (Ui.c:754-786) and the footer begins at 1350 (Ui.c:787), so the band still overwrites the entries and the status lines. The commit message's claim is not supported by the arithmetic. (5) UsbConfigDxe ships the vendor binary instead of the byte-patched blob.",
    "Two of those commits were a revert pair (TimerDxe handing the arch-timer PPI back at ExitBootServices, reverted in 4424dd5). For the file the net effect is zero, but the patch was never in the FV: build_uefi.py applies Timer.patch, not Timer-Handoff.patch, so neither the change nor the revert affected the firmware. The firmware FV has not been rebuilt for this board and cannot be built as the tree stands: on Windows build_uefi.py:12 imports coloredlogs (absent) and Mu_Basecore is a WSL symlink over a gitlink that Windows cannot read; in WSL the dependencies resolve but the last build ends in an edk2toolext ConfMgmt TypeError, and build_uefi.py:204-205 skips --setup because Build/ exists, so it will not repair itself. The only complete FV is DEBUG (Build/dby_w09Pkg/DEBUG_CLANGPDB, 2026-10-31 22:18) while this record says RELEASE - and RELEASE has PcdDebugPropertyMask=0x00, which suppresses every DebugLib line including the board's own EFI_D_ERROR output, so the log level would then be moot.",
    "2026-11-06, a firmware FV and a boot image were built from 423e222 plus three changes, and neither has been booted (work/tracks/firmware-build/REPORT.md). Artifacts: work/tracks/firmware-build/out/dby_w09-boot-2026-11-06.img 9142272 B sha256 a7af199f88c89e222de6c06e966db2dfba3f71524ce4e85fecf518a59291117c, FV 8388608 B sha256 10d2d870be091b8d413381dbd1aacb6c3f33d38b34743dc35addaff3ffdcfb34. Build: `python3 build_uefi.py -d dby_w09 -r DEBUG -s` in WSL, PROGRESS Success, 36 min, FVMAIN 99% full. Three findings matter beyond this build: (1) the log band is now clamped above the menu box (FB_LOG_BAND_LIMIT_PX 739 = Ui.c:784's rule, rows 0..19, bottom y=720) so the band, the entries and the footer cannot collide; proven by simulation (verify-logband.py 12/12, which also reproduces the old band landing on 17 menu rows and 7 footer rows), by the compiled IR (umin clamp, udiv 739/CellHeight) and in the linked BdsDxe.efi. (2) The build-host ConfMgmt TypeError was an unset EDK_TOOLS_PATH in stuart's BuildVars; exporting it in the shell does not work, passing it as a build var does (build_uefi.py:202-211). (3) DEBUG is not just 'keeps error lines': in RELEASE SerialPortLib and DebugLib map to the Null implementations, so RELEASE has no firmware log at all - which settles the DEBUG/RELEASE question the earlier review left open. Secure boot must stay 1: building with 0 drops SiPolicy.p7b and shrinks SecurityStubDxe 952920->40024 B and VariableRuntimeDxe 973408->64608 B, so the shipped volume keeps -s and matches the recorded module set plus UniXNUDxe (+24176 B).",
    "2026-11-06 12:46, the first boot of the new firmware volume succeeded: the tablet left fastboot and went STRAIGHT to the XNU diagnostics page, with no UniXNU menu and no key press. That is the UniXNUDxe wiring working as designed - BDS starts the registered Boot#### instead of the old LoadImage-by-GUID path - and it also proves the payload on the preload partition (stage87, GPU mode 18) still runs under the new UEFI. The image was flashed with `fastboot flash boot` after checking its sha256 (a7af199f88c89e222de6c06e966db2dfba3f71524ce4e85fecf518a59291117c) and the 96 MiB partition bound; `fastboot continue` is what actually started it (this ABL ignores `reboot`). Visual confirmation of the log-band fix is still pending: the menu only appears via Return to firmware, and the boot path no longer passes through it."]

completion = [
    "The firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = [
    "Firmware build products are not reproducible from this repository alone until the tree becomes a standard uefi-dby_w09 repository."]

next_action = [
    "Boot work/tracks/firmware-build/out/dby_w09-boot-2026-11-06.img once and read the panel: rollback is one command (`pwsh -File work/verify/flash-boot.ps1 -Image evidence/boot/dby_w09-boot-clean.img`, sha256 EF1733BA...). Do not flash it in the same round as a payload change, so a failure is attributable.",
    "Rebuild the firmware FV from 423e222 plus the local Main.c pin-probe fix (its reservation is now 25 characters, so `dby-pinprobe=` can actually be appended to a 975-character command line) and flash it; the current FV predates every commit in this pull. Before that, fix the two things the review found in the tree: the log band starts inside the menu entries rather than below them, and the build host still cannot produce a RELEASE FV.",
    "Move the firmware port into a standard device firmware repository and enable ./unixnu build firmware with the pinned submodule list."]

