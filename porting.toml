configuration = ["[kernel.prelink] roots already include com.apple.iokit.IOHIDFamily and com.apple.iokit.IOHIDEventDriver, so the OS side of HID is inside the prelink closure.", "[payload] kernel_args reserve offline-hid-input=1, offline-hid-home=1 and offline-key-events=1 for the board producer that is not written yet."]
procedure = ["Read https://unixnu.com/porting/input completely before writing board code: transport and sensor, publishing reports through the qualified IOHIDDevice ABI, then physical buttons.", "Port the shared HID driver against a qualified prelinked candidate and add a board probe that emits a Home report."]
findings = ["The kernel currently contains no HID producer, so the lock screen cannot be dismissed: this is the blocker that separates the presented frame from the desktop.", "Publishing reports means subclassing the original IOHIDDevice with its exact 207-slot vtable and 0xd0 instance size; an approximate header changes the instance layout and the failure appears far from its cause.", "The touch IC is a Novatek NT36xxx 9Z (support_vendor_ic_type=5), not Goodix: all eight Huawei dtbo overlays carry only a `novatech` child under huawei_thp@10 and the THP core looks that child up by ic_name, whose Goodix enumeration stops below 5.", "The SM8250 pin controller is tiled. A pin register is tile_base + *global* pin id * 0x1000 (mainline pinctrl-sm8250.c: ctl_reg = REG_SIZE * id, driver indexes regs[g->tile]); gpio 39/40/41/42/43 are in SOUTH (0x0F500000) and gpio 98 in NORTH (0x0F900000). Reading west + pin * 0x1000 - what this driver did - lands on unused slots and returns 0x00000000, which is why the first census reported six zero words.", "The one non-zero value the probe ever produced (0x00000001 at 0x0F500000 + 39 * 0x1000) was the real GPIO_CFG39, not an unknown block; scanning the west window instead hung the kernel because it walked unused slots.", "With the same MMIO idiom (IODeviceMemory::withRange + kIOMapInhibitCache) the driver reads GICD_CTLR = 0x00000012 and the UFS HCI version = 0x00000300, so the idiom itself is sound on this platform; the earlier \"pin controller is unreachable\" conclusion is withdrawn.", "The official ShengNovatekTouch revision supports the NT36532 family; driving this N9Z needs a variant branch (identify at 0x3F004/0x3F0FE, frame read tx[0]=0x20 with an 8208-byte full-duplex transfer; the no-host-firmware-download part of this note was wrong - see the 2026-11-02 findings, the HAL uploads a 0x30000 image), see work/tracks/nvt-verify/VERDICT.md.", "2026-11-01 stage 2 ran for the first time: it had never executed because the payload carried dby-touch=1 and the ladder starts at 2. With dby-touch=2 the board reported clk=1 and t=1, i.e. the five wrapper-2 branch clocks left CLK_OFF on the first poll after the 0x52010 vote.", "2026-11-01 the pin plan landed: the page showed pw=2/0 (two writes, no failures) and the post-write words p39=0x00000083 (pull-up + 8 mA) and p98=0x00000080 (8 mA, pull disabled). Before this, the page printed the census snapshot taken *before* the write, so a successful configuration looked identical to an untouched pin.", "2026-11-01 the QUP wrapper answers: the version register at 0x8C0004 reads 0x20050000, so the wrapper window is mapped correctly and its clocks are on.", "2026-11-01 the serial engine itself still reads zero (se=UNCLOCKED, fw=00000000, sst=00000000) even though its wrapper answers and the branch clocks report running. The next step is the QUP reset release the vendor driver performs before touching SE registers, not another vote.", "The kona GCC values differ from the sheng board header: the QUP vote register is 0x52010 (sheng 0x52008) and wrapper 2's halt registers are 0x23270/0x23278 and 0x1e004/0x1e008/0x1e00c. work/refs/kona-qupv3-se14-clocks.md records the per-clock table.", "2026-11-01 the serial-engine window had always been mapped at 0x08800000 instead of 0x00880000 - one hex digit too many, sixteen times the DT reg <0x880000 0x4000> - so every SE access, including the identity words that always read zero, went to empty space while the correctly mapped wrapper answered. The base is now 0x00880000 in DbyTouchBoard.h and the QUP2 SE1 A/B probe reads the real 0x00884000 window; row 1 carries f1 (+0x68) and h1 (+0xE24) instead of the ambiguous e1 so the row stays within its 120 bytes.",
 "2026-11-02 finger-held frame measurement, and the hypothesis it kills: a whole boot was spent with a finger held on the panel and the dumped frame compared against the idle baseline (work/verify/diff-focus.py). Payload 0x000-0x0FFF did not move at all - the only differing bytes were the boot counter at 0x03F8-0x0403 and the noise tail 0x0FE1+ - while 0x1000-0x1FFF is stable within one boot and different across boots (2230 of 4096 bytes reused). That is firmware RAM written once at chip initialisation, not a capacitance image, so \"the matrix is at 0x1000\" is withdrawn and the chip was not scanning at all.",
 "2026-11-02 the vendor kernel's entire chip bring-up is four lines: rst98 LOW -> write 0xAA to 0x3F0FE -> rst98 HIGH (novatek_thp.c:310-333). Stage 6 implements it, and it ran: the row reported en=0 (every step answered, including the reset pad's level read back), the identity still matched (id=01236503 row=20), and gpio39 sat LOW the whole time. The frame that followed was 8192 bytes of uniform random (per-1KiB entropy 7.80-7.83, zeros 2-10, int16 lag-1 correlation 0.017) and byte-identical across eight consecutive reads. So the reset took effect and the chip still does not report.",
 "2026-11-02 the missing layer was found by reverse-engineering this tablet's own vendor partition (super -> vendor is EROFS; the daemon and libraries are in evidence/vendor-blobs). Correction to the 2026-11-01 note that expected \"no host firmware download\": the /dev/thp client is not libthp.so but libafehal<project>.so (ours libafehalW2599Z1100.so), which embeds a 0x30000-byte Novatek image (\"NT36523_THP_BIN\", extracted to evidence/vendor-blobs/n9z_thp_fw.bin, 196608 bytes, ends in ASCII \"NVT\") and calls a firmware-update routine unconditionally from thp_afe_forcestart, afterwards polling six bytes at chip 0x2FE60 for a first byte in 0xA0..0xAF. A part with no image returns the uniform random block we measured. Work plan: work/tracks/thp-daemon-re/REPORT.md.",
 "2026-11-02 host-command protocol, corrected twice in one night: the record this firmware parses is seven bytes {0x80|(addr&0x7F), cmd, 0xBB, arg_lo, arg_hi, stamp-1, checksum} sent in ONE transfer after one page latch, acknowledged by the stamp at 0x2FE77 matching what was written (novatek_thp.c:855-913). The official ShengNovatekTouch five-byte {0xBF, cmd, 0, lo, hi} form belongs to NT36532E and has no handshake, stamp or checksum; sending it to an N9Z proves nothing either way. Stage 7 sends the vendor record for three opcodes, the first of which (0xC2, the vendor's own boot command) exists only to prove the mailbox path end to end.",
 "2026-11-02 evening, THE BREAKTHROUGH: the firmware upload works and the chip now reports real capacitance data. Row 47 read `up=0/1* hc=000 fw=255,255 ok=1 xy=32,50` - the upload finished on its first attempt, all three host commands were acknowledged through the 0x2FE77 stamp, the FWINFO block became valid for the first time and reports a 32x50 matrix, and the 8208-byte frame changed from 8192 bytes of uniform random (entropy 7.90) into structured data (entropy 5.4-5.6) that sits around a 0x8000 baseline with +-400 offsets. Two defects had to be fixed first: the SRAM stream must re-emit the page latch AND the opcode byte for every window with CS released between windows (the vendor HAL's rwSPIBuf loops per piece), and the image is a FOUR-partition one - the two 0x100-byte header blocks are also streamed to SRAM 0x2BC48/0x2BD48. The 128-byte window that the frame READ needs is a host RX-drain artefact, not a chip limit: the upload now streams 0x13FD-byte windows like the HAL.",
 "2026-11-02 evening, touch detection confirmed on hardware: a 20-frame sweep (2 s apart, dumped into the export region tail, three blocks per frame) was captured inside ONE boot while the panel was pressed and released repeatedly. Nodes (row 13, col 45) and (row 13, col 46) alternate between about -200 and +2500 with the press rhythm, while the noise floor is +-40..100; the neighbours at cols 44 and 47 respond with a smaller amplitude (500-1700), which is the expected spread of one contact. Cross-boot comparison is useless here - two idle frames from consecutive boots correlate only 0.295 because the firmware's adaptive baseline settles differently every boot - so every touch measurement must be taken inside a single boot.",
 "2026-11-02 evening, what remains for offline touch output: (a) calibrate the matrix orientation by pressing the four corners and mapping row/col to the 1600x2560 panel, (b) turn the responding nodes into a contact (peak detect + centroid; the official ShengNovatekTouch NvtTouchCore.c is pure C and matches this matrix size), (c) scale to panel pixels (magnification 8 is recorded in the DTS). The 32x50 geometry comes from the chip itself (FWINFO x_num/y_num), so it outranks the 32x18 that the factory-test library libthpinterface hard-codes.",
  "2026-11-02 late, review #2 of the in-kernel contact extraction found two fatal defects, both reproduced offline over the recorded 40-frame sweep (evidence/edl-frames40/frames40.img). (a) Sample domain: the matrix payload is 0x8000-centred OFFSET BINARY, and the code read it as int16_t, so half of every frame landed at the opposite end of the signed range - measured coherence was 54.8 %..63.1 % against an 80 % gate, i.e. all 40 real frames were rejected and the diagnostics row stayed 0xFFFFFFFF, indistinguishable from 'stage 5 never ran'. The 'extreme nodes -32704/+31238' that an earlier finding attributed to the sensor were this bug (-32704 is raw 0x8040). (b) Baseline: one frame-wide median for all 1600 nodes is wrong because the top-left cluster (nodes 0,1,2 and row 1) rests 1937..3953 BELOW it, so a full-strength press there still lands below the median and the corner was never detected. Both are fixed by decoding the word as uint16_t offset binary, keeping a per-node min-hold reference (gTouchBase[1600], 3200 B of BSS) and using a fixed 1200 floor with a 6000 ceiling instead of a peak/2 threshold. Emulated statement-for-statement over the sweep, the rewritten reader now finds all four corners: TL (73,45), TR (1551,58), BL (73,2510), BR (1557,2508) against true corners (0,0),(1599,0),(0,2559),(1599,2559), and the sequence BR->TR->TL->BL matches the order the owner pressed them.",
  "2026-11-02 late, the producer seam is written and it does not need the HID archive to be testable. BootProgress.c:1166-1181 already draws a dot overlay from native_touch_seq/count/xs/ys and starts its own 30 ms thread, and the ShengHidInput device consumes the same five globals over the same seqlock (NativeHidInput.cpp:18-19, 155-206), so DbyTouch now defines native_touch_seq/count/xs/ys/ids, a strong native_touch_set_sink (the archive ships a weak empty one) and dbyTouchPublishContact() with the odd/even sequence and dmb barriers of the upstream producer (work/refs/sheng/TouchProbe.cpp:340-358), then keeps sampling every 100 ms while the new kernel argument sheng-touch-hid=1 is passed. Publication is in the consumers' axis domain because both consumers hardcode 30480/20320; publishing pixels would put every touch in the top-left corner. (The formula first written here read x = y_px*30480/2560, y = x_px*20320/1600, i.e. transposed; corrected 2026-11-03 01:35 to x = x_px, y = y_px and then 2026-11-03 12:16 to a bottom-up y - see the last finding in this list.) Row 42 gained hid=<publishes>/<sink registered>, so 'producer silent' and 'consumer never registered' are different rows in the log.",
  "2026-11-02 late, the corner calibration is now a committed artifact instead of a sentence: work/tracks/contact-calibration/REPORT.md plus work/verify/corner-calibration.py regenerate the four corner presses from the recorded sweep. It also reconciles 'y_num = 50' against the observation that one bottom-centroid landed at r48: every bottom press raises nodes up to r49 (extents r48..49 and peaks on node 1599), so the row axis does carry all 50 rows and r48 is a patch centroid, not a dead row. The two candidate mappings (uniform pitch (R+0.5)*2560/50 versus edge-to-edge R/49*2559) differ by at most 26 px, which is below the finger patch, so the data cannot choose between them; the driver keeps the uniform form and the 26 px residual is recorded as UNVERIFIED.",
  "2026-11-02 23:20, the READBACK itself was the defect, and it nearly produced the wrong verdict twice. work/verify/edl/readback-frames40.xml reads 64 blocks of log slots, i.e. slots 0..3, i.e. rounds r=0..3, i.e. the page as composed at t=0..7 s. The stage-5 sweep does not start until ~t=4 s and finishes at ~t=82 s, so row 42 in those four slots is ALWAYS the boot-time census line 'TOUCH st=8 ...' - the handoff's rule 'TOUCH st= means the reader never ran' is only true for the first 8 seconds. The window header (block 0 of LBA 30684672, struct boot_log_header) is the authority: window_blocks=8192, slot_count=509, 16 blocks per slot, one slot every 2000 ms. Read all 8192 blocks and pick the newest slot; note that the window also holds slots from earlier boots, so rank within r < slots_written and remember this boot's slot n carries r = n-1 (a long earlier boot's r climbs past ours, e.g. r=1526, and ranking by r alone reported a different payload's row). read-bootlog.ps1's own header decode reads first_lba at offset 40 and window_blocks at 48, but the naturally aligned AArch64 struct puts them at 24 and 32 - use work/verify/decode-window-2230.py.",
  "2026-11-02 23:33, CONTACT EXTRACTION CONFIRMED ON HARDWARE. A boot of payload-stage12-tx-2230.img with the panel pressed by hand reported 'TX none f=56 h=13 hid=16/0' at t=82 s and held h=13 through t=88 s (the boot's own slots; header uptime_s=88, slots_written=45). gTouchHits only increments, so 13 contacts were really detected, and f climbing 56->112 while h stayed 13 places all of them in the sweep window. The three-state row therefore works as review #3 (D2) required: 'ran and found nothing' (TX none f=.. h=..) is visually distinct from 'never ran' (the census line). The same payload on a boot where nobody touched the panel reported h=0 for 6176 frames over 791 s, which is the correct reading of an untouched panel and not a driver fault - the 40 dumped frames of that boot peak at 945, i.e. 255 below the 1200 floor. Coordinate output is still unobserved: no boot has yet produced a 'TX x,y w= n=' line, because the presses so far were taps that fell between the 2 s dump frames and ended between the ~1 s page compositions. Hold a corner for ~6 s to capture one.",
  "2026-11-02 23:42, the HID consumer is wired in (defconfig:131, board.toml:275). CONFIG_XNU_EXTRA_LD_ARCHIVES gained '-Wl,-force_load,{tree}/build/dby-hid-input/libDbyHidInput.a' after a regenerated .config (editing the defconfig text alone is inert), and kernel_args gained dk=0 (46 args, 996 of the hard 1000 bytes). The archive is supplied into the build tree after ./unixnu tree rather than rebuilt, the same pattern board.toml:121-123 already documents for libVerifiedRootProbe.a. Its only remaining undefined bridge symbols are the five native_touch_* globals now defined by DbyTouch.cpp and native_legacy_transfer_calls from LegacyDisplayProbe.cpp; the weak native_touch_set_sink inside its own DbyHidSinkStubs.o loses to the strong definition in DbyTouch.cpp, so the sink registration cannot be swallowed.", "2026-11-03 00:22, the HID round's verdict, read from the newest log slot (payload-stage13-hid-final.img, sha256 20C4CDE8..., uptime_s=472): row 48 'TOUCH HID started=1 drv=1 key-reports=0 touch-reports=0 res=-1 | pad dots=0' and row 42 'TX none f=3416 h=0 hid=3376/1'. (a) The archive is linked and running: started=1 means NativeHidInput::start() completed and drv=1 means results[3]=1, i.e. the stock IOHIDEventDriver really attached BELOW the device on this kernelcache, so IOHIDResource -> IOHIDDevice -> IOHIDEventDriver -> backboardd exists here. (b) hid=3376/1 is the independent sink proof: 3376 publishes and the sink IS registered, so native_touch_set_sink resolved to DbyTouch's strong definition and the weak stub lost. (c) key-reports=0 is neither a fault nor a sink problem: native_hid_input_requested() returns false because its first gate is native_legacy_transfer_calls<2 and its second needs either the offline-hid-auto-home timer (not passed) or a mailbox command (not sent) - HidInputProbe.cpp:36-51. The touch path does not pass through that gate, because dbyTouchPublishContact calls the sink directly. So the 1 Hz Home probe is off by design in this configuration; if it is wanted, offline-hid-auto-home=<s> costs 25 bytes and only 4 are left of the 1000-byte command line, so it must replace another argument. The page also showed [touch edge] installed=1 contacts=0, SpringBoard p27 and backboardd p55 alive, and the sweep's h=0 because the panel was untouched during that boot. What remains is one boot with a finger on the panel: touch-reports must rise above 0 and the UI must react.", "2026-11-03 00:35, TOUCH REACHES THE HID EVENT DRIVER - the chain is complete end to end. A 90-second boot with the panel pressed (haphazardly, several fingers, some overlap) read row 48 'TOUCH HID started=1 drv=1 key-reports=0 touch-reports=79 res=0 | pad dots=288', row 42 'TX 1121,2002 w=19933 n=9 hid=88/1', and '[touch edge] installed=1 contacts=2 from_edge=0 skipped=0'. So 88 publishes carried 79 digitizer reports into the stock IOHIDEventDriver and the last IOReturn was 0 (success), which is the first time a finger on this panel has produced an OS-level HID event. res=0 also settles the earlier worry that IOHIDEventDriver would reject a digitizer collection: it accepted them. The dot overlay drew 288 dots from the same globals, so the producer, the seqlock and both consumers agree. Still unverified, and only observable on the panel: whether SpringBoard/backboardd acts on the events (a swipe that moves the lock screen) and whether the coordinates land where the finger was - TX 1121,2002 is inside 1600x2560 and consistent with a press right of centre, but nothing in the log records where the owner actually touched, so the x<-y_px transpose and the 30480x20320 mapping stay unproven. key-reports=0 remains by design (native_hid_input_requested() needs native_legacy_transfer_calls>=2 plus offline-hid-auto-home or a mailbox command).", "2026-11-03 00:56, touch tuning round (source rev dby-touch/2026-11-03a) after the owner reported 'gestures unstable, works but not sensitive'. Changes: DBY_TOUCH_HID_PERIOD_MS 100 -> 25 (measured basis: 3376 publishes over the 390 s after the sweep = 115.5 ms per iteration, and IOSleep sits at the top of the loop, so the SPI frame read itself is only ~15 ms - the sample rate was set by the constant, not by the hardware; 25 ms gives ~40 ms per frame, ~25 Hz, at a ~37% duty cycle of one core while the same boot reported idle=97%); DBY_TOUCH_TOUCH_FLOOR 1200 -> 700 and DBY_TOUCH_MIN_NODES 3 -> 2, because a light press raises its centre node ~1500 and its neighbours 500..1700, so at 1200 only one or two nodes cleared the floor and the node gate then dropped the whole touch; a 3-frame lift debounce, because one weak frame used to publish a lift and end a drag mid-gesture; and the 40-frame/78-second sweep is skipped when sheng-touch-hid=1, which removes ~82 s of dead touch at boot (offline frame evidence now needs a boot without that argument). Review M1 rejected the first version of the floor change as unsafe: at (700, 2) the untouched 791-second recording puts 2..4 SCATTERED nodes above the floor in 13 of 39 frames whenever a reference step lands at frame 10, which published phantom contacts at 775,1281 -> 800,519 -> 1025,760 with no finger on the panel, because the downward-only reference cannot absorb a step up. Fixed by requiring a 4-connected component and taking the heaviest one's centroid (dbyTouchFlood), since every real press in every recording is one contiguous patch and the phantoms never are. Row 42's no-contact shape also gained x=, the count of frames whose SPI read failed, so a low publication rate can be told apart from a lossy one.", "2026-11-03 01:05, review round on the tuning batch, and the residual it caught. (a) The floor change as first written was unsafe, and the review proved it with our own untouched recording, so the reader gained a 4-connected-component gate plus a second threshold DBY_TOUCH_TOUCH_PEAK 1200 (DbyTouch.cpp:340 and :2983): FLOOR 700 decides which nodes join the centroid, PEAK decides whether a finger exists at all. work/verify/emulate-connected.py replays the exact reader over three recordings: the untouched 791 s boot gives 14 contacts with a flat sum, 1 with connectivity alone (2 adjacent nodes, peak 774) and 0 with the peak gate, while the four-corner recording stays at 18 of 39 in all three variants. (b) Residual risk, stated rather than fixed: the peak gate is component-local, so a reference step that lifted two ADJACENT nodes with one at or above 1200 would still pass; no recording shows it (largest quiet-frame excursion 945, the residual phantom 774). If dull touches persist the next lever is MIN_NODES 1, never removing the peak gate. (c) Two source-comment corrections are owed to DbyTouch.cpp - the sentence 'two nodes above 700 cannot be produced by a quiet frame' is refuted by the same recording - and are deliberately deferred to the next edit of that file, because a comment cannot change codegen and the flashed image was built from the reviewed hash 1CFD0F01. (d) The owner, who used the previous cycle's build, reports that touch is usable but not sensitive and that gestures are unstable. That is the FIRST UI-level observation on this line: 79 reports with res=0 proved only that handleReport returned success, never that an IOHIDEvent reached backboardd, which is the trap that cost another board a round (docs/devices/oneplus13t.md:511). The tuning batch is aimed at exactly that report.", "2026-11-03 01:35, the published coordinate domain was wrong and the owner's words name the defect: touch horizontal and vertical are swapped, and tapping an icon lands in the wrong place. Root cause: dbyTouchPublishContact transposed the panel - it fed gTouchPixels[1] (vertical) into the published x and gTouchPixels[0] (horizontal) into y. That transpose was a guess made when the consumer's contract had only been read at its call site. Reading the descriptor settles it: FINGER_DESC declares X and Y as two INDEPENDENT axes, each logical 0..32767 (NativeHidInput.cpp:41), and transformCoordinate(value,maximum) = value*32767/(maximum-1) (NativeHidInput.cpp:140-144) divides each axis by its own input range, so 30480 and 20320 cancel out of the aspect and cannot force a transposition. The panel is also not rotated relative to the framebuffer: the IOMFB dictionary reports 0x640 x 0xa00, the same 1600x2560 portrait space the centroid is computed in. Fixed by feeding panel X into xs and panel Y into ys. BootProgress.c:1197 maps the same two globals through the same maxima, so the dot overlay follows the fix with no edit of its own. This closes the published-coordinate-domain item that had been UNVERIFIED since the producer was written; what remains is only whether an axis is additionally mirrored, which one press at a known corner settles, because row 42's TX x,y is printed in panel pixels and does not depend on the publish mapping.", "2026-11-03 01:59, the coordinate system is VERIFIED on hardware, including the mirror question that was left open. The owner pressed top, left, bottom, right and centre in that order while holding each one long enough for the 2-second archive to catch it, and the five archived samples came back in the same order: (801,25) top, (37,1226) left, (798,2518) bottom, (1575,1271) right, (783,1147) centre on a 1600x2560 panel. That rules out both mirrors IN PANEL SPACE: x small on the left and large on the right, y small on the top and large on the bottom. It does NOT rule out a mirror between panel space and the published axis, and row 42 prints panel pixels so it could never have shown one: on 2026-11-03 12:16 the owner reported from a booted OS that portrait touch was inverted up/down, which is exactly that gap (corrected here, see the last finding). Two of the five presses were only 2-node contacts with weights 3540 and 2645, which is the new sensitivity path proving itself: at the old floor of 1200 with a 3-node minimum those two would have been dropped. Same boot: publish rate f=1504 in 62 s = 24 Hz (the 8 Hz of the pre-tuning build is gone), x= is not printed because row 42 was in its contact branch, hid=1504/1 (sink registered), touch-reports=292 with res=0. Earlier in the same session the 12 transient samples of the previous boot already matched left (x~50), right (x~1570), bottom (y~2517) and centre; only the top press had been missed there, because a tap lasts ~100 ms while the page is archived every 2 s and recomposed every ~0.64 s, i.e. about a 15% capture chance. Holding each position for ~5 s is what made the five-sample test reliable, and that is the procedure to reuse.", "2026-11-03 02:54, two more changes reached the device in one payload (payload-stage16-cpu-precision.img, sha256 990E735A...): the centroid now weights by (delta - floor) and the kernel carries a read-only CPU-frequency census ported from the official CpuFreqProbe. Precision: a source study of UniXNU/ShengNovatekTouch@a1a6f2b (NvtTouchCore.c:262-263) found the rule this reader lacked - weight each node by delta minus max(30 % of the blob's own peak, the noise floor) - and measured the defect it fixes: our node count swung 1..17 with pressure while the author's stays 5..7, which is the owner's 'position not precise'. The peak must come from the UNCLAMPED delta (pass 1 no longer clamps; the clamp moved into the weight accumulation), because the floor keeps growing while weights cap at 8000. work/tracks/touch-precision/REPORT.md models the gain at light-press error 16 -> 1.5 px, jitter 2.9 -> 1.0 px mean and 14 -> 4 px max, coverage at the 1200 peak gate 68/101 -> 101/101 - MODEL numbers, not yet measured; the study also proved the author's handy node-centre tables are GEOMETRIC (the 60-column table is mirror-symmetric to 0.0 px, pitches only {50,51,52}) and therefore not transferable to this 50x32 panel. CPU: package/CpuFreqProbe.cpp (633 lines, ported from alioth's SM8250 version of the official probe) + scripts/build-cpufreq.py, force-loaded via defconfig:131 because LinkStubs.c:96-99's weak sheng_cpufreq_probe would otherwise satisfy the caller and the probe would silently never run. Default mode is a READ-ONLY census: review confirmed the only hardware store is wr32 called from voteDomain reached only when gMode >= 2, and absent sheng-cpufreq the mode is 1, so it performs zero MMIO writes. It maps 0x18591000/92000/93000 and prints enable/domain_state/decoded LUT on page row 39 and in a 24-row [clocks] census in the log. Also fixed a real type bug: BootProgressStubs.c declared native_cpufreq_row as uint64_t[120] while both readers use char[120]. GPU was deliberately NOT wired: NativeAdrenoPublish.cpp:59,66 reference _native_gop_handoff_call/_memory which nothing in this tree defines, the board has no Adreno740 feed pin at all, and the G-1 SMMU measurement needs pipa-gpu=1 with the owner watching. Owed should-fixes from review round 6 are listed in work/HANDOFF-2026-11-03-night.md §8; the dangerous one is the DbyTouch.cpp:348 comment that still claims two nodes above 700 cannot occur - a future reader could delete DBY_TOUCH_TOUCH_PEAK on the strength of it.", "2026-11-03 03:08, GPU G0 wiring was attempted on hardware and stopped at a compiler ICE, then reverted so the tree stays buildable. What worked: adding an Adreno740 [[source]] pin to feeds.toml (FFT-infra/Adreno650 @ 70771a7, verified with git cat-file), unixnu fetch + tree materialising kits/{ArmSmmu4K,AdrenoPM4,AdrenoFirmware}, and selecting the Adreno740 component materialising drivers/Adreno740 with all 29 TU. That also disproved the warning the implementation agent carried: _native_gop_handoff_call and _native_gop_handoff_memory DO exist in this tree - libNativeGOPPresenter.a and libNativeLegacyDisplay.late.a both define them at offset 0x12a4/0x12a8 and the linked kernel has them at fffffff00c009e90 - the agent's check only compared the A650 archive's own symbol set. What failed: clang-24 ICEs while parsing NativeAdrenoService.cpp:95, OSDefineMetaClassAndStructors(NativeAdrenoGpuService,IOService), with the current parser token attributed to kalloc.h:765 (KT_SUMMARY_GRANULES / __builtin_xnu_type_summary). Removing any single suspect flag (-fmerge-all-constants, -fsanitize-minimal-runtime, -ftrivial-auto-var-init=zero) still reproduces it (work/verify/probe-adreno-ice.sh), so it is a compiler-level fault, not configuration. Wiring was reverted (component:Adreno740 removed from [kernel] archives, CONFIG_XNU_NATIVE_ADRENO back to not-set) and the kernel rebuilt green at 03:09. Kept as preparation: feeds pin, scripts/build-adreno650.py, scripts/gen-gpu-firmware-header.py, package/DbyGpuFirmware.h with the three firmware arrays parsed and sha256-checked (gmu 41548 / sqe 31632 / zap 13964). Cheapest way to still clear the GPU entry gate: the SMMU input_bits read needs only a minimal probe mapping GPU SMMU ID2 and printing bits[11:8] - it does not need the 29-TU driver at all, which is why work/tracks/gpu/SPEC.md originally costed G-1 at one boot.", "2026-11-03 18:20, G1 mode 1 measured, and it produced two hardware facts that change the plan. The stage28 boot (payload A4219A4E...) ran 8440 s / 4133 archived rounds with write_errors=0, so the read-only GCC step did not disturb the device (touch meanwhile at 24.1 Hz, 203632 frames, 0 SPI failures). Rows: GPU PWR m=1 gcc=1 cc=4 smmu=4 gpu=4 cx=0 clk=0 ahb=0 / cfg_ahb=00000001>00000001 memnoc=80004221 dvm=80000001 gpll0=01206d7f / cxgdscr..before all zero / GPU SMMU not read: state=4 (nomap) / rbbm=00000000 ioerr=0. (a) cfg_ahb (gcc_gpu_cfg_ahb_clk) is ALREADY ENABLED by the bootloader, so mode 2 has nothing to write and degenerates into a GPUCC read - and, more importantly, the mode-1 window whitelist was load-bearing: without it the probe would have gone on to read GPUCC and, had CX been up, the SMMU, i.e. the 13:12 freeze was one missed clock away from repeating. (b) gcc_gpu_memnoc_gfx is OFF (CLK_OFF set) while gcc_gpu_snoc_dvm_gfx is on; the vendor SMMU node lists memnoc as one of its clocks (kona-gpu.dtsi:270-275) and neither the kit nor its SMMU gate touches or checks it, so mode 3 must answer the memnoc question (enable it, a write the kit does not do, or prove it is unnecessary) before any SMMU register is read. G-1 therefore moves behind that answer. Full write-up: work/tracks/g1-mode1/REPORT.md.", "2026-11-03 03:40, two more reviewed changes are built but not flashed (the owner is asleep and only a power cycle reaches fastboot). (a) GPU entry gate without the driver: package/DbyGpuSmmuProbe.cpp maps 0x03da0000 for 0x10000 - the base this board's own vendor tree declares at kona-gpu.dtsi:263-266, qcom,kgsl-iommu@3da0000, reg = <0x03da0000 0x10000> - and reads ID0 0x20 / ID1 0x24 / ID2 0x28, decoding input_bits as {32,36,40,42,44}[code] or 48 for code=(id2>>8)&15 and OAS as {32,36,40,42,44,48}[code] capped at 40 for (id2>>4)&15 (NativeAdrenoGmuContext.cpp:31-35). It is opt-in via dby-gpu-smmu=1 and performs no writes, because the SMMU sits behind gpu_cc_ahb and an unanswered read on this SoC is an SError; review confirmed the built payload does not carry the argument, so the flash cannot touch the SMMU at all. (b) Fixed a real cliff in the touch centroid: the relative floor was derived from the UNCAPPED peak while every weight is capped at CEILING 8000, so any raw peak at or above 10*8000/3 = 26667 zeroed its own patch and the contact was silently dropped - pressing harder stopped registering. The floor now uses min(bestPeak, CEILING), which the review verified is arithmetically identical for every peak at or below 8000 (so all three recordings, max 4161, are unchanged: 0/19 untouched, 0/39 press-dump, 18/39 four-corner) and saturates at 2400 above it. Worth recording that the earlier rationale for this 'unclamped peak' was backwards: clamping the stored delta was what would have removed the cliff, and the study's warning applied to a different thing. Both changes are in payload-stage19-s1fix.img (sha256 9547EA8B...), reviewed Y.", "2026-11-03 12:16, the published Y axis was mirrored and is now bottom-up, using the official producer's own fix. The owner, on a booted OS (payload-stage19, SpringBoard and backboardd running), reported '现在屏幕竖屏触摸上下颠倒了'. Root cause: dbyTouchPublishContact published the panel's top-down row index as the digitizer Y, and the consumer passes the sign through untouched (ShengHidInput/NativeHidInput.cpp touchSend: y=transformCoordinate(ys[i],20320), no inversion), so the fix is a producer-side mirror: y = (20320-1) - y_px*20320/1600. This is the official mechanism, not an invention - work/refs/sheng/TouchProbe.cpp:351, the same author's own panel, says 'Panel photograph (v94): X is correct and Y is mirrored, so publish Y from the other edge (axis maximum 20320)'. The -1 is load-bearing: with 20320 the producer's clamp folds rows 0 and 1 into one, while 20319 makes the mapping injective with both endpoints exact (review computed t(0)=32767, t(20319)=0, t(10159)=16384). BootProgress.c's dot overlay reads the same globals, so it now flips back (20319-ys[i]) and its output is bit-identical to before the change - which means neither the overlay nor the 25-point precision grid (that reads row 42 TX, in panel pixels, upstream of the publish mapping) can witness this fix. Acceptance is UI-level only: touch the top and bottom edges and see where the response lands. Not bumped: DBY_TOUCH_SOURCE_REV still reads dby-touch/2026-11-03a although the mapping changed; the payload sha256 identifies this image and the rev moves to -03b with the next touch edit. Same round, the kernel command line moved to 974/1000 bytes (45 args): sheng-cpufreq=2 was added to vote EPSS domain 0 after the stage19 census proved the route on hardware (3/3 domains mapped, LUT stride 4 B, 1516/710/844 MHz, work/tracks/stage19-verification/REPORT.md), and the review decoded the real LUT out of the archived window to predict the exact outcome (row 16 = 1804 MHz, so expect v16@1804 and domain_state 0x4f -> 0x5e; the readback at CpuFreqProbe.cpp:535 proves only that the register kept the request, the pre=/post= pair is the evidence). dby-touch-dump=1 and sheng-build-tag were dropped to make the room (both proven inert: the dump path is skipped whenever sheng-touch-hid=1, and the tag only names the image in the log header). dby-gpu-smmu=1 was added and then REMOVED again before the flash because an independent review judged it N: an unclocked SMMU block reads 0xffffffff, which decodes to input_bits=48 and prints a false G-1 pass, and the probe runs on the monitor thread's first round while the log writer is still waiting for UFS, so a fault there would destroy the CPU-vote evidence as well. The gate to add before that argument: all-0/all-ones id0/id1/id2 get their own stage and no decode.", "2026-11-03 17:40, multi-contact reader (source rev dby-touch/2026-11-03b). Why: the producer published native_touch_count = 1 by construction (it kept only the heaviest 4-connected component), so pinch-zoom and multi-finger gestures were impossible regardless of sensitivity; the HID consumer supports 10 fingers. What changed: the frame now enumerates EVERY component (keeping the 24 heaviest of DBY_TOUCH_MAX_CANDIDATES), applies the SAME three gates per component (4-connectivity, 2..80 nodes, peak >= DBY_TOUCH_TOUCH_PEAK; the per-blob floor rule is unchanged and factored into dbyTouchCentroid), matches each accepted component to a live id, and publishes up to DBY_TOUCH_MAX_CONTACTS (10, the protocol header cap, within the 12-wide native_touch arrays). Ids are the smallest free value in 1..255 because the HID report packs id&0xff. Lift debounce is now per contact; row 42 gained c=<live count>. Offline regression over the three existing recordings is unchanged for one finger (work/verify/emulate-multitouch.py: untouched 0/39, press 0/39, four corners 18/39, max simultaneous 1), and none of them contains two simultaneous fingers, so multi-touch itself is a hardware-only verdict. The 18:05 review blocked the first version with three must-fixes, all applied before any flash: (1) a fixed 220 px continuation radius turned a fast flick into 2..4 phantom fingers (220 px at 24.5 Hz is ~5400 px/s, and one panel width in 0.3 s is a normal swipe), so matching now uses the contact s own predicted position (last + per-frame velocity, bounded) plus a last-unclaimed-pair fallback; (2) the moment the live set emptied, row 42 could print TX c=0 with a stale coordinate for three publishes, because the whole-frame hold returned before clearing gTouchPixels - the empty case now clears the point and row 42 is additionally gated on gTouchLiveCount; (3) the comment claiming the dot overlay draws one point was false (BootProgress.c draws one dot per published contact), so it is wrong comments of that class this board has already paid for. Also applied: gTouchHits counts confirmed contacts again rather than held frames, the collector applies the node/peak gates before the 24-slot eviction so heavy-but-invalid blobs cannot evict a real finger, and the publish loop is bounded by the array width rather than the macro. A third review round then blocked the candidate-first pairing for two deterministic defects (a minted contact inherited a velocity computed from the recycled slot s stale position, so two still fingers were reported as 2,4,6,8,8 contacts; and a heavier new finger could steal a live contact s id), and a fourth blocked the per-contact greedy order because an aging contact claimed a component belonging to another live finger - the id teleported and the finger that was actually down lost it. The final matcher scores every (contact, candidate, distance) triple, sorts and assigns globally, mints only when nothing is free, gives a new contact zero velocity and miss = 0, and ages a contact with the counter tested before the increment so it lifts on the 4th empty frame (unchanged latency). Verdict on the fourth round: Y with no must-fix. Hardware acceptance 2026-11-03 21:34 (evidence/edl-log-s39): TX c=2 with two fingers, touch-reports=1601 res=0, 375 s and zero write errors; a whole hand on the panel produced max=10 contacts, which is the correct reading of a large contact area as many 4-connected components. Known limitation recorded there: there is NO palm rejection, so a resting hand is published as up to 10 fingers and the UI may act on it - the follow-up is a node-count or total-area gate, which needs palm samples first. Recorded non-blocking facts: the pairs array is exactly 10x10 and would overflow silently if only one cap grew; two fingers closing at >=200 px/frame still swap ids once (harmless - the consumer uses ids only for lift detection, so the acceptance text must not claim ids never swap); and with no radius a lift plus a new press in the same frame transfers the lifted id rather than emitting up+down, which is what the old single-id reader did too."]
completion = ["A touch or key event reaches SpringBoard and the lock screen can be dismissed on hardware."]
limits = ["No sensor descriptor and no HID event driver is present in this repository yet.", "The chip is a no-flash THP part: until the 0x30000-byte image is uploaded over SPI it never reports, so every measurement before that upload describes a chip without firmware, not a panel without touch."]
next_action = ["Read row 42 from the NEWEST slot of the full 8192-block window (work/verify/edl/readback-window.xml, then work/verify/history-2230.py), never from the 64-block slot read. Done 2026-11-02: the producer is confirmed on hardware (h=13 with a hand on the panel, h=0 on an untouched boot over 6176 frames). Still open: no boot has produced a 'TX x,y w= n=' line, so the coordinate domain and the x<-y_px transpose remain unverified - hold one corner for ~6 s so a page composition catches it.", "Done 2026-11-02 23:42 (defconfig:131 + board.toml:275; command line 996 of 1000): the archive is force-loaded and dk=0 is passed. Next: flash that payload and read the TOUCH HID row - started= (device started), driver= (the stock IOHIDEventDriver attached below it), key-reports (the Path-0 chain, one synthetic Home press per second), touch-reports (the sensor bridge). key-reports=0 means link or args and not the sensor; key-reports>0 with touch-reports=0 means the sink or the bridge; touch-reports>0 with a dead UI means the coordinate domain or DigitizerCollectionDispatch.", "The firmware upload is proven (up=0) and must run on every boot - the chip is a no-flash part. Sweep payload: evidence/payload/payload-stage10c-sweep40.img, read with work/verify/edl/readback-frames40.xml, analysed with work/verify/corner-calibration.py. Touch measurements must be taken inside ONE boot: the adaptive baseline settles differently every boot (two idle frames correlate only 0.295)."]

[[area.evidence]]
kind = "device"
reference = "package/DbyTouch/DbyTouch.cpp"
command = "fastboot flash preload evidence/payload/payload-probe2.img; then pwsh -File work/verify/read-bootlog.ps1 -Xml work/verify/edl/readback-bootlog-slots.xml; then python3 work/verify/show-probe.py"
revision = "9b0cbdbd5850cd8658500b929df6ecc42efc71f2"
result = "PROBE gic=00000012 ufs=00000300 tlmm=00000000 gcc=00000000 tlmmS=00000001 tlmmN=00000000, read back from the archived diagnostics page over EDL. gic and ufs prove the MMIO idiom works; the pin words were zero because the driver addressed west + pin * 0x1000 while the touch pins live in the south and north tiles - the one non-zero value (0x00000001 at 0x0F500000 + 39 * 0x1000) is the real GPIO_CFG39."

[[area]]
id = "gpu"
status = "device-verified"
components = ["Sm8250Platform", "ArmSmmu4K", "AdrenoFirmware", "AdrenoPM4"]
paths = ["board.toml", "configs/dby_w09_defconfig", "package/DbyGpuPowerProbe.cpp", "package/DbyGpuFirmware.h", "scripts/build-gpu-power-probe.py", "scripts/gen-gpu-firmware-header.py"]
inputs = ["Adreno 650 (SM8250). The shared tree's GPU components target Adreno 740, a different generation.", "Signed ZAP firmware, GMU and SQE images: read out of the tablet's own /vendor/firmware (a650_zap.elf 13964 B, a650_gmu.bin 41308 B, a650_sqe.fw 31460 B, from the vendor logical partition extracted out of super), plus the alioth copies the shared tree ships, which are the ones embedded in package/DbyGpuFirmware.h (GMU 41548 B, SQE 31632 B).", "The kit sources named by components: Sm8250Platform (A650GmuPower.c, A650GmuRegions.c, board copy of A650Gmu.c), ArmSmmu4K, AdrenoFirmware (HFI), AdrenoPM4 (packet encoder)."]
configuration = ["The board selects no GPU driver; com.apple.iokit.IOGPUFamily is kept in the prelink roots only because the donor closure requires it.", "IOCoreSurfaceRoot has to be published for the display stack to complete, which was done without any GPU hardware.", "The bring-up is selected by the kernel argument dby-gpu-power=<1..15> (board.toml:253 holds the current level). package/DbyGpuPowerProbe.cpp reads it and runs exactly one level, then stops; levels 1..15 are CX power, GMU clocks, GMU SMMU context, cold start, GX power, GPU SMMU context plus SQE plus ring 0, CP_ME_INIT plus CP_MEM_WRITE, stock ZAP through PAS 13, and the TZ queries.", "configs/dby_w09_defconfig:145-166 keeps CONFIG_XNU_NATIVE_ADRENO off, with the clang-24 failure that caused it written next to the symbol.", "The firmware blobs are generated into package/DbyGpuFirmware.h by scripts/gen-gpu-firmware-header.py and built into the probe archive by scripts/build-gpu-power-probe.py; the zap array was hand-swapped to the device's own image by work/verify/swap-zap.py."]
procedure = ["Build the probe with scripts/build-gpu-power-probe.py, then the payload, then python3 work/verify/payload-preflight.py <img> and require VERDICT: PASS before flashing.", "Advance one level per boot, keep the previous level's payload as the fallback, and re-prove the ladder from the bottom after any change to the power, SMMU or ring code.", "Read the result over EDL: work/verify/read-window-keep-edl.ps1 with work/verify/edl/readback-window.xml fetches the boot-log window at LBA 30684672 (8192 blocks), and python3 work/verify/decode-thisboot.py <img> --page all prints the rows.", "Before porting further, confirm an SM8250 GPU path exists upstream or scope the handover as its own project; do not adapt an Adreno 740 source line by line."]
findings = [
    "Everything currently on the panel is CPU-rendered scanout, so GPU work is an optimization and not the next blocker.",
    "The display stack reaching its started state without GPU proves the surface path is separable from rendering.",
    "2026-11-03 13:55, G-1 cannot be cleared by a bare register read: it hangs this SoC. The reviewed gate was in place (package/DbyGpuSmmuProbe.cpp dbyGpuSmmuReject: any single ID word at 0x0/0xFFFFFFFF, S1TS, SMS, NUMSMRG, NUMCB, NUMS2CB, UBS/OAS codes 0..5, PTFS4K bit12, distinctness of id0/id1/id2, ID2 IAS, ID1 page geometry against the 0x10000 map; the call site also waited for now>=20 and a written log slot). Payload stage22 (sha256 E6DEF527..., 46 args / 989 bytes, dby-gpu-smmu=1) froze the device: evidence/edl-log-s22 read over EDL shows rounds=10 slots_written=10 uptime_s=18, slots r=0..9, last page time=19s with procs=1 (only launchd) and NO GPU SMMU row at all. Slots are written every 2 s, so t=18 is the last one and t=20 is the round in which the probe first ran - it never returned. The comparison is stage21 (sha256 16080DCD..., 45 args / 974 bytes): 345 s, 159 slots, procs=250, SpringBoard p353 - note it is a DIFFERENT kernel binary (2df719f8...), so the 13:07 kernel (949bd994...) has never booted without the argument; the stage23 recovery boot is that first boot. procs=1 on the frozen page is not evidence (stage21 r=9 at t=19 s is identical), and 「no GPU SMMU row」 is entailed by the slot timing rather than independent proof; the discriminator is the missing t=20 store with write_errors=0 state=2. Panic vs stall is UNVERIFIED (no photo, no panic log region). This matches the vendor constraint the review cited: the GPU SMMU block must not be touched before gcc_gpu_memnoc_gfx, gcc_gpu_snoc_dvm_gfx and gpu_cc_ahb are enabled (vendor kgsl_iommu.c:945-956, kona-gpu.dtsi:269-274), and this kernel votes none of them. Conclusion: the input_bits <= 32 gate is real, but its verdict has to be read from inside the GPU bring-up, after gcc_gpu_cfg_ahb_clk (GCC+0x171004), gcc_gpu_memnoc_gfx / gcc_gpu_snoc_dvm_gfx (GCC+0x17100c / +0x171018), gpu_cc_ahb_clk (GPUCC+0x1078), the hlos1 SMMU vote clock (GPUCC+0x5000) and gpu_cx_gdsc PWR_ON (GPUCC+0x106c, poll gds_hw_ctrl+0x1540). That code ALREADY EXISTS in the pinned SoC feed: the missing owner is bits 2->3 of Sm8250Platform/A650GmuPower.c (writes the cfg_ahb enable bit, then clears SW_COLLAPSE and polls PWR_ON, :158-220), which gates the SMMU read on CX PWR_ON + the vote clock at :258-263 and returns SkippedPrereq otherwise - exactly the guard the ad-hoc probe lacked. Sm8250Platform is pinned in the sm8250-common feed but not wired here ([components] has no Sm8250Platform, CONFIG_XNU_NATIVE_ADRENO is not set). The reference board documents the same order (package/GpuProbe.cpp:158 gates GPUCC reads on mode>=3; :1789 starts the sequence 5 s after the late probe). A timeout around the read is impossible: an unclocked slave either SLVERRs or never completes, there is no in-kernel bound, and BootResetDby.c:321-328 returns -1 (no hypervisor watchdog), so boot_reset_watchdog is an inert stub. Ordering is the only protection. The probe stays linked and inert (without the argument it prints only GPU SMMU skipped) and its plausibility gate is kept for that powered path. Recovery payload-stage23-nosmmu-recovery.img (sha256 B9B27572..., 45 args / 974 bytes, the stage21 argument set) was flashed automatically at 14:03 and boots. G0 remains the only GPU result and it is link-only: scripts/build-adreno650.py archives the pinned Adreno650@70771a7 driver plus ArmSmmu4K@83969cd into 28 objects / 1672520 B; work/tracks/gpu-smmu-read-hang/REPORT.md is the full write-up.",
    "2026-11-03 15:10, G1 execution path in place: the GPU power/clock step now exists as code. The missing owner was upstream all along - FFT-infra/UniXNU-sm8250-common@26fd784 adds kits/Sm8250Platform (A650GmuPower.c: mode 2 writes gcc_gpu_cfg_ahb_clk s enable bit, mode 3 clears SW_COLLAPSE on gpu_cx_gdsc, polls gds_hw_ctrl for PWR_ON and waits for the hlos1 SMMU vote clock, and :258-263 refuses to read any SMMU register until those hold). The upstream catalogue never listed that component, so core components.toml gained a LOCAL Sm8250Platform entry (marked local, full sha, path kits/Sm8250Platform), feeds.toml a matching [[source]], and board.toml selects it. The SoC pin was deliberately NOT bumped: 6bb9b02 -> 26fd784 also carries dts/sm8250.dtsi changes to ufshc/ufsphy, and UFS is the only working storage path; verified the tree still uses the pinned adreno-650.0 DT. New package/DbyGpuPowerProbe.cpp maps the seven windows, implements A650GpuIo with bounds checks, calls A650GpuBringup and renders six rows (native_gpupower_rows); scripts/build-gpu-power-probe.py compiles it with the kernel s recorded C++ command and the kit with the recorded C command, force-loaded via defconfig. Boot argument dby-gpu-power=<1|2|3>; this round takes 1 (46 args / 990 bytes) - zero writes, GCC-only by the window mask. Two critical defects were caught in review before any flash. (a) package/LegacyDisplayProbe.cpp:493-496 called sheng_gpu_power_probe() from native_legacy_display_late_probe(), which bsd_init.c:1314-1315 runs inside bsd_autoconf - early, before the log writer stores a slot - and the one-shot guard would then have made the late BootProgress gate a no-op, i.e. exactly the pre-evidence MMIO that froze the device on 13:12. That call was REMOVED (BootProgress is the only call site), and the probe additionally carries its own witness gate: it weak-imports boot_log_slots_ok (new in BootLog.c, incremented only when the slot, message buffer, header write and sync all succeeded - boot_log_rounds is bumped before the header write and cannot serve) and returns without latching stage until that counter is non-zero. (b) mode 1 was not the zero-risk step it was described as: A650GmuPower.c s GPUCC and SMMU reads are gated on prerequisites (cfg_ahb enabled; CX PWR_ON plus the hlos1 vote clock), not on the mode, so a bootloader that left those clocks on would have made mode 1 read GPUCC and the SMMU. Fixed in the probe: the mode decides the have_windows mask the kit receives - mode 1 gets GCC/GCC_VOTE only, mode 2 adds GPUCC, mode 3 adds SMMU/GPU. mode 3 still needs the full capability gate (the old dbyGpuSmmuReject checks) and an answer to the gcc_gpu_memnoc_gfx / gcc_gpu_snoc_dvm_gfx question, both recorded as preconditions. Outcome matrix: survives with GPU PWR m=2 ... ahb=1 -> GPUCC is readable and cfg_ahb works, next is mode 3 (CX + vote clock + SMMU read); survives with GPU SMMU not read: state=2 -> the kit s gate refused as designed, go to mode 3; freezes again -> GPUCC reads are also unsafe on this board and the next step is mode 1 (GCC only).",
    "2026-11-03 20:30, G1 mode 1 and mode 2 measured on hardware, with the power probe now driven by the upstream Sm8250Platform kit. Mode 1 (payload stage28, 8440 s uptime, zero write errors) printed gcc=1 cc=4 smmu=4 gpu=4 cx=0 clk=0 ahb=0, cfg_ahb=00000001>00000001 (the branch is ALREADY ENABLED when the kernel starts), memnoc=80004221, dvm=80000001, gpll0=01206d7f. Two readings in that row had to be corrected afterwards: 80004221 and 80000001 both have CBCR_ENABLE (bit0) set AND CLK_OFF (bit31) set, i.e. enabled-but-halted, not off; an earlier report called dvm on. Mode 2 (payload stage35, 217 s uptime, zero write errors) printed gcc=1 cc=1, cxgdscr=00222001 (SW_COLLAPSE set, PWR_ON clear -> CX GDSC is off), cc_ahb=80000001 and cc_smmu=80000000 (the hlos1 SMMU vote is neither running nor even enabled), ahb=0 (no write happened, as predicted). So GPUCC is readable once cfg_ahb is on, the CX rail is down at boot, and mode 3 is NOT the zero-write case. Consequences recorded: (a) the memnoc pre-enable idea was rejected by review and by the register itself - a bit-0 write is a no-op when the enable bit is already set, and the branch is expected to unhalt once CX/GX power comes up (hypothesis that modes 3/4 test, not a measurement); (b) the SMMU verdict now also requires gpu_cc_ahb to be running, because the kit enables it and never verifies it and that is the SMMU register-interface clock; (c) a new mode 4 (3a) runs the kit mode 3 with the SMMU window masked, so the GDSC/clock writes can be proven on their own before the first SMMU read, since rows render only after A650GpuBringup returns and a freeze during the writes would otherwise leave no evidence. Mode 2 also validated the isolation rule: dby-touch=0 keeps the touch driver off hardware (it returns before mapWindows), so this boot had exactly one new variable. Artifacts: payload-stage28/35 for the two measurements, payload-stage36-gpupower4-3a for the next step; reports work/tracks/g1-mode1 and g1-mode2.",
    "2026-11-03 22:35, GPU route corrected after two independent reviews (external Adreno documentation plus a repository audit; work/tracks/gpu-route-review/REPORT.md). Two of the project s own assumptions were wrong. First, SMMU_IDR2 IAS/OAS is the SMMU s synthesised address width (arm_smmu_id_size_to_bits maps 0..5 to 32..48 bits) and is read-only: it is not a fuse, a client whitelist or a security gate, and mainline returns IOMMU_DOMAIN_IDENTITY for qcom,adreno clients, so the theory that input_bits below 36 refuses non-kernel clients has no mechanism behind it - and the e00002be figure that started it is alioth s driver-side clientWindowBytes()==0 refusal, never measured on this board. Second, the real gate is GPU secure mode: a6xx powers up secure, the supported exit is the signed zap shader loaded through PAS/TZ (DRI-devel 2019-04), and writing RBBM_SECVID_TRUST_CNTL directly is documented to take a secure target down. Neither SECVID writability nor the presence of a secure monitor has been measured here. The GMU cold start also needs five clocks (GPU_CC_CX_GMU_CLK/AHB/CXO, GCC_DDRSS_GPU_AXI, GCC_GPU_MEMNOC_GFX), the RSCC/PDC microcode, a650_gmu.bin and the HFI queues, none of which exist in the ladder; the kit s mode 6 has the clock sequence but nothing calls it. Host-side defects found and to fix before any GMU work: the kit gates on chip id 0x06050002 (AC/PIPA) while this board s vendor DTS says 0x06050000; the kit s HFI table reaches 670 MHz while the board s OPP table stops at 480 MHz; the kit s SMMU gate powers only gpu_cc_ahb and the hlos1 vote where the vendor powers the GDSC plus three clocks; and there are two competing GMU stacks with no declared owner (the G0 archive excludes NativeAdrenoService.cpp, so the linked driver path cannot cold start the GMU at all). Decision: run one bundled probe boot (re-read memnoc/dvm after power, print input_bits on every path, write-readback SCR0 to settle EL1 writability, set the GPLL0 GPU votes and re-read), then PAUSE the GPU track and move capacity to the A track (A7 Data, then A4/A5); resume only when U2 acceptance is met and A7 persists, or a GPU content requirement becomes the top acceptance item, or the GOP-to-GPU handoff gets its own milestone.",
    "2026-11-04, the ladder is measured on hardware, not inferred. package/DbyGpuPowerProbe.cpp (4076 lines, sha256 3C950687D9F202D17242F17258E37937DDAED48FDB0465EDDED14D30B96388F1) runs one bring-up level per boot under dby-gpu-power=1..15 and every level below the driver handover returns PASS in the boot-log window: CX power (gpu_cc_cx_gdsc), GMU clocks, GMU SMMU context bank 1 / ASID 2, A650GmuColdStart, GX power, GPU SMMU context bank 0 / ASID 1, SQE load, ring 0, CP_ME_INIT and CP_MEM_WRITE. Rows are in evidence/edl-log-s70 through s78. The CP proof (s70) reads GPU CP st=00000000 rptr=0000001b wptr=00000024 me=1 mw=2 sf=3 hf=00000000 mark=a6500c0d, where mark is the CP_MEM_WRITE payload, i.e. the command processor really executed from the ring and wrote memory.",
    "2026-11-04, ZAP and secure mode are cleared with the device's own firmware. Mode 15 loads the tablet's /vendor/firmware/a650_zap.elf (13964 B, sha256 ba430ec576dc469a77237d0f47ba4f6feb71478fe643a3fd202413a3a61c03c9) through PAS 13 with that image's own signature metadata instead of the alioth image the shared tree ships (payload stage81 sha256 78ecfc25c7f283fc8d8133ca5232063f91d59c94ce2166325d72d857b4038533, evidence/edl-log-s78): GPU ZAP st=00000000 step=7 init=00000000/00000000 mem=00000000/00000000 auth=00000000/00000000 sec=0 tr=00000001. sec=0 is the CP reporting unsecured mode after CP_SET_SECURE_MODE(0), which is what the vendor sends through the ring once zap_loaded is set (adreno.c:2001-2021), and the order matches the vendor's a6xx_hw_init -> CP init -> a6xx_zap_load -> adreno_set_unsecured_mode (adreno_a6xx.c:922, :926, :931). The first attempt with the alioth zap was refused, init=ffcfffbb (evidence/edl-log-s71); the refusal was the OEM signature, not a missing PAS.",
    "Two writes on this path are known-bad and must not be retried without new evidence: writing RBBM_SECVID_TRUST_CONTROL 0xF400 stalls the interconnect whether or not the value is read back (prog=4, evidence/edl-log-s75 and s79/s80), and the vendor only writes it when zap_loaded == 0 (adreno.c:2039-2043); handing the PAS loader the alioth image with corrected metadata hung the CPU in EL3 (prog=3, evidence/edl-log-s74). A stall here is not a panic: the boot-log page keeps its last slot and the uptime stops.",
    "The remaining step, handing the GPU to a driver, is blocked in the shared tree rather than on the device: src/UniXNU/drivers/Adreno740/NativeAdrenoService.cpp:95 (OSDefineMetaClassAndStructors) makes clang-24 assert in RecordLayoutBuilder.cpp:3439 (reproduced, rc=-6), and NativeAdrenoGmuConfig.h:6 includes ShengGmu.h, the SM8550 GMU backend, which has no SM8250 counterpart. Neither defect is a hardware limit, so the ladder above is not lost work; the route that resolves them is the subject of work/tracks/adreno-build-path/REPORT.md.",
    "pas_supported(13) returning a1=0 on this board is advisory and is not evidence that PAS 13 is unavailable (evidence/edl-log-s76: sup=0/0 avail=0/1 tr=1). kgsl never calls qcom_scm_pas_supported, only qcom_wcnss.c:480 does, and the tablet runs Android with the same TZ, so the query says nothing about the loader; the loader worked.",
    "2026-11-05, the archive builds again and the two records that called it a compiler blocker are corrected. kits/ArmSmmu4K was checked out 4 commits behind origin/main (3ba9245 vs the catalogue pin 83969cd, which carries `feat(smmu): allocate page tables on demand`, 48dbd6c); with the submodule switched, scripts/build-adreno650.py compiles 28 objects into build/adreno740/libAdreno740.a (1672432 B, sha256 85a7bfee9bff615ed50fec095eb0f6cdda022cbd11dfb80c34f345cefe58c116, evidence/gpu-archive-r1/build-report.json). The clang-24 assertion at NativeAdrenoService.cpp:95 is error recovery on an invalid RecordDecl (the XNU type-signature patch reaches RecordLayoutBuilder.cpp:3439) caused by the missing ShengGmu.h and ArmSmmu4KTablePages types, not by flags or by the metaclass macro: work/verify/verify-h1.py reproduces w0/w1 crashing and w2 (both types supplied) not crashing. Link-time gaps left: _native_gpu_dcvs, _native_gop_handoff_call, _native_gop_handoff_memory.",
    "2026-11-05, R2: build/adreno740/libAdreno740.a is force-loaded into the kernel and the link succeeds. CONFIG_XNU_NATIVE_ADRENO=y plus CONFIG_XNU_NATIVE_ADRENO_ARCHIVE in configs/dby_w09_defconfig, build-adreno650.py last in board.toml [kernel] archives; kernel.macho sha256 e9aca811359454c7ebd9209a13da3cbe38f98240a9b4d2a795e1bfadb2bee2f7 (evidence/gpu-archive-r1/kernel-r2.json). Nothing in the driver runs at G0: no caller and no boot argument, so the image cannot change a boot by itself.",
    "Three link failures came out of R2 and each has a cause on disk, not a guess: (1) '_native_gpu_dcvs' and '_native_pmap_user_mappings' undefined -- the driver declares them weak_import and a static kernel link still refuses an undefined weak_import, so package/BootProgressStubs.c now carries the reference board's own answer (alioth package/BootProgressStubs.c: 15-entry DVFS array of zeros, pmap probe returning 0); (2) 41 duplicate symbols between libAdreno740.a and libDbyGpuPowerProbe.a -- both embed AdrenoFirmware/AdrenoHfi/AdrenoPM4/ArmSmmu4K and both are force_load'ed; (3) dropping the probe archives leaves _native_gpusmmu_census and _sheng_gpu_smmu_probe (BootLog.c:148, BootProgress.c:103) undefined, which the same stub file now answers.",
    "The driver archive and the ladder probe cannot both be force-loaded today. The board therefore has two named configurations, switched by work/verify/toggle-gpu-config.py: 'ladder' (probes in, driver archive out -- what the tablet runs, payload stage81) and 'g0' (driver archive in, probes out -- what R2 proved links). Resolving the duplication properly is part of R3: one of the two has to stop compiling its own copy of the kits.",
    "The archive recipe needed a driver lookup because the tree never has one: under schema_version 2 unixnu tree keeps only the components board.toml selects (src/UniXNU/scripts/unixnu/components.py:102 and :111-117), so the feeds.toml Adreno740 [[source]] is dropped even though it is pinned at 70771a7. build-adreno650.py now looks in the tree first, then beside the repository the package symlink resolves to, then beside the script (driver_candidates). Selecting the catalog Adreno740 component instead is not the answer: its dependencies pull Sm8550Platform and its build is build-arm-driver.py Adreno740.",
    "2026-11-06, kit ownership resolved (option ii of work/tracks/gpu-r3-wiring/REPORT.md): the 13 kit TUs (ArmSmmu4K x8, AdrenoPM4, AdrenoFirmware/Hfi x4) are compiled once into build/adreno-kits/libAdrenoKits.a by scripts/build-adreno650.py --kits-only, that archive is the LAST word of CONFIG_XNU_EXTRA_LD_ARCHIVES and is not force_load'ed, so it sits after the driver's force_load on the ld line (build-xnu-4k-baseline.sh:626, :755-757) and satisfies both consumers. The driver archive is now the 15 driver TUs only (1419704 B, sha256 d5a7d3d3354fd0ad1ab68c11b2e34688db664ce5e134d5036b0af8c99083c748) and the ladder probe archive is 4 TUs (754832 B, sha256 a0e5898e724ad81408ee50af3ec26607d0d714b43843129cc60c339e8bd410fc). Both are force_load'ed in one kernel: sha256 33382ba6f1cf793ec94f16dd68dbf8d7743481b09112963beb0b31e5f50f31a6, one definition each of _ArmSmmu4KLivePrepare, _AdrenoPM4Type7, _A650GmuColdStart, _NativeAdrenoGpuContextBringupRoutes and _native_gpu_dcvs, zero undefined symbols. The 41-duplicate problem is gone, so the board no longer needs two configurations; the invariants are checked by work/verify/toggle-gpu-config.py (7/7).",
    "2026-11-06 01:26, G-1 measured on the device, first time: input_bits = 48. The mode-15 ladder now renders the number from the identity word its GPU context encode already reads and proves (package/DbyGpuPowerProbe.cpp renderZap, the row starts with input_bits=), and the archived boot (evidence/edl-log-s79/decoded.txt, 276 of 286 slots) carries `GPU CP st=00000000 rptr=0000001b wptr=00000024 input_bits=48 id2=00005511 me=1 mw=2 sf=3 hf=00000000 mark=a6500c0d` next to `GPU ZAP ... sec=0 tr=00000001`. Decoding ID2=0x00005511: UBS bits[11:8]=5 -> 48-bit input address, OAS bits[7:4]=1 -> 36-bit output, IAS bits[3:0]=1 -> 36-bit input address size, PTFS_4K bit[12]=1 -> 4 KiB granule. So the driver's gate (input_bits <= 32 makes every non-kernel client fail with e00002be) is CLEARED with 16 bits of margin, and a 4 KiB granule is the one this board's tables already use.",
    "2026-11-06, the vendored GPU documentation and pins were audited against upstream (work/tracks/upstream-sync/REPORT.md, 781 lines; work/tracks/upstream-sync/AUDIT.md). Four results: (1) at audit time src/UniXNU was da14170, exactly 392 commits behind UniXNU/UniXNU main 7307c26; upstream main has since moved to e2fdae4 (413 commits behind da14170), and the vendored docs were replaced from that tip in b14e515 - 819 files byte-identical to work/upstream/UniXNU-live/docs - so the local pages are no longer an older-core snapshot. (2) The GPU chapter is written against Adreno740/SM8550, not the A650 line this board runs: it documents sheng-gpu-preempt and sheng-fb-bgra (the preemption mode needs NativeAdrenoPreempt.*, absent from 70771a7) and invokes tools/options the vendored core lacks (make-m2vpack.py, read-sheng-log.py, make-gpu-addon.py --cache-export and --pipeline-pack); following it would wire against code this board does not have. (3) The Adreno740 pin did not move: NativeAdrenoRing.cpp, NativeAdrenoGpuContext.h and NativeAdrenoGmuContext.h at 10304855 and at main 6fa7bae2 contain 0 matches for 0x06050002 and SM8250, the tree comparison against 6fa7bae2 shows 94 common files (64 identical, 30 differing, including those three), and the A650 content is byte-identical to FFT-infra/Adreno650 70771a7. (4) The A650 working tree was committed as 25b448e (49 files, +3111/-857) and pinned by parent commit 5fdcdc0, so it is no longer uncommitted: git submodule update at that gitlink is a no-op and, without --force, refuses to overwrite a dirty submodule. work/gpu/adreno740-a650-workingtree.patch (427180 B) covers 48 of the 49 files (+3040/-857) and reverses cleanly, but it omits tests/test_system_memory.cpp (+71), so it is a record of the earlier working tree, not a complete restore point.",
    "2026-11-06, the earlier claim that no UniXNU port had ever composited the desktop on the GPU is WRONG and is retracted here (work/tracks/gpu-desktop-precedent/REPORT.md, evidence with permalinks). FFT-infra/UniXNU-alioth is a Redmi K40: SM8250-AC and an Adreno 650, the same silicon class as this tablet. Its dated evidence says the GPU renders into the compositor's surface and the display copies it to the panel (docs/evidence/2026-10-29-gpu-gx-and-context.md @5cb506f0: '22 copies of 1080x2400x4 bytes, all retired', 'the picture on the panel is the desktop', 'seen on the panel, not inferred'; commits 76f34824 'evidence: the desktop draws' and bc908974). It also registers the Metal accelerator (GPUROW24: IOGPUFamily loaded, class size 136, IOAcceleratorES -> MetalPluginName -> NSBundle). Two other ports corroborate: UniXNU-sheng (A740) shows the home screen with icons and AdrenoMetal's README states GPU composition verified there, and ShueiTsuki/data-a-live credits UniXNU for the same on an A840. So the ladder below is not speculative work: it is the same route, on the same SoC, one reference board ahead. Alioth is honest that it is not yet boot-to-boot stable ('the desktop appearing is a race'), so the target is 'reaches the panel', not 'deterministic'.",
    "2026-11-06 04:40, mode 18 on hardware: the command processor executes from the archive's own ring. Row, stable across all 52 slots of the boot (evidence/edl-log-s82/decoded.txt, uptime 102 s): 'GPU ARC gx=00000000 gpu=00000000 buf=00000000 bits=48 nrm=8 | RING st=1 at=00000000 cp=00000000 w=00000000 o=1'. st=1 is the verdict (CpInit returned 0, idle() returned 0 and the observed fence reached the one the ring handed out); o=1 is the CACHE_FLUSH_TS timestamp retired by the CP, i.e. the CP really fetched and executed out of the ring the archive allocated at IOVA 0x200000. The path that produced it: the archive's GPU context, then the device-proven hw_init preamble (CP_PROTECT, CP_MEMPOOL, ROQ/IB thresholds, CP_APRIV_CNTL, RBBM_INT_0_MASK=0), then the a650_sqe.fw microcode copied into the archive's SQE buffer with readback, CP_SQE_INSTR_BASE/CNTL, ring gen 6 attach, CP_ME_INIT and a 100 ms fence wait. The previous round without the preamble failed exactly as predicted: 'w=e00002d6 o=0' (evidence/edl-log-s81) - the CP accepted the WPTR and never fetched.",
    "2026-11-06, mode 19 (GPU interrupt + published service) hung the kernel about two seconds into boot: evidence/edl-log-s83/decoded.txt shows rounds=1 slots_written=1, the page stops at time=2s with procs=1 and launchd just exec'd, and there is no GPU row at all - mode 18 writes 52 slots on the same image (evidence/edl-log-s82). A hung kernel also stops the boot-log writer, so in-kernel step markers cannot localise this; the four new calls are therefore bisected across boots with staged modes: 20 = NativeAdrenoIrq attach + programMask(true) only, 21 = + armcpu_spi_attach(332), 22 = + Submit/Timer attach, 19 = + native_adreno_publish. The device was restored to stage87 (mode 18) before the next round.",
    "2026-11-06 13:30, mode 19 on hardware: the GPU service is PUBLISHED and its interrupt is live. Rows, stable across all 149 slots of a 303 s boot (evidence/edl-log-s85/decoded.txt): 'GPU ARC gx=00000000 gpu=00000000 buf=00000000 bits=48 nrm=8 | RING st=1 at=00000000 cp=00000000 w=00000000 o=1' and 'GPU PUB st=7 s=00000000 t=00000000 i=00000000 m=03d0e242 spi=00000000 p=00000000 rb=0000a002 n=1'. Reading it: st=7 is the last step (publish returned); Submit::attach, Timer::attach and Irq::attach all returned 0; m=03d0e242 is exactly kEnableA6xx, so programMask's readback matched the A6xx enable set rather than the A7XX default that would mask the two IB interrupts; spi=0 means armcpu_spi_attach claimed INTID 332 as a level line; p=0 means native_adreno_publish returned success, so IOPMrootDomain and every later user client can find the device; rb=0000a002 is the GIC readback (enabled, level, group 1); and n=1 is the handler count - a GPU interrupt was actually delivered and acknowledged, which is the one thing the row could not have faked before this round. Two earlier attempts at this measurement were void and are recorded so they are not repeated: the board booted dby-gpu-power=18 (the payload's argument was never bumped) and the one-slot log that looked like a mode-19 hang was a boot the owner interrupted at monitor-time 2 s, eighteen seconds before the probe is allowed to run (BootProgress.c:1251-1259, DbyGpuPowerProbe.cpp:4599-4601).",
    "2026-11-06 13:30, mode 19 on hardware: the GPU service is PUBLISHED and its interrupt is live. Rows, stable across all 149 slots of a 303 s boot (evidence/edl-log-s85/decoded.txt): 'GPU ARC gx=00000000 gpu=00000000 buf=00000000 bits=48 nrm=8 | RING st=1 at=00000000 cp=00000000 w=00000000 o=1' and 'GPU PUB st=7 s=00000000 t=00000000 i=00000000 m=03d0e242 spi=00000000 p=00000000 rb=0000a002 n=1'. Reading it: st=7 is the last step (publish returned); Submit::attach, Timer::attach and Irq::attach all returned 0; m=03d0e242 is exactly kEnableA6xx, so programMask's readback matched the A6xx enable set rather than the A7XX default that would mask the two IB interrupts; spi=0 means armcpu_spi_attach claimed INTID 332 as a level line; p=0 means native_adreno_publish returned success, so IOPMrootDomain and every later user client can find the device; rb=0000a002 is the GIC readback (enabled, level, group 1); n=1 is the handler count, i.e. a GPU interrupt was really delivered and acknowledged. Two earlier attempts at this measurement were void and are recorded so they are not repeated: the board booted dby-gpu-power=18 because the payload's argument was never bumped, and the one-slot log that looked like a mode-19 hang was a boot the owner interrupted at monitor-time 2 s, eighteen seconds before the probe may run (BootProgress.c:1251-1259, DbyGpuPowerProbe.cpp:4599-4601).",
    "2026-11-06 14:50, mode 23 on hardware: a client opens the published GPU device and reads its ABI. Row, stable across all 123 slots of a 247 s boot (evidence/edl-log-s86/decoded.txt): 'GPU UC st=7 open=00000000 again=00000000 q=00000000 info=00000000 chip=06050002 ok=1 abi=2 in=48 out=36', with the mode-19 row unchanged beside it. Reading it: the first newUserClient(kernel_task, type 0x4147) returned success, a second open returned kIOReturnBusy (the driver's one-client rule, so the open really reached it), NativeAdrenoMethodQuery and NativeAdrenoMethodGetDeviceInfo both answered with exact record sizes, and the chip id in the reply equals the one published (0x06050002), so the reply came from our device and not from a zeroed record. abi=2, in=48, out=36 agree with the G-1 ID2 decode, i.e. the client is told the same address sizes the SMMU was programmed with. Two defects had to be fixed first and both are instructive: serviceMatching(\"NativeAdrenoGpu\") can never match, because serviceMatching looks up the C++ CLASS name while setName() only writes the registry IOName (the class is NativeAdrenoGpuPublished), so the reference's native_adreno_published_service() accessor is the right route; and the client must be closed with clientClose(), not just released, or the driver keeps kernel_client set, one of its four rows and a leaked core for the rest of the boot.",
    "2026-11-06 18:25, mode 24 on hardware: a client's command buffer is EXECUTED by the CP and its writes land in client memory. Row, stable across all 59 slots of a 117 s boot (evidence/edl-log-s87/decoded.txt): 'GPU BO st=11 a=00000000 m=00000000 c=00000000 mem=00000000 sub=00000000 w=00000000 rd=0', beside mode 23's 'GPU UC st=7 open=0 again=0 q=0 info=0 chip=06050002 ok=1 abi=2 in=48 out=36'. Reading it: two BoAlloc, two BoMap at client IOVAs (0x100004000 / 0x100005000, inside the aperture a client is actually given), two BoCpuMap, clientMemoryForType for both tokens, an IB of three CP_MEM_WRITE packets submitted as one indirect buffer, a fence wait that completed, and then the target buffer holding 0x0badc0de / 0xfeed0001 / 0x600d0003 - the values the IB wrote, not values the probe put there (it filled the buffer with 0xdeadbeef first). Three review catches made this measurement trustworthy and are worth keeping: WaitFence's output record is ZERO bytes, so passing one fails with kIOReturnBadArgument before the method runs; the read-back must start at a sentinel, because a BSS zero renders rd=0 and reads exactly like success; and the BO IOVAs have to be >= GpuClientVaStart, because 0x20004000 only worked for a kernel-owned connection whose scope is zeroed and would have proved the wrong thing."]



completion = [
    "A GPU-backed surface presents and the frame counters move without the CPU renderer.",
    "The ladder reaching ZAP clear is the half of that completion this board can prove without a driver: the GMU is up, the CP retired a fence, the service is published with a live interrupt and secure mode is cleared, so the path from XNU to the GPU core is established even before a client exists."]
limits = [
    "A client has never opened the published device: mode 19 proves publication and a live interrupt, not that a user process can map buffers or submit work.",
    "This build links the A740 context header, which places the SQE at 0x100000 inside the advertised [0,0x120000) GMEM aperture. Harmless while no client exists, but it must be settled before the first client round, or a client would find the SQE inside its GMEM.",
    "The GMU and SQE images embedded in package/DbyGpuFirmware.h are the alioth copies (41548 B / 31632 B), not the tablet's own (41308 B / 31460 B). Cold start and the ring work with the alioth copies, so the size difference is recorded rather than explained.",
    "The kit gates on chip id 0x06050002 while this board's vendor DTS says 0x06050000, and its HFI table reaches 670 MHz while the board's OPP table stops at 480 MHz; the probe works around both, so neither is fixed upstream yet.",
    "The documentation matches upstream main e2fdae4 (819/819 files identical) and the A650 edits are committed and pinned (25b448e, gitlink 5fdcdc0). The remaining gap is the patch backup: work/gpu/adreno740-a650-workingtree.patch covers 48 of the 49 files and omits tests/test_system_memory.cpp."]
next_action = [
    "Mode 25 (host + device rounds): the same round from a REAL user process, not kernel_task, plus the desktop: a user-space client that opens /dev-style through IOKit, maps a surface and submits frames. The known blockers are the four client slots, the slot-0 window needing to exceed 967 MiB, and backboardd's SIGBUS with the Metal plugin (try TU_DEBUG=sysmem); the GPU copy path is mandatory - zero-copy never worked because MDP writes hang under the secure-world display configuration this board boots with.",
    "Do not port NativeAdrenoService.cpp; pipa and alioth both exclude it. Retire the ladder probe once the client round is replaced by a user-space client, which restores the upstream single-archive shape."]



