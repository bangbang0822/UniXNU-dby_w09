# 本板的源钉选（会写进 unixnu.lock，发布前逐条复核 URL 与 commit）。
#
# Apple 参考源（xnu、libplatform、libdispatch、AvailabilityVersions、edk2、libpthread、
# corecrypto-2023、IOStorageFamily）由基础仓 feeds.toml 钉住，这里不重复。
# 机器相关路径永不写进本文件：拷 local.toml.example 到被忽略的 local.toml，
# 或在命令行用 --local-module。见 https://unixnu.com/porting/device-repository。

# SM8250 / kona 共享硬件描述：dts/sm8250.dtsi、configs/sm8250.config、patches/xnu/series。
# [board] soc_source = "sm8250" 指的就是这条。
# a6e7e36 是官方同 SoC 板 alioth 钉的那一条，比原来的 6bb9b02 多两样本板要用、
# 且只能由 SoC 层拥有的东西：patches/xnu/series 里的 native-smp-secondary +
# native-smp-type-clusters（多核与 E/P 大小核的内核侧），和 kits/Sm8250Platform 的
# A650 GMU 源码与 sm8250.dtsi 里 status = "disabled" 的 gpu/gmu/gpu_smmu 节点。
# 换 pin 前这两份补丁是本板 device series 用 arch: 代管的（见 patches/xnu/series）。
[[source]]
name = "sm8250"
kind = "soc"
git = "https://github.com/FFT-infra/UniXNU-sm8250-common"
commit = "a6e7e36caab58f5b9a5625dbdb8da2bf290fa5cc"

# 官方目录里的 ShengUfs 是 SM8550 范围的（hardware = ["SM8550 UFS controller"]、
# board_dependencies 里写死 SM8550 clocks/SMMU），本板要的是同一驱动里带
# SM8250 stream（0x0e0 / 0x4e0）与 qcom,sm8250-ufshc 匹配的这支。
# 目录 ID 保持不变，只把源换掉——这也是 alioth（同为 SM8250）的做法。
[[source]]
name = "ShengUfs"
kind = "driver"
git = "https://github.com/FFT-infra/NativeUfs-alioth"
commit = "ab5405905a1892da03a9a53e0fa3dcd255d04055"

# GPU 驱动源。**name 必须是 Adreno740**：那是核心 components.toml 里的组件身份
# （Adreno740 依赖 AdrenoPM4/AdrenoFirmware/Sm8550Platform），我们的芯片是 A650，但源仓库
# 是 Adreno650 的 fork —— 与 alioth（同为 SM8250）完全相同的做法。
#
# **钉 alioth-ring 线的 70771a7，不要用 fft 分支的 bef707a**：
#   - 70771a7 把用户态客户端改成「每连接独立地址空间」，
#     window = (1<<input_bits) - GpuClientVaStart(0x100000000)；
#   - fft@bef707a 仍是静态 kClientWindows 表（slot0 512–1536 MiB、slot1 1536–1706.66 MiB），
#     README 里那个 OutOfMemory(Device) 就是它的；而本板 1600x2560 的像素量是参考板的 1.58 倍，
#     客户端 VA 压力更大，正好落在 fft 死掉的那一点上。
#
# G0 只做接线：归档编进内核但**不传 pipa-gpu=**，GpuProbe 的门是
#   if (gMode || !parsed || !mode) return;
# 没有参数、解析失败、为 0、或第二次进入，都在碰任何寄存器之前返回。
[[source]]
name = "Adreno740"
kind = "driver"
git = "https://github.com/FFT-infra/Adreno650"
commit = "70771a71795d7e1a78afdb82badd7943adb0a3a0"
# GPU 电源/时钟 kit（SM8250 + Adreno 650）。它是 soc feed 里 52bab45dde057f053c47ab4b73166f34b4e42678 才加进来的模块，
# 而本板 [board] soc_source 仍钉在 6bb9b02；直接 bump soc 会把 dts/sm8250.dtsi 的
# ufshc/ufsphy 改动一起带进来（uart/UFS 是当前唯一在工作的存储路径，不能顺手动）。
# feeds 的 git source 是"按模块路径 sparse checkout"，所以这里单独取这一个 kit。
# 上游来源：FFT-infra/UniXNU-sm8250-common 52bab45dde057f053c47ab4b73166f34b4e42678 "gmu: the HFI 30 vote alone,
# and the status that says which half failed"（在我们的旧 pin 26fd784e 之上只加 A650GmuSetFreq，+20/+2 行；
# 该 kit 由 26fd784e 引入，本 pin 是它的快进，无其他改动）。
[[source]]
name = "Sm8250Platform"
kind = "kit"
git = "https://github.com/FFT-infra/UniXNU-sm8250-common"
commit = "52bab45dde057f053c47ab4b73166f34b4e42678"
# 只取这一个 kit 子目录（sparse checkout）：整仓 checkout 会让 tree 的 kits/Sm8250Platform
# 指向仓库根，变成 kits/Sm8250Platform/kits/Sm8250Platform/…，与目录声明的 path 不一致。
path = "kits/Sm8250Platform"

# Adreno 的 firmware/HFI 与 PM4 两个 kit（2026-11-04）：A650Gmu.c 冷启动需要 AdrenoHfiStartup.h /
# AdrenoFirmware.h，它们属于这两个 kit；树里原本没有 materialize，编译 A650Gmu.c 会直接 "file not found"。
# 版本取自 components.toml 的 catalogue（AdrenoFirmware 20ad3d7a、AdrenoPM4 282606b5）。
[[source]]
name = "AdrenoFirmware"
kind = "kit"
git = "https://github.com/UniXNU/AdrenoFirmware"
commit = "20ad3d7a"
path = "kits/AdrenoFirmware"

[[source]]
name = "AdrenoPM4"
kind = "kit"
git = "https://github.com/UniXNU/AdrenoPM4"
commit = "282606b5"
path = "kits/AdrenoPM4"

# ArmCpu：基础目录钉的 UniXNU/ArmCpu@9066b53 把每个核都登记成启动簇的类型
# （ArmCpu.cpp:402/452 两处都是 info.cluster_type = ml_get_boot_cluster_type()），
# 也从不调 ml_cpu_init_completed()——本树里唯一的调用点在 AppleARMSMP.cpp:236，而本板的
# 次核是 ArmCpu 自己拉起来的，走不到那条路。后果是：dts 里写的 unixnu,cluster-type 到不了
# processor 注册，Edge 调度器也不会建立簇间 edge（不建就没有跨簇迁移和窃取），所以
# native-smp-type-clusters.patch 单独落地并不能解决「非常卡」。
# xVanTuring/ArmCpu@a9c4585 这支持有：clusterType() 读 topology->cpus[cpu].cluster_type、
# 全部核注册完后调 ml_cpu_init_completed()，并把 SPI IPI 的 INTID 基址改为按 GICD_TYPER 推
# （固定 1008 只是 sheng 的写法）。官方同 SoC 板 alioth 的 feeds.toml 正是这么钉的，
# 它的 cpu 记录给出真机证据：每进程 c0..c7 都有计数、P 簇承担数倍于 E 簇的负载。
# 换源前已核对：本板 package/kits/scripts 引用的 19 个 armcpu_* 符号在这支里全部存在。
[[source]]
name = "ArmCpu"
kind = "driver"
git = "https://github.com/xVanTuring/ArmCpu"
commit = "a9c4585dbb1b75b8594dd0ae54962cc59969d98f"
