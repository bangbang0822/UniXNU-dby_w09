# Diagnostic, not part of the build: one Ubuntu job and one macOS job that do nothing but say which
# runner image answered. The 2026-11-16 package runs were all cancelled with "The job was not acquired
# by Runner of type hosted even after multiple attempts" while Ubuntu workflows in this repository
# started normally, and this file is what tells those two cases apart without another build.
name: runner check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "linux ok: $(uname -a)"
  macos:
    runs-on: macos-15
    steps:
      - run: |
          echo "macos ok: $(sw_vers -productVersion) $(xcodebuild -version | head -1)"
  # The same image with a job shaped like the package one: a checkout with submodules and a long
  # timeout. If this one is acquired while `package` is not, the difference is something in that
  # workflow rather than the runner pool.
  macos-heavy:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - run: |
          echo "macos heavy ok: $(sw_vers -productVersion)"
          echo "device files: $(find device -type f | wc -l)"
          sleep 30
