name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and
# uefi-dby_w09 checkouts beside it, the layout board.toml names. The platform seed
# comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the
# images, so the run's artifacts belong to one device alone: download them, then
# delete the run.
#
# The Data seed is produced on macOS and its APFS volume UUID has to equal
# CONFIG_XNU_OWNER_DATA_VOLUME_UUID in configs/dby_w09_defconfig. The cache below keeps that one file
# between runs, and a run that finds no cached seed stops - unless init_data is set. That input is the
# first-install path for a repository that has never had a seed (a fresh fork): the runtime step builds
# one on the runner, which has the macOS hdiutil the seed tool needs, and rewrites the UUID before the
# kernel compiles. A cached seed is reused even when init_data is set; the input only answers "what if
# there is no cache".

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["ipados-17.7.11-21H461"]
        default: "ipados-17.7.11-21H461"
      init_data:
        description: "Build a Data seed when no cached one exists (first-install path for a repository with no seed cache)"
        type: boolean
        default: false
      runner:
        description: "Runner image. macos-26 is what this board is qualified on; the older images are the fallback when GitHub has no capacity for it (the 2026-11-16 runs were cancelled with 'not acquired by Runner of type hosted even after multiple attempts')"
        type: choice
        options: ["macos-26", "macos-15", "macos-14"]
        default: "macos-26"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: dby-w09
  OS_PROFILE: ${{ inputs.os }}
  RUN_DIR: out/dby-w09/${{ inputs.os }}/dby_w09/runtime

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      # The board builds against the dby-w09 line of the core, not the public main: board.toml
      # selects QcomXnuUsbDebug, which only that line's components.toml carries, and the build stops
      # with "unixnu: unknown component: QcomXnuUsbDebug" on main. That line lives on gitee and its
      # history is unrelated to github.com/UniXNU/UniXNU, so this is a clone rather than a checkout of
      # a branch of the public repository. The core's own submodules are GitHub URLs.
      - name: UniXNU core
        run: |
          # --branch selects the mirrored line. The temporary rebuild branch is based on its 7b tip
          # (which contains the board-required f28 revision) and adds the APFS image-store fix needed
          # to recreate the missing Data seed on current macOS runners.
          #
          # Cloned from the GitHub mirror of that line, not from gitee: on 2026-11-17 a run sat for
          # 300 s and failed with "unable to access https://gitee.com/... Connection timed out", and
          # every runner is somewhere else in GitHub's network. The mirror is a plain push of that line.
          git clone --branch dby-w09 https://github.com/bangbang0822/UniXNU-core-dby-w09.git UniXNU
          git -C UniXNU fetch origin refs/heads/codex/rebuild-macos-2026-11-26
          git -C UniXNU checkout --detach 973f86d6bb7e336e255204b0cf5171b759de1c03
          git -C UniXNU submodule update --init --recursive
          # This core pin predates the matching SystemOS policy signer. Add the official helper to
          # the core source before tree assembly so every subsequent tree refresh preserves it.
          systemos_tool=UniXNU/scripts/build-owner-systemos-policy.py
          curl -fL --retry 3 --retry-delay 5 -o "$systemos_tool" \
            "https://raw.githubusercontent.com/FFT-infra/UniXNU/e0ee2ad9a2654309480c8b0cc725d0dc09186cd4/scripts/build-owner-systemos-policy.py"
          printf '%s  %s\n' \
            'a29a653da6812ed092bb548eb37c645b34677c57326047e19369d3bc46e7d700' \
            "$systemos_tool" | shasum -a 256 -c -
      - uses: actions/checkout@v4
        with:
          repository: WQSQW/uefi-dby_w09
          path: uefi-dby_w09
          submodules: recursive
      - name: tools
        run: |
          # glslang is what build-turnip-darwin.py asks for by name ("glslangValidator is required
          # by the Vulkan runtime build") before it configures Mesa's Vulkan runtime; bison and flex
          # generate src/freedreno/ir3/ir3_parser.c, and macOS ships bison 2.3, which cannot; shaderc
          # and spirv-tools are what gen-turnip-smoke-shaders.py runs (`glslc` then `spirv-val`).
          brew install dtc llvm lld cmake mtools ninja glslang bison flex shaderc spirv-tools openssl@3 \
                       blacktop/tap/ipsw
          # The Metal bridge is a Rust static library and build-adreno-metal-bridge.py asks for the
          # pinned toolchain by name (`cargo +1.98.0`), which the image's default Rust does not have.
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # The bridge cross-builds for the board's iOS target; a fresh toolchain only carries the
          # host's, and without this the build stops at "can't find crate for core" inside typenum.
          rustup target add --toolchain 1.98.0 aarch64-apple-ios
          llvm_prefix=$(brew --prefix llvm)
          bison_prefix=$(brew --prefix bison)
          openssl_prefix=$(brew --prefix openssl@3)
          export PATH="$openssl_prefix/bin:$PATH"
          {
            echo "$bison_prefix/bin"
            echo "$llvm_prefix/bin"
            echo "$(brew --prefix lld)/bin"
            echo "$openssl_prefix/bin"
          } >> "$GITHUB_PATH"
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool openssl \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in llvm-nm llvm-objcopy llvm-ar; do
            [ -f "$llvm_prefix/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          for t in bison flex glslc spirv-val cargo rustup; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        with:
          path: |
            UniXNU/out/dby-w09/${{ inputs.os }}/dby_w09/runtime/data.dbr
            UniXNU/out/dby-w09/${{ inputs.os }}/dby_w09/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: require the preserved Data seed
        if: ${{ !inputs.init_data }}
        run: |
          seed="UniXNU/out/dby-w09/$OS_PROFILE/dby_w09/runtime/data.dbr"
          if [ ! -f "$seed" ]; then
            echo "No cached Data seed at $seed." >&2
            echo "Restore the seed produced for this unit, or run with init_data=true to build one here (the runner has the macOS hdiutil that the seed tool needs)." >&2
            exit 1
          fi
      # Assemble the shipping tree before the bootstrap pass. release repeats defconfig and build,
      # but the explicit sequence here gives the cold tree a chance to create its reference kernel.
      - name: prepare shipping tree
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-dby_w09
        run: |
          set -euo pipefail
          ./unixnu defconfig dby_w09_defconfig -D ../device
          ./unixnu fetch -D ../device
          ./unixnu tree -D ../device
      - name: verified root inputs
        # The signed OS and SystemOS block tables are inputs to the official dual-policy probe
        # archive. The IPSW is public and pinned by both member hashes below; the RSA owner key is
        # generated in the ignored build tree and never uploaded or committed.
        working-directory: UniXNU
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          tree="$GITHUB_WORKSPACE/UniXNU/out/dby-w09/$OS_PROFILE/dby_w09/tree"
          volumes="$GITHUB_WORKSPACE/device/.cache/firmware/target-volumes"
          host="$tree/build/verified-root-host"
          mkdir -p "$volumes" "$host/keys"
          cmp "$GITHUB_WORKSPACE/UniXNU/scripts/build-owner-systemos-policy.py" \
              "$tree/scripts/build-owner-systemos-policy.py"

          openssl genrsa -out "$host/keys/owner.pem" 3072
          openssl rsa -in "$host/keys/owner.pem" -pubout -out "$host/keys/owner-public.pem"
          clang -dynamiclib -O2 -Wall -Wextra \
            -I "$tree/kits/VerifiedRoot/include" -I "$(brew --prefix openssl@3)/include" \
            "$tree/kits/VerifiedRoot/src/verified_root.c" \
            "$tree/kits/VerifiedRoot/tests/openssl_provider.c" \
            -L "$(brew --prefix openssl@3)/lib" -lcrypto \
            -o "$host/verified-root.dylib"
          nm -gU "$host/verified-root.dylib" | grep -E 'vr_host_open|vr_host_block'

          ipsw="$GITHUB_WORKSPACE/runtime/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
          mkdir -p "$GITHUB_WORKSPACE/runtime"
          [ -f "$ipsw" ] || curl -fL --retry 3 --retry-delay 5 -o "$ipsw" \
            "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
          unzip -o -j "$ipsw" "044-76040-038.dmg" -d "$volumes"
          sysos_bytes=$((806400 * 4096))
          member=$(unzip -l "$ipsw" | awk -v want="$sysos_bytes" '$1 == want {print $4; exit}')
          if [ -z "$member" ]; then
            echo "::error::no $sysos_bytes-byte SystemOS member in the IPSW"
            unzip -l "$ipsw" | grep -i '\.dmg' | head -20
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/runtime/sysos"
          unzip -o -j "$ipsw" "$member" -d "$GITHUB_WORKSPACE/runtime/sysos"
          mv -f "$GITHUB_WORKSPACE/runtime/sysos/$(basename "$member")" "$volumes/044-76034-038.dmg"
          echo '3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d  '"$volumes/044-76040-038.dmg" | shasum -a 256 -c -
          echo 'b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f  '"$volumes/044-76034-038.dmg" | shasum -a 256 -c -
          mkdir -p "$volumes/os-mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$volumes/os-mount" "$volumes/044-76040-038.dmg"
          detach_os() { hdiutil detach "$volumes/os-mount" >/dev/null 2>&1 || true; }
          trap detach_os EXIT
          python3 "$tree/scripts/build-owner-os-policy.py"
          python3 "$tree/scripts/build-owner-systemos-policy.py"
          detach_os
          trap - EXIT
          rm -f "$volumes/044-76040-038.dmg" "$volumes/044-76034-038.dmg" "$ipsw"
          # The official probe reuses bsd_init.o's compile arguments before the kernel export tree
          # is complete; its source does not include libsa headers, so the directory only needs to exist.
          mkdir -p "$tree/build/xnu/ios-obj/EXPORT_HDRS/libsa"
          ls -l "$tree/build/verified-root-os" "$tree/build/verified-root-systemos" | head -20
      - name: bootstrap kernel and prelinked candidate
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          INIT_DATA: ${{ inputs.init_data }}
          # prepare-xnu-source.py and the Adreno source fetcher call the GitHub API; anonymous
          # requests from hosted runners exhaust the shared quota before the bootstrap build.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hid=scripts/build-sheng-hid-input.py
          if ! grep -q 'first-pass objects' "$hid"; then
            python3 - "$hid" <<'PATCH'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          text = p.read_text()
          anchor = "p=ROOT/'build/xnu-prelink/native-owner-ufs-cpu-desktop-v9-hid-init-candidate.macho'\n"
          guard = anchor + '''
          # Cold-tree fallback: the first kernel supplies the candidate used by the audited pass.
          if not p.exists() and not any((ROOT/'build/xnu-prelink').glob('native-owner-ufs-cpu-desktop-*-candidate.macho')):
              _stub = OUT/'FirstPassStub.c'
              _stub.write_text('// First bootstrap pass; replaced after a candidate kernel exists.\\n')
              for _name in ('NativeHidInput.late.o', 'hid-original-bindings.o'):
                  run(['xcrun','clang','-target',TRIPLE,'-isysroot',
                       run(['xcrun','--sdk','iphoneos','--show-sdk-path'],text=True).strip(),
                       '-c',_stub,'-o',OUT/_name])
              print('HID input: no reference candidate yet; wrote first-pass objects.')
              raise SystemExit(0)
          '''
          if 'first-pass objects' in text:
              print('HID recipe already has a first-pass fallback')
          elif anchor in text:
              p.write_text(text.replace(anchor, guard, 1))
              print('Added cold-tree fallback to the fetched HID recipe')
          else:
              sys.exit('HID candidate anchor not found; refusing an unreviewed patch')
          PATCH
          fi
          ./unixnu defconfig dby_w09_bootstrap_defconfig -D ../device
          ./unixnu tree -D ../device
          shipping_tree="$GITHUB_WORKSPACE/UniXNU/out/dby-w09/$OS_PROFILE/dby_w09/tree"
          bootstrap_tree="$GITHUB_WORKSPACE/UniXNU/out/dby-w09/$OS_PROFILE/dby_w09_bootstrap/tree"
          bootstrap_work="$GITHUB_WORKSPACE/UniXNU/out/dby-w09/$OS_PROFILE/dby_w09_bootstrap"
          shipping_work="$GITHUB_WORKSPACE/UniXNU/out/dby-w09/$OS_PROFILE/dby_w09"
          shipping_seed="$shipping_work/runtime/data.dbr"
          # Reuse the verified signed policies and per-run owner key in this separate tree.
          # The UFS and Virtio archives then link against the same dual-policy inputs as shipping.
          mkdir -p "$bootstrap_tree/build"
          for input in verified-root-host verified-root-os verified-root-systemos; do
            [ -d "$shipping_tree/build/$input" ] || { echo "::error::missing signed input $input"; exit 1; }
            cp -R "$shipping_tree/build/$input" "$bootstrap_tree/build/"
          done
          if [ ! -f "$shipping_seed" ] && [ "$INIT_DATA" != "true" ]; then
            echo '::error::No preserved Data seed; set init_data=true for a first-install seed.'
            exit 1
          fi
          args=(build kernel runtime -D ../device)
          if [ -f "$shipping_seed" ]; then
            args+=(--data-ramdisk "$shipping_seed")
          else
            args+=(--init-data)
          fi
          ./unixnu "${args[@]}"

          data_uuid=$(sed -n 's/^CONFIG_XNU_OWNER_DATA_VOLUME_UUID="\([0-9A-Fa-f-]*\)"$/\1/p' "$bootstrap_work/.config")
          if ! [[ "$data_uuid" =~ ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$ ]]; then
            echo '::error::bootstrap configuration has no valid Data volume UUID'
            exit 1
          fi
          printf 'DATA_VOLUME_UUID=%s\n' "$data_uuid" >> "$GITHUB_ENV"

          boot_kernel="$bootstrap_work/kernel/kernel.macho"
          boot_runtime="$bootstrap_work/runtime"
          [ -f "$boot_kernel" ] || { echo '::error::bootstrap kernel.macho is missing'; exit 1; }
          prelink="$shipping_tree/build/xnu-prelink"
          mkdir -p "$prelink"
          for name in native-owner-mobile-graphics-candidate native-owner-ufs-cpu-desktop-v9-hid-init-candidate; do
            cp "$boot_kernel" "$prelink/$name.macho"
            cp "$bootstrap_work/kernel/kernel.json" "$prelink/$name.json"
          done
          ls -lh "$prelink"

          # Runtime inputs built with the bootstrap pass are reused by release so the expensive
          # Metal addon is compiled once per run, while the exact cached Data seed stays unchanged.
          mkdir -p "$shipping_work/runtime"
          if [ ! -f "$shipping_seed" ]; then cp "$boot_runtime/data.dbr" "$shipping_seed"; fi
          for file in gpuaddon.bin owner-trust.bundle generated.json; do
            cp "$boot_runtime/$file" "$shipping_work/runtime/$file"
          done
          mkdir -p "$shipping_tree/build/display-analysis"
          printf '{"runtime_metadata_checkpoint_sha256":"3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b"}\n' \
            > "$shipping_tree/build/display-analysis/mobile-graphics-legacy-abi.json"
          ./unixnu defconfig dby_w09_defconfig -D ../device
          ./unixnu tree -D ../device
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-dby_w09
        run: |
          set -euo pipefail
          config=configs/dby_w09_defconfig
          cp "$config" "$RUNNER_TEMP/dby_w09_defconfig.original"
          restore_config() { cp "$RUNNER_TEMP/dby_w09_defconfig.original" "$config"; }
          trap restore_config EXIT
          python3 - "$config" "$DATA_VOLUME_UUID" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          value = sys.argv[2]
          text = path.read_text()
          text, count = re.subn(
              r'^CONFIG_XNU_OWNER_DATA_VOLUME_UUID="[0-9A-Fa-f-]+"$',
              f'CONFIG_XNU_OWNER_DATA_VOLUME_UUID="{value}"', text, flags=re.M)
          if count != 1:
              raise SystemExit(f'expected one owner Data UUID in {path}, found {count}')
          path.write_text(text)
          print(f'Using Data seed volume UUID {value} for the shipping kernel')
          PY
          scripts/package.sh --os "$OS_PROFILE" --uefi ../uefi-dby_w09 --no-deps \
            --data-ramdisk "../UniXNU/$RUN_DIR/data.dbr" \
            --gpu-addon "../UniXNU/$RUN_DIR/gpuaddon.bin" \
            --owner-trust-cache "../UniXNU/$RUN_DIR/owner-trust.bundle"
      # One run of the bridge patch that does not apply on the runner but does on a Linux clone of the
      # same pinned revisions needs the runner's own state written down: which commit the translator's
      # checkout is on, whether that checkout is clean, what the patch files hash to, and what git
      # itself answers for the two patches the bridge applies first.
      - name: bridge patch state
        if: always()
        run: |
          set +e
          T=UniXNU/out/dby-w09/*/*/tree
          SRC=$(ls -d $T/.cache/gpu-reference/metal2vulkan 2>/dev/null | head -1)
          PAT=$(ls -d $T/drivers/AdrenoMetal/bridge/patches 2>/dev/null | head -1)
          echo "translator: $SRC"
          echo "patches:    $PAT"
          [ -n "$SRC" ] && git -C "$SRC" rev-parse HEAD
          [ -n "$SRC" ] && git -C "$SRC" status --short | head -5
          [ -n "$PAT" ] && sha256sum "$PAT"/0002-*.patch "$PAT"/0004-*.patch "$PAT"/0040-*.patch 2>/dev/null
          if [ -n "$SRC" ] && [ -n "$PAT" ]; then
            PAT=$(cd "$PAT" && pwd)
            SRC=$(cd "$SRC" && pwd)
            IDX=$(mktemp)
            for p in "$PAT"/0002-*.patch "$PAT"/0004-*.patch; do
              GIT_INDEX_FILE=$IDX git -C "$SRC" read-tree HEAD
              if GIT_INDEX_FILE=$IDX git -C "$SRC" apply --check --cached "$p" 2>&1; then
                echo "check ok:   $(basename "$p")"
              else
                echo "check FAIL: $(basename "$p")"
              fi
              GIT_INDEX_FILE=$IDX git -C "$SRC" apply --cached "$p" 2>&1 | head -3
            done
            rm -f "$IDX"
          fi
          git -C UniXNU rev-parse HEAD
          git -C UniXNU/drivers/AdrenoMetal rev-parse HEAD 2>/dev/null
      - name: runtime log
        if: failure()
        run: |
          # The runtime step runs its sub-tools with check=True and captures their output, so a failure
          # there reaches the job log as a Python traceback with no message from the tool that failed -
          # which is exactly what the 2026-11-16 seed-data-grow failure looked like. Print the tools'
          # own logs so the next failure names its command. The mesa build log lives under .cache/ and
          # is the only place a compiler error inside Turnip is written down.
          for f in UniXNU/out/dby-w09/*/*/logs/runtime.log UniXNU/out/dby-w09/*/*/logs/*.log \
                   UniXNU/out/dby-w09/*/*/tree/.cache/mesa-*-build.log; do
            [ -f "$f" ] || continue
            echo "=== ${f} (tail)"
            tail -150 "$f"
          done
      - name: preserve generated Data seed
        if: always() && steps.data-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source="UniXNU/out/dby-w09/$OS_PROFILE/dby_w09_bootstrap/runtime"
          target="UniXNU/out/dby-w09/$OS_PROFILE/dby_w09/runtime"
          if [ ! -f "$source/data.dbr" ] || [ ! -f "$source/inputs.json" ]; then exit 0; fi
          python3 - "$source/data.dbr" "$source/inputs.json" <<'PY'
          import hashlib, json, pathlib, sys
          seed, report = map(pathlib.Path, sys.argv[1:])
          expected = json.loads(report.read_text())['inputs']['data_ramdisk']['sha256']
          if hashlib.sha256(seed.read_bytes()).hexdigest() != expected:
              raise SystemExit('generated Data seed differs from its runtime input hash')
          PY
          mkdir -p "$target"
          if [ -f "$target/data.dbr" ]; then
            cmp "$source/data.dbr" "$target/data.dbr"
          else
            cp "$source/data.dbr" "$target/data.dbr"
          fi
          cp "$source/inputs.json" "$target/inputs.json"
      - uses: actions/cache/save@v4
        if: always() && steps.data-cache.outputs.cache-hit != 'true'
        with:
          path: |
            UniXNU/out/dby-w09/${{ inputs.os }}/dby_w09/runtime/data.dbr
            UniXNU/out/dby-w09/${{ inputs.os }}/dby_w09/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/dby-w09/*/*/runtime/data.dbr
            UniXNU/out/dby-w09/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/dby-w09/*/*/boot/boot.img
            UniXNU/out/dby-w09/*/*/payload/payload.img
            UniXNU/out/dby-w09/*/*/kernel/kernel.macho
            UniXNU/out/dby-w09/*/*/package.manifest.json
      # The GPU addon is the one image input a Linux host cannot make: Turnip and the Metal
      # plugin need Xcode's clang and the iOS SDK, and the tablet cannot build them either.
      # board.toml's [payload.runtime] is what asks for it; this step keeps the pair the runtime
      # step produced - the addon and the owner trust bundle that carries its CDHash - so a
      # payload built elsewhere can take them with --gpu-addon and --owner-trust-cache. They must
      # come from the same run: the trust module carries the plugin's hash, and pairing one run's
      # addon with another run's trust bundle is what AMFI refuses.
      - name: gpu addon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-addon-${{ inputs.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            UniXNU/out/dby-w09/*/*/runtime/gpuaddon.bin
            UniXNU/out/dby-w09/*/*/runtime/owner-trust.bundle
            UniXNU/out/dby-w09/*/*/runtime/generated.json
      # Keep the build-tree inputs this board cannot recover from its Git history. This run is
      # the source of record for a fresh tree; download these together with the seed and images.
      - name: rebuilt kernel inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-inputs-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            device/configs/dby_w09_defconfig
            device/configs/dby_w09_bootstrap_defconfig
            UniXNU/out/dby-w09/*/*/tree/build/xnu-prelink/*-candidate.macho
            UniXNU/out/dby-w09/*/*/tree/build/xnu-prelink/*-candidate.json
            UniXNU/out/dby-w09/*/*/tree/build/display-analysis/mobile-graphics-legacy-abi.json
            UniXNU/out/dby-w09/*/*/tree/build/verified-root-os-xnu-bundle/libVerifiedRootProbe.a
            UniXNU/out/dby-w09/*/*/tree/build/verified-root-os-xnu-bundle/archive.json
            UniXNU/out/dby-w09/*/*/tree/build/verified-root-os/verification.json
            UniXNU/out/dby-w09/*/*/tree/build/verified-root-systemos/verification.json
